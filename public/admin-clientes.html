<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<script src="/mp-cobro.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.inactivo{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:920px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .modal-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .modal-tabs button{background:none;border:none;padding:9px 12px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .modal-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Clientes</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Clientes. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Clientes</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:220px;flex:1">
            <label>Buscar (nombre, código, CUIT o documento)</label>
            <input id="fBusqueda" oninput="cargarClientes()" placeholder="Ej: Pérez, 20-12345678-9">
          </div>
          <div>
            <label style="visibility:hidden">.</label>
            <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap">
              <input type="checkbox" id="fInactivos" style="width:auto" onchange="cargarClientes()"> Ver inactivos
            </label>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <div style="position:relative">
            <button class="btn secondary" onclick="toggleSelectorColumnas(event)" title="Elegí qué columnas ver en el listado">Columnas ▾</button>
            <div id="selectorColumnas" class="hidden" style="position:absolute;right:0;top:100%;z-index:50;background:var(--card,#fff);border:1px solid var(--border,#ccc);border-radius:8px;padding:10px;min-width:220px;max-height:340px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)" onclick="event.stopPropagation()"></div>
          </div>
          <button class="btn secondary" onclick="exportarXlsx()">Exportar</button>
          <button class="btn secondary" onclick="abrirImportar()">Importar</button>
          <button class="btn secondary dux-migracion" style="display:none" data-migracion="dux" onclick="abrirUnificar()" title="Buscar clientes duplicados y unificarlos">Unificar duplicados</button>
          <button class="btn secondary dux-migracion" style="display:none" data-migracion="dux" onclick="abrirFichasCliDux()" title="Ficha de clientes de Dux (Listado de Clientes)">Fichas Dux</button>
          <button class="btn secondary dux-migracion" style="display:none" data-migracion="dux" onclick="abrirSaldosDux()" title="Saldos de cuenta corriente de Dux (Consulta de Clientes con Saldo)">Saldos Dux</button>
          <button class="btn" onclick="abrirNuevoCliente()">+ Nuevo cliente</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead id="clientesHead"></thead>
        <tbody id="clientesBody"><tr><td colspan="7" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<!-- Modal aparte para "Cobrar" una venta desde la pestaña Cuenta corriente
     (3/10/2026) — va en SU PROPIO contenedor, no en #modalRoot, para no
     pisar el modal de "Editar cliente" que sigue abierto detrás. -->
<div id="modalCobroVentaRoot"></div>

<script>
const BASE = '/api/clientes';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){
  n = Number(n || 0);
  const signo = n < 0 ? '-' : '';
  return signo + '$ ' + Math.abs(n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR', /T00:00:00(\.000)?Z$/.test(String(iso)) ? {timeZone:'UTC'} : undefined); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('clientes'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'clientes', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await Promise.all([cargarClientes(), cargarVendedoresYListasCliente()]);
  // Abrir la ficha de un cliente puntual (?id=...), p. ej. desde la pantalla de ventas.
  try {
    const idQs = new URLSearchParams(location.search).get('id');
    if (idQs) {
      if (!clientesCache.find(x => x._id === idQs)) {
        const rc = await fetch(BASE + '?incluirInactivos=1', {headers: headersAuth()});
        if (rc.ok) clientesCache = await rc.json();
      }
      abrirEditarCliente(idQs);
      const tabQs = new URLSearchParams(location.search).get('tab');
      if (tabQs === 'cuenta-corriente') mostrarTabCliente('cuenta-corriente', idQs);
    }
  } catch(e) {}
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

let clientesCache = [];
async function cargarClientes(){
  const params = new URLSearchParams();
  if (document.getElementById('fBusqueda').value.trim()) params.set('q', document.getElementById('fBusqueda').value.trim());
  if (document.getElementById('fInactivos').checked) params.set('incluirInactivos', '1');
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('clientesBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="7" class="err">No se pudo cargar.</td></tr>'; return; }
  clientesCache = await r.json();
  renderClientes();
}

const CATEGORIA_FISCAL_LABEL = {
  consumidor_final: 'Consumidor final', exento: 'Exento', monotributista: 'Monotributista',
  responsable_inscripto: 'Responsable Inscripto', exterior: 'Exterior', iva_no_alcanzado: 'IVA no alcanzado'
};
const TIPO_DOCUMENTO_LABEL = { cuil: 'CUIL', cuit: 'CUIT', dni: 'DNI', pasaporte: 'Pasaporte' };

// Columnas configurables (13/10/2026, pedido de Mato): cada usuario elige qué
// columnas ve en el listado; se guarda en este navegador, por usuario.
const COLUMNAS_CLIENTES = [
  { k: 'codigo', l: 'Código', def: true, th: 'Código', td: c => `<strong>${escapeHtml(c.codigo || '—')}</strong>` },
  { k: 'cliente', l: 'Cliente', def: true, fija: true, th: 'Cliente', td: c => `${escapeHtml(c.apellidoRazonSocial)}${c.nombre ? ' ' + escapeHtml(c.nombre) : ''}${c.nombreFantasia ? `<div class="muted">${escapeHtml(c.nombreFantasia)}</div>` : ''}` },
  { k: 'categoria', l: 'Categoría fiscal', def: true, th: 'Categoría fiscal', td: c => CATEGORIA_FISCAL_LABEL[c.categoriaFiscal] || '—' },
  { k: 'cuit', l: 'CUIT / Doc.', def: true, th: 'CUIT / Doc.', td: c => c.cuit ? escapeHtml(c.cuit) : (c.numeroDocumento ? `${TIPO_DOCUMENTO_LABEL[c.tipoDocumento]||'Doc.'} ${escapeHtml(c.numeroDocumento)}` : '—') },
  { k: 'contacto', l: 'Contacto (tel. + mail)', def: true, th: 'Contacto', td: c => [c.telefono || c.celular, c.email].filter(Boolean).map(escapeHtml).join(' · ') || '—' },
  { k: 'telefono', l: 'Teléfono', th: 'Teléfono', td: c => escapeHtml(c.telefono || '—') },
  { k: 'celular', l: 'Celular', th: 'Celular', td: c => escapeHtml(c.celular || '—') },
  { k: 'email', l: 'Email', th: 'Email', td: c => escapeHtml(c.email || '—') },
  { k: 'personaContacto', l: 'Persona de contacto', th: 'Persona de contacto', td: c => escapeHtml(c.personaContacto || '—') },
  { k: 'domicilio', l: 'Domicilio', th: 'Domicilio', td: c => escapeHtml(c.domicilio || '—') },
  { k: 'localidad', l: 'Localidad', th: 'Localidad', td: c => escapeHtml(c.localidad || '—') },
  { k: 'provincia', l: 'Provincia', th: 'Provincia', td: c => escapeHtml(c.provincia || '—') },
  { k: 'zona', l: 'Zona', th: 'Zona', td: c => escapeHtml(c.zona || '—') },
  { k: 'vendedor', l: 'Vendedor', th: 'Vendedor', td: c => escapeHtml(c.vendedor || '—') },
  { k: 'tipoCliente', l: 'Tipo de cliente', th: 'Tipo', td: c => escapeHtml(c.tipoCliente || '—') },
  { k: 'origenCliente', l: 'Origen del cliente', th: 'Origen', td: c => escapeHtml(c.origenCliente || '—') },
  { k: 'condicionPago', l: 'Condición de pago', th: 'Cond. de pago', td: c => escapeHtml(c.condicionPago || '—') },
  { k: 'descuento', l: '% descuento', th: '% Desc.', td: c => c.porcentajeDescuento ? escapeHtml(String(c.porcentajeDescuento)) + '%' : '—' },
  { k: 'limiteCtaCte', l: 'Límite cta. cte.', th: 'Límite cta. cte.', td: c => c.limiteCtaCteFacturacion ? money(c.limiteCtaCteFacturacion) : '—' },
  { k: 'estado', l: 'Estado', def: true, th: 'Estado', td: c => `<span class="pill ${c.activo === false ? 'inactivo' : 'activo'}">${c.activo === false ? 'Inactivo' : 'Activo'}</span>` }
];
function claveColumnasClientes(){ return 'clientes_columnas_' + (typeof NOMBRE_USUARIO !== 'undefined' ? NOMBRE_USUARIO : ''); }
function columnasClientesVisibles(){
  let sel = null;
  try { sel = JSON.parse(localStorage.getItem(claveColumnasClientes()) || 'null'); } catch(e){}
  if (!Array.isArray(sel)) sel = COLUMNAS_CLIENTES.filter(c => c.def).map(c => c.k);
  return COLUMNAS_CLIENTES.filter(c => c.fija || sel.includes(c.k));
}
function toggleSelectorColumnas(ev){
  if (ev) ev.stopPropagation();
  const box = document.getElementById('selectorColumnas');
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
  const vis = columnasClientesVisibles().map(c => c.k);
  box.innerHTML = '<div class="muted" style="margin-bottom:6px">Columnas a mostrar</div>' +
    COLUMNAS_CLIENTES.map(c => `<label style="display:flex;align-items:center;gap:6px;font-weight:500;margin:3px 0"><input type="checkbox" style="width:auto" ${vis.includes(c.k) ? 'checked' : ''} ${c.fija ? 'disabled' : ''} onchange="guardarColumnasClientes()" data-col="${c.k}"> ${c.l}</label>`).join('') +
    '<button class="btn small secondary" style="margin-top:8px" onclick="restablecerColumnasClientes()">Restablecer</button>';
  box.classList.remove('hidden');
}
function guardarColumnasClientes(){
  const sel = Array.from(document.querySelectorAll('#selectorColumnas input[data-col]')).filter(i => i.checked).map(i => i.dataset.col);
  try { localStorage.setItem(claveColumnasClientes(), JSON.stringify(sel)); } catch(e){}
  renderClientes();
}
function restablecerColumnasClientes(){
  try { localStorage.removeItem(claveColumnasClientes()); } catch(e){}
  document.getElementById('selectorColumnas').classList.add('hidden');
  renderClientes();
}
document.addEventListener('click', () => { const b = document.getElementById('selectorColumnas'); if (b) b.classList.add('hidden'); });

function renderClientes(){
  const body = document.getElementById('clientesBody');
  const cols = columnasClientesVisibles();
  document.getElementById('clientesHead').innerHTML = '<tr>' + cols.map(c => `<th>${c.th}</th>`).join('') + '<th></th></tr>';
  if (!clientesCache.length) { body.innerHTML = `<tr><td colspan="${cols.length + 1}" class="muted">No hay clientes todavía.</td></tr>`; return; }
  body.innerHTML = clientesCache.map(c => `
    <tr>
      ${cols.map(col => `<td${col.k === 'codigo' || col.k === 'cliente' || col.k === 'estado' ? '' : ' class="muted"'}>${col.td(c)}</td>`).join('')}
      <td>
        <button class="btn small secondary" onclick="abrirEditarCliente('${c._id}')">Editar</button>
        ${c.activo === false ? '' : `<button class="btn small danger" onclick="desactivarCliente('${c._id}', '${escapeHtml(c.apellidoRazonSocial).replace(/'/g,"\\'")}')">Desactivar</button>`}
      </td>
    </tr>
  `).join('');
}

const SEXOS = [{v:'', l:'Sin especificar'}, {v:'femenino', l:'Femenino'}, {v:'masculino', l:'Masculino'}];
const CATEGORIAS_FISCALES = [
  {v:'consumidor_final', l:'Consumidor final'}, {v:'exento', l:'Exento'}, {v:'monotributista', l:'Monotributista'},
  {v:'responsable_inscripto', l:'Responsable Inscripto'}, {v:'exterior', l:'Exterior'}, {v:'iva_no_alcanzado', l:'IVA no alcanzado'}
];
const TIPOS_DOCUMENTO = [{v:'', l:'Sin especificar'}, {v:'dni', l:'DNI'}, {v:'cuit', l:'CUIT'}, {v:'cuil', l:'CUIL'}, {v:'pasaporte', l:'Pasaporte'}];
const TIPOS_COMPROBANTE = [{v:'', l:'Sin especificar'}, {v:'comprobante_venta', l:'Comprobante de venta'}, {v:'factura', l:'Factura'}];

function opciones(lista, seleccionada){
  return lista.map(u => `<option value="${u.v}" ${u.v===(seleccionada||'')?'selected':''}>${u.l}</option>`).join('');
}

// Vendedores y listas de precio por defecto (3/10/2026, pedido de Mato:
// "en datos de clientes fijate que deberia desplegar vendedores y lista
// de precios por defecto. de esa manera puedo asignarle un vendedor y
// una lista para cuando tenga que hacer una venta") — antes eran campos
// de texto libre. Vendedor usa los usuarios activos del sistema (mismo
// GET /api/usuarios/lite que ya usa el combo de Ventas, guarda el
// nombre); Lista de precio usa las listas reales de Productos (guarda
// el _id de la lista, igual que en Ventas).
let usuariosClientesCache = [];
let listasPrecioClientesCache = [];
async function cargarVendedoresYListasCliente(){
  const [ru, rl] = await Promise.all([
    fetch('/api/usuarios/lite', {headers: headersAuth()}),
    fetch('/api/productos/listas-precio', {headers: headersAuth()})
  ]);
  usuariosClientesCache = ru.ok ? await ru.json() : [];
  listasPrecioClientesCache = rl.ok ? await rl.json() : [];
}
function opcionesVendedorCliente(seleccionado){
  const base = seleccionado && !usuariosClientesCache.some(u => u.nombre === seleccionado) ? [{nombre: seleccionado}] : [];
  return '<option value="">Sin especificar</option>' + base.concat(usuariosClientesCache).map(u =>
    `<option value="${escapeHtml(u.nombre)}" ${u.nombre===seleccionado?'selected':''}>${escapeHtml(u.nombre)}</option>`
  ).join('');
}
function opcionesListaPrecioCliente(seleccionada){
  return '<option value="">Sin especificar</option>' + listasPrecioClientesCache.filter(l => l.activa !== false).map(l =>
    `<option value="${l._id}" ${String(l._id)===String(seleccionada||'')?'selected':''}>${escapeHtml(l.nombre)}</option>`
  ).join('');
}

// Tipo de cliente: desplegable con algunos valores fijos + los que ya se
// hayan cargado antes (así queda "abierto" sin volver a ser texto libre).
// La opción "+ Agregar nuevo…" (ver listenerTipoCliente) permite sumar uno
// nuevo al vuelo, que a partir de ahí queda disponible para el resto.
const TIPOS_CLIENTE_BASE = ['Consumidor final', 'Mayorista', 'Colocador'];
function opcionesTipoCliente(seleccionado){
  const usados = clientesCache.map(c => c.tipoCliente).filter(Boolean);
  const todos = [...new Set([...TIPOS_CLIENTE_BASE, ...usados])];
  let html = '<option value="">Sin especificar</option>' +
    todos.map(t => `<option value="${escapeHtml(t)}" ${t===seleccionado?'selected':''}>${escapeHtml(t)}</option>`).join('');
  if (seleccionado && !todos.includes(seleccionado)) {
    html += `<option value="${escapeHtml(seleccionado)}" selected>${escapeHtml(seleccionado)}</option>`;
  }
  html += '<option value="__nuevo__">+ Agregar nuevo…</option>';
  return html;
}
function listenerTipoCliente(){
  const select = document.getElementById('fcTipoCliente');
  const valorPrevio = select.value;
  select.addEventListener('change', function(){
    if (this.value !== '__nuevo__') return;
    const nuevo = (prompt('Nuevo tipo de cliente:') || '').trim();
    if (nuevo) {
      const opt = document.createElement('option');
      opt.value = nuevo; opt.textContent = nuevo; opt.selected = true;
      this.insertBefore(opt, this.lastElementChild);
    } else {
      this.value = valorPrevio && valorPrevio !== '__nuevo__' ? valorPrevio : '';
    }
  });
}

async function guardarNuevoCliente(){
  const body = leerFormularioCliente();
  if (!body.apellidoRazonSocial) { document.getElementById('fcErr').textContent = 'El apellido / razón social es obligatorio'; return; }
  if (!body.categoriaFiscal) { document.getElementById('fcErr').textContent = 'La categoría fiscal es obligatoria'; return; }
  try{
    const r = await fetch(BASE, {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    cerrarModal();
    await cargarClientes();
  }catch(e){
    document.getElementById('fcErr').textContent = e.message;
  }
}

// Mato: "la cuenta corriente anidamela dentro del cliente cuando abri

// a repartir botones sueltos en la fila de la tabla.

  const c = clientesCache.find(x => x._id === id);
  if (!c) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg">
      <div class="modal wide">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>${escapeHtml(c.apellidoRazonSocial)}</h2>
        <div class="modal-tabs">
          <button class="active" data-tab="datos" onclick="mostrarTabCliente('datos')">Datos del cliente</button>
          <button data-tab="cuenta-corriente" onclick="mostrarTabCliente('cuenta-corriente', '${id}')">Cuenta corriente</button>
          <button data-tab="presupuestos" onclick="mostrarTabCliente('presupuestos', '${id}')">Presupuestos</button>
          <button data-tab="productos" onclick="mostrarTabCliente('productos', '${id}')">Productos comprados</button>
          <button data-tab="obras" onclick="mostrarTabCliente('obras', '${id}')">Obras</button>
        </div>
        <div id="tabClienteDatos">
          ${formularioCliente(c)}
          <div class="err" id="fcErr"></div>
          <button class="btn" style="margin-top:10px" onclick="guardarEdicionCliente('${id}')">Guardar cambios</button>
        </div>
        <div id="tabClienteCuentaCorriente" class="hidden">
          <div id="ccContenido" class="muted">Cargando...</div>
        </div>
        <div id="tabClientePresupuestos" class="hidden"><div id="presContenido" class="muted">Cargando...</div></div>
        <div id="tabClienteProductos" class="hidden"><div id="prodContenido" class="muted">Cargando...</div></div>
        <div id="tabClienteObras" class="hidden"><div id="obrasContenido" class="muted">Cargando...</div></div>
      </div>
    </div>
  `;
  listenerTipoCliente();
}
function mostrarTabCliente(tab, clienteId){
  document.querySelectorAll('.modal-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tabClienteDatos').classList.toggle('hidden', tab !== 'datos');
  document.getElementById('tabClienteCuentaCorriente').classList.toggle('hidden', tab !== 'cuenta-corriente');
  document.getElementById('tabClientePresupuestos').classList.toggle('hidden', tab !== 'presupuestos');
  document.getElementById('tabClienteProductos').classList.toggle('hidden', tab !== 'productos');
  document.getElementById('tabClienteObras').classList.toggle('hidden', tab !== 'obras');
  if (tab === 'cuenta-corriente') cargarCuentaCorrienteTab(clienteId);
  if (tab === 'presupuestos') cargarPresupuestosTab(clienteId);
  if (tab === 'productos') cargarProductosTab(clienteId);
  if (tab === 'obras') cargarObrasTab(clienteId);
}

function moneyMon(n, mon){ return (mon && mon !== 'ARS' ? mon + ' ' : '') + money(n); }
async function traerTab(id, ruta, contId){
  const cont = document.getElementById(contId);
  if (cont) cont.innerHTML = 'Cargando...';
  const r = await fetch(BASE + '/' + id + '/' + ruta, {headers: headersAuth()});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Error al cargar');
  return data;
}
function errTab(contId, e){ const c = document.getElementById(contId); if (c) c.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`; }

const ESTADO_PRES_LABEL = {presupuestado:'Presupuestado', en_seguimiento:'En seguimiento', aprobado:'Aprobado', rechazado:'Rechazado'};
async function cargarPresupuestosTab(id){
  try{
    const lista = await traerTab(id, 'presupuestos', 'presContenido');
    const cont = document.getElementById('presContenido'); if (!cont) return;
    cont.innerHTML = `<table>
      <thead><tr><th>N°</th><th>Fecha</th><th>Estado</th><th>Vendedor</th><th>Total</th><th></th></tr></thead>
      <tbody>${lista.length ? lista.map(p => `<tr>
        <td>${escapeHtml(p.numero)}</td><td>${fechaCorta(p.fecha)}</td>
        <td>${ESTADO_PRES_LABEL[p.estado] || escapeHtml(p.estado || '—')}</td>
        <td class="muted">${escapeHtml(p.vendedor || '—')}</td>
        <td>${moneyMon(p.total, p.moneda)}</td>
        <td><a href="javascript:void(0)" onclick="imprimirDocumento('/api/presupuestos/${p._id}/imprimir')" style="text-decoration:underline">Ver</a></td>
      </tr>`).join('') : '<tr><td colspan="6" class="muted">Este cliente todavía no tiene presupuestos.</td></tr>'}</tbody></table>`;
  }catch(e){ errTab('presContenido', e); }
}

async function cargarProductosTab(id){
  try{
    const data = await traerTab(id, 'productos', 'prodContenido');
    const cont = document.getElementById('prodContenido'); if (!cont) return;
    const lista = data.productos;
    cont.innerHTML = `<p class="muted" style="margin-top:0">${lista.length} producto(s) en ${data.ventas} venta(s) (sin contar anuladas).</p>
      <table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Cantidad</th><th>Veces</th><th>Total comprado</th><th>Última compra</th></tr></thead>
      <tbody>${lista.length ? lista.map(p => `<tr>
        <td class="muted">${escapeHtml(p.sku || '—')}</td><td>${escapeHtml(p.nombre)}</td>
        <td>${p.cantidad}</td><td>${p.compras}</td>
        <td>${Object.keys(p.monto).map(m => moneyMon(p.monto[m], m)).join(' + ')}</td>
        <td>${fechaCorta(p.ultimaCompra)}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="muted">Este cliente todavía no compró productos.</td></tr>'}</tbody></table>`;
  }catch(e){ errTab('prodContenido', e); }
}

const ESTADO_OBRA_LABEL = {pendiente:'Pendiente', asignado:'Asignada', en_curso:'En curso', terminada:'Terminada', cancelada:'Cancelada'};
function srcFoto(f){ const d = (f && typeof f === 'object') ? f.data : f; return typeof d === 'string' ? d : ''; }
async function cargarObrasTab(id){
  try{
    const lista = await traerTab(id, 'obras', 'obrasContenido');
    const cont = document.getElementById('obrasContenido'); if (!cont) return;
    if (!lista.length) { cont.innerHTML = '<p class="muted">Este cliente no tiene obras.</p>'; return; }
    cont.innerHTML = lista.map(o => {
      const fotos = (o.fotos || []).map(srcFoto).filter(Boolean);
      const m2 = (o.tareas || []).reduce((a, t) => a + (Number(t.m2Presupuestados) || 0), 0);
      const tipos = [...new Set((o.tareas || []).map(t => t.tipoTrabajo).filter(Boolean))].join(', ');
      return `<div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
          <strong>Obra #${escapeHtml(o.numero)} · ${ESTADO_OBRA_LABEL[o.estado] || escapeHtml(o.estado || '')}</strong>
          <span class="muted">${fechaCorta(o.fechaVenta)}</span>
        </div>
        <div class="muted" style="margin:4px 0 8px">${escapeHtml((o.cliente && o.cliente.direccion) || '')}${o.cliente && o.cliente.localidad ? ', ' + escapeHtml(o.cliente.localidad) : ''}${tipos ? ' · ' + escapeHtml(tipos) : ''}${m2 ? ' · ' + m2 + ' m²' : ''}</div>
        ${fotos.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${fotos.map(f => `<img src="${f}" alt="Foto de la obra" loading="lazy" style="width:110px;height:110px;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick="verFotoObra(this.src)">`).join('')}</div>` : '<div class="muted">Sin fotos.</div>'}
      </div>`;
    }).join('');
  }catch(e){ errTab('obrasContenido', e); }
}
function verFotoObra(src){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:zoom-out';

// Cuenta corriente (2/10/2026, pedido de Mato) — historial de deuda y
// cobros de un cliente, independiente de cada venta puntual. Ver
// GET /:id/cuenta-corriente y registrarMovimientoCuentaCorriente en
// clientes.js (backend).
// -------------------------------------------------------------------
const ORIGEN_CC_LABEL = { venta: 'Venta', cobro_venta: 'Cobro de venta', cobro_cuenta: 'Cobro a cuenta', manual: 'Manual', devolucion: 'Devolución', saldo_inicial_dux: 'Saldo inicial Dux', anulacion_cobro: 'Anulación de cobranza' };
// Ver/Imprimir/Compartir/Anular para comprobantes de venta referenciados
// desde la cuenta corriente (3/10/2026, pedido de Mato: "en todas las
// cuentas corrientes o detalles q haya algun comprobante asociado
// agregar boton de ver, comparti, imprimir, anular"). Misma convención
// que admin-ventas.html (cada pantalla con su copia mínima).
async function imprimirDocumento(url, accion){
  const ventana = window.open('', '_blank');
  try{
    const r = await fetch(url, {headers: headersAuth()});
    const html = await r.text();
    if (!r.ok) { ventana.document.write('<p>No se pudo generar el documento.</p>'); return; }
    ventana.document.write(html);
    ventana.document.close();
    if (accion === 'imprimir') {
      ventana.addEventListener('load', () => setTimeout(() => ventana.print(), 250));
    } else if (accion === 'compartir') {
      ventana.addEventListener('load', () => setTimeout(() => { if (ventana.compartirDocumento) ventana.compartirDocumento(); }, 250));
    }
  }catch(e){
    ventana.document.write('<p>No se pudo generar el documento: ' + escapeHtml(e.message) + '</p>');
  }
}
// Copia al portapapeles un link público del documento (comprobante, remito o recibo) para mandárselo al cliente.
async function copiarLinkPublico(url){
  let m, body;
  if ((m = url.match(/\/api\/ventas\/remitos\/([0-9a-f]{24})\/imprimir/))) body = { tipo: 'remito', id: m[1] };
  else if ((m = url.match(/\/api\/ventas\/([0-9a-f]{24})\/pagos\/(\d+)\/recibo/))) body = { tipo: 'recibo', id: m[1], index: Number(m[2]) };
  else if ((m = url.match(/\/api\/ventas\/([0-9a-f]{24})\/comprobante/))) body = { tipo: 'comprobante', id: m[1] };
  else { alert('No se pudo armar el link de este documento.'); return; }
  try{
    const r = await fetch('/api/ventas/link-publico', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    const link = location.origin + '/d/' + d.token;
    try { await navigator.clipboard.writeText(link); alert('Link copiado. Pegalo en el chat con el cliente:\n\n' + link); }
    catch(e2){ window.prompt('Copiá el link (Ctrl+C):', link); }
  }catch(e){ alert('No se pudo generar el link: ' + e.message); }
}
function botonesImprimible(url){
  return `
    <button class="btn small secondary" onclick="imprimirDocumento('${url}')">Ver</button>
    <button class="btn small secondary" onclick="imprimirDocumento('${url}','imprimir')">Imprimir</button>
    <button class="btn small secondary" onclick="copiarLinkPublico('${url}')">Copiar link</button>

}

// Pensada para la pestaña "Cuenta corriente" del modal de Editar cliente
// (ver abrirEditarCliente/mostrarTabCliente arriba) — no es un modal
// propio, rellena el contenedor #ccContenido que ya está en el DOM.
async function cargarCuentaCorrienteTab(id){
  const cont0 = document.getElementById('ccContenido');
  if (cont0) cont0.innerHTML = 'Cargando...';
  try{
    const r = await fetch(BASE + '/' + id + '/cuenta-corriente', {headers: headersAuth()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al cargar la cuenta corriente');
    const cont = document.getElementById('ccContenido');
    if (!cont) return; // se cerró el modal mientras cargaba
    const saldoTexto = money(data.saldo);
    // Columna "Saldo" (3/10/2026, pedido de Mato: "agreguemos una columna
    // de saldo que vaya tirando el saldo historico"): data.movimientos
    // viene ordenado del más nuevo al más viejo (fecha desc). El saldo
    // actual en caché (data.saldo) es el saldo DESPUÉS del movimiento más
    // nuevo (fila 0) — para cada fila siguiente (más vieja), el saldo que
    // tenía la cuenta después de ESE movimiento es el de la fila anterior
    // menos el efecto de la fila anterior (débito suma, crédito resta),
    // es decir, deshaciendo los movimientos uno por uno yendo hacia atrás
    // en el tiempo.
    // Saldo corrido en dos tramos: (1) lo operado en el sistema (incluye el "Saldo inicial Dux"), del más nuevo al más viejo, deshaciendo
    // movimiento por movimiento desde el saldo actual; (2) el historial importado de Dux (ventas, cobros, devoluciones), que ya está
    // incluido en ese saldo inicial: su saldo corrido termina en el saldo inicial y, hacia atrás, resta cada movimiento. Lo que queda
    // antes del primer movimiento cargado se muestra como "Saldo anterior al historial cargado", así la cuenta cierra.
    let saldoCorrido = data.saldo;
    const nativos = data.movimientos.filter(m => !m.importado), hist = data.movimientos.filter(m => m.importado);
    const saldoDe = new Map(); let anclaHist = null;
    nativos.forEach((m, i) => {
      if (i > 0) { const ant = nativos[i - 1]; saldoCorrido -= ant.tipo === 'debito' ? ant.monto : -ant.monto; }
      saldoDe.set(m, saldoCorrido);
      if (m.origen === 'saldo_inicial_dux') anclaHist = saldoCorrido;
    });
    if (anclaHist === null) anclaHist = nativos.length ? saldoCorrido - (nativos[nativos.length - 1].tipo === 'debito' ? nativos[nativos.length - 1].monto : -nativos[nativos.length - 1].monto) : data.saldo;
    let sh = anclaHist;
    hist.forEach((m, i) => {
      if (i > 0) { const ant = hist[i - 1]; sh -= ant.tipo === 'debito' ? ant.monto : -ant.monto; }
      saldoDe.set(m, sh);
    });
    const filas = data.movimientos.map(m => ({ m, saldo: saldoDe.get(m) }));
    let saldoAnterior = null;
    if (data.completo && hist.length){
      const ult = hist[hist.length - 1];
      saldoAnterior = Math.round((sh - (ult.tipo === 'debito' ? ult.monto : -ult.monto)) * 100) / 100;
    }
    // Botón "Cobrar" por fila (3/10/2026, pedido de Mato: "deberiamos
    // tener algun boton que nos permita generar un cobro de cada factura
    // o un cobro parcial") — solo tiene sentido en el movimiento de
    // DÉBITO de una venta (origen: 'venta') que todavía tenga saldo
    // pendiente según `ventasPorId` (viene resuelto del backend, que ya
    // tiene en cuenta cobros parciales/anulaciones). El propio cobro de
    // venta (origen: 'cobro_venta') y los movimientos sin ventaId
    // (cobro a cuenta, manual) no llevan botón.
    const ventasPorId = data.ventasPorId || {};
    window._ccCtx = { id, cliente: data.cliente, saldo: data.saldo, filas, saldoAnterior };
    window._ccVentas = ventasPorId;
    cont.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative">
        <p class="muted" style="margin:0">Saldo: <strong style="color:${data.saldo > 0 ? 'var(--danger)' : (data.saldo < 0 ? 'var(--ok)' : 'var(--text)')}">${saldoTexto}</strong></p>
        <div style="position:relative">
          <button class="btn secondary" id="ccAccionesBtn" onclick="toggleAccionesCC(event)" title="Acciones de la cuenta corriente" style="font-size:18px;line-height:1;padding:6px 12px">⚙</button>
          <div id="ccAccionesMenu" class="hidden" style="position:absolute;right:0;top:110%;z-index:50;min-width:230px;background:var(--surface,#fff);border:1px solid var(--border,#ccc);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px">
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCC(\'cobrar\')">💰 Cobrar</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCC(\'vender\')">🛒 Vender</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCC(\'imprimir\')">🖨 Ver / imprimir resumen</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCC(\'whatsapp\')">💬 Enviar resumen por WhatsApp</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCC(\'mail\')">✉ Enviar resumen por mail</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCC(\'excel\')">⬇ Descargar resumen (Excel/CSV)</a>
          </div>
        </div>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Comprobante</th><th>Origen</th><th>Débito</th><th>Crédito</th><th>Saldo</th><th></th></tr></thead>
        <tbody>
          ${filas.length ? filas.map(({m, saldo}) => {
            // Antes solo resolvía la venta para un DÉBITO (una venta
            // normal/Nota de Débito) — una Nota de Crédito es un
            // CRÉDITO con ventaId igual, y se quedaba sin comprobante
            // clickeable. Ahora alcanza con que tenga ventaId, sea cual
            // sea el tipo de movimiento (3/10/2026, pedido de Mato:
            // "poder clikear en el comprobante para ver el detalle o
            // imprimirlo").
            const venta = m.ventaId ? ventasPorId[String(m.ventaId)] : null;
            const cobrable = venta && !m.importado && m.tipo === 'debito' && venta.estado !== 'anulada' && venta.saldoPendiente > 0;
            const conceptoHtml = `${escapeHtml(m.concepto || '—')}${m.observaciones ? `<div class="muted">${escapeHtml(m.observaciones)}</div>` : ''}`;
            return `
            <tr>
              <td>${fechaCorta(m.fecha)}</td>
              <td>${venta
                ? `<a href="javascript:void(0)" onclick="imprimirDocumento('/api/ventas/${m.ventaId}/comprobante')" style="text-decoration:underline;cursor:pointer" title="Ver el comprobante">${conceptoHtml}</a>`
                : conceptoHtml}</td>
              <td style="white-space:nowrap">${venta && venta.comprobante ? `<strong>${escapeHtml(venta.comprobante)}</strong> <span class="pill ${venta.fiscalComprobante ? 'entregada' : 'pendiente'}" style="font-size:11px">${venta.fiscalComprobante ? 'Fiscal' : 'No fiscal'}</span>` : '<span class="muted">—</span>'}</td>
              <td class="muted">${ORIGEN_CC_LABEL[m.origen] || escapeHtml(m.origen || '—')}${m.importado ? ' <span style="font-size:11px" title="Histórico importado de Dux">Dux</span>' : ''}</td>
              <td>${m.tipo === 'debito' ? money(m.monto) : ''}</td>
              <td>${m.tipo === 'credito' ? money(m.monto) : ''}</td>
              <td class="muted">${money(saldo)}</td>
              <td style="white-space:nowrap">
                ${venta ? botonesImprimible('/api/ventas/' + m.ventaId + '/comprobante') : ''}
                ${cobrable ? ` <button class="btn small" onclick="abrirCobroVentaDesdeCC('${m.ventaId}', ${venta.numero}, ${venta.saldoPendiente}, '${venta.moneda || 'ARS'}', '${id}')">Cobrar</button>` : ''}
                ${venta && !m.importado && m.tipo === 'debito' && venta.estado !== 'anulada' ? ` <button class="btn small danger" onclick="anularVentaDesdeCC('${m.ventaId}', ${venta.numero}, ${venta.stockDescontado ? 'true' : 'false'}, '${id}')">Anular</button>` : ''}
              </td>
            </tr>
          `; }).join('') + (saldoAnterior !== null && Math.abs(saldoAnterior) >= 0.01 ? `<tr><td></td><td colspan="3" class="muted"><i>Saldo anterior al historial cargado (lo que ya traía la cuenta antes de los movimientos importados de Dux)</i></td><td>${saldoAnterior > 0 ? money(saldoAnterior) : ''}</td><td>${saldoAnterior < 0 ? money(-saldoAnterior) : ''}</td><td class="muted">${money(saldoAnterior)}</td><td></td></tr>` : '') : '<tr><td colspan="7" class="muted">Todavía no hay movimientos.</td></tr>'}
        </tbody>
      </table>
    `;
  }catch(e){
    const cont = document.getElementById('ccContenido');
    if (cont) cont.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`;
  }
}

// (3/10/2026, pedido de Mato: "deberiamos tener algun boton que nos
// permita generar un cobro de cada factura o un cobro parcial"). Mismas
// reglas que el cobro de Ventas/Cobranza: efectivo solo a caja, cuenta
// (transferencia)/tarjeta solo a banco, cheque entra "en cartera". Pega
// directo a POST /api/ventas/:id/pagos — mismo endpoint que usa
// admin-ventas.html — así que lo que se cobra acá actualiza la venta
// real (totalCobrado/saldoPendiente) y la cuenta corriente del cliente.
// Cajas y bancos se piden recién al abrir este modal (no en el caché de

let cajasTesoreriaCacheCC = [];
let bancosTesoreriaCacheCC = [];
async function cargarCajasYBancosCC(){
  const [rc, rb] = await Promise.all([
    fetch('/api/tesoreria/cajas', {headers: headersAuth()}),
    fetch('/api/tesoreria/bancos', {headers: headersAuth()})

  bancosTesoreriaCacheCC = rb.ok ? await rb.json() : [];
}

      || '<option value="">No hay ninguna caja habilitada</option>';
  }
  return bancosTesoreriaCacheCC.map(b => `<option value="banco:${b._id}">${escapeHtml(b.nombre)}</option>`).join('')
    || '<option value="">No hay ningún banco habilitado</option>';

    body.chequeNumero = document.getElementById('cvccChequeNumero').value.trim();

    body.chequeLibrador = document.getElementById('cvccChequeLibrador').value.trim();
    body.chequeCuitLibrador = document.getElementById('cvccChequeCuit').value.trim();
    body.chequeFechaEmision = document.getElementById('cvccChequeFechaEmision').value;
    body.chequeFechaVencimiento = document.getElementById('cvccChequeVencimiento').value;
    if (!body.chequeNumero) { errEl.textContent = 'Falta el número de cheque'; return; }
    if (!body.chequeFechaVencimiento) { errEl.textContent = 'Falta la fecha de vencimiento del cheque'; return; }
  } else {
    const cuenta = document.getElementById('cvccCuenta').value;
    if (!cuenta) { errEl.textContent = tipoValor === 'efectivo' ? 'Elegí a qué caja va el cobro' : 'Elegí a qué banco va el cobro'; return; }
    const [cuentaTipo, cuentaId] = cuenta.split(':');
    body.cuentaTipo = cuentaTipo;
    body.cuentaId = cuentaId;
    if (tipoValor === 'tarjeta') {
      body.tarjetaEntidad = document.getElementById('cvccTarjetaEntidad').value.trim();
      body.tarjetaTipo = document.getElementById('cvccTarjetaTipo').value;
      body.tarjetaCuotas = Number(document.getElementById('cvccTarjetaCuotas').value) || 1;
      body.tarjetaLote = document.getElementById('cvccTarjetaLote').value.trim();
      body.tarjetaCupon = document.getElementById('cvccTarjetaCupon').value.trim();
      body.tarjetaCodigoAutorizacion = document.getElementById('cvccTarjetaCodigoAutorizacion').value.trim();
      if (!body.tarjetaLote) { errEl.textContent = 'Falta el número de lote'; return; }
      if (!body.tarjetaCupon) { errEl.textContent = 'Falta el número de cupón'; return; }
    }
  }
  try{
    if (!ventaId) body.clienteId = clienteId;
    const r = await fetch(ventaId ? '/api/ventas/' + ventaId + '/pagos' : '/api/tesoreria/cobros-cuenta-cliente', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al registrar el cobro');
    if (!ventaId && data.reciboTipo && data.reciboId) {
      const url = '/api/tesoreria/recibo-cuenta/' + data.reciboTipo + '/' + data.reciboId;
      document.getElementById('modalCobroVentaRoot').innerHTML = `<div class="modal-bg"><div class="modal"><span class="close-x" onclick="cerrarModalCobroVentaCC()">✕</span><h2>Recibo registrado</h2>
        <p class="ok-msg">El cobro de ${money(body.monto)} quedó registrado y el saldo del cliente se actualizó.</p>
        <button class="btn" onclick="imprimirDocumento('${url}')">Imprimir recibo</button> <button class="btn secondary" onclick="imprimirDocumento('${url}','compartir')">Compartir</button> <button class="btn secondary" onclick="cerrarModalCobroVentaCC()">Cerrar</button></div></div>`;
      await cargarCuentaCorrienteTab(clienteId);
      return;
    }
    cerrarModalCobroVentaCC();
    await cargarCuentaCorrienteTab(clienteId);
  }catch(e){ errEl.textContent = e.message; }
}

async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function exportarXlsx(){ descargarBlob(BASE + '/export', 'clientes.xlsx'); }

async function confirmarImportar(){
  const input = document.getElementById('impArchivo');
  const file = input.files[0];
  document.getElementById('impErr').textContent = '';
  document.getElementById('impResultado').innerHTML = '';
  if (!file) { document.getElementById('impErr').textContent = 'Elegí un archivo .xlsx'; return; }
  try{
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const r = await fetch(BASE + '/import', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    let html = `<p class="ok-msg">Creados: ${data.creados} — Actualizados: ${data.actualizados}</p>`;
    if (data.errores && data.errores.length) {
      html += `<p class="err">${data.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        data.errores.map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') + '</ul>';
    }
    document.getElementById('impResultado').innerHTML = html;
    await cargarClientes();
  }catch(e){
    document.getElementById('impErr').textContent = e.message;
  }
}

// Consulta de CUIT en ARCA (5/10/2026): completa razón social, domicilio y
// categoría fiscal con los datos del padrón. No pisa lo que ya está cargado
// salvo la categoría fiscal; si falla, el formulario sigue igual.
let autoCuitUltimo = '';
// Al completar los 11 dígitos se consulta ARCA solo (sin pisar lo ya cargado).
function autoBuscarCuit(pref){
  const d = document.getElementById(pref + 'Cuit').value.replace(/\D/g, '');
  if (d.length !== 11) { autoCuitUltimo = ''; return; }
  if (d === autoCuitUltimo) return;
  autoCuitUltimo = d;
  const nombreId = pref === 'fc' ? 'fcApellidoRazonSocial' : 'fpRazonSocial';
  buscarCuitEnArca(pref, nombreId, pref === 'fc');
}
async function buscarCuitEnArca(pref, idNombre, conCategoria){
  const inp = document.getElementById(pref + 'Cuit');
  const err = document.getElementById(pref + 'Err');
  const cuit = (inp.value || '').replace(/\D/g, '');
  if (cuit.length !== 11) { err.textContent = 'Cargá el CUIT completo (11 dígitos) para buscarlo en ARCA'; return; }
  err.textContent = 'Consultando ARCA…';
  try{
    const r = await fetch('/api/fiscal/consulta-cuit/' + cuit, {headers: headersAuth()});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'No se pudo consultar ARCA');
    const poner = (id, val, forzar) => { const el = document.getElementById(id); if (el && val && (forzar || !el.value.trim())) el.value = val; };
    poner(idNombre, d.razonSocial);
    poner(pref + 'Domicilio', d.domicilio);
    poner(pref + 'Localidad', d.localidad);
    poner(pref + 'Provincia', d.provincia);
    poner(pref + 'CodigoPostal', d.codigoPostal);
    if (conCategoria) poner(pref + 'CategoriaFiscal', d.categoriaFiscal, true);
    err.textContent = '';
    if (d.estadoClave && String(d.estadoClave).toUpperCase() !== 'ACTIVO') err.textContent = 'Ojo: ARCA informa la clave como ' + d.estadoClave + '.';
  }catch(e){ err.textContent = e.message; }
}

// Comprobante completo + si es fiscal (para la tabla, el resumen impreso, el CSV y el texto de WhatsApp/mail).
function compCC(m){
  const v = m.ventaId && window._ccVentas ? window._ccVentas[String(m.ventaId)] : null;
  return v ? { num: v.comprobante || '', fiscal: v.fiscalComprobante ? 'Fiscal' : 'No fiscal' } : { num: '', fiscal: '' };
}
function resumenCCTexto(maxFilas){
  const c = window._ccCtx; if (!c) return '';
  const nombre = [c.cliente.apellidoRazonSocial, c.cliente.nombre].filter(Boolean).join(', ');
  const fil = c.filas.filter(f => !(f.m.importado && f.m.origen === 'saldo_inicial_dux')).slice(0, maxFilas || 10);
  const estado = c.saldo > 0.005 ? 'Saldo a pagar: ' + money(c.saldo) : (c.saldo < -0.005 ? 'Saldo a favor: ' + money(-c.saldo) : 'Cuenta al día (saldo $ 0)');
  return 'Resumen de cuenta corriente — ' + nombre + '\n' + estado + '\n\nÚltimos movimientos:\n' + fil.map(f => fechaCorta(f.m.fecha) + ' · ' + (f.m.concepto || f.m.origen || '') + (compCC(f.m).num ? ' · ' + compCC(f.m).num + ' (' + compCC(f.m).fiscal + ')' : '') + ' · ' + (f.m.tipo === 'debito' ? '+' : '−') + money(f.m.monto)).join('\n');
}
function telefonoWhatsApp(c){
  let d = String(c.celular || c.telefono || '').replace(/\D/g, '');
  if (!d) return '';
  d = d.replace(/^0+/, '');
  if (d.startsWith('54')) return d;
  if (!d.startsWith('9')) d = '9' + d;
  return '54' + d;
}
function accionCC(que){
  const m = document.getElementById('ccAccionesMenu'); if (m) m.classList.add('hidden');
  const c = window._ccCtx; if (!c) return;
  if (que === 'cobrar') { abrirCobroCuentaCC(c.id, c.saldo, [c.cliente.apellidoRazonSocial, c.cliente.nombre].filter(Boolean).join(', ')); return; }
  if (que === 'vender') { location.href = '/admin-ventas.html?vender=' + encodeURIComponent(c.id); return; }
  if (que === 'whatsapp') {
    const tel = telefonoWhatsApp(c.cliente);
    if (!tel && !confirm('El cliente no tiene teléfono cargado. ¿Abrir WhatsApp igual para elegir el contacto a mano?')) return;
    window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(resumenCCTexto(10)), '_blank'); return;
  }
  if (que === 'mail') {
    const mail = c.cliente.email || '';
    location.href = 'mailto:' + mail + '?subject=' + encodeURIComponent('Resumen de cuenta corriente') + '&body=' + encodeURIComponent(resumenCCTexto(15));
    return;
  }
  const nombre = [c.cliente.apellidoRazonSocial, c.cliente.nombre].filter(Boolean).join(', ');
  const filas = c.filas;
  if (que === 'excel') {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lineas = [['Fecha', 'Concepto', 'Comprobante', 'Fiscal', 'Origen', 'Débito', 'Crédito', 'Saldo'].map(q).join(';')].concat(filas.map(f => [fechaCorta(f.m.fecha), f.m.concepto || '', compCC(f.m).num, compCC(f.m).fiscal, f.m.origen || '', f.m.tipo === 'debito' ? f.m.monto : '', f.m.tipo === 'credito' ? f.m.monto : '', f.saldo == null ? '' : f.saldo].map(q).join(';')));
    if (c.saldoAnterior != null) lineas.push(['', 'Saldo anterior al historial cargado', '', '', '', '', '', c.saldoAnterior].map(q).join(';'));
    const blob = new Blob(['﻿' + lineas.join('\n')], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cuenta-corriente-' + nombre.replace(/[^\w]+/g, '-') + '.csv'; a.click(); return;
  }
  // imprimir / ver
  const w = window.open('', '_blank'); if (!w) { alert('El navegador bloqueó la ventana. Permití ventanas emergentes.'); return; }
  const tr = filas.map(f => `<tr><td>${fechaCorta(f.m.fecha)}</td><td>${escapeHtml(f.m.concepto || '')}</td><td style="white-space:nowrap">${escapeHtml(compCC(f.m).num)}${compCC(f.m).fiscal ? ' <small>(' + compCC(f.m).fiscal + ')</small>' : ''}</td><td style="text-align:right">${f.m.tipo === 'debito' ? money(f.m.monto) : ''}</td><td style="text-align:right">${f.m.tipo === 'credito' ? money(f.m.monto) : ''}</td><td style="text-align:right">${f.saldo == null ? '' : money(f.saldo)}</td></tr>`).join('');
  const ant = c.saldoAnterior != null && Math.abs(c.saldoAnterior) >= 0.01 ? `<tr><td></td><td><i>Saldo anterior al historial cargado</i></td><td></td><td></td><td></td><td style="text-align:right">${money(c.saldoAnterior)}</td></tr>` : '';
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Resumen de cuenta corriente</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#111}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left}th{background:#f3f3f3}</style>
    <h2>Resumen de cuenta corriente</h2><p><b>${escapeHtml(nombre)}</b>${c.cliente.cuit ? ' · CUIT ' + escapeHtml(c.cliente.cuit) : ''}<br>Emitido el ${new Date().toLocaleDateString('es-AR')} · <b>Saldo: ${money(c.saldo)}</b> ${c.saldo > 0.005 ? '(a pagar)' : (c.saldo < -0.005 ? '(a favor del cliente)' : '')}</p>
    <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Comprobante</th><th style="text-align:right">Débito</th><th style="text-align:right">Crédito</th><th style="text-align:right">Saldo</th></tr></thead><tbody>${tr}${ant}</tbody></table>
    <p><button onclick="window.print()">Imprimir</button></p>`);
  w.document.close();
}

let unifGrupos = [];
async function abrirUnificar(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg">
      <div class="modal" style="max-width:900px;width:96%">
        <span class="close-x" onclick="cerrarModal()">✕</span>

        <div style="margin:6px 0"><input type="text" id="unifQ" placeholder="Buscar un cliente por nombre o CUIT (ej: gercafe)…" style="width:60%" onkeydown="if(event.key==='Enter') buscarUnificar()"> <button class="btn secondary" onclick="buscarUnificar()">Buscar</button></div>

function unifGrupoHtml(g, gi){ return `
      <div id="unifG${gi}" style="border:1px solid #ccc;border-radius:8px;padding:8px 10px;margin:8px 0;${g.riesgo ? 'border-color:#d9a400;background:rgba(217,164,0,.08)' : ''}">

        <table style="width:100%;font-size:13px;border-collapse:collapse">

          ${g.miembros.map((m, mi) => `<tr>
            <td><input type="radio" name="unifK${gi}" value="${m._id}" ${mi === 0 ? 'checked' : ''} onchange="unifMarcar(${gi})"></td>
            <td><input type="checkbox" class="unifC${gi}" value="${m._id}" ${mi === 0 ? 'disabled' : (gi >= 100000 ? '' : 'checked')}></td>
            <td>${escapeHtml(m.nombre)}</td><td>${escapeHtml(m.sucursal)}</td><td>${escapeHtml(m.cuit)}</td><td>${escapeHtml(m.domicilio)}</td><td>${escapeHtml(m.telefono)}</td>
            <td style="text-align:right">${m.ventas}</td><td style="text-align:right">${m.saldo ? m.saldo.toLocaleString('es-AR') : ''}</td></tr>`).join('')}
        </table>
        <button class="btn" style="margin-top:6px" onclick="unificarGrupo(${gi})">Unificar este grupo</button>
        <span class="muted" id="unifR${gi}"></span>
      </div>`; }
let unifManual = 0;
async function buscarUnificar(){
  const q = document.getElementById('unifQ').value.trim(), out = document.getElementById('unifBusca'), errEl = document.getElementById('unifErr'); errEl.textContent = '';
  if (q.length < 2){ out.innerHTML = ''; return; }
  out.innerHTML = '<p class="muted">Buscando…</p>';
  try{
    const r = await fetch('/api/unificar-clientes/buscar?q=' + encodeURIComponent(q), {headers: headersAuth()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    if (d.miembros.length < 2){ out.innerHTML = '<p class="muted">' + (d.miembros.length ? 'Solo hay un cliente con ese nombre.' : 'No se encontró ningún cliente.') + '</p>'; return; }
    const gi = 100000 + (++unifManual);
    out.innerHTML = '<p class="muted">Resultados de la búsqueda (hasta 60). Tildá los que son el mismo cliente y elegí cuál se conserva:</p>' + unifGrupoHtml({motivo: 'Búsqueda manual', riesgo: false, miembros: d.miembros}, gi);
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function cargarUnificar(){
  const out = document.getElementById('unifLista'), errEl = document.getElementById('unifErr'); if (!out) return;
  try{
    const r = await fetch('/api/unificar-clientes/grupos', {headers: headersAuth()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    unifGrupos = d.grupos;
    if (!d.grupos.length){ out.innerHTML = '<p class="ok-msg">No se encontraron clientes duplicados.</p>'; return; }
    out.innerHTML = `<p><b>${d.total}</b> grupo(s) de posibles duplicados${d.total > d.grupos.length ? ' (se muestran los primeros ' + d.grupos.length + ')' : ''}.
      <button class="btn unifTodosBtn" style="margin-left:8px" onclick="unificarTodos(true)">Unificar TODO junto (${d.total} grupos)</button>
      ${d.sinRiesgo && d.sinRiesgo < d.total ? `<button class="btn secondary unifTodosBtn" style="margin-left:8px" onclick="unificarTodos(false)">Solo los ${d.sinRiesgo} sin riesgo</button>` : ''}</p><p class="muted" id="unifProg"></p>` + d.grupos.map((g, gi) => unifGrupoHtml(g, gi)).join('');
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function unificarTodos(incluirDudosos){
  const prog = document.getElementById('unifProg');
  const msg = incluirDudosos
    ? 'Se van a unificar TODOS los grupos, incluidos los de mismo nombre con CUIT distinto (pueden ser personas distintas). En cada grupo se conserva el cliente con más ventas. No hay botón para deshacerlo. ¿Seguro?'
    : 'Se van a unificar todos los grupos sin riesgo (mismo CUIT, o mismo nombre sin CUIT contradictorio). En cada grupo se conserva el cliente con más ventas. ¿Seguimos?';
  if (!confirm(msg)) return;
  document.querySelectorAll('.unifTodosBtn').forEach(b => b.disabled = true);
  if (prog) prog.textContent = 'Unificando, puede tardar un par de minutos…';
  try{
    const r = await fetch('/api/unificar-clientes/unificar-todos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({incluirDudosos: !!incluirDudosos})});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    document.getElementById('unifLista').innerHTML = '<p class="ok-msg">Listo: ' + d.grupos + ' grupos unificados (' + d.unificados + ' clientes duplicados juntados).</p>';
    if (typeof cargarClientes === 'function') cargarClientes();
  }catch(e){ if (prog) prog.textContent = ''; document.getElementById('unifErr').textContent = e.message; document.querySelectorAll('.unifTodosBtn').forEach(b => b.disabled = false); }
}
function unifMarcar(gi){
  const k = document.querySelector('input[name="unifK' + gi + '"]:checked').value;
  document.querySelectorAll('.unifC' + gi).forEach(c => { if (c.value === k){ c.checked = false; c.disabled = true; } else if (c.disabled){ c.disabled = false; c.checked = gi < 100000; } });
}
async function unificarGrupo(gi){
  const k = document.querySelector('input[name="unifK' + gi + '"]:checked').value;
  const perd = [...document.querySelectorAll('.unifC' + gi)].filter(c => c.checked && c.value !== k).map(c => c.value);
  if (!perd.length){ alert('Tildá al menos un duplicado para juntar.'); return; }
  if (!confirm('¿Unificar ' + perd.length + ' cliente(s) duplicado(s) en el que conservás? No se puede deshacer fácilmente.')) return;

  try{
    const r = await fetch('/api/unificar-clientes/unificar', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({ganadorId: k, perdedorIds: perd})});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    document.getElementById('unifG' + gi).innerHTML = '<span class="ok-msg">Listo: ' + d.unificados + ' unificado(s) en ' + escapeHtml(d.conservado) + '.</span>';

  }catch(e){ res.textContent = ' ' + e.message; }
}

    <div class="modal-bg">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar fichas de clientes de Dux</h2>
        <p class="muted">Subí el archivo "Listado de Clientes" de Dux. A los clientes que ya existen (por las ventas, cobros y saldos importados) les completa los datos que tengan vacíos (CUIT/DNI, categoría fiscal, domicilio, teléfono, mail, vendedor…) sin pisar lo ya cargado. Los que no existen se crean en la sucursal que elijas. Se puede repetir sin duplicar.</p>
        <label>Sucursal donde se crean los que no existan</label>
        <select id="impFcOrg" onchange="previewFichasCliDux()">${impFcOrgs.map(o => `<option value="${o._id}" ${o._id === ORG ? 'selected' : ''}>${escapeHtml(o.nombre)}</option>`).join('')}</select>
        <input type="file" id="impFcArchivo" accept=".xls,.xlsx" onchange="previewFichasCliDux()" style="margin-top:8px">
        <div class="err" id="impFcErr"></div>
        <div id="impFcResumen"></div>
        <button class="btn" id="impFcBtn" style="margin-top:10px;display:none" onclick="aplicarFichasCliDux()">Importar fichas</button>
      </div>
    </div>`;
}
function hFc(){ const h = headersAuthJson(); const s = document.getElementById('impFcOrg'); if (s && s.value) h['x-org-id'] = s.value; return h; }
function bodyFc(){ return JSON.stringify({archivoBase64: impFcB64.b64, orgId: document.getElementById('impFcOrg').value}); }
async function previewFichasCliDux(){
  const file = document.getElementById('impFcArchivo').files[0]; const errEl = document.getElementById('impFcErr'); errEl.textContent = '';
  const out = document.getElementById('impFcResumen'); out.innerHTML = ''; document.getElementById('impFcBtn').style.display = 'none';
  if (!file) return; out.innerHTML = '<p class="muted">Analizando…</p>';
  try{
    if (!impFcB64 || impFcB64.file !== file) impFcB64 = {file, b64: await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); })};
    const r = await fetch('/api/fichas-import-dux/clientes/preview', {method:'POST', headers: hFc(), body: bodyFc()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al analizar');
    out.innerHTML = `<ul style="line-height:1.7;padding-left:18px">
      <li><b>${d.clientes}</b> clientes en el archivo (${d.conCuit} con CUIT, ${d.resp_inscriptos} responsables inscriptos)</li>
      <li>${d.existentes} ya existen: a <b>${d.aCompletar}</b> se les completan datos (${d.camposACompletar} campos vacíos)</li>
      <li><b>${d.aCrear}</b> se van a crear en ${escapeHtml(d.sucursalNuevos)}</li></ul>`
      + (d.cuitRepetidos ? `<p class="muted">${d.cuitRepetidos} CUIT no se cargan porque ya los tiene otro cliente de la sucursal.</p>` : '')
      + (d.ambiguos ? `<p class="err">${d.ambiguos} no se cargan porque coinciden con más de un cliente: ${d.ejemplosAmbiguos.map(escapeHtml).join(', ')}.</p>` : '')
      + (d.errores ? '<p class="muted">' + d.errores + ' fila(s) omitidas: ' + d.ejemplosErrores.map(escapeHtml).join('; ') + '</p>' : '');
    if (d.aCrear > 0 || d.aCompletar > 0) document.getElementById('impFcBtn').style.display = '';
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function aplicarFichasCliDux(){
  const btn = document.getElementById('impFcBtn'), errEl = document.getElementById('impFcErr');
  if (btn.disabled || !impFcB64) return; btn.disabled = true; errEl.textContent = '';
  try{
    const r = await fetch('/api/fichas-import-dux/clientes/aplicar', {method:'POST', headers: hFc(), body: bodyFc()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al importar');
    document.getElementById('impFcResumen').innerHTML = `<p class="ok-msg">Listo: ${d.creados} clientes creados y ${d.completados} completados.</p>`;
    btn.style.display = 'none'; if (typeof cargarClientes === 'function') cargarClientes();
  }catch(e){ errEl.textContent = e.message; }
  btn.disabled = false;
}

// ---- Saldos de clientes de Dux ----
let impSdB64 = null, impSdOrgs = [];
async function abrirSaldosDux(){
  impSdB64 = null;
  try{ const r = await fetch('/api/usuarios/me', {headers: headersAuth()}); if (r.ok) impSdOrgs = (await r.json()).organizaciones || []; }catch(e){}
  const hoy = new Date(Date.now() - 3*3600e3).toISOString().slice(0,10);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar saldos de clientes de Dux</h2>
        <p class="muted">Subí el archivo "Consulta de Clientes con Saldo" de Dux. Cada saldo se carga como un movimiento "Saldo inicial Dux" en la cuenta corriente del cliente (positivo = debe, negativo = a favor). Cada cliente se busca por nombre en todas tus sucursales. Si lo subís de nuevo, reemplaza el saldo inicial anterior, no lo duplica.</p>
        <label>Fecha del saldo</label>
        <input type="date" id="impSdFecha" value="${hoy}" onchange="previewSaldosDux()">
        <label style="margin-top:8px;display:block">Sucursal para los clientes que no existan</label>
        <select id="impSdOrg" onchange="previewSaldosDux()">${impSdOrgs.map(o => `<option value="${o._id}" ${o._id === ORG ? 'selected' : ''}>${escapeHtml(o.nombre)}</option>`).join('')}</select>
        <label style="display:block;margin-top:8px"><input type="checkbox" id="impSdCero" onchange="previewSaldosDux()"> Poner en 0 a los clientes con saldo inicial anterior que ya no figuran en el archivo</label>
        <input type="file" id="impSdArchivo" accept=".xls,.xlsx" onchange="previewSaldosDux()" style="margin-top:8px">
        <div class="err" id="impSdErr"></div>
        <div id="impSdResumen"></div>
        <button class="btn" id="impSdBtn" style="margin-top:10px;display:none" onclick="aplicarSaldosDux()">Cargar saldos</button>
      </div>
    </div>`;
}
function bodySaldosDux(){ return JSON.stringify({archivoBase64: impSdB64.b64, orgId: document.getElementById('impSdOrg').value, fechaCorte: document.getElementById('impSdFecha').value, ponerEnCero: document.getElementById('impSdCero').checked}); }
function hSd(){ const h = headersAuthJson(); const s = document.getElementById('impSdOrg'); if (s && s.value) h['x-org-id'] = s.value; return h; }
async function previewSaldosDux(){
  const file = document.getElementById('impSdArchivo').files[0]; const errEl = document.getElementById('impSdErr'); errEl.textContent = '';
  const out = document.getElementById('impSdResumen'); out.innerHTML = ''; document.getElementById('impSdBtn').style.display = 'none';
  if (!file) return; out.innerHTML = '<p class="muted">Analizando…</p>';
  try{
    if (!impSdB64 || impSdB64.file !== file) impSdB64 = {file, b64: await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); })};
    const r = await fetch('/api/saldos-import-dux/clientes/preview', {method:'POST', headers: hSd(), body: bodySaldosDux()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al analizar');
    const m = n => '$' + Number(n).toLocaleString('es-AR', {maximumFractionDigits:0});
    out.innerHTML = `<ul style="line-height:1.7;padding-left:18px">
      <li><b>${d.clientes}</b> clientes con saldo. Deben <b>${m(d.totalDeudores)}</b> (${d.cantDeudores}) · a favor <b>${m(d.totalAFavor)}</b> (${d.cantAFavor}) · neto <b>${m(d.saldoNeto)}</b></li>
      <li>${d.existentes} ya existen${d.enVariasSucursales ? ' (' + d.enVariasSucursales + ' están en más de una sucursal: van a la que tiene más ventas)' : ''}, <b>${d.nuevos}</b> se van a crear</li>
      <li>A cargar ahora: <b>${d.aCargar}</b> (${d.sinCambios} ya tienen ese mismo saldo)${d.ponerEnCero ? ' · ' + d.ponerEnCero + ' se ponen en 0' : ''}</li></ul>`
      + (d.ambiguos ? `<p class="err"><b>${d.ambiguos} clientes no se cargan</b> (${m(d.montoAmbiguos)}) porque el nombre coincide con más de un cliente del sistema: ${d.detalleAmbiguos.map(x => escapeHtml(x.nombre) + ' (' + m(x.saldo) + ')').join(', ')}. Unificá los duplicados y volvé a subir el archivo.</p>` : '')
      + (d.errores.length ? '<p class="muted">' + d.errores.length + ' aviso(s): ' + d.errores.slice(0,5).map(e => escapeHtml(e.motivo)).join('; ') + '</p>' : '');
    if (d.aCargar > 0 || d.ponerEnCero > 0) document.getElementById('impSdBtn').style.display = '';
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function aplicarSaldosDux(){
  const btn = document.getElementById('impSdBtn'), errEl = document.getElementById('impSdErr');
  if (btn.disabled || !impSdB64) return; btn.disabled = true; errEl.textContent = '';
  try{
    const r = await fetch('/api/saldos-import-dux/clientes/aplicar', {method:'POST', headers: hSd(), body: bodySaldosDux()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al cargar');
    document.getElementById('impSdResumen').innerHTML = `<p class="ok-msg">Listo: ${d.cargados} saldos cargados${d.clientesCreados ? ' y ' + d.clientesCreados + ' clientes creados' : ''}.</p>`;
    btn.style.display = 'none'; if (typeof cargarClientes === 'function') cargarClientes();
  }catch(e){ errEl.textContent = e.message; }
  btn.disabled = false;
}
</script>
</body>
</html>
