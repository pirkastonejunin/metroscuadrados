<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.inactivo{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:920px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .modal-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .modal-tabs button{background:none;border:none;padding:9px 12px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .modal-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Clientes</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Clientes. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Clientes</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:220px;flex:1">
            <label>Buscar (nombre, código, CUIT o documento)</label>
            <input id="fBusqueda" oninput="cargarClientes()" placeholder="Ej: Pérez, 20-12345678-9">
          </div>
          <div>
            <label style="visibility:hidden">.</label>
            <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap">
              <input type="checkbox" id="fInactivos" style="width:auto" onchange="cargarClientes()"> Ver inactivos
            </label>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" onclick="exportarXlsx()">Exportar</button>
          <button class="btn secondary" onclick="abrirImportar()">Importar</button>
          <button class="btn" onclick="abrirNuevoCliente()">+ Nuevo cliente</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Código</th><th>Cliente</th><th>Categoría fiscal</th><th>CUIT / Doc.</th><th>Contacto</th><th>Estado</th><th></th></tr></thead>
        <tbody id="clientesBody"><tr><td colspan="7" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<!-- Modal aparte para "Cobrar" una venta desde la pestaña Cuenta corriente
     (3/10/2026) — va en SU PROPIO contenedor, no en #modalRoot, para no
     pisar el modal de "Editar cliente" que sigue abierto detrás. -->
<div id="modalCobroVentaRoot"></div>

<script>
const BASE = '/api/clientes';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('clientes'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'clientes', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await Promise.all([cargarClientes(), cargarVendedoresYListasCliente()]);
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

let clientesCache = [];
async function cargarClientes(){
  const params = new URLSearchParams();
  if (document.getElementById('fBusqueda').value.trim()) params.set('q', document.getElementById('fBusqueda').value.trim());
  if (document.getElementById('fInactivos').checked) params.set('incluirInactivos', '1');
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('clientesBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="7" class="err">No se pudo cargar.</td></tr>'; return; }
  clientesCache = await r.json();
  renderClientes();
}

const CATEGORIA_FISCAL_LABEL = {
  consumidor_final: 'Consumidor final', exento: 'Exento', monotributista: 'Monotributista',
  responsable_inscripto: 'Responsable Inscripto', exterior: 'Exterior', iva_no_alcanzado: 'IVA no alcanzado'
};
const TIPO_DOCUMENTO_LABEL = { cuil: 'CUIL', cuit: 'CUIT', dni: 'DNI', pasaporte: 'Pasaporte' };

function renderClientes(){
  const body = document.getElementById('clientesBody');
  if (!clientesCache.length) { body.innerHTML = '<tr><td colspan="7" class="muted">No hay clientes todavía.</td></tr>'; return; }
  body.innerHTML = clientesCache.map(c => `
    <tr>
      <td><strong>${escapeHtml(c.codigo || '—')}</strong></td>
      <td>${escapeHtml(c.apellidoRazonSocial)}${c.nombre ? ' ' + escapeHtml(c.nombre) : ''}${c.nombreFantasia ? `<div class="muted">${escapeHtml(c.nombreFantasia)}</div>` : ''}</td>
      <td class="muted">${CATEGORIA_FISCAL_LABEL[c.categoriaFiscal] || '—'}</td>
      <td class="muted">${c.cuit ? escapeHtml(c.cuit) : (c.numeroDocumento ? `${TIPO_DOCUMENTO_LABEL[c.tipoDocumento]||'Doc.'} ${escapeHtml(c.numeroDocumento)}` : '—')}</td>
      <td class="muted">${[c.telefono || c.celular, c.email].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</td>
      <td><span class="pill ${c.activo === false ? 'inactivo' : 'activo'}">${c.activo === false ? 'Inactivo' : 'Activo'}</span></td>
      <td>
        <button class="btn small secondary" onclick="abrirEditarCliente('${c._id}')">Editar</button>
        ${c.activo === false ? '' : `<button class="btn small danger" onclick="desactivarCliente('${c._id}', '${escapeHtml(c.apellidoRazonSocial).replace(/'/g,"\\'")}')">Desactivar</button>`}
      </td>
    </tr>
  `).join('');
}

const SEXOS = [{v:'', l:'Sin especificar'}, {v:'femenino', l:'Femenino'}, {v:'masculino', l:'Masculino'}];
const CATEGORIAS_FISCALES = [
  {v:'consumidor_final', l:'Consumidor final'}, {v:'exento', l:'Exento'}, {v:'monotributista', l:'Monotributista'},
  {v:'responsable_inscripto', l:'Responsable Inscripto'}, {v:'exterior', l:'Exterior'}, {v:'iva_no_alcanzado', l:'IVA no alcanzado'}
];
const TIPOS_DOCUMENTO = [{v:'', l:'Sin especificar'}, {v:'dni', l:'DNI'}, {v:'cuit', l:'CUIT'}, {v:'cuil', l:'CUIL'}, {v:'pasaporte', l:'Pasaporte'}];
const TIPOS_COMPROBANTE = [{v:'', l:'Sin especificar'}, {v:'comprobante_venta', l:'Comprobante de venta'}, {v:'factura', l:'Factura'}];

function opciones(lista, seleccionada){
  return lista.map(u => `<option value="${u.v}" ${u.v===(seleccionada||'')?'selected':''}>${u.l}</option>`).join('');
}

// Vendedores y listas de precio por defecto (3/10/2026, pedido de Mato:
// "en datos de clientes fijate que deberia desplegar vendedores y lista
// de precios por defecto. de esa manera puedo asignarle un vendedor y
// una lista para cuando tenga que hacer una venta") — antes eran campos
// de texto libre. Vendedor usa los usuarios activos del sistema (mismo
// GET /api/usuarios/lite que ya usa el combo de Ventas, guarda el
// nombre); Lista de precio usa las listas reales de Productos (guarda
// el _id de la lista, igual que en Ventas).
let usuariosClientesCache = [];
let listasPrecioClientesCache = [];
async function cargarVendedoresYListasCliente(){
  const [ru, rl] = await Promise.all([
    fetch('/api/usuarios/lite', {headers: headersAuth()}),
    fetch('/api/productos/listas-precio', {headers: headersAuth()})
  ]);
  usuariosClientesCache = ru.ok ? await ru.json() : [];
  listasPrecioClientesCache = rl.ok ? await rl.json() : [];
}
function opcionesVendedorCliente(seleccionado){
  const base = seleccionado && !usuariosClientesCache.some(u => u.nombre === seleccionado) ? [{nombre: seleccionado}] : [];
  return '<option value="">Sin especificar</option>' + base.concat(usuariosClientesCache).map(u =>
    `<option value="${escapeHtml(u.nombre)}" ${u.nombre===seleccionado?'selected':''}>${escapeHtml(u.nombre)}</option>`
  ).join('');
}
function opcionesListaPrecioCliente(seleccionada){
  return '<option value="">Sin especificar</option>' + listasPrecioClientesCache.filter(l => l.activa !== false).map(l =>
    `<option value="${l._id}" ${String(l._id)===String(seleccionada||'')?'selected':''}>${escapeHtml(l.nombre)}</option>`
  ).join('');
}

// Tipo de cliente: desplegable con algunos valores fijos + los que ya se
// hayan cargado antes (así queda "abierto" sin volver a ser texto libre).
// La opción "+ Agregar nuevo…" (ver listenerTipoCliente) permite sumar uno
// nuevo al vuelo, que a partir de ahí queda disponible para el resto.
const TIPOS_CLIENTE_BASE = ['Consumidor final', 'Mayorista', 'Colocador'];
function opcionesTipoCliente(seleccionado){
  const usados = clientesCache.map(c => c.tipoCliente).filter(Boolean);
  const todos = [...new Set([...TIPOS_CLIENTE_BASE, ...usados])];
  let html = '<option value="">Sin especificar</option>' +
    todos.map(t => `<option value="${escapeHtml(t)}" ${t===seleccionado?'selected':''}>${escapeHtml(t)}</option>`).join('');
  if (seleccionado && !todos.includes(seleccionado)) {
    html += `<option value="${escapeHtml(seleccionado)}" selected>${escapeHtml(seleccionado)}</option>`;
  }
  html += '<option value="__nuevo__">+ Agregar nuevo…</option>';
  return html;
}
function listenerTipoCliente(){
  const select = document.getElementById('fcTipoCliente');
  const valorPrevio = select.value;
  select.addEventListener('change', function(){
    if (this.value !== '__nuevo__') return;
    const nuevo = (prompt('Nuevo tipo de cliente:') || '').trim();
    if (nuevo) {
      const opt = document.createElement('option');
      opt.value = nuevo; opt.textContent = nuevo; opt.selected = true;
      this.insertBefore(opt, this.lastElementChild);
    } else {
      this.value = valorPrevio && valorPrevio !== '__nuevo__' ? valorPrevio : '';
    }
  });
}

function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// Campos alineados con la ficha de cliente de Dux (ver clientes.js) para que
// migrar sea directo — se cargan los mismos datos y de ahí en más se sacan o
// agregan según haga falta. A diferencia de Productos, acá solo Apellido/
// Razón social y Categoría fiscal son obligatorios, igual que en Dux.
function formularioCliente(c){
  c = c || {};
  return `
    <div class="section-title">Datos personales</div>
    <div class="grid3">
      <div style="grid-column:span 2"><label>Apellido / Razón social *</label><input id="fcApellidoRazonSocial" value="${escapeHtml(c.apellidoRazonSocial||'')}"></div>
      <div><label>Código</label><input id="fcCodigo" value="${escapeHtml(c.codigo||'')}" placeholder="Igual al Código en Dux"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>Nombre</label><input id="fcNombre" value="${escapeHtml(c.nombre||'')}"></div>
      <div><label>Nombre de fantasía</label><input id="fcNombreFantasia" value="${escapeHtml(c.nombreFantasia||'')}"></div>
      <div><label>Sexo</label><select id="fcSexo">${opciones(SEXOS, c.sexo)}</select></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>Tipo de cliente</label><select id="fcTipoCliente">${opcionesTipoCliente(c.tipoCliente)}</select></div>
      <div><label>Origen del cliente</label><input id="fcOrigenCliente" value="${escapeHtml(c.origenCliente||'')}" placeholder="Ej: Showroom, Referido"></div>
      <div><label>Fecha de nacimiento</label><input id="fcFechaNacimiento" type="date" value="${c.fechaNacimiento ? String(c.fechaNacimiento).slice(0,10) : ''}"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>Límite cta. cte. en facturación</label><input id="fcLimiteCtaCteFacturacion" type="number" min="0" step="0.01" value="${c.limiteCtaCteFacturacion!=null?c.limiteCtaCteFacturacion:''}"></div>
      <div><label>Límite cta. cte. en pedido</label><input id="fcLimiteCtaCtePedido" type="number" min="0" step="0.01" value="${c.limiteCtaCtePedido!=null?c.limiteCtaCtePedido:''}"></div>
      <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);margin-top:18px"><input type="checkbox" id="fcNoEditable" style="width:auto" ${c.noEditable?'checked':''}> No editable</label>
    </div>

    <div class="section-title" style="margin-top:16px">Datos de facturación</div>
    <div class="grid3">
      <div><label>Categoría fiscal *</label><select id="fcCategoriaFiscal">${opciones(CATEGORIAS_FISCALES, c.categoriaFiscal)}</select></div>
      <div><label>Tipo documento</label><select id="fcTipoDocumento">${opciones(TIPOS_DOCUMENTO, c.tipoDocumento)}</select></div>

// -------------------------------------------------------------------
// Cuenta corriente (2/10/2026, pedido de Mato) — historial de deuda y
// cobros de un cliente, independiente de cada venta puntual. Ver
// GET /:id/cuenta-corriente y registrarMovimientoCuentaCorriente en
// clientes.js (backend).
// -------------------------------------------------------------------
const ORIGEN_CC_LABEL = { venta: 'Venta', cobro_venta: 'Cobro de venta', cobro_cuenta: 'Cobro a cuenta', manual: 'Manual' };
// Ver/Imprimir/Compartir/Anular para comprobantes de venta referenciados
// desde la cuenta corriente (3/10/2026, pedido de Mato: "en todas las
// cuentas corrientes o detalles q haya algun comprobante asociado
// agregar boton de ver, comparti, imprimir, anular"). Misma convención
// que admin-ventas.html (cada pantalla con su copia mínima).
async function imprimirDocumento(url, accion){
  const ventana = window.open('', '_blank');
  try{
    const r = await fetch(url, {headers: headersAuth()});
    const html = await r.text();
    if (!r.ok) { ventana.document.write('<p>No se pudo generar el documento.</p>'); return; }
    ventana.document.write(html);
    ventana.document.close();
    if (accion === 'imprimir') {
      ventana.addEventListener('load', () => setTimeout(() => ventana.print(), 250));
    } else if (accion === 'compartir') {
      ventana.addEventListener('load', () => setTimeout(() => { if (ventana.compartirDocumento) ventana.compartirDocumento(); }, 250));
    }
  }catch(e){
    ventana.document.write('<p>No se pudo generar el documento: ' + escapeHtml(e.message) + '</p>');
  }
}
function botonesImprimible(url){
  return `
    <button class="btn small secondary" onclick="imprimirDocumento('${url}')">Ver</button>
    <button class="btn small secondary" onclick="imprimirDocumento('${url}','imprimir')">Imprimir</button>
    <button class="btn small secondary" onclick="imprimirDocumento('${url}','compartir')">Compartir</button>
  `;
}
// Anular una venta desde la cuenta corriente del cliente. No tenemos acá
// un ventasCache como en admin-ventas.html, así que recibe directo el
// número y si tenía stock descontado (para el texto de confirmación).
async function anularVentaDesdeCC(ventaId, numero, stockDescontado, clienteId){
  const motivo = prompt('¿Por qué se anula esta venta? (opcional)') || '';
  if (motivo === null) return;
  if (!confirm(`¿Anular la venta #${numero}?${stockDescontado ? ' Se va a reingresar el stock descontado.' : ''}`)) return;
  try{
    const r = await fetch('/api/ventas/' + ventaId + '/anular', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({motivo})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarCuentaCorrienteTab(clienteId);
  }catch(e){
    alert(e.message);
  }
}
// Pensada para la pestaña "Cuenta corriente" del modal de Editar cliente
// (ver abrirEditarCliente/mostrarTabCliente arriba) — no es un modal
// propio, rellena el contenedor #ccContenido que ya está en el DOM.
async function cargarCuentaCorrienteTab(id){
  const cont0 = document.getElementById('ccContenido');
  if (cont0) cont0.innerHTML = 'Cargando...';
  try{
    const r = await fetch(BASE + '/' + id + '/cuenta-corriente', {headers: headersAuth()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al cargar la cuenta corriente');
    const cont = document.getElementById('ccContenido');
    if (!cont) return; // se cerró el modal mientras cargaba
    const saldoTexto = data.saldo > 0 ? `Debe ${money(data.saldo)}` : (data.saldo < 0 ? `Tiene a favor ${money(-data.saldo)}` : 'Al día ($ 0,00)');
    // Columna "Saldo" (3/10/2026, pedido de Mato: "agreguemos una columna
    // de saldo que vaya tirando el saldo historico"): data.movimientos
    // viene ordenado del más nuevo al más viejo (fecha desc). El saldo
    // actual en caché (data.saldo) es el saldo DESPUÉS del movimiento más
    // nuevo (fila 0) — para cada fila siguiente (más vieja), el saldo que
    // tenía la cuenta después de ESE movimiento es el de la fila anterior
    // menos el efecto de la fila anterior (débito suma, crédito resta),
    // es decir, deshaciendo los movimientos uno por uno yendo hacia atrás
    // en el tiempo.
    let saldoCorrido = data.saldo;
    const filas = data.movimientos.map((m, i) => {
      if (i > 0) {
        const anterior = data.movimientos[i - 1];
        saldoCorrido -= anterior.tipo === 'debito' ? anterior.monto : -anterior.monto;
      }
      return { m, saldo: saldoCorrido };
    });
    // Botón "Cobrar" por fila (3/10/2026, pedido de Mato: "deberiamos
    // tener algun boton que nos permita generar un cobro de cada factura
    // o un cobro parcial") — solo tiene sentido en el movimiento de
    // DÉBITO de una venta (origen: 'venta') que todavía tenga saldo
    // pendiente según `ventasPorId` (viene resuelto del backend, que ya
    // tiene en cuenta cobros parciales/anulaciones). El propio cobro de
    // venta (origen: 'cobro_venta') y los movimientos sin ventaId
    // (cobro a cuenta, manual) no llevan botón.
    const ventasPorId = data.ventasPorId || {};
    cont.innerHTML = `
      <p class="muted" style="margin-top:0">Saldo: <strong style="color:${data.saldo > 0 ? 'var(--danger)' : (data.saldo < 0 ? 'var(--ok)' : 'var(--text)')}">${saldoTexto}</strong></p>
      <table>
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Origen</th><th>Débito</th><th>Crédito</th><th>Saldo</th><th></th></tr></thead>
        <tbody>
          ${filas.length ? filas.map(({m, saldo}) => {
            const venta = (m.tipo === 'debito' && m.ventaId) ? ventasPorId[String(m.ventaId)] : null;
            const cobrable = venta && venta.estado !== 'anulada' && venta.saldoPendiente > 0;
            return `
            <tr>
              <td>${fechaCorta(m.fecha)}</td>
              <td>${escapeHtml(m.concepto || '—')}${m.observaciones ? `<div class="muted">${escapeHtml(m.observaciones)}</div>` : ''}</td>
              <td class="muted">${ORIGEN_CC_LABEL[m.origen] || escapeHtml(m.origen || '—')}</td>
              <td>${m.tipo === 'debito' ? money(m.monto) : ''}</td>
              <td>${m.tipo === 'credito' ? money(m.monto) : ''}</td>
              <td class="muted">${money(saldo)}</td>
              <td style="white-space:nowrap">
                ${venta ? botonesImprimible('/api/ventas/' + m.ventaId + '/comprobante') : ''}
                ${cobrable ? ` <button class="btn small" onclick="abrirCobroVentaDesdeCC('${m.ventaId}', ${venta.numero}, ${venta.saldoPendiente}, '${venta.moneda || 'ARS'}', '${id}')">Cobrar</button>` : ''}
                ${venta && venta.estado !== 'anulada' ? ` <button class="btn small danger" onclick="anularVentaDesdeCC('${m.ventaId}', ${venta.numero}, ${venta.stockDescontado ? 'true' : 'false'}, '${id}')">Anular</button>` : ''}
              </td>
            </tr>
          `; }).join('') : '<tr><td colspan="7" class="muted">Todavía no hay movimientos.</td></tr>'}
        </tbody>
      </table>
    `;
  }catch(e){
    const cont = document.getElementById('ccContenido');
    if (cont) cont.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`;
  }
}

// -------------------------------------------------------------------
// Cobro de una venta puntual, directo desde la pestaña Cuenta corriente
// (3/10/2026, pedido de Mato: "deberiamos tener algun boton que nos
// permita generar un cobro de cada factura o un cobro parcial"). Mismas
// reglas que el cobro de Ventas/Cobranza: efectivo solo a caja, cuenta
// (transferencia)/tarjeta solo a banco, cheque entra "en cartera". Pega
// directo a POST /api/ventas/:id/pagos — mismo endpoint que usa
// admin-ventas.html — así que lo que se cobra acá actualiza la venta
// real (totalCobrado/saldoPendiente) y la cuenta corriente del cliente.
// Cajas y bancos se piden recién al abrir este modal (no en el caché de
// la pantalla), siguiendo el mismo criterio de no cargar de más que
// motivó el fix de rendimiento de Ventas.
let cajasTesoreriaCacheCC = [];
let bancosTesoreriaCacheCC = [];
async function cargarCajasYBancosCC(){
  const [rc, rb] = await Promise.all([
    fetch('/api/tesoreria/cajas', {headers: headersAuth()}),
    fetch('/api/tesoreria/bancos', {headers: headersAuth()})
  ]);
  cajasTesoreriaCacheCC = rc.ok ? await rc.json() : [];
  bancosTesoreriaCacheCC = rb.ok ? await rb.json() : [];
}
function opcionesCuentaCobroVentaCC(tipoValor){
  if (tipoValor === 'efectivo') {
    return cajasTesoreriaCacheCC.map(c => `<option value="caja:${c._id}">${escapeHtml(c.nombre)}</option>`).join('')
      || '<option value="">No hay ninguna caja habilitada</option>';
  }
  return bancosTesoreriaCacheCC.map(b => `<option value="banco:${b._id}">${escapeHtml(b.nombre)}</option>`).join('')
    || '<option value="">No hay ningún banco habilitado</option>';
}
function actualizarTipoValorCobroVentaCC(){
  const tipoValor = document.getElementById('cvccTipoValor').value;
  const esCheque = tipoValor === 'cheque';
  const esTarjeta = tipoValor === 'tarjeta';
  document.getElementById('cvccCuentaWrap').classList.toggle('hidden', esCheque);
  document.getElementById('cvccChequeWrap').classList.toggle('hidden', !esCheque);
  document.getElementById('cvccTarjetaWrap').classList.toggle('hidden', !esTarjeta);
  if (!esCheque) {
    document.getElementById('cvccCuentaLabel').textContent = tipoValor === 'efectivo' ? '¿A qué caja va? *' : '¿A qué banco va? *';
    document.getElementById('cvccCuenta').innerHTML = opcionesCuentaCobroVentaCC(tipoValor);
  }
  if (esCheque) document.getElementById('cvccChequeFechaEmision').value = document.getElementById('cvccChequeFechaEmision').value || new Date().toISOString().slice(0,10);
}

          <div><label>Fecha de vencimiento *</label><input id="cvccChequeVencimiento" type="date"></div>
        </div>
        <div class="grid2 hidden" id="cvccTarjetaWrap" style="margin-top:10px">
          <div><label>Entidad</label><input id="cvccTarjetaEntidad"></div>
          <div><label>Tipo</label><select id="cvccTarjetaTipo"><option value="credito">Crédito</option><option value="debito">Débito</option></select></div>
          <div><label>Cuotas</label><input id="cvccTarjetaCuotas" type="number" min="1" value="1"></div>
          <div><label>Lote *</label><input id="cvccTarjetaLote"></div>
          <div><label>Cupón *</label><input id="cvccTarjetaCupon"></div>
          <div><label>Código de autorización</label><input id="cvccTarjetaCodigoAutorizacion"></div>
        </div>
        <div class="err" id="cvccErr"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarCobroVentaCC()">Registrar cobro</button>
      </div>
    </div>
  `;
  await cargarCajasYBancosCC();
  actualizarTipoValorCobroVentaCC();
}
function cerrarModalCobroVentaCC(){ document.getElementById('modalCobroVentaRoot').innerHTML = ''; }
async function confirmarCobroVentaCC(){
  const errEl = document.getElementById('cvccErr');
  errEl.textContent = '';
  const ventaId = document.getElementById('cvccVentaId').value;
  const clienteId = document.getElementById('cvccClienteId').value;
  const tipoValor = document.getElementById('cvccTipoValor').value;
  const body = {
    tipoValor,
    monto: Number(document.getElementById('cvccMonto').value),
    fecha: document.getElementById('cvccFecha').value,
    nota: document.getElementById('cvccNota').value.trim()
  };
  if (!body.monto || body.monto <= 0) { errEl.textContent = 'El monto tiene que ser mayor a 0'; return; }
  if (tipoValor === 'cheque') {
    body.chequeNumero = document.getElementById('cvccChequeNumero').value.trim();
    body.chequeBanco = document.getElementById('cvccChequeBanco').value.trim();
    body.chequeLibrador = document.getElementById('cvccChequeLibrador').value.trim();
    body.chequeCuitLibrador = document.getElementById('cvccChequeCuit').value.trim();
    body.chequeFechaEmision = document.getElementById('cvccChequeFechaEmision').value;
    body.chequeFechaVencimiento = document.getElementById('cvccChequeVencimiento').value;
    if (!body.chequeNumero) { errEl.textContent = 'Falta el número de cheque'; return; }
    if (!body.chequeFechaVencimiento) { errEl.textContent = 'Falta la fecha de vencimiento del cheque'; return; }
  } else {
    const cuenta = document.getElementById('cvccCuenta').value;
    if (!cuenta) { errEl.textContent = tipoValor === 'efectivo' ? 'Elegí a qué caja va el cobro' : 'Elegí a qué banco va el cobro'; return; }
    const [cuentaTipo, cuentaId] = cuenta.split(':');
    body.cuentaTipo = cuentaTipo;
    body.cuentaId = cuentaId;
    if (tipoValor === 'tarjeta') {
      body.tarjetaEntidad = document.getElementById('cvccTarjetaEntidad').value.trim();
      body.tarjetaTipo = document.getElementById('cvccTarjetaTipo').value;
      body.tarjetaCuotas = Number(document.getElementById('cvccTarjetaCuotas').value) || 1;
      body.tarjetaLote = document.getElementById('cvccTarjetaLote').value.trim();
      body.tarjetaCupon = document.getElementById('cvccTarjetaCupon').value.trim();
      body.tarjetaCodigoAutorizacion = document.getElementById('cvccTarjetaCodigoAutorizacion').value.trim();
      if (!body.tarjetaLote) { errEl.textContent = 'Falta el número de lote'; return; }
      if (!body.tarjetaCupon) { errEl.textContent = 'Falta el número de cupón'; return; }
    }
  }
  try{
    const r = await fetch('/api/ventas/' + ventaId + '/pagos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al registrar el cobro');
    cerrarModalCobroVentaCC();
    await cargarCuentaCorrienteTab(clienteId);
  }catch(e){ errEl.textContent = e.message; }
}

async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function exportarXlsx(){ descargarBlob(BASE + '/export', 'clientes.xlsx'); }

function abrirImportar(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar clientes desde Excel</h2>
        <p class="muted">Tiene que tener las mismas columnas que el export de este módulo (los títulos de columna, no el orden). Si el Código o el CUIT ya existen, se actualiza ese cliente; si no, se crea uno nuevo.</p>
        <p><a href="#" onclick="descargarBlob(BASE + '/plantilla-import', 'plantilla-clientes.xlsx'); return false;">Descargar plantilla en blanco</a></p>
        <label>Archivo (.xlsx)</label>
        <input type="file" id="impArchivo" accept=".xlsx">
        <div class="err" id="impErr"></div>
        <div id="impResultado"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarImportar()">Importar</button>
      </div>
    </div>
  `;
}

async function confirmarImportar(){
  const input = document.getElementById('impArchivo');
  const file = input.files[0];
  document.getElementById('impErr').textContent = '';
  document.getElementById('impResultado').innerHTML = '';
  if (!file) { document.getElementById('impErr').textContent = 'Elegí un archivo .xlsx'; return; }
  try{
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const r = await fetch(BASE + '/import', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    let html = `<p class="ok-msg">Creados: ${data.creados} — Actualizados: ${data.actualizados}</p>`;
    if (data.errores && data.errores.length) {
      html += `<p class="err">${data.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        data.errores.map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') + '</ul>';
    }
    document.getElementById('impResultado').innerHTML = html;
    await cargarClientes();
  }catch(e){
    document.getElementById('impErr').textContent = e.message;
  }
}
</script>
