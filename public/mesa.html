<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f6f7f9; --line:#e5e7eb; --ink:#171a1f; --mute:#6b7280; --chat:#efeae2;
  --accent:#ff5a36; --accent-ink:#ffffff; --accent-soft:#ffe7de;
  --hot:#d92d20; --hot-soft:#fde4e1; --warm:#b45309; --warm-soft:#fff4d6; --cold:#1d5fa8; --cold-soft:#dbe9f8;
  --ok:#1f8a5f; --ok-soft:#e1f5ea; --bad:#c53030; --bad-soft:#fbe3e3; --violet:#6d4fd8; --violet-soft:#ece7ff;
  --in:#ffffff; --out:#d9fdd3; --bot:#ece7ff; --shadow:0 1px 2px rgba(17,20,24,.05),0 8px 20px -12px rgba(17,20,24,.18);
  --sans:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121316; --panel:#1c1e22; --panel2:#202328; --line:#2c2f34; --ink:#f4f5f6; --mute:#9aa0a8; --chat:#17191c;
  --accent:#ff7a56; --accent-ink:#1a0f0b; --accent-soft:#3a241f;
  --hot:#f87171; --hot-soft:#3d1f1f; --warm:#fbbf24; --warm-soft:#3a2f14; --cold:#7cb4f0; --cold-soft:#16324f;
  --ok:#4ade80; --ok-soft:#173328; --bad:#f87171; --bad-soft:#3d1f1f; --violet:#a78bfa; --violet-soft:#2a2547;
  --in:#2a2d33; --out:#1d3a2a; --bot:#2a2547; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:500;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding:12px 16px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.sp{flex:1}
.err{color:var(--bad);font-size:12.5px}.err:empty{display:none}

/* barra superior */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:2px}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;color:var(--mute);font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.resumen{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 12px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--shadow)}
.stat b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--mute);font-weight:600}
.stat.al b{color:var(--bad)}.stat.okk b{color:var(--ok)}
.barra{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.barra select,.barra input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;max-width:128px}.barra .chip{padding:3px 10px;font-size:12px}.barra{gap:5px;flex-wrap:nowrap;overflow-x:auto}.barra>*{flex:none}.barra .tip{font-size:11.5px}

/* resumen */
.res{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rh h2{margin:0;font-size:15px;font-weight:800}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.k span{font-size:11.5px;color:var(--mute);font-weight:700;display:block}.k b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.k small{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.k.bad b{color:var(--bad)}.k.ok b{color:var(--ok)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bx{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.gads{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}.gads label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mute);font-weight:700}.gads input{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 7px;font-size:12.5px;font-weight:600;width:100%}
.res{max-width:1280px;width:100%;margin:0 auto;gap:26px}
.rh{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 8px;margin-bottom:-8px}
.rsec{display:flex;flex-direction:column;gap:10px}
.rsh{font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 2px 7px;border-bottom:1px solid var(--line)}.rsh small{font-size:12px;color:var(--mute);font-weight:600}
.rg{grid-template-columns:repeat(2,minmax(0,1fr))!important}@media (max-width:900px){.rg{grid-template-columns:minmax(0,1fr)!important}}
.bx h3{text-transform:none!important;letter-spacing:0!important;font-size:13.5px!important;color:var(--ink)!important;margin-bottom:10px!important}
.rt tbody tr:hover td{background:var(--panel2)}.rt td:first-child{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aten .av{margin-left:0!important}[data-w=evo],[data-w=evom]{grid-column:1/-1}[data-w=ads] svg{max-height:250px}
details.mm{margin-top:4px;border-top:1px dashed var(--line);padding-top:8px}details.mm summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:8px}details.mm[open] summary{color:var(--ink)}
.ia{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 60%)}.ia ul.l li{margin-bottom:3px}
.bx h3 .wx{float:right;border:0;background:transparent;color:var(--mute);font-size:12px;padding:0 4px;border-radius:6px;opacity:0;transition:opacity .15s}.bx:hover h3 .wx{opacity:1}@media (hover:none){.bx h3 .wx{opacity:.7}}.wx:hover{background:var(--panel2);color:var(--ink)}
.bx h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800}
.br{display:grid;grid-template-columns:minmax(80px,1.1fr) 3fr auto;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.br .tr{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}.br .tr i{display:block;height:100%;border-radius:8px;background:var(--cc,var(--accent));transition:width .6s}
.br .vl{font-weight:800;white-space:nowrap}.br .vl small{color:var(--mute);font-weight:600;margin-left:5px}
.rt{width:100%;border-collapse:collapse;font-size:12.5px}.rt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:right;padding:4px 8px;font-weight:800}.rt th:first-child,.rt td:first-child{text-align:left}
.rt td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;font-weight:600}.rt td:first-child{font-weight:800}.rt td.bad{color:var(--bad);font-weight:800}
.aten{display:flex;flex-direction:column;gap:2px}.aten button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:8px;font-size:12.5px}.aten button:hover{background:var(--panel2)}
.aten b{font-weight:800}.aten span{color:var(--mute);margin-left:auto;white-space:nowrap}
/* embudo */
.embudo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:none}
.fz{--cc:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 10px;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer;text-align:left;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:1px}
.fz:hover{border-color:var(--cc);transform:translateY(-1px)}.fz.flash{animation:fl .7s}@keyframes fl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cc) 45%,transparent)}100%{box-shadow:0 0 0 9px transparent}}.fz.on{border-color:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 18%,transparent)}
.fz .t{font-size:11.5px;font-weight:700;color:var(--mute);display:flex;gap:5px;align-items:center}
.fz .c{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.fz .row{display:flex;align-items:baseline;gap:8px}.fz .row .d{margin-left:auto}
.fz .d{font-size:11.5px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.fz .bar{height:3px;border-radius:4px;background:var(--panel2);margin-top:4px;overflow:hidden}.fz .bar i{display:block;height:100%;background:var(--cc);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fz[data-k=nuevo]{--cc:var(--cold)}.fz[data-k=conversando]{--cc:var(--warm)}.fz[data-k=presupuesto]{--cc:var(--violet)}.fz[data-k=cerrando]{--cc:var(--accent)}.fz[data-k=ganada]{--cc:var(--ok)}
@media (max-width:760px){.embudo{grid-auto-flow:column;grid-auto-columns:150px;grid-template-columns:none;overflow-x:auto}}
/* tablero */
.tablero{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:2px}
.colu{--cc:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;min-width:0;transition:background .15s}
.colu[data-e=hoy]{--cc:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.colu[data-e=esperando]{--cc:var(--cold)}.colu[data-e=seguimiento]{--cc:var(--warm)}.colu[data-e=presupuesto]{--cc:var(--violet)}.colu[data-e=cerrando]{--cc:var(--ok)}
.colu.over{outline:2px dashed var(--cc);outline-offset:-4px}
.ch{padding:9px 12px 2px;display:flex;align-items:center;gap:8px;flex:none}
.ch .ico{font-size:16px;line-height:1;flex:none}
.ch h2{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.005em}
.ch .n{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:800;color:var(--ink);min-width:22px;text-align:center}
.ch .v{margin-left:auto;font-size:11.5px;color:var(--mute);font-weight:700}
.ch-sub{padding:0 14px 6px;font-size:11px;color:var(--mute);font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{flex:1;min-height:0;overflow:auto;padding:2px 8px 8px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:grab;display:flex;flex-direction:column;gap:5px;animation:in .25s ease-out;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--mute);transform:translateY(-1px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.drag{opacity:.4}
.r1{display:flex;align-items:center;gap:9px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.who b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:1.2}
.who span{font-size:11.5px;line-height:1.25;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-weight:800;font-size:12.5px;white-space:nowrap;align-self:flex-start}
.ult{margin:0;font-size:12px;color:var(--ink);opacity:.8;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.r3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;border-radius:7px;padding:2px 8px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warm{background:var(--warm-soft);color:var(--warm)}.tag.cold{background:var(--cold-soft);color:var(--cold)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.cmpn{font-size:11px;font-weight:700;color:var(--violet);background:var(--violet-soft);border-radius:6px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:flex-start;max-width:100%}
.tmp{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;color:var(--mute)}
.tmp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tmp.caliente{color:var(--hot)}.tmp.tibio{color:var(--warm)}.tmp.frio{color:var(--cold)}
.unread{background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;font-weight:800}
.mini{margin-left:auto;font-size:11px;color:var(--mute);font-weight:700;white-space:nowrap}
.vacioc{color:var(--mute);text-align:center;padding:22px 10px;font-size:12.5px;font-weight:600}
.vacioc big{display:block;font-size:26px;margin-bottom:4px}
.cierres{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.zona{border:2px dashed var(--line);border-radius:14px;padding:8px;text-align:center;font-weight:700;color:var(--mute);font-size:12.5px}
.zona.ok.over{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.zona.bad.over{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* lista */
.tabla{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tabla table{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tabla td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabla tr.f{cursor:pointer}.tabla tr.f:hover{background:var(--panel2)}
.tabla td.n{text-align:right;white-space:nowrap;font-weight:700}
.tip{color:var(--mute);font-size:11.5px;font-weight:600}
iframe#bot{flex:1;min-height:0;width:100%;border:1px solid var(--line);border-radius:16px;background:var(--bg)}

/* cajón */
.vel{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:30;animation:fi .15s}
.caj{position:fixed;top:0;right:0;bottom:0;width:min(1020px,100%);background:var(--bg);z-index:31;display:grid;grid-template-columns:minmax(0,1fr) 310px;box-shadow:-14px 0 40px rgba(0,0,0,.22);animation:sl .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes sl{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.vel,.caj{animation:none}.card{transition:none}}
.cp{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.cp.fi{border-left:1px solid var(--line);overflow:auto;display:block;background:var(--panel)}
.chead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex:none}
.chead .av{width:36px;height:36px;font-size:13px}
.chead h2{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.01em}.chead .sb{color:var(--mute);font-size:12px;font-weight:600}
.x{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-weight:700;color:var(--mute);font-size:13px}.x:hover{background:var(--panel2);color:var(--ink)}
.msgs{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--chat)}
.m{max-width:78%;padding:7px 11px;border-radius:12px;background:var(--in);white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.06);overflow-wrap:anywhere}
.m.out{align-self:flex-end;background:var(--out)}.m.bot{align-self:flex-end;background:var(--bot)}
.m small{display:block;font-size:10.5px;color:var(--mute);margin-top:2px;font-weight:600}
.sug{padding:10px 16px;border-top:1px solid var(--line);background:var(--accent-soft);display:flex;gap:12px;align-items:center;flex:none}
.sug .tx{flex:1;min-width:0;font-weight:600}.sug .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:800;display:block;margin-bottom:2px}
.vent{margin:0 16px 8px;padding:9px 12px;border-radius:12px;background:var(--warm-soft,#fff4e0);border:1px solid var(--warm,#e0a040);font-size:12.5px;flex:none}.vent.ok{background:var(--panel2);border-color:var(--line);color:var(--mute);font-weight:600}.vent .vrow{display:flex;gap:8px;margin-top:8px}.vent select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--panel)}
.m .tpl{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);margin-right:6px}.m .fallo{color:var(--bad);font-weight:800}.m .leido{color:var(--cold);font-weight:800}
.m .mi{display:block;max-width:240px;max-height:260px;border-radius:10px;margin-bottom:4px;background:var(--panel2);min-width:90px;min-height:70px;object-fit:cover;cursor:zoom-in}.m .mb{margin-bottom:4px}.m audio{display:block;max-width:240px;height:36px;margin-bottom:4px}.m video{display:block;max-width:280px;max-height:260px;border-radius:10px;margin-bottom:4px}
.visor{position:fixed;inset:0;z-index:10003;background:rgba(0,0,0,.82);display:grid;place-items:center;cursor:zoom-out}.visor img{max-width:92vw;max-height:90vh;border-radius:8px}.visor button{position:absolute;top:14px;right:14px}
.comp{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;flex:none}
.comp textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:14px;padding:9px 13px;background:var(--panel2);height:48px}
.comp select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px;max-width:112px;font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-weight:700;font-size:12.5px;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--panel2)}.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:3px 10px;font-size:12px}
.ghost{border:0;background:transparent;color:var(--mute);font-weight:700;font-size:12.5px;padding:5px 8px;border-radius:7px}.ghost:hover{background:var(--panel2);color:var(--ink)}
.acc{display:flex;gap:6px;padding:4px 12px 8px;flex:none}
.dec{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:9px;flex:none}
.dh{display:flex;align-items:center;gap:8px}.dh .q{font-weight:800;font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pl{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-weight:700;font-size:12.5px;white-space:nowrap}
.pl:hover{border-color:var(--mute)}.pl.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pl.ok{color:var(--ok)}.pl.bad{color:var(--bad)}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sub:empty{display:none}
.sub .pl{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sub input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px}
.later{background:none;border:0;color:var(--mute);font-weight:700;font-size:12px;cursor:pointer;padding:2px 4px}.later:hover{color:var(--ink);text-decoration:underline}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800}
.sec p{margin:0}
.paso{background:var(--accent-soft);border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.35}
.temp{display:flex;gap:5px}
.temp button{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 0;font-size:12.5px;color:var(--mute);font-weight:700}
.temp button.on.caliente{background:var(--hot-soft);color:var(--hot);border-color:var(--hot)}
.temp button.on.tibio{background:var(--warm-soft);color:var(--warm);border-color:var(--warm)}
.temp button.on.frio{background:var(--cold-soft);color:var(--cold);border-color:var(--cold)}
.etapas{display:flex;flex-wrap:wrap;gap:5px}
.etapas button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mute);font-weight:700}
.etapas button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.valor{font-size:22px;font-weight:800;letter-spacing:-.01em}
details.mas summary{padding:13px 16px;cursor:pointer;color:var(--mute);font-weight:700;list-style:none}
details.mas summary::before{content:"+ "}details.mas[open] summary::before{content:"– "}
ul.l{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}ul.l li{display:flex;gap:7px}ul.l li::before{content:"–";color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-weight:600}
.notas textarea{width:100%;resize:vertical;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.hist{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.vacio{padding:34px 18px;color:var(--mute);text-align:center;font-weight:600}
.adj{padding:6px 16px;background:var(--violet-soft);color:var(--violet);font-weight:700;font-size:12.5px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.pop{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:10001;display:grid;place-items:center;padding:3vh 3vw}
.pop-in{background:var(--panel);border-radius:16px;width:min(1100px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.pop-h{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex:none}.pop-in iframe{flex:1;border:0;width:100%;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:700;z-index:10002;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:1100px){body{padding:10px 12px}}
@media (max-width:760px){
  .caj{grid-template-columns:1fr;overflow:auto}.cp.fi{border-left:0;border-top:1px solid var(--line);order:2}
  .cp:first-child{min-height:88vh}.resumen{justify-content:flex-start}.m{max-width:90%}
}

<body>
<div class="app">
  <header class="top">
    <div class="brand">CRM<small id="quien">Piedra Negra</small></div>
    <div class="seg" id="vistas"><button data-v="tablero" class="on">Tablero</button><button data-v="lista">Lista</button><button data-v="resumen">Resumen</button><button data-v="bot">Bot de WhatsApp</button></div>
    <div class="resumen" id="resumen"></div>
  </header>
  <div class="err" id="msg"></div>
  <div class="barra" id="barra">
    <button class="chip on" data-f="mias" title="Mías y sin asignar">Mías</button><button class="chip" data-f="todas" title="Toda la sucursal">Sucursal</button>
    <select id="fTemp" aria-label="Temperatura"><option value="">Temperatura</option><option value="caliente">Caliente</option><option value="tibio">Tibio</option><option value="frio">Frío</option></select>
    <select id="fCamp" aria-label="Campaña"><option value="">Campaña</option></select>
    <select id="fProd" aria-label="Producto"><option value="">Producto</option></select>
    <input id="q" type="search" placeholder="Buscar" aria-label="Buscar" style="max-width:110px">
    <label class="tip"><input type="checkbox" id="fCer"> Cerradas</label>
    <span class="sp"></span><span class="tip" id="cant"></span><button class="chip" id="soloHoy">Solo Hoy</button><button class="btn sm" id="ej" hidden>Quitar ejemplos</button><a class="ghost" href="/crm.html" title="Vista clásica del CRM">Clásica</a>
  </div>
  <div class="embudo" id="embudo"></div>
  <div class="tablero" id="tab"></div>
  <div class="tabla" id="v-lista" hidden><table><thead><tr><th>Cliente</th><th>Producto</th><th>Campaña</th><th>Temp.</th><th>Etapa</th><th>Columna</th><th>Asesor</th><th>Aviso</th><th class="n">Presupuesto</th><th>Actividad</th></tr></thead><tbody id="tBody"></tbody></table></div>
  <div class="res" id="v-res" hidden></div>
  <iframe id="bot" title="Bot de WhatsApp" hidden></iframe>
  <div class="cierres" id="cierres"><div class="zona ok" data-z="ganada">✅ Soltá acá para marcar como ganada</div><div class="zona bad" data-z="perdida">❌ Soltá acá para marcar como perdida</div></div>
</div>
<div class="vel" id="vel" hidden></div>
<aside class="caj" id="caj" hidden></aside>
<div class="toast" id="toast" hidden></div>

<script>
let TOKEN = localStorage.getItem('obras_admin_token') || '', ORG = localStorage.getItem('obras_org_activo') || '', OP = localStorage.getItem('obras_org_operar') || '';
function H(x){ const h = Object.assign({'x-admin-token':TOKEN}, x||{}); if (ORG) h['x-org-id'] = ORG; if (ORG==='todas' && OP) h['x-org-operar'] = OP; return h; }
const J = {'Content-Type':'application/json'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url, opt){ const r = await fetch(url, opt); const raw = await r.text(); let d = {}; try{ d = JSON.parse(raw); }catch(e){} if (!r.ok) throw new Error(d.error || ('Error ' + r.status)); return d; }
const post = (url, body) => api(url, {method:'POST', headers:H(J), body:JSON.stringify(body||{})});
const money = n => '$ ' + Math.round(n||0).toLocaleString('es-AR');
const mins = m => m<1 ? 'recién' : m<60 ? m+' min' : m<1440 ? Math.floor(m/60)+' h' : Math.floor(m/1440)+' d';
const hora = d => new Date(d).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',dateStyle:'short',timeStyle:'short'});
const hhmm = d => new Date(d).toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit'});
function err(e){ $('msg').textContent = e && e.message || e || ''; }
let tt; function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(tt); tt=setTimeout(()=>e.hidden=true,2600); }
const COLORES = ['#ff5a36','#7c3aed','#0ea5e9','#16a34a','#d97706','#db2777','#0d9488'];
const colorDe = s => COLORES[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORES.length];
const iniciales = n => (String(n||'?').replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('')||'?').toUpperCase();
const COLS = [
  {k:'hoy', i:'📥', n:'Hoy', sub:'Lo que requiere una acción hoy. Objetivo: terminar el día vacía'},
  {k:'esperando', i:'⏳', n:'Esperando respuesta', sub:'Vencen hoy a las 15 hs. Si no contesta, vuelven a Hoy para recordarle'},
  {k:'seguimiento', i:'⏰', n:'Seguimiento', sub:'Con fecha. Ese día pasan a Hoy'},
  {k:'presupuesto', i:'📄', n:'Presupuesto enviado', sub:'Esperando la decisión del cliente'},
  {k:'cerrando', i:'🤝', n:'Por cerrar', sub:'Ya decidió, falta confirmar'}
];
const ETAPAS = [{k:'nuevo',n:'Nuevo'},{k:'conversando',n:'En conversación'},{k:'presupuesto',n:'Presupuesto enviado'},{k:'cerrando',n:'Por cerrar'}];
const ETN = Object.fromEntries(ETAPAS.map(e=>[e.k,e.n]));

let PREV = {}, ETF = '', ITEMS = [], YO = {id:'',nombre:''}, MOTIVOS = [], F = 'mias', VISTA = 'tablero', sel = null, MSGS = [], VENT = null, PLANT = [], FILE = null, dragId = null, pend = null, decOpen = false;
const TOC = new Set(); // conversaciones donde escribí en esta sesión: al salir hay que decidir qué sigue
const cur = () => ITEMS.find(l=>l.id===sel);
const mio = l => l.sinAsignar || String(l.asesorId||'') === YO.id;
function filtradas(){
  const t=$('fTemp').value, p=$('fProd').value, q=$('q').value.trim().toLowerCase(), h=$('soloHoy').classList.contains('on');
  return ITEMS.filter(l=>(F==='todas'||mio(l)) && (!t||l.temperatura===t) && (!p||l.producto===p) && (!q||(l.nombre+' '+l.tel+' '+l.producto).toLowerCase().includes(q)) && (!h||l.columna==='hoy') && (!ETF||l.etapa===ETF) && (!$('fCamp').value||(l.campana||'(sin campaña)')===$('fCamp').value));
}
const orden = l => (l.sinDec?-5:0) + (l.esperaCliente?0:50) + (l.prox&&l.prox.dias<=0?10:20) + ({caliente:0,tibio:3,frio:6}[l.temperatura]) - Math.min(9,(l.esperaMin||0)/1000);
function aviso(l){
  if (l.cierre) return [l.cierre.estado==='ganada'?'Ganada':'Perdida: '+(l.cierre.motivo||''), l.cierre.estado==='ganada'?'ok':'bad'];
  if (l.sinDec) return ['Falta decidir','bad'];
  if (l.esperaCliente) return ['Espera '+mins(l.esperaMin), l.esperaMin>240?'bad':'warm'];
  if (l.recordar) return l.recs>=3 ? [l.recs+' recordatorios: ¿cerrar?','bad'] : ['Sin respuesta: recordale','warm'];
  if (l.columna==='esperando') return [l.esperandoVence&&hhmm(l.esperandoVence)==='00:00'?'Vuelve a Hoy mañana':'Vence hoy '+hhmm(l.esperandoVence||new Date()),'cold'];
  if (!l.prox) return l.etapa==='nuevo' ? ['Nuevo','cold'] : ['Sin próxima acción','bad'];
  if (l.prox.dias<0) return ['Vencido hace '+(-l.prox.dias)+' d','bad'];
  if (l.prox.dias===0) return ['Hoy','warm'];
  return [l.prox.dias===1?'Mañana':'En '+l.prox.dias+' d',''];
}
function tarjeta(l){
  const [t,c] = aviso(l);
  return `<div class="card ${l.id===sel?'sel':''}" draggable="${l.convId?'true':'false'}" data-id="${esc(l.id)}" tabindex="0">
    <div class="r1"><span class="av" style="background:${colorDe(l.nombre)}">${esc(iniciales(l.nombre))}</span><div class="who"><b>${esc(l.nombre)}</b><span>${esc(l.producto||'Sin producto definido')}</span></div>${l.valor?`<span class="val">${money(l.valor)}</span>`:''}</div>
    ${l.ultimo||l.resumen?`<p class="ult">${esc(l.ultimo?l.ultimo.texto:l.resumen)}</p>`:''}
    <div class="r3"><span class="tag ${c}">${esc(t)}</span>${l.sinLeer?`<span class="unread">${l.sinLeer}</span>`:''}<span class="tmp ${l.temperatura}">${l.temperatura==='caliente'?'Caliente':l.temperatura==='tibio'?'Tibio':'Frío'}</span><span class="mini">${esc(l.asesorNombre||'Sin asignar')}</span></div>${l.campana?`<div class="cmpn" title="${esc(l.campana)}">📣 ${esc(l.campana)}</div>`:''}</div>`;
}
function pintar(){
  const L = filtradas().filter(l=>!l.cierre || $('fCer').checked);
  $('tab').innerHTML = COLS.map(e=>{
    const c = L.filter(l=>l.columna===e.k && !l.cierre).sort((a,b)=>orden(a)-orden(b)); const tot = c.reduce((s,l)=>s+(l.valor||0),0);
    const vacio = e.k==='hoy' ? '<div class="vacioc"><big>✅</big>Hoy está vacío.<br>No queda nada por resolver.</div>' : '<div class="vacioc">Nada acá</div>';
    return `<section class="colu" data-e="${e.k}"><div class="ch"><span class="ico">${e.i}</span><h2>${e.n}</h2><span class="n">${c.length}</span><span class="v">${tot?money(tot):''}</span></div><div class="ch-sub" title="${e.sub}">${e.sub}</div><div class="cards">${c.map(tarjeta).join('')||vacio}</div></section>`;
  }).join('');
  pintarEmbudo();
  const a = ITEMS.filter(l=>!l.cierre), h = a.filter(l=>l.columna==='hoy').length, ve = a.filter(l=>l.columna==='hoy'&&l.prox&&l.prox.dias<0).length, sd = a.filter(l=>l.sinDec).length;
  $('resumen').innerHTML = `<div class="stat ${h?'al':'okk'}"><b>${h}</b><span>${h?'por resolver hoy':'Hoy al día'}</span></div>${ve?`<div class="stat al"><b>${ve}</b><span>vencidas</span></div>`:''}${sd?`<div class="stat al"><b>${sd}</b><span>sin decidir</span></div>`:''}<div class="stat"><b>${money(a.reduce((x,l)=>x+(l.valor||0),0))}</b><span>en presupuestos</span></div>`;
  $('cant').textContent = ''; $('ej').hidden = !ITEMS.some(i=>i.demo);
  const ps=$('fProd'), pv=ps.value; ps.innerHTML = '<option value="">Producto</option>' + [...new Set(ITEMS.map(i=>i.producto).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join(''); ps.value = pv;
  const cs=$('fCamp'), cv=cs.value; cs.innerHTML = '<option value="">Campaña</option>' + [...new Set(ITEMS.map(i=>i.campana||'(sin campaña)'))].sort().map(x=>`<option>${esc(x)}</option>`).join(''); cs.value = cv;
  enlazar();
  if (VISTA==='lista') pintarLista();
  if (VISTA==='resumen') pintarResumen();
}
function pintarEmbudo(){
  const base = ITEMS.filter(l=>(F==='todas'||mio(l))), ab = base.filter(l=>!l.cierre);
  const mes = new Date(Date.now()-3*3600000).toISOString().slice(0,7);
  const delMes = base.filter(l=>l.cierre && l.cierre.at && new Date(new Date(l.cierre.at).getTime()-3*3600000).toISOString().slice(0,7)===mes);
  const gan = delMes.filter(l=>l.cierre.estado==='ganada'), per = delMes.filter(l=>l.cierre.estado!=='ganada');
  const tot = ab.length + gan.length || 1;
  const pasos = [['nuevo','🆕','Nuevos'],['conversando','💬','En conversación'],['presupuesto','📄','Presupuesto enviado'],['cerrando','🤝','Por cerrar']];
  const sv = a => a.reduce((x,l)=>x+(l.valor||0),0);
  let h = pasos.map(([k,i,n])=>{ const c = ab.filter(l=>l.etapa===k), pc = Math.round(c.length/tot*100); return `<button class="fz ${ETF===k?'on':''}" data-k="${k}" data-n="${c.length}" title="${n}: ${c.length} (${pc}%)"><span class="t">${i} ${n}</span><span class="row"><span class="c" data-to="${c.length}">${c.length}</span><span class="d">${c.length?money(sv(c)):''}</span></span><span class="bar"><i style="width:${pc}%"></i></span></button>`; }).join('');
  const cv = gan.length+per.length ? Math.round(gan.length/(gan.length+per.length)*100)+'% cierre' : '';
  h += `<div class="fz" data-k="ganada" data-n="${gan.length}" title="${per.length} perdidas este mes"><span class="t">🏆 Ganadas del mes</span><span class="row"><span class="c" data-to="${gan.length}">${gan.length}</span><span class="d">${gan.length?money(sv(gan)):''} ${cv}</span></span><span class="bar"><i style="width:${Math.round(gan.length/tot*100)}%"></i></span></div>`;
  const prev = PREV; PREV = {};
  $('embudo').innerHTML = h;
  $('embudo').querySelectorAll('.fz').forEach(f=>{ const k=f.dataset.k, n=+f.dataset.n; PREV[k]=n; const c=f.querySelector('.c');
    if (prev[k]!==undefined && prev[k]!==n){ f.classList.add('flash'); const t0=performance.now(), d=prev[k]; const step=t=>{ const q=Math.min(1,(t-t0)/500); c.textContent=Math.round(d+(n-d)*q); if(q<1) requestAnimationFrame(step); }; requestAnimationFrame(step); } });
  $('embudo').querySelectorAll('button.fz').forEach(b=>b.onclick=()=>{ ETF = ETF===b.dataset.k ? '' : b.dataset.k; pintar(); });
}
function pintarResumen(){
  const per = $('rper') ? $('rper').value : 'mes';
  const base = ITEMS.filter(l=>F==='todas'||mio(l)), ab = base.filter(l=>!l.cierre);
  const desde = per==='7' ? Date.now()-7*864e5 : per==='30' ? Date.now()-30*864e5 : per==='mes' ? new Date(new Date(Date.now()-3*3600000).toISOString().slice(0,7)+'-01T03:00:00Z').getTime() : 0;
  const cer = base.filter(l=>l.cierre && l.cierre.at && new Date(l.cierre.at).getTime()>=desde);
  const gan = cer.filter(l=>l.cierre.estado==='ganada'), perd = cer.filter(l=>l.cierre.estado!=='ganada');
  const sv = a => a.reduce((x,l)=>x+(l.valor||0),0), pc = (a,b) => b ? Math.round(a/b*100)+'%' : '—';
  const hoy = ab.filter(l=>l.columna==='hoy'), venc = hoy.filter(l=>l.prox&&l.prox.dias<0), sd = ab.filter(l=>l.sinDec), sinResp = ab.filter(l=>l.recordar);
  const bars = (rows, color) => { const mx = Math.max(1,...rows.map(r=>r.n)); return rows.length ? rows.map(r=>`<div class="br" style="--cc:${r.c||color||'var(--accent)'}"><span class="nm" title="${esc(r.k)}">${esc(r.k)}</span><span class="tr"><i style="width:${Math.round(r.n/mx*100)}%"></i></span><span class="vl">${r.n}${r.v?`<small>${money(r.v)}</small>`:''}</span></div>`).join('') : '<div class="tip">Sin datos todavía.</div>'; };
  const grp = (arr, fn) => { const m = new Map(); arr.forEach(l=>{ const k = fn(l)||'Sin definir'; const e = m.get(k)||{k,n:0,v:0}; e.n++; e.v+=l.valor||0; m.set(k,e); }); return [...m.values()].sort((a,b)=>b.n-a.n); };
  const etp = ETAPAS.map(e=>({k:e.n, n:ab.filter(l=>l.etapa===e.k).length, v:sv(ab.filter(l=>l.etapa===e.k)), c:{nuevo:'var(--cold)',conversando:'var(--warm)',presupuesto:'var(--violet)',cerrando:'var(--accent)'}[e.k]}));
  const tmp = [['caliente','Caliente','var(--hot)'],['tibio','Tibio','var(--warm)'],['frio','Frío','var(--cold)']].map(([k,n,c])=>({k:n,c,n:ab.filter(l=>l.temperatura===k).length,v:sv(ab.filter(l=>l.temperatura===k))}));
  const ases = [...new Set(base.map(l=>l.asesorNombre||'Sin asignar'))].map(a=>{ const m = base.filter(l=>(l.asesorNombre||'Sin asignar')===a), o = m.filter(l=>!l.cierre), g = m.filter(l=>l.cierre&&l.cierre.estado==='ganada'&&new Date(l.cierre.at)>=desde), p = m.filter(l=>l.cierre&&l.cierre.estado!=='ganada'&&new Date(l.cierre.at)>=desde);
    return {a, ab:o.length, hoy:o.filter(l=>l.columna==='hoy').length, sd:o.filter(l=>l.sinDec).length, g:g.length, p:p.length, vg:sv(g)}; }).sort((x,y)=>y.ab-x.ab);
  const cm = new Map((CAMPS||[]).map(x=>[x.nombre,{k:x.nombre,leads:x.leads,clientes:x.clientes,compraron:x.compraron,montoARS:x.montoARS,montoUSD:x.montoUSD,ab:0,g:0,p:0,vj:0}]));
  base.forEach(l=>{ const k = l.campana||'(sin campaña)'; if (!cm.has(k)) cm.set(k,{k,leads:0,clientes:0,compraron:0,montoARS:0,montoUSD:0,ab:0,g:0,p:0,vj:0}); const e = cm.get(k);
    if (!l.cierre){ e.ab++; e.vj+=l.valor||0; } else if (new Date(l.cierre.at)>=desde){ if (l.cierre.estado==='ganada') e.g++; else e.p++; } });
  const nrm = x => String(x||'').toLowerCase().replace(/\s+/g,' ').trim(); const invm = new Map((EVOX.camp||[]).map(c=>[nrm(c.campana), c.monto])); cm.forEach(e=>{ e.inv = invm.get(nrm(e.k))||0; });
  const camp = [...cm.values()].sort((a,b)=>(b.montoARS-a.montoARS)||(b.leads-a.leads)||(b.ab-a.ab));
  SNAP = { periodo: ({mes:'este mes','7':'últimos 7 días','30':'últimos 30 días',todo:'todo el historial'})[per], alcance: F==='todas'?'toda la sucursal':'mis oportunidades y sin asignar',

const MEDIA = {}; // id -> blob URL (así no se vuelve a bajar cada vez que se repinta el chat)
function mediaHtml(m){
  const a = m.archivo; if (!a) return '';
  const id = esc(a.id);
  if (a.tipo==='image'||a.tipo==='sticker') return `<img class="mi" data-mid="${id}" alt="${a.tipo==='sticker'?'Sticker':'Foto del cliente'}"${MEDIA[a.id]?` src="${MEDIA[a.id]}"`:''}>`;
  if (a.tipo==='audio') return `<div class="mb"><button class="ghost" data-mid="${id}" data-act="audio">▶ ${a.voz?'Escuchar el audio':'Escuchar'}</button></div>`;
  if (a.tipo==='video') return `<div class="mb"><button class="ghost" data-mid="${id}" data-act="video">▶ Ver el video</button></div>`;
  return `<div class="mb"><button class="ghost" data-mid="${id}" data-act="doc" data-n="${esc(a.nombre||'archivo')}">📥 Abrir ${esc(a.nombre||'el archivo')}</button></div>`;
}
const MEDIA_OK = /^(image\/(jpeg|png|webp|gif)|audio\/(ogg|mpeg|mp4|aac|amr|wav|x-m4a)|video\/(mp4|3gpp|webm|quicktime)|application\/pdf)$/;
async function bajarMedia(id){
  if (MEDIA[id]) return MEDIA[id];
  const r = await fetch('/api/bot/media/'+encodeURIComponent(id), {headers:H()});
  if (!r.ok){ let d={}; try{ d = await r.json(); }catch(e){} throw new Error(d.error||('Error '+r.status)); }
  const b = await r.blob(); const t = (b.type||'').split(';')[0];
  return MEDIA[id] = URL.createObjectURL(MEDIA_OK.test(t) ? b : new Blob([b],{type:'application/octet-stream'}));
}
function verGrande(src){
  const o = document.createElement('div'); o.className='visor'; o.innerHTML = `<img src="${src}" alt="Foto"><button class="btn" aria-label="Cerrar">✕</button>`;
  const x = () => { o.remove(); document.removeEventListener('keydown', k); }; const k = e => { if (e.key==='Escape') x(); };
  o.onclick = e => { if (e.target.tagName!=='IMG') x(); }; document.addEventListener('keydown', k); document.body.appendChild(o);
}
function activarMedia(){
  const ms = $('msgs'); if (!ms) return;
  ms.querySelectorAll('img.mi').forEach(img=>{
    if (img.src && img.getAttribute('src')){ img.onclick = () => verGrande(img.src); return; }
    bajarMedia(img.dataset.mid).then(u=>{ img.src = u; img.onclick = () => verGrande(u); const m = $('msgs'); if (m && m.scrollTop+m.clientHeight>=m.scrollHeight-260) m.scrollTop = m.scrollHeight; })
      .catch(e=>{ const s = document.createElement('span'); s.className='tip'; s.textContent = '🖼 '+e.message; img.replaceWith(s); });
  });
  ms.querySelectorAll('button[data-act]').forEach(b=>b.onclick = async () => {
    const id = b.dataset.mid, act = b.dataset.act; const t0 = b.textContent; b.disabled = true; b.textContent = 'Cargando…';
    try{ const u = await bajarMedia(id);
      if (act==='audio'){ const au = document.createElement('audio'); au.controls = true; au.src = u; au.autoplay = true; b.replaceWith(au); }
      else if (act==='video'){ const v = document.createElement('video'); v.controls = true; v.src = u; v.autoplay = true; v.playsInline = true; b.replaceWith(v); }
      else { const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel='noopener'; a.download = b.dataset.n||'archivo'; document.body.appendChild(a); a.click(); a.remove(); b.disabled = false; b.textContent = t0; }
    }catch(e){ b.disabled = false; b.textContent = t0; toast(e.message); }
  });
}

const aB64 = blob => new Promise((ok,ko)=>{ const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]||''); r.onerror = () => ko(new Error('No se pudo leer el archivo.')); r.readAsDataURL(blob); });

  }

  if (!Object.values(EXT_MIME).includes(mime)) throw new Error('Ese tipo de archivo no se puede mandar por WhatsApp. Sirven fotos, videos MP4, audios, PDF, Word, Excel y PowerPoint.');

async function decidir(l, k, btn){

  try{
    if (k==='later'){ await post(`/api/mesa/${l.convId}/sin-decidir`); toast('Quedó marcada "Falta decidir"'); }
    else {
      let body;
      if (k==='esperar') body = {tipo:'esperar'};
      else if (k.startsWith('s:')) body = {tipo:'seguimiento', dias:+k.slice(2)};
      else if (k==='p') body = {tipo:'posponer', fecha:$('pf').value};
      else if (k==='ganada') body = {tipo:'ganada'};
      else body = {tipo:'perdida', motivo:k.split(':')[1]||''};
      if (btn) btn.disabled = true;
      await post(`/api/mesa/${l.convId}/decidir`, body);
      toast({esperar:'Esperando respuesta. Si no contesta hoy, vuelve a Hoy para recordarle.',seguimiento:'Seguimiento programado',posponer:'Pospuesta',ganada:'¡Venta cerrada!',perdida:'Marcada como perdida'}[body.tipo]);
    }

     <div class="sec"><h3>Cliente</h3><dl class="kv"><dt>Producto</dt><dd>${esc(l.producto||'—')}</dd><dt>Llegó por</dt><dd>${esc(l.fuente||'—')}</dd>${l.campana?`<dt>Campaña</dt><dd>${esc(l.campana)}</dd>`:''}<dt>Asesor</dt><dd>${esc(l.asesorNombre||'Sin asignar')}</dd>${l.opNumero?`<dt>Oportunidad</dt><dd>#${l.opNumero}</dd>`:''}</dl>${l.opId?`<div style="margin-top:9px"><a class="btn sm" href="/crm.html?abrir=crm-${esc(l.opId)}">Editar datos o asignar visita</a></div>`:''}</div>
     ${l.convId?`<div class="sec notas"><h3>Notas internas</h3><textarea id="nota" placeholder="Solo las ve el equipo">${esc(keepN!=null?keepN:l.notas)}</textarea></div>`:''}
     ${l.historial.length?`<div class="sec"><h3>Historial</h3><div class="hist">${l.historial.slice().reverse().map(h=>`<span>${esc(h.txt)} · ${hora(h.at)}</span>`).join('')}</div></div>`:''}
   </details>`;
  c.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>popup(b.dataset.pop));
  if ($('adjP')) $('adjP').onclick = () => { ADJ={id:l.presupuesto.id, numero:l.presupuesto.numero, conv:l.id}; pintarCaj(l,{keep:true}); const t=$('txt'); if(t){ if(!t.value) t.value='Te paso el presupuesto Nº '+String(l.presupuesto.numero).padStart(5,'0')+' (total '+money(l.presupuesto.total)+', precios finales con IVA). Cualquier duda me avisás.'; t.focus(); } };
  if ($('hacerP')) $('hacerP').onclick = () => popup('/admin-presupuestos.html?embed=1&nuevo=1&nombre='+encodeURIComponent(l.nombre)+'&tel='+encodeURIComponent(l.tel)+(l.convId?'&convId='+encodeURIComponent(l.convId):''), 'Nuevo presupuesto para '+l.nombre);
  c.querySelectorAll('.temp button').forEach(b=>b.onclick=async()=>{ try{ await post(`/api/mesa/${l.convId}/temperatura`, {temperatura:b.dataset.t}); await cargar({forzar:true}); }catch(e){ err(e); } });
  c.querySelectorAll('.etapas button').forEach(b=>b.onclick=async()=>{ try{ await post(`/api/mesa/${l.convId}/etapa`, {etapa:b.dataset.e}); await cargar({forzar:true}); }catch(e){ err(e); } });
  if ($('nota')){ let t; $('nota').oninput = e => { clearTimeout(t); const v=e.target.value; t=setTimeout(()=>post(`/api/mesa/${l.convId}/nota`, {texto:v}).catch(()=>{}), 700); }; }
}

/* ---- ventana emergente (presupuestos) ---- */
let POP = null, ADJ = null, CAMPS = null;
let RESL = null, EVO = null, SNAP = null, AIR = null, EVOX = {}, ADSCON = null;
const diaAR = ms => new Date(ms-3*3600000).toISOString().slice(0,10);
function desdeStr(per){ return per==='7' ? diaAR(Date.now()-6*864e5) : per==='30' ? diaAR(Date.now()-29*864e5) : per==='mes' ? diaAR(Date.now()).slice(0,8)+'01' : diaAR(Date.now()-89*864e5); }
async function cargarCamps(){
  const per = $('rper') ? $('rper').value : 'mes';
  try{ CAMPS = (await api('/api/leads/campanas', {headers:H()})).items; }catch(e){ CAMPS = CAMPS||[]; }
  try{ RESL = await api('/api/leads/resumen?desde='+desdeStr(per), {headers:H()}); RESL.per = per; }catch(e){ RESL = RESL||null; }
  try{ const ev = await api('/api/mesa/evolucion', {headers:H()}); EVO = ev.meses; EVOX = {camp: ev.gastoPorCampana||[], meta: ev.mesesDeMeta||[]}; }catch(e){ EVO = EVO||null; }
  try{ ADSCON = (await api('/api/mesa/gasto-ads/estado', {headers:H()})).conectado; }catch(e){}
  if (VISTA==='resumen') pintarResumen();
}
function graficoMeses(ms){
  const W = 720, Hh = 150, pl = 40, pb = 18, g = (W-pl)/ms.length, mx = Math.max(1,...ms.map(m=>Math.max(m.leads,m.presupuestos)));
  const nm = m => ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m.mes.slice(5)-1];
  const hh = v => Math.round(v/mx*(Hh-pb-10)), y = v => Hh-pb-hh(v);
  const bars = ms.map((m,i)=>{ const x = pl+i*g, w = g*0.36; return `<g><title>${nm(m)} ${m.mes.slice(0,4)}: ${m.leads} consultas · ${m.presupuestos} presupuestos (${money(m.monto)})${m.aprobados?` · ${m.aprobados} aprobados`:''}</title><rect x="${x+g*0.1}" y="${y(m.leads)}" width="${w}" height="${Math.max(m.leads?2:0,hh(m.leads))}" rx="2" fill="var(--accent)"/><rect x="${x+g*0.1+w+2}" y="${y(m.presupuestos)}" width="${w}" height="${Math.max(m.presupuestos?2:0,hh(m.presupuestos))}" rx="2" fill="var(--violet)"/></g><text x="${x+g/2}" y="${Hh-4}" font-size="9.5" text-anchor="middle" fill="var(--mute)">${nm(m)}</text>`; }).join('');
  const ticks = [0,Math.ceil(mx/2),mx].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<text x="${pl-5}" y="${y(v)+3}" font-size="9.5" text-anchor="end" fill="var(--mute)">${v}</text><line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('');
  const mxm = Math.max(1,...ms.map(m=>m.monto)), hm = v => Math.round(v/mxm*(Hh-pb-10));
  const barsM = ms.map((m,i)=>{ const x = pl+i*g; return `<g><title>${nm(m)} ${m.mes.slice(0,4)}: ${money(m.monto)} presupuestado${m.montoAprobado?` · ${money(m.montoAprobado)} aprobado`:''}</title><rect x="${x+g*0.18}" y="${Hh-pb-hm(m.monto)}" width="${g*0.64}" height="${Math.max(m.monto?2:0,hm(m.monto))}" rx="2" fill="var(--violet)" opacity=".35"/><rect x="${x+g*0.18}" y="${Hh-pb-hm(m.montoAprobado)}" width="${g*0.64}" height="${Math.max(m.montoAprobado?2:0,hm(m.montoAprobado))}" rx="2" fill="var(--ok)"/></g><text x="${x+g/2}" y="${Hh-4}" font-size="9.5" text-anchor="middle" fill="var(--mute)">${nm(m)}</text>`; }).join('');
  const k = v => v>=1e6 ? (v/1e6).toFixed(1).replace('.',',')+' M' : v>=1e3 ? Math.round(v/1e3)+' mil' : String(v);
  const tM = [0,mxm/2,mxm].map(v=>`<text x="${pl-5}" y="${Hh-pb-hm(v)+3}" font-size="9.5" text-anchor="end" fill="var(--mute)">${k(Math.round(v))}</text><line x1="${pl}" x2="${W}" y1="${Hh-pb-hm(v)}" y2="${Hh-pb-hm(v)}" stroke="var(--line)"/>`).join('');
  return {cant:`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Consultas y presupuestos por mes" style="display:block">${ticks}${bars}</svg>`, monto:`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Monto presupuestado por mes" style="display:block">${tM}${barsM}</svg>`};
}
function graficoAds(ms){
  const W = 720, Hh = 150, pl = 46, pr = 46, pb = 18, g = (W-pl-pr)/ms.length, mxg = Math.max(1,...ms.map(m=>m.gastoAds)); const cpl = ms.map(m=>m.leadsMeta&&m.gastoAds?m.gastoAds/m.leadsMeta:null); const mxc = Math.max(1,...cpl.map(v=>v||0));
  const nm = m => ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m.mes.slice(5)-1], k = v => v>=1e6 ? (v/1e6).toFixed(1).replace('.',',')+' M' : v>=1e3 ? Math.round(v/1e3)+' mil' : String(Math.round(v));
  const yg = v => Hh-pb-Math.round(v/mxg*(Hh-pb-10)), yc = v => Hh-pb-Math.round(v/mxc*(Hh-pb-10));
  const bars = ms.map((m,i)=>{ const x = pl+i*g; return `<g><title>${nm(m)} ${m.mes.slice(0,4)}: ${money(m.gastoAds)} invertidos · ${m.leadsMeta} consultas de Meta Ads${cpl[i]?' · '+money(Math.round(cpl[i]))+' por consulta':''}</title><rect x="${x+g*0.18}" y="${yg(m.gastoAds)}" width="${g*0.64}" height="${Math.max(m.gastoAds?2:0,Hh-pb-yg(m.gastoAds))}" rx="2" fill="var(--cold)" opacity=".8"/></g><text x="${x+g/2}" y="${Hh-4}" font-size="9.5" text-anchor="middle" fill="var(--mute)">${nm(m)}</text>`; }).join('');
  const pts = cpl.map((v,i)=>v==null?null:[pl+i*g+g/2, yc(v)]).filter(Boolean); const line = pts.length>1 ? `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ''; const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join('');
  const tg = [0,mxg/2,mxg].map(v=>`<text x="${pl-5}" y="${yg(v)+3}" font-size="9.5" text-anchor="end" fill="var(--cold)">${k(v)}</text><line x1="${pl}" x2="${W-pr}" y1="${yg(v)}" y2="${yg(v)}" stroke="var(--line)"/>`).join(''); const tc = [0,mxc/2,mxc].map(v=>`<text x="${W-pr+5}" y="${yc(v)+3}" font-size="9.5" fill="var(--accent)">${k(v)}</text>`).join('');
  return `<div class="tip" style="margin:0 0 4px"><span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:10px;height:10px;border-radius:3px;background:var(--cold);display:inline-block"></i>Inversión (eje izquierdo)</span><span style="display:inline-flex;align-items:center;gap:5px"><i style="width:14px;height:3px;background:var(--accent);display:inline-block"></i>Costo por consulta (eje derecho)</span></div><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Inversión en Meta Ads y costo por consulta por mes" style="display:block">${tg}${tc}${bars}${line}${dots}</svg>`;
}
function graficoDias(res, per){
  const mapa = new Map((res.porDia||[]).map(x=>[x.nombre,x])); const dias = []; const ini = desdeStr(per);
  for (let d = new Date(ini+'T12:00:00Z'); diaAR(d.getTime()+3*3600000) <= diaAR(Date.now()); d = new Date(d.getTime()+864e5)){ const k = d.toISOString().slice(0,10); const e = mapa.get(k); dias.push({k, n:e?e.leads:0, c:e?e.clientes:0}); }
  const mx = Math.max(1,...dias.map(d=>d.n)), W = 720, Hh = 105, pl = 26, pb = 18, bw = (W-pl)/Math.max(1,dias.length), tot = dias.reduce((s,d)=>s+d.n,0);
  const step = Math.max(1, Math.ceil(dias.length/10));
  const bars = dias.map((d,i)=>{ const h = Math.round(d.n/mx*(Hh-pb-8)); const x = pl+i*bw; return `<g><title>${d.k.slice(8)}/${d.k.slice(5,7)}: ${d.n} consulta${d.n===1?'':'s'}${d.c?`, ${d.c} ya cliente${d.c===1?'':'s'}`:''}</title><rect x="${x+bw*0.14}" y="${Hh-pb-h}" width="${Math.max(1,bw*0.72)}" height="${Math.max(d.n?2:0,h)}" rx="2" fill="var(--accent)" opacity=".9"/></g>${i%step===0?`<text x="${x+bw/2}" y="${Hh-4}" font-size="9.5" text-anchor="middle" fill="var(--mute)">${d.k.slice(8)}/${d.k.slice(5,7)}</text>`:''}`; }).join('');
  const ticks = [0,Math.ceil(mx/2),mx].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<text x="${pl-5}" y="${Hh-pb-Math.round(v/mx*(Hh-pb-8))+3}" font-size="9.5" text-anchor="end" fill="var(--mute)">${v}</text><line x1="${pl}" x2="${W}" y1="${Hh-pb-Math.round(v/mx*(Hh-pb-8))}" y2="${Hh-pb-Math.round(v/mx*(Hh-pb-8))}" stroke="var(--line)" stroke-width="1"/>`).join('');
  return {svg:`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Consultas por día" style="display:block">${ticks}${bars}</svg>`, tot, prom: dias.length ? (tot/dias.length).toFixed(1).replace('.',',') : '0', mx};
}
// PDF con el mismo diseño del botón Imprimir: se abre esa página en un marco oculto y se genera ahí.
async function pdfPresupuesto(id){
  const r = await fetch('/api/presupuestos/'+id+'/imprimir', {headers:H()}); if (!r.ok) throw new Error('No se pudo abrir el presupuesto');
  const html = await r.text(); const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;left:-10000px;top:0;width:820px;height:1200px;border:0;visibility:hidden'; f.srcdoc = html; document.body.appendChild(f);
  try{
    await new Promise((ok,ko)=>{ f.onload = ok; setTimeout(()=>ko(new Error('Tardó demasiado')), 15000); });
    for (let i=0;i<60 && !(f.contentWindow.html2canvas && f.contentWindow.jspdf && f.contentWindow.generarPdfBlob); i++) await new Promise(x=>setTimeout(x,150));
    if (!f.contentWindow.generarPdfBlob || !f.contentWindow.html2canvas) throw new Error('No cargó el generador de PDF');
    await new Promise(x=>setTimeout(x,300));
    const { blob } = await f.contentWindow.generarPdfBlob();
    return await new Promise((ok,ko)=>{ const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = ko; fr.readAsDataURL(blob); });
  } finally { f.remove(); }
}
function textoPresupuesto(p){
  const m = n => (p.moneda==='USD'?'US$ ':'$ ') + Math.round(n||0).toLocaleString('es-AR');
  const it = (p.items||[]).map(i=>'• '+i.cantidad+' x '+i.nombre+' — '+m(i.precioUnitario*i.cantidad)).join('\n');
  return 'Te paso el presupuesto Nº '+String(p.numero).padStart(5,'0')+':\n'+it+(p.descuento?'\nDescuento: '+p.descuento+'%':'')+'\nTotal: '+m(p.total)+' (precios finales con IVA).\nCualquier duda me avisás.';
}
window.addEventListener('message', async e => {
  if (e.origin !== location.origin || !e.data || e.data.tipo !== 'presupuesto-guardado') return;
  if (POP){ POP.remove(); POP = null; }
  await cargar({forzar:true});
  const cl = cur(); const tx = $('txt'); if (tx && cl){ ADJ = {id:e.data.id, numero:e.data.numero, conv:cl.id}; tx.value = textoPresupuesto(e.data); pintarCaj(cl,{keep:true}); $('txt').value = textoPresupuesto(e.data); $('txt').focus(); toast('Presupuesto guardado. Revisá el mensaje y enviá el PDF al cliente'); }
  else toast('Presupuesto guardado');
});
function popup(url, titulo){
  const w = document.createElement('div'); w.className = 'pop'; w.innerHTML = '<div class="pop-in"><div class="pop-h"><b id="popt">Presupuesto</b><span class="sp"></span><button class="x" id="popx">Cerrar ✕</button></div><iframe title="Presupuesto"></iframe></div>';
  document.body.appendChild(w); w.querySelector('iframe').src = url; if (titulo) w.querySelector('#popt').textContent = titulo; POP = w;
  const cerrar = () => { w.remove(); POP = null; document.removeEventListener('keydown', esc2); cargar({forzar:true}); };
  const esc2 = e => { if (e.key==='Escape'){ e.stopPropagation(); cerrar(); } };
  document.addEventListener('keydown', esc2, true);
  w.onclick = e => { if (e.target===w) cerrar(); }; w.querySelector('#popx').onclick = cerrar;
}
/* ---- arrastrar ---- */
function enlazar(){
  document.querySelectorAll('.card').forEach(c=>{
    c.onclick = () => abrir(c.dataset.id); c.onkeydown = e => { if (e.key==='Enter') abrir(c.dataset.id); };
    c.ondragstart = e => { dragId = c.dataset.id; c.classList.add('drag'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch(x){} };
    c.ondragend = () => { c.classList.remove('drag'); dragId = null; document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); };
  });
  document.querySelectorAll('.colu').forEach(col=>{
    col.ondragover = e => { e.preventDefault(); col.classList.add('over'); }; col.ondragleave = () => col.classList.remove('over');
    col.ondrop = async e => { e.preventDefault(); col.classList.remove('over'); const l = ITEMS.find(x=>x.id===dragId); if (!l||!l.convId||l.columna===col.dataset.e) return;
      try{ await post(`/api/mesa/${l.convId}/mover`, {columna:col.dataset.e}); toast(l.nombre+' → '+COLS.find(x=>x.k===col.dataset.e).n); await cargar(); }catch(x){ err(x); } };
  });
}
document.querySelectorAll('.zona').forEach(z=>{
  z.ondragover = e => { e.preventDefault(); z.classList.add('over'); }; z.ondragleave = () => z.classList.remove('over');
  z.ondrop = async e => { e.preventDefault(); z.classList.remove('over'); const l = ITEMS.find(x=>x.id===dragId); if (!l||!l.convId) return;
    if (z.dataset.z==='ganada'){ try{ await post(`/api/mesa/${l.convId}/decidir`, {tipo:'ganada'}); toast('¡Venta cerrada!'); await cargar(); }catch(x){ err(x); } }
    else { sel = l.id; pend = null; decOpen = 'perdida'; pintar(); await abrirCaj(l); } };
});

/* ---- vistas y filtros ---- */
function setV(v){
  VISTA = v; document.querySelectorAll('#vistas button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('tab').hidden = v!=='tablero'; $('embudo').hidden = v==='bot'||v==='resumen'; $('v-res').hidden = v!=='resumen'; $('cierres').hidden = v!=='tablero'; $('v-lista').hidden = v!=='lista'; $('barra').hidden = v==='bot'; $('bot').hidden = v!=='bot';
  if (v==='bot' && !$('bot').src) $('bot').src = '/admin-bot.html?embed=1';

}
$('vistas').onclick = e => { const b = e.target.closest('button'); if (b) setV(b.dataset.v); };
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ F=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); pintar(); });
$('soloHoy').onclick = () => { $('soloHoy').classList.toggle('on'); pintar(); };

async function ejemplos(alta){ if (!alta && !confirm('¿Quitar las conversaciones de ejemplo y las oportunidades creadas desde ellas?')) return; try{ await api('/api/bot/conversaciones/ejemplos', {method: alta?'POST':'DELETE', headers:H(J), body:'{}'}); sel=null; cierre(); await cargar(); }catch(e){ err(e); } }
$('ej').onclick = () => ejemplos(false);
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('caj').hidden) cerrarCaj(); });
(async function init(){
  if (!TOKEN){ err('Entrá primero al sistema con tu usuario.'); return; }
  try{ const me = await api('/api/usuarios/me', {headers:H()}); if (window.PiedraSidebar) PiedraSidebar.render(me, 'crm'); }catch(e){ err(e); return; }

  setInterval(() => { if (!document.hidden && !decOpen && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('.gads')) && !(document.activeElement && document.activeElement.id==='txt' && document.activeElement.value)) cargar(); }, 20000);
})();
