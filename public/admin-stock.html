<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.inactivo{background:var(--danger-soft);color:var(--danger);}
  .pill.bajo{background:var(--danger-soft);color:var(--danger);}
  .pill.ok{background:var(--ok-soft);color:var(--ok);}
  .pill.ingreso{background:var(--ok-soft);color:var(--ok);}
  .pill.egreso{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:500;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:820px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
  .tab-btn.activa{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Stock</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Stock. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Stock</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button class="tab-btn" id="tabBtnActual" onclick="cambiarTab('actual')">Stock actual</button>
      <button class="tab-btn" id="tabBtnMovimientos" onclick="cambiarTab('movimientos')">Movimientos</button>
      <button class="tab-btn" id="tabBtnDepositos" onclick="cambiarTab('depositos')">Depósitos</button>
    </div>

    <div id="tabActual">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="row" style="flex:1">
            <div style="min-width:200px;flex:1">
              <label>Buscar (nombre o SKU)</label>
              <input id="faBusqueda" oninput="cargarStockActual()" placeholder="Ej: revestimiento gris">
            </div>
            <div style="min-width:180px">
              <label>Depósito</label>
              <select id="faDeposito" onchange="cargarStockActual()"><option value="">Todos</option></select>
            </div>
            <div>
              <label style="visibility:hidden">.</label>
              <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap">
                <input type="checkbox" id="faBajoMinimo" style="width:auto" onchange="cargarStockActual()"> Solo bajo mínimo
              </label>
            </div>
          </div>
          <button class="btn secondary" onclick="descargarBlob(BASE + '/actual/export', 'stock-actual.xlsx')">Exportar</button>
        </div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>SKU</th><th>Producto</th><th>Depósito</th><th>Cantidad</th><th>Mínimo</th><th>Estado</th></tr></thead>
          <tbody id="actualBody"><tr><td colspan="6" class="muted">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="tabMovimientos" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="row" style="flex:1">
            <div style="min-width:180px">
              <label>Producto</label>
              <select id="fmProducto" onchange="cargarMovimientos()"><option value="">Todos</option></select>
            </div>
            <div style="min-width:160px">
              <label>Depósito</label>
              <select id="fmDeposito" onchange="cargarMovimientos()"><option value="">Todos</option></select>
            </div>
            <div style="min-width:140px">
              <label>Tipo</label>
              <select id="fmTipo" onchange="cargarMovimientos()">
                <option value="">Todos</option>
                <option value="ingreso">Ingreso</option>
                <option value="egreso">Egreso</option>
              </select>
            </div>
            <div style="min-width:140px">
              <label>Desde</label>
              <input id="fmDesde" type="date" onchange="cargarMovimientos()">
            </div>
            <div style="min-width:140px">
              <label>Hasta</label>
              <input id="fmHasta" type="date" onchange="cargarMovimientos()">
            </div>
          </div>
          <div class="row">
            <button class="btn secondary" onclick="descargarBlob(BASE + '/movimientos/export', 'movimientos-stock.xlsx')">Exportar</button>
            <button class="btn secondary" onclick="abrirImportarMovimientos()">Carga inicial de stock</button>
            <button class="btn secondary" onclick="abrirNuevaTransferencia()">Transferencia</button>
            <button class="btn" onclick="abrirNuevoMovimiento()">+ Nuevo movimiento</button>
          </div>
        </div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Fecha</th><th>Producto</th><th>Depósito</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th>Usuario</th></tr></thead>
          <tbody id="movimientosBody"><tr><td colspan="7" class="muted">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="tabDepositos" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div></div>
          <div class="row" style="gap:8px">
            <button class="btn secondary" onclick="descargarBlob(BASE + '/depositos/export', 'depositos.xlsx')">Exportar</button>
            <button class="btn secondary" onclick="abrirImportarDepositos()">Importar</button>
            <button class="btn" onclick="abrirNuevoDeposito()">+ Nuevo depósito</button>
          </div>
        </div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Nombre</th><th>Dirección</th><th>Estado</th><th></th></tr></thead>
          <tbody id="depositosBody"><tr><td colspan="4" class="muted">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/stock';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('stock'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'stock', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarProductosYDepositos();
  cambiarTab('actual');
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

// -------------------------------------------------------------------
// Tabs
// -------------------------------------------------------------------
let tabActiva = 'actual';
function cambiarTab(tab){
  tabActiva = tab;
  document.getElementById('tabActual').classList.toggle('hidden', tab !== 'actual');
  document.getElementById('tabMovimientos').classList.toggle('hidden', tab !== 'movimientos');
  document.getElementById('tabDepositos').classList.toggle('hidden', tab !== 'depositos');
  document.getElementById('tabBtnActual').classList.toggle('activa', tab === 'actual');
  document.getElementById('tabBtnMovimientos').classList.toggle('activa', tab === 'movimientos');
  document.getElementById('tabBtnDepositos').classList.toggle('activa', tab === 'depositos');
  if (tab === 'actual') cargarStockActual();
  if (tab === 'movimientos') cargarMovimientos();
  if (tab === 'depositos') cargarDepositos();
}

// -------------------------------------------------------------------
// Productos y depósitos (para selects, se cargan una sola vez al entrar)
// -------------------------------------------------------------------
let productosCache = [];
let depositosCache = [];
async function cargarProductosYDepositos(){
  const [rp, rd] = await Promise.all([
    fetch('/api/productos', {headers: headersAuth()}),
    fetch(BASE + '/depositos', {headers: headersAuth()})
  ]);
  productosCache = rp.ok ? await rp.json() : [];
  depositosCache = rd.ok ? await rd.json() : [];
  const opcionesProductos = productosCache.map(p => `<option value="${p._id}">${escapeHtml(p.sku)} — ${escapeHtml(p.nombre)}</option>`).join('');
  const opcionesDepositos = depositosCache.filter(d => d.activo !== false).map(d => `<option value="${d._id}">${escapeHtml(d.nombre)}</option>`).join('');
  document.getElementById('faDeposito').innerHTML = '<option value="">Todos</option>' + opcionesDepositos;
  document.getElementById('fmProducto').innerHTML = '<option value="">Todos</option>' + opcionesProductos;
  document.getElementById('fmDeposito').innerHTML = '<option value="">Todos</option>' + opcionesDepositos;
}

function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// -------------------------------------------------------------------
// Stock actual
// -------------------------------------------------------------------
async function cargarStockActual(){
  const params = new URLSearchParams();
  if (document.getElementById('faBusqueda').value.trim()) params.set('q', document.getElementById('faBusqueda').value.trim());
  if (document.getElementById('faDeposito').value) params.set('depositoId', document.getElementById('faDeposito').value);
  if (document.getElementById('faBajoMinimo').checked) params.set('soloBajoMinimo', '1');
  const r = await fetch(BASE + '/actual?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('actualBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="6" class="err">No se pudo cargar.</td></tr>'; return; }
  const filas = await r.json();
  if (!filas.length) { body.innerHTML = '<tr><td colspan="6" class="muted">Sin existencias cargadas todavía.</td></tr>'; return; }
  body.innerHTML = filas.map(f => `
    <tr>
      <td><strong>${escapeHtml(f.sku)}</strong></td>
      <td>${escapeHtml(f.nombre)}</td>
      <td class="muted">${escapeHtml(f.deposito)}</td>
      <td>${f.cantidad} <span class="muted">${escapeHtml(f.unidad||'')}</span></td>
      <td class="muted">${f.cantidadMinima!=null ? f.cantidadMinima : '—'}</td>
      <td>${f.cantidadMinima!=null ? `<span class="pill ${f.bajoMinimo?'bajo':'ok'}">${f.bajoMinimo?'Bajo mínimo':'OK'}</span>` : '<span class="muted">—</span>'}</td>
    </tr>
  `).join('');
}

// -------------------------------------------------------------------
// Movimientos
// -------------------------------------------------------------------
const TIPO_MOVIMIENTO_LABEL = { ingreso: 'Ingreso', egreso: 'Egreso' };

async function cargarMovimientos(){
  const params = new URLSearchParams();
  if (document.getElementById('fmProducto').value) params.set('productoId', document.getElementById('fmProducto').value);
  if (document.getElementById('fmDeposito').value) params.set('depositoId', document.getElementById('fmDeposito').value);
  if (document.getElementById('fmTipo').value) params.set('tipo', document.getElementById('fmTipo').value);
  if (document.getElementById('fmDesde').value) params.set('desde', document.getElementById('fmDesde').value);
  if (document.getElementById('fmHasta').value) params.set('hasta', document.getElementById('fmHasta').value);
  const r = await fetch(BASE + '/movimientos?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('movimientosBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="7" class="err">No se pudo cargar.</td></tr>'; return; }
  const movimientos = await r.json();
  if (!movimientos.length) { body.innerHTML = '<tr><td colspan="7" class="muted">No hay movimientos todavía.</td></tr>'; return; }
  body.innerHTML = movimientos.map(m => `
    <tr>
      <td class="muted">${fechaCorta(m.fecha)}</td>
      <td><strong>${escapeHtml(m.sku||'')}</strong> ${escapeHtml(m.producto)}</td>
      <td class="muted">${escapeHtml(m.deposito)}</td>
      <td><span class="pill ${m.tipo}">${TIPO_MOVIMIENTO_LABEL[m.tipo]||m.tipo}</span></td>
      <td>${m.cantidad}</td>
      <td class="muted">${escapeHtml(m.motivo||'—')}${m.transferenciaId ? ' <span class="muted">(transferencia)</span>' : ''}</td>
      <td class="muted">${escapeHtml(m.usuarioNombre||'—')}</td>
    </tr>
  `).join('');
}

function opcionesProductosDatalist(seleccionado){
  return '<option value="">Elegí un producto…</option>' + productosCache.map(p => `<option value="${p._id}" ${p._id===seleccionado?'selected':''}>${escapeHtml(p.sku)} — ${escapeHtml(p.nombre)}</option>`).join('');
}
function opcionesDepositosSelect(seleccionado){
  return '<option value="">Elegí un depósito…</option>' + depositosCache.filter(d => d.activo !== false).map(d => `<option value="${d._id}" ${d._id===seleccionado?'selected':''}>${escapeHtml(d.nombre)}</option>`).join('');
}

function abrirNuevoMovimiento(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Nuevo movimiento</h2>
        <div class="grid2">
          <div><label>Producto *</label><select id="mmProducto">${opcionesProductosDatalist()}</select></div>
          <div><label>Depósito *</label><select id="mmDeposito">${opcionesDepositosSelect()}</select></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div><label>Tipo *</label><select id="mmTipo"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select></div>
          <div><label>Cantidad *</label><input id="mmCantidad" type="number" min="0.01" step="0.01"></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div><label>Fecha</label><input id="mmFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div><label>Sucursal</label><input id="mmSucursal" placeholder="Opcional"></div>
        </div>
        <div class="grid2" style="margin-top:10px">

// Depósitos

async function cargarDepositos(){
  const r = await fetch(BASE + '/depositos?incluirInactivos=1', {headers: headersAuth()});
  const body = document.getElementById('depositosBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="4" class="err">No se pudo cargar.</td></tr>'; return; }
  depositosCache = await r.json();
  document.getElementById('fmDeposito').innerHTML = '<option value="">Todos</option>' + depositosCache.filter(d => d.activo !== false).map(d => `<option value="${d._id}">${escapeHtml(d.nombre)}</option>`).join('');
  document.getElementById('faDeposito').innerHTML = '<option value="">Todos</option>' + depositosCache.filter(d => d.activo !== false).map(d => `<option value="${d._id}">${escapeHtml(d.nombre)}</option>`).join('');
  if (!depositosCache.length) { body.innerHTML = '<tr><td colspan="4" class="muted">No hay depósitos todavía.</td></tr>'; return; }
  body.innerHTML = depositosCache.map(d => `
    <tr>
      <td><strong>${escapeHtml(d.nombre)}</strong></td>
      <td class="muted">${escapeHtml(d.direccion || '—')}</td>
      <td><span class="pill ${d.activo === false ? 'inactivo' : 'activo'}">${d.activo === false ? 'Inactivo' : 'Activo'}</span></td>
      <td>
        <button class="btn small secondary" onclick="abrirEditarDeposito('${d._id}')">Editar</button>
        ${d.activo === false ? '' : `<button class="btn small danger" onclick="desactivarDeposito('${d._id}', '${escapeHtml(d.nombre).replace(/'/g,"\\'")}')">Desactivar</button>`}
      </td>
    </tr>
  `).join('');
}

// -------------------------------------------------------------------
// Import / export en Excel (.xlsx) — ver importExport.js en el backend.
// Stock tiene tres planillas: depósitos (import/export), stock actual
// (solo export, es un caché calculado) y movimientos (export de
// historial + "carga inicial de stock", que importa filas como
// movimientos de ingreso reales).
// -------------------------------------------------------------------
async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

async function importarGenerico(url, archivoInputId, mensajeExito, recargar){
  const input = document.getElementById(archivoInputId);
  const file = input.files[0];
  document.getElementById('impErr').textContent = '';
  document.getElementById('impResultado').innerHTML = '';
  if (!file) { document.getElementById('impErr').textContent = 'Elegí un archivo .xlsx'; return; }
  try{
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const r = await fetch(url, {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    let html = `<p class="ok-msg">${mensajeExito(data)}</p>`;
    if (data.errores && data.errores.length) {
      html += `<p class="err">${data.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        data.errores.map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') + '</ul>';
    }
    document.getElementById('impResultado').innerHTML = html;
    await recargar();
  }catch(e){
    document.getElementById('impErr').textContent = e.message;
  }
}
