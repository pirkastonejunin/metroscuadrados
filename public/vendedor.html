<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding-bottom:30px;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);color:var(--text);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:10px;}
  header .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  header .logo{height:19px;width:auto;display:block;flex-shrink:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;flex-shrink:0;}
  main{padding:14px;max-width:520px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:11px 16px;border-radius:8px;font-size:15px;font-weight:700;width:100%;font-family:inherit;display:inline-block;text-decoration:none;text-align:center;box-sizing:border-box;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);color:#fff;border:none;}
  .btn.small{width:auto;padding:8px 12px;font-size:13px;}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.sin_visita,.pill.agendada{background:var(--bg);color:var(--muted);}
  .pill.presupuestada{background:var(--accent-soft);color:var(--accent);}
  .pill.vendido,.pill.confirmada{background:var(--ok-soft);color:var(--ok);}
  .pill.instalado{background:var(--info-soft);color:var(--info);}
  .pill.cancelada{background:var(--danger-soft);color:var(--danger);}
  .visita-titulo{font-weight:800;font-size:15px;}
  .muted{color:var(--muted);font-size:12.5px;}
  .err{color:var(--danger);font-size:13px;margin:8px 0;}
  #vendedorScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  #vendedorScreen .card{width:100%;max-width:340px;text-align:center;}
  #vendedorScreen .logo{height:24px;width:auto;margin:0 auto 16px;display:block;}
  .hidden{display:none !important;}
  .vend-btn{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;margin-bottom:8px;font-family:inherit;}
  .foto-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin:10px 0;}
  .foto-galeria img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .item-row{display:flex;gap:6px;margin-bottom:6px;}
  .item-row select{flex:2} .item-row input{flex:1}
  .back-link{color:var(--accent);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:10px;font-weight:700;}
  .cotizacion-opcion{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;font-size:13px;}
  .divider{border-top:1px solid var(--border);margin:14px 0;padding-top:14px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
    :root:not([data-theme="light"]) .logo{filter:invert(1);}
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
  :root[data-theme="dark"] .logo{filter:invert(1);}
</style>
</head>

<script>
const BASE = '/api/visitas'; // coincide con app.use('/api/visitas', visitasRouter) en server.js
let VENDEDOR_ID = localStorage.getItem('vendedor_id') || '';
let VENDEDOR_NOMBRE = localStorage.getItem('vendedor_nombre') || '';
let STORE_ID = null;
let TIPOS_TRABAJO = [];
let VISITAS = [];

function api(path, opts={}) {
  if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  return fetch(BASE+path, opts).then(async r => {
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || 'Error de red');
    return data;
  });
}
function fmtFecha(f){ return f ? new Date(f).toLocaleString('es-AR',{weekday:'short', day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''; }
const ESTADOS = {sin_visita:'Sin visita', presupuestada:'Presupuestada', vendido:'Vendido', instalado:'Instalado', cancelada:'Cancelada',
  // alias por compatibilidad con nombres de estado viejos
  agendada:'Sin visita', confirmada:'Vendido'};

async function cargarSelectorVendedor(){
  try{
    const lista = await api('/vendedores/publico');
    document.getElementById('listaVendedores').innerHTML = lista.map(v =>
      `<button class="vend-btn" onclick='elegirVendedor("${v._id}", ${JSON.stringify(v.nombre)})'>${v.nombre}</button>`
    ).join('') || '<p class="muted">Todavía no hay vendedores cargados. Pedile a la oficina que te agregue en el panel de Visitas.</p>';
  }catch(e){
    document.getElementById('listaVendedores').innerHTML = `<p class="err">${e.message}</p>`;
  }
}
function elegirVendedor(id, nombre){
  VENDEDOR_ID = id; VENDEDOR_NOMBRE = nombre;
  localStorage.setItem('vendedor_id', id);
  localStorage.setItem('vendedor_nombre', nombre);
  iniciar();
}
function cambiarVendedor(){
  localStorage.removeItem('vendedor_id');
  localStorage.removeItem('vendedor_nombre');
  location.reload();
}

async function iniciar(){
  document.getElementById('vendedorScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('saludo').textContent = 'Hola, ' + VENDEDOR_NOMBRE;
  try{
    const cfg = await api('/config');
    STORE_ID = cfg.storeId;
  }catch(e){ /* seguimos sin cotizador si falla */ }
  try{ TIPOS_TRABAJO = await api('/catalogo/tipos-trabajo'); }catch(e){ TIPOS_TRABAJO = []; }
  mostrarListaVisitas();
}
if (VENDEDOR_ID) iniciar(); else cargarSelectorVendedor();

// ---------------- LISTA DE VISITAS ----------------

async function mostrarListaVisitas(){
  const pant = document.getElementById('pantalla');
  pant.innerHTML = '<p class="muted">Cargando…</p>';
  try{
    VISITAS = await api(`/vendedor/${VENDEDOR_ID}/visitas`);
  }catch(e){
    pant.innerHTML = `<p class="err">${e.message}</p>`;
    return;
  }
  if (!VISITAS.length){
    pant.innerHTML = '<p class="muted">No tenés visitas agendadas por ahora.</p>';
    return;
  }
  pant.innerHTML = VISITAS.map(v => `
    <div class="card" onclick="mostrarDetalleVisita('${v._id}')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="visita-titulo">${v.cliente.nombre}</div>
        <span class="pill ${v.estado}">${ESTADOS[v.estado]||v.estado}</span>
      </div>
      <div class="muted">${v.cliente.direccion||''}</div>
      <div class="muted">${fmtFecha(v.fechaHora)}</div>
    </div>
  `).join('');
}

// ---------------- DETALLE DE VISITA ----------------

async function mostrarDetalleVisita(id){
  const pant = document.getElementById('pantalla');
  pant.innerHTML = '<p class="muted">Cargando…</p>';
  let v;
  try{ v = await api(`/vendedor/${VENDEDOR_ID}/visitas/${id}`); }
  catch(e){ pant.innerHTML = `<p class="err">${e.message}</p>`; return; }

  const fotosHtml = (v.fotos && v.fotos.length)
    ? `<div class="foto-galeria">${v.fotos.map((f,i)=>`<img src="${f.data}">`).join('')}</div>`
    : '<p class="muted">Todavía no sacaste fotos.</p>';

  // Se puede editar/rehacer el presupuesto mientras la visita no se haya
  // confirmado todavía (una vez "vendido" ya se generó la Obra a partir de
  // ese presupuesto, así que cambiarlo acá no tendría efecto).
  const presupuestoEditable = v.estado !== 'vendido' && v.estado !== 'instalado';

  let presupuestoHtml;
  if (v.presupuesto){
    let resumen;
    if (v.presupuesto.tipo === 'manual'){
      const formasPagoHtml = (v.presupuesto.formasPago && v.presupuesto.formasPago.length)
        ? '<div class="muted" style="margin-top:6px">' +
          v.presupuesto.formasPago.map(fp => `${fp.nombre}: $${Number(fp.total||0).toLocaleString('es-AR')}`).join(' · ') +
          '</div>'
        : '';
      resumen = `<b>Presupuesto (a mano)</b><br>` +
        v.presupuesto.items.map(it=>`${it.tipoTrabajo}${it.descripcion?' ('+it.descripcion+')':''}: ${it.cantidad} × $${(it.valor||0).toLocaleString('es-AR')} = $${(it.total||0).toLocaleString('es-AR')}`).join('<br>') +
        `<br><b>Total: $${(v.presupuesto.total||0).toLocaleString('es-AR')}</b>` + formasPagoHtml +
        `<div style="margin-top:8px"><a class="btn small secondary" href="/api/visitas/vendedor/${VENDEDOR_ID}/visitas/${v._id}/presupuesto-pdf" target="_blank">Ver PDF llave en mano</a></div>`;
    } else {
      const params = new URLSearchParams({ store_id: v.presupuesto.storeId || STORE_ID, vista: 'simple' });
      resumen = `<b>Presupuesto (cotizador)</b><br>${v.presupuesto.tipoObraNombre||''}<br><b>Total: $${(v.presupuesto.total||0).toLocaleString('es-AR')}</b>` +
        `<div style="margin-top:8px"><a class="btn small secondary" href="/api/cotizador/pdf/${v.presupuesto.cotizacionId}?${params.toString()}" target="_blank">Ver PDF llave en mano</a></div>`;
    }
    presupuestoHtml = `
      <div class="card">
        ${resumen}
        ${presupuestoEditable ? `<div style="margin-top:10px"><button class="btn small secondary" onclick="mostrarElegirPresupuesto('${v._id}')">Editar presupuesto</button></div><div id="elegirPresupuesto"></div>` : ''}
      </div>`;
  } else {
    presupuestoHtml = `<div class="card"><b>Presupuesto</b><div id="elegirPresupuesto">${formularioElegirPresupuesto(v._id)}</div></div>`;
  }

  const puedeConfirmar = v.estado === 'presupuestada';

  pant.innerHTML = `
    <a class="back-link" href="javascript:void(0)" onclick="mostrarListaVisitas()">&larr; Volver a mis visitas</a>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="visita-titulo">${v.cliente.nombre}</div>
        <span class="pill ${v.estado}">${ESTADOS[v.estado]||v.estado}</span>
      </div>
      <div class="muted">${v.cliente.direccion||''} ${v.cliente.localidad?'· '+v.cliente.localidad:''}</div>
      <div class="muted">${v.cliente.telefono||''}</div>
      <div class="muted">${fmtFecha(v.fechaHora)}</div>
      ${v.notasEmpleada ? `<div class="muted">Nota del local: ${v.notasEmpleada}</div>` : ''}
    </div>
    <div class="card">
      <b>Fotos del lugar</b>
      ${fotosHtml}
      <input type="file" accept="image/*" multiple id="inputFotos" style="margin-top:8px">
      <button class="btn small" style="margin-top:8px" onclick="subirFotos('${v._id}')">Agregar fotos</button>
      <div class="err" id="fotoErr"></div>
    </div>
    ${presupuestoHtml}
    <div class="err" id="confirmErr"></div>
    ${puedeConfirmar ? `<button class="btn" onclick="confirmarVisita('${v._id}')">Confirmar obra con el cliente</button>` : ''}
    ${v.obraId ? `<p class="muted" style="text-align:center;margin-top:10px">Esta visita ya generó una obra.</p>` : ''}
  `;
}

// ---------------- FOTOS ----------------

function leerComoDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function subirFotos(visitaId){
  const input = document.getElementById('inputFotos');
  const errEl = document.getElementById('fotoErr');
  errEl.textContent = '';
  if (!input.files.length){ errEl.textContent = 'Elegí al menos una foto'; return; }
  try{
    const fotos = await Promise.all([...input.files].map(leerComoDataURL));
    await api(`/vendedor/${VENDEDOR_ID}/visitas/${visitaId}/fotos`, {method:'POST', body:{fotos}});
    mostrarDetalleVisita(visitaId);
  }catch(e){ errEl.textContent = e.message; }
}

// ---------------- ELEGIR / EDITAR PRESUPUESTO ----------------

function formularioElegirPresupuesto(visitaId){
  return `
    <p class="muted">Elegí cómo presupuestar esta visita.</p>
    <button class="btn secondary" onclick="abrirCotizador('${visitaId}')">Abrir cotizador</button>
    <div style="margin-top:8px"><button class="btn secondary" onclick="mostrarVincularCotizacion('${visitaId}')">Ya guardé la cotización, vincularla</button></div>
    <div id="vincularCotizacion"></div>
    <div class="divider">
      <button class="btn secondary" onclick="mostrarFormManual('${visitaId}')">Cargar presupuesto a mano</button>
      <div id="formManual"></div>
    </div>`;
}
function mostrarElegirPresupuesto(visitaId){
  document.getElementById('elegirPresupuesto').innerHTML = formularioElegirPresupuesto(visitaId);
}

// ---------------- ABRIR COTIZADOR ----------------

function abrirCotizador(visitaId){
  const v = VISITAS.find(x => x._id === visitaId) || {};
  const params = new URLSearchParams();
  if (STORE_ID) params.set('store_id', STORE_ID);
  if (v.cliente && v.cliente.nombre) params.set('cliente', v.cliente.nombre);
  if (v.cliente && v.cliente.direccion) params.set('direccion', v.cliente.direccion);
  window.open('/cotizador.html?' + params.toString(), '_blank');
}

async function mostrarVincularCotizacion(visitaId){
  const cont = document.getElementById('vincularCotizacion');
  if (!STORE_ID){ cont.innerHTML = '<p class="err">Falta configurar la tienda del cotizador (TIENDA_REAL_STORE_ID).</p>'; return; }
  cont.innerHTML = '<p class="muted">Buscando cotizaciones guardadas recientes…</p>';
  try{
    const res = await fetch('/api/cotizador/historial?store_id=' + encodeURIComponent(STORE_ID));
    const historial = await res.json();
    if (!res.ok) throw new Error(historial.error || 'No se pudo leer el historial del cotizador');
    cont.innerHTML = historial.slice(0, 8).map(c => `
      <div class="cotizacion-opcion">
        <b>${c.cliente || '(sin cliente)'}</b> — $${(c.total||0).toLocaleString('es-AR')}<br>
        <span class="muted">${c.tipoObraNombre||''} · ${new Date(c.fecha).toLocaleDateString('es-AR')}</span>
        <button class="btn small" style="margin-top:6px" onclick="vincularCotizacion('${visitaId}','${c._id}')">Usar esta</button>
      </div>
    `).join('') || '<p class="muted">No hay cotizaciones guardadas todavía.</p>';
  }catch(e){ cont.innerHTML = `<p class="err">${e.message}</p>`; }
}
async function vincularCotizacion(visitaId, cotizacionId){
  try{
    await api(`/vendedor/${VENDEDOR_ID}/visitas/${visitaId}/presupuesto-cotizador`, {
      method:'POST', body:{ cotizacionId, storeId: STORE_ID }
    });
    mostrarDetalleVisita(visitaId);
  }catch(e){ alert(e.message); }
}

// ---------------- PRESUPUESTO MANUAL ----------------

function filaItemManual(){
  const opciones = TIPOS_TRABAJO.map(t=>`<option value="${t.nombre}">${t.nombre}</option>`).join('');
  return `<div class="item-row" style="flex-wrap:wrap">
    <select class="itTipo" style="flex:2;min-width:120px">${opciones}</select>
    <input class="itDescripcion" placeholder="Descripción" style="flex:2;min-width:120px">
    <input class="itCantidad" type="number" step="0.01" placeholder="m²" style="flex:1;min-width:70px" oninput="actualizarTotalItem(this)">
    <input class="itValor" type="number" step="0.01" placeholder="Precio unit." style="flex:1;min-width:80px" oninput="actualizarTotalItem(this)">
    <span class="muted itTotal" style="flex:1;min-width:70px;align-self:center">Total: $0</span>
  </div>`;
}
function actualizarTotalItem(el){
  const row = el.closest('.item-row');
  const cantidad = Number(row.querySelector('.itCantidad').value) || 0;
  const valor = Number(row.querySelector('.itValor').value) || 0;
  row.querySelector('.itTotal').textContent = 'Total: $' + (cantidad*valor).toLocaleString('es-AR');
}
async function mostrarFormManual(visitaId){
  const cont = document.getElementById('formManual');
  cont.innerHTML = `
    <div id="itemsManual">${filaItemManual()}</div>
    <button class="btn small secondary" type="button" onclick="document.getElementById('itemsManual').insertAdjacentHTML('beforeend', filaItemManual())">+ Agregar producto</button>
    <div id="formasPagoManual" class="muted" style="margin-top:10px">Cargando formas de pago…</div>
    <div class="err" id="manualErr"></div>
    <button class="btn" style="margin-top:8px" onclick="guardarPresupuestoManual('${visitaId}')">Guardar presupuesto</button>
  `;
  cargarFormasPagoManual();
}
// Mismo catálogo de formas de pago que ya carga Mato para el cotizador
// (/api/cotizador/formas-pago) — así no hay que cargarlas dos veces.
async function cargarFormasPagoManual(){
  const cont = document.getElementById('formasPagoManual');
  if (!STORE_ID){ cont.innerHTML = ''; return; }
  try{
    const res = await fetch('/api/cotizador/formas-pago?store_id=' + encodeURIComponent(STORE_ID));
    const formas = await res.json();
    if (!res.ok) throw new Error(formas.error || 'No se pudieron cargar las formas de pago');
    if (!formas.length){ cont.innerHTML = ''; return; }
    cont.innerHTML = '<b class="muted">Formas de pago a mostrar en el presupuesto</b>' +
      formas.map(fp => `
        <label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:normal">
          <input type="checkbox" class="fpCheck" value='${JSON.stringify(fp).replace(/'/g,'&#39;')}'>
          ${fp.nombre}${fp.porcentaje ? ` (${fp.tipo==='recargo'?'+':'-'}${fp.porcentaje}%)` : ''}
        </label>`).join('');
  }catch(e){ cont.innerHTML = `<p class="err">${e.message}</p>`; }
}
async function guardarPresupuestoManual(visitaId){
  const items = [...document.querySelectorAll('#itemsManual .item-row')].map(row => ({
    tipoTrabajo: row.querySelector('.itTipo').value,
    descripcion: row.querySelector('.itDescripcion').value.trim(),
    cantidad: Number(row.querySelector('.itCantidad').value) || 0,
    valor: Number(row.querySelector('.itValor').value) || 0
  }));
  const formasPagoSeleccionadas = [...document.querySelectorAll('.fpCheck:checked')].map(chk => JSON.parse(chk.value));
  try{
    await api(`/vendedor/${VENDEDOR_ID}/visitas/${visitaId}/presupuesto-manual`, {method:'POST', body:{items, formasPagoSeleccionadas}});
    mostrarDetalleVisita(visitaId);
  }catch(e){ document.getElementById('manualErr').textContent = e.message; }
}

// ---------------- CONFIRMAR ----------------

async function confirmarVisita(visitaId){
  if (!confirm('¿El cliente confirmó la obra?')) return;
  try{
    await api(`/vendedor/${VENDEDOR_ID}/visitas/${visitaId}/confirmar`, {method:'POST'});
    alert('¡Obra creada! Ya queda lista para que oficina asigne colocador.');
    mostrarListaVisitas();
  }catch(e){ document.getElementById('confirmErr').textContent = e.message; }
}
</script>
