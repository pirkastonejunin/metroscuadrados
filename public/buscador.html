<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Buscar por material o textura</title>
<style>
  body { font-family: sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  .filtros { margin: 20px 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .filtro-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid #ccc;
    background: #fff; cursor: pointer; font-size: 14px;
  }
  .filtro-btn.activo { background: #222; color: #fff; border-color: #222; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px; margin-top: 20px;
  }
  .card {
    border: 1px solid #eee; border-radius: 10px; overflow: hidden;
    text-decoration: none; color: inherit; display: block;
  }
  .card img { width: 100%; height: 160px; object-fit: cover; background: #f2f2f2; }
  .card .info { padding: 10px; }
  .card .nombre { font-size: 14px; font-weight: 600; margin: 0 0 4px 0; }
  .card .material { font-size: 12px; color: #888; margin: 0 0 4px 0; }
  .card .precio { font-size: 15px; margin: 0; }
  .vacio { color: #888; margin-top: 30px; }
</style>
</head>
<body>
  <h1>Buscar por material o textura</h1>
  <div class="filtros" id="filtros"></div>
  <div class="grid" id="grid"></div>
  <p class="vacio" id="vacio" style="display:none;">No hay productos con ese material.</p>

  <script>
    var APP_URL = ''; // vacio: usa el mismo origen (esta misma app)
    var productos = [];
    var filtroActivo = null;

    function formatPrice(value) {
      if (!value) return '';
      return '$' + parseFloat(value).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderFiltros() {
      var materiales = [...new Set(productos.map(p => p.material).filter(Boolean))].sort();
      var cont = document.getElementById('filtros');
      cont.innerHTML = '';

      var btnTodos = document.createElement('button');
      btnTodos.className = 'filtro-btn' + (filtroActivo === null ? ' activo' : '');
      btnTodos.textContent = 'Todos';
      btnTodos.onclick = function () { filtroActivo = null; renderFiltros(); renderGrid(); };
      cont.appendChild(btnTodos);

      materiales.forEach(function (m) {
        var btn = document.createElement('button');
        btn.className = 'filtro-btn' + (filtroActivo === m ? ' activo' : '');
        btn.textContent = m;
        btn.onclick = function () { filtroActivo = m; renderFiltros(); renderGrid(); };
        cont.appendChild(btn);
      });
    }

    function renderGrid() {
      var lista = filtroActivo ? productos.filter(p => p.material === filtroActivo) : productos;
      var grid = document.getElementById('grid');
      var vacio = document.getElementById('vacio');
      grid.innerHTML = '';

      if (!lista.length) {
        vacio.style.display = 'block';
        return;
      }
      vacio.style.display = 'none';

      lista.forEach(function (p) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = p.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML =
          '<img src="' + (p.imagen || '') + '" alt="' + p.nombre + '" onerror="this.style.display=\'none\'" />' +
          '<div class="info">' +
          '<p class="nombre">' + p.nombre + '</p>' +
          (p.material ? '<p class="material">' + p.material + '</p>' : '') +
          '<p class="precio">' + formatPrice(p.precio) + '</p>' +
          '</div>';
        grid.appendChild(a);
      });
    }

    fetch(APP_URL + '/public/catalogo')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        productos = data.productos || [];
        renderFiltros();
        renderGrid();
      });
  </script>
</body>
</html>
