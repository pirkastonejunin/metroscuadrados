<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<script src="/impuestos-ui.js"></script>
<script src="/factura-ia-ui.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --warn:#b7791f; --warn-soft:#fdf3d9;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.anulada{background:var(--danger-soft);color:var(--danger);}
  .pill.inactivo{background:var(--bg);color:var(--muted);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:500;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:860px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin:14px 0 10px;}
  .fila-item{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .fila-item .campo-concepto{flex:2;min-width:0;}
  .fila-item .campo-cant{flex:1;min-width:0;}
  .fila-item .campo-precio{flex:1;min-width:0;}
  .fila-item .campo-iva{flex:1;min-width:0;}
  .fila-item .campo-subtotal{flex:1;min-width:0;text-align:right;font-weight:700;padding-top:8px;}
  .fila-item .btn-quitar{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--danger);border-radius:8px;width:36px;height:36px;font-size:15px;font-weight:700;cursor:pointer;}
  .totales-box{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;}
  .totales-box .fila-total{display:flex;justify-content:space-between;padding:2px 0;}
  .totales-box .fila-total.grande{font-size:16px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  .detalle-pago{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14;
      --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14;
    --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Gastos</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Gastos. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Gastos</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:180px">
            <label>Proveedor</label>
            <select id="fcProveedor" onchange="cargarGastos()"><option value="">Todos</option></select>
          </div>
          <div style="min-width:150px">
            <label>Estado</label>
            <select id="fcEstado" onchange="cargarGastos()">
              <option value="">Todos</option>
              <option value="activo">Activo</option>
              <option value="anulada">Anulado</option>
            </select>
          </div>
          <div style="min-width:140px">
            <label>Desde</label>
            <input id="fcDesde" type="date" onchange="cargarGastos()">
          </div>
          <div style="min-width:140px">
            <label>Hasta</label>
            <input id="fcHasta" type="date" onchange="cargarGastos()">
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" onclick="descargarBlob(BASE + '/export', 'gastos.xlsx')">Exportar</button>
          <button class="btn secondary" onclick="abrirImportarDux()">Importar de Dux</button>
            <button class="btn" onclick="abrirNuevoGasto()">+ Nuevo gasto</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Nº</th><th>Fecha</th><th>Proveedor</th><th>Comprobante</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
        <tbody id="gastosBody"><tr><td colspan="9" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/gastos';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }
function fechaHora(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('es-AR'); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

// Comprobante fiscal (4/10/2026, pedido de Mato: numeración real +
// IVA discriminado, para después poder armar el Libro IVA Compras).
const TIPO_COMPROBANTE_LABEL = {
  factura_a: 'Factura A', factura_b: 'Factura B', factura_c: 'Factura C', factura_m: 'Factura M',
  nota_credito_a: 'Nota de Crédito A', nota_credito_b: 'Nota de Crédito B', nota_credito_c: 'Nota de Crédito C', nota_credito_m: 'Nota de Crédito M',
  nota_debito_a: 'Nota de Débito A', nota_debito_b: 'Nota de Débito B', nota_debito_c: 'Nota de Débito C', nota_debito_m: 'Nota de Débito M',
  recibo: 'Recibo', ticket: 'Ticket', otro: 'Otro (no fiscal)'
};
const ALICUOTAS_IVA_VALIDAS = [21, 10.5, 27, 5, 2.5, 0];
function opcionesTipoComprobante(seleccionado){
  return Object.keys(TIPO_COMPROBANTE_LABEL).map(k =>
    `<option value="${k}" ${k===seleccionado?'selected':''}>${TIPO_COMPROBANTE_LABEL[k]}</option>`
  ).join('');
}
function opcionesAlicuotaIva(seleccionado){
  return ALICUOTAS_IVA_VALIDAS.map(a =>
    `<option value="${a}" ${String(a)===String(seleccionado)?'selected':''}>${a === 0 ? 'Exento / no gravado' : a + '%'}</option>`
  ).join('');
}

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('gastos'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'gastos', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarListasBase();
  await ImpuestosUI.cargarTipos(BASE, headersAuth);
  await cargarGastos();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// -------------------------------------------------------------------
// Proveedores y conceptos de gasto — se cargan una sola vez al entrar
// -------------------------------------------------------------------
let proveedoresCache = [];
let conceptosCache = [];
// Tesorería: cajas/bancos habilitados para este usuario+sucursal, para
// elegir de dónde sale un pago (o qué banco propio emite un cheque).
let cajasTesoreriaCache = [];
let bancosTesoreriaCache = [];
async function cargarListasBase(){
  const [rp2, rc, rcj, rbc] = await Promise.all([
    fetch(BASE + '/proveedores', {headers: headersAuth()}),
    fetch(BASE + '/conceptos', {headers: headersAuth()}),
    fetch('/api/tesoreria/cajas', {headers: headersAuth()}),
    fetch('/api/tesoreria/bancos', {headers: headersAuth()})
  ]);
  proveedoresCache = rp2.ok ? await rp2.json() : [];
  conceptosCache = rc.ok ? await rc.json() : [];
  // Si el usuario no tiene el módulo Tesorería habilitado esto da 403 —
  // no es una falla real, simplemente no va a poder elegir cuenta al pagar.
  cajasTesoreriaCache = rcj.ok ? await rcj.json() : [];
  bancosTesoreriaCache = rbc.ok ? await rbc.json() : [];
  document.getElementById('fcProveedor').innerHTML = '<option value="">Todos</option>' +
    proveedoresCache.map(p => `<option value="${p._id}">${escapeHtml(p.razonSocial || p.nombreFantasia || '(sin nombre)')}</option>`).join('');
}

// -------------------------------------------------------------------
// Listado de gastos
// -------------------------------------------------------------------
const ESTADO_LABEL = { activo: 'Activo', anulada: 'Anulado' };
let gastosCache = [];

async function cargarGastos(){
  const params = new URLSearchParams();
  if (document.getElementById('fcProveedor').value) params.set('proveedorId', document.getElementById('fcProveedor').value);
  if (document.getElementById('fcEstado').value) params.set('estado', document.getElementById('fcEstado').value);
  if (document.getElementById('fcDesde').value) params.set('desde', document.getElementById('fcDesde').value);
  if (document.getElementById('fcHasta').value) params.set('hasta', document.getElementById('fcHasta').value);
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('gastosBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="9" class="err">No se pudo cargar.</td></tr>'; return; }
  gastosCache = await r.json();
  if (!gastosCache.length) { body.innerHTML = '<tr><td colspan="9" class="muted">No hay gastos cargados todavía.</td></tr>'; return; }
  body.innerHTML = gastosCache.map(g => `
    <tr>
      <td><strong>${nroImportado(g)}</strong></td>
      <td class="muted">${fechaCorta(g.fecha)}</td>
      <td>${escapeHtml(g.proveedorNombre)}</td>
      <td class="muted">${escapeHtml(g.comprobanteNumero||'—')}</td>
      <td>${money(g.total)}</td>
      <td class="muted">${money(g.totalPagado)}</td>
      <td>${g.saldoPendiente > 0 ? money(g.saldoPendiente) : '<span class="muted">—</span>'}</td>
      <td><span class="pill ${g.estado}">${ESTADO_LABEL[g.estado]||g.estado}</span></td>
      <td><button class="btn small secondary" onclick="verDetalle('${g._id}')">Ver</button></td>
    </tr>
  `).join('');
}

// -------------------------------------------------------------------
// Nuevo gasto
// -------------------------------------------------------------------
function opcionesProveedoresSelect(seleccionado){
  return '<option value="">Elegí un proveedor…</option>' + proveedoresCache.map(p =>
    `<option value="${p._id}" ${p._id===seleccionado?'selected':''}>${escapeHtml(p.razonSocial || p.nombreFantasia || '(sin nombre)')}</option>`
  ).join('');
}
// Incluye siempre la opción "+ Nuevo concepto…" al final — alta rápida
// desde la propia pantalla (pedido de Mato: "en caso de que no esté que
// se pueda cargar de la misma pantalla").
function opcionesConceptosGasto(seleccionado){
  return '<option value="">Elegí un concepto…</option>' + conceptosCache.map(c =>
    `<option value="${c._id}" ${c._id===seleccionado?'selected':''}>${escapeHtml(c.nombre)}</option>`
  ).join('') + '<option value="__nuevo__">+ Nuevo concepto…</option>';
}

async function manejarSelectConcepto(select){
  if (select.value !== '__nuevo__') return;
  const nombre = (prompt('Nombre del nuevo concepto de gasto (ej: Alquiler, Honorarios, Luz):') || '').trim();
  if (!nombre) { select.value = ''; return; }
  try{
    const r = await fetch(BASE + '/conceptos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({nombre})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al crear el concepto');
    if (!conceptosCache.some(c => c._id === data._id)) {
      conceptosCache.push(data);
      conceptosCache.sort((a,b) => a.nombre.localeCompare(b.nombre));
    }
    // Reconstruye TODOS los selects de concepto abiertos para que el
    // nuevo aparezca en todas las filas, y deja seleccionado el nuevo
    // en el que lo disparó.
    document.querySelectorAll('#ngFilasItems select.select-concepto').forEach(s => {
      const actual = s.value === '__nuevo__' ? '' : s.value;
      s.innerHTML = opcionesConceptosGasto(s === select ? data._id : actual);
    });
  }catch(e){
    alert(e.message);
    select.value = '';
  }
}

function abrirNuevoGasto(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal wide">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Nuevo gasto</h2>
        ${FacturaIAUI.cajaHtml('ng', 'Sacá una foto o subí un PDF u otro archivo de la factura (luz, gas, teléfono, honorarios, etc.): la IA lee los datos y completa el formulario. Revisá todo antes de guardar.')}
        <div class="grid3">
          <div><label>Proveedor *</label><select id="ngProveedor" onchange="actualizarCondicionPago()">${opcionesProveedoresSelect()}</select></div>
          <div><label>Condición de pago</label><input id="ngCondicionPago" placeholder="Se autocompleta del proveedor"></div>
          <div><label>Fecha</label><input id="ngFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <div class="grid3" style="margin-top:10px">
          <div><label>Moneda</label><select id="ngMoneda"><option value="ARS">Pesos (ARS)</option><option value="USD">Dólares (USD)</option></select></div>
          <div></div>
          <div></div>
        </div>

        <div class="section-title">Comprobante</div>
        <div class="grid3">
          <div><label>Tipo de comprobante *</label><select id="ngTipoComprobante">${opcionesTipoComprobante('factura_a')}</select></div>
          <div><label>Punto de venta *</label><input id="ngPuntoVenta" placeholder="Ej: 0007"></div>
          <div><label>Número *</label><input id="ngComprobanteNumero" placeholder="Ej: 00001234"></div>
        </div>

        <div class="section-title">Conceptos</div>
        <div id="ngFilasItems"></div>

function juntarItemsGasto(){
  const filas = document.querySelectorAll('#ngFilasItems .fila-item');
  const items = [];
  filas.forEach(fila => {
    const select = fila.querySelector('select.select-concepto');
    const cantidad = Number(fila.querySelector('.campo-cant input').value);
    const precioUnitario = Number(fila.querySelector('.campo-precio input').value);
    const alicuotaIva = Number(fila.querySelector('select.select-iva').value);
    if (select.value && select.value !== '__nuevo__' && cantidad > 0) items.push({ conceptoId: select.value, cantidad, precioUnitario, alicuotaIva });
  });
  return items;
}

// Desglosa el IVA por alícuota (cada concepto puede tener la suya —
// 4/10/2026, pedido de Mato: "el tema del iva debe ir por articulo no
// por factura") y lo muestra debajo de los conceptos.
function actualizarTotalesGasto(){
  const filas = document.querySelectorAll('#ngFilasItems .fila-item');
  let subtotal = 0;
  const porAlicuota = {};
  let importeExento = 0;
  filas.forEach(fila => {
    const cantidad = Number(fila.querySelector('.campo-cant input').value) || 0;
    const precioUnitario = Number(fila.querySelector('.campo-precio input').value) || 0;
    const alicuota = Number(fila.querySelector('select.select-iva').value) || 0;
    const sub = cantidad * precioUnitario;
    subtotal += sub;
    fila.querySelector('.subtotal-valor').textContent = money(sub);
    if (alicuota === 0) { importeExento += sub; }
    else {
      if (!porAlicuota[alicuota]) porAlicuota[alicuota] = { neto: 0, iva: 0 };
      porAlicuota[alicuota].neto += sub;
      porAlicuota[alicuota].iva += Math.round(sub * alicuota) / 100;
    }
  });
  const lineasIva = Object.keys(porAlicuota).sort((a,b) => b-a).map(al =>
    `${al}%: neto ${money(porAlicuota[al].neto)} + IVA ${money(porAlicuota[al].iva)}`
  );
  if (importeExento > 0) lineasIva.push(`Exento: ${money(importeExento)}`);
  const totalIva = Object.values(porAlicuota).reduce((a,x) => a + x.iva, 0);
  const totalComprobante = subtotal + totalIva;
  document.getElementById('ngComprobanteTotales').innerHTML = lineasIva.length
    ? lineasIva.join(' — ') + ` — <strong>Total comprobante: ${money(totalComprobante)}</strong>`
    : '';
  const descPorc = Number(document.getElementById('ngDescuentoPorcentaje').value) || 0;
  const descMonto = Number(document.getElementById('ngDescuentoMonto').value) || 0;
  // 5/10/2026: el Total incluye el IVA de cada concepto (igual que Compras
  // y que lo que se guarda) más los impuestos adicionales: percepciones,
  // crédito/débito y otros.
  let total = subtotal + totalIva;
  if (descPorc) total -= total * (descPorc / 100);
  if (descMonto) total -= descMonto;
  total = Math.max(0, total);
  const impLineas = ImpuestosUI.lineasResumen('impNG');
  total += impLineas.reduce((a, l) => a + l.monto, 0);
  const totalFactura = window._iaTotalFactura || 0;
  const difFactura = Math.abs(Math.round(total * 100) / 100 - Math.round(totalFactura * 100) / 100);
  document.getElementById('ngTotales').innerHTML = `
    <div class="fila-total"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    ${totalIva ? `<div class="fila-total"><span>IVA</span><span>${money(totalIva)}</span></div>` : ''}
    ${impLineas.map(l => `<div class="fila-total"><span>${escapeHtml(l.etiqueta)}</span><span>${money(l.monto)}</span></div>`).join('')}
    <div class="fila-total grande"><span>Total</span><span>${money(total)}</span></div>
    ${totalFactura > 0 ? `<div class="fila-total" style="${difFactura > 1 ? 'color:var(--danger);font-weight:700' : 'opacity:.7'}"><span>Total de la factura (leído por la IA)</span><span>${money(totalFactura)}${difFactura > 1 ? ' — diferencia ' + money(difFactura) : ' ✓'}</span></div>` : ''}
  `;
}

// -------------------------------------------------------------------
// Cargar la factura con IA (5/10/2026, pedido de Mato) — foto, PDF u otro
// archivo → el servidor lee la factura (facturaIA.js) y acá se completa el
// formulario. Proveedor que no existe: se ofrece crearlo. Conceptos que no
// coinciden con los del catálogo: se PREGUNTA (usar uno existente, crear
// uno nuevo u omitir); no se puede guardar mientras haya ítems sin resolver.
// -------------------------------------------------------------------
let iaSeq = 0;
function iaSetearValor(id, valor){
  const el = document.getElementById(id);
  if (el && valor !== undefined && valor !== null && valor !== '') el.value = valor;
}
function iaPend(id){ return (window._iaItemsPendientes || []).find(x => x._iaId === id); }
function iaQuitarPend(id){
  window._iaItemsPendientes = (window._iaItemsPendientes || []).filter(x => x._iaId !== id);
  iaRenderPendientes();
  actualizarTotalesGasto();
}
function iaAsegurarConcepto(c){
  if (!conceptosCache.some(x => String(x._id) === String(c._id))) {
    conceptosCache.push({ _id: c._id, nombre: c.nombre });
    conceptosCache.sort((a,b) => a.nombre.localeCompare(b.nombre));
  }
  document.querySelectorAll('#ngFilasItems select.select-concepto').forEach(s => {
    const actual = s.value === '__nuevo__' ? '' : s.value;
    s.innerHTML = opcionesConceptosGasto(actual);
  });
}

async function aplicarFacturaLeida(d){
  document.getElementById('ngFiaRevision').innerHTML = '<div id="ngIaProveedor"></div><div id="ngIaItems"></div>';
  const c = d.comprobante || {};
  if (c.tipoComprobante) iaSetearValor('ngTipoComprobante', c.tipoComprobante);
  iaSetearValor('ngPuntoVenta', c.puntoVenta);
  iaSetearValor('ngComprobanteNumero', c.comprobanteNumero);
  iaSetearValor('ngFecha', c.fecha);
  iaSetearValor('ngMoneda', c.moneda);
  window._iaTotalFactura = (d.totales && d.totales.total) || 0;
  iaRenderProveedor(d);

  document.getElementById('ngFilasItems').innerHTML = '';
  window._iaItemsPendientes = [];
  for (const it of (d.items || [])) {
    if (it.concepto) iaAgregarFilaConConcepto(it, it.concepto);
    else { it._iaId = ++iaSeq; window._iaItemsPendientes.push(it); }
  }
  if (!document.querySelector('#ngFilasItems .fila-item') && !window._iaItemsPendientes.length) agregarFilaGasto();
  iaRenderPendientes();

  ImpuestosUI.cargar('impNG', d.impuestos);
  const avisos = (d.avisos || []).slice();
  if (d.duplicado) avisos.unshift('Esta factura ya está cargada para ese proveedor (gasto #' + d.duplicado.numero + '). Si la guardás de nuevo, el sistema la va a rechazar.');
  FacturaIAUI.avisos('ng', avisos);
  actualizarTotalesGasto();
}

function iaRenderProveedor(d){
  const cont = document.getElementById('ngIaProveedor');
  const sel = document.getElementById('ngProveedor');
  const co = d.proveedorCoincidencia;
  if (co) {
    if (!proveedoresCache.some(p => String(p._id) === String(co._id))) proveedoresCache.push({ _id: co._id, razonSocial: co.razonSocial, condicionPago: co.condicionPago || '' });
    sel.innerHTML = opcionesProveedoresSelect(String(co._id));
    sel.value = String(co._id);
    actualizarCondicionPago();
    cont.innerHTML = `<div class="muted" style="margin-top:8px">Proveedor reconocido: <strong>${escapeHtml(co.razonSocial)}</strong> (${co.criterio === 'cuit' ? 'por CUIT' : 'por nombre'}).</div>`;
    return;
  }
  const p = d.proveedor || {};
  window._iaProvDomicilio = p.domicilio || '';
  sel.value = '';
  cont.innerHTML = `
    <div class="fia-item">
      <h4>⚠ Proveedor nuevo: todavía no está cargado</h4>
      <div class="grid2">
        <div><label>Razón social *</label><input id="iaProvNombre" value="${escapeHtml(p.razonSocial || '')}"></div>
        <div><label>CUIT</label><input id="iaProvCuit" value="${escapeHtml(p.cuit || '')}"></div>
      </div>
      <div class="fia-acciones"><button class="btn small" onclick="iaCrearProveedor()">Crear proveedor y usarlo</button><span class="muted">O elegí uno existente en "Proveedor".</span></div>
      <div class="err" id="iaProvErr"></div>
    </div>`;
}

async function iaCrearProveedor(){
  const razonSocial = document.getElementById('iaProvNombre').value.trim();
  const cuit = document.getElementById('iaProvCuit').value.trim();
  const errEl = document.getElementById('iaProvErr');
  errEl.textContent = '';
  if (!razonSocial) { errEl.textContent = 'Falta la razón social'; return; }
  try{
    const r = await fetch(BASE + '/proveedor-rapido', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({ razonSocial, cuit, domicilio: window._iaProvDomicilio || '' })});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'No se pudo crear el proveedor');
    proveedoresCache.push(data);
    const sel = document.getElementById('ngProveedor');
    sel.innerHTML = opcionesProveedoresSelect(String(data._id));
    sel.value = String(data._id);
    actualizarCondicionPago();
    document.getElementById('ngIaProveedor').innerHTML = `<div class="muted" style="margin-top:8px">Proveedor creado y elegido: <strong>${escapeHtml(data.razonSocial)}</strong>.</div>`;
  }catch(e){ errEl.textContent = e.message; }
}

function iaAgregarFilaConConcepto(it, concepto){
  iaAsegurarConcepto(concepto);
  agregarFilaGasto();
  const filas = document.querySelectorAll('#ngFilasItems .fila-item');
  const fila = filas[filas.length - 1];
  fila.querySelector('select.select-concepto').value = String(concepto._id);
  fila.querySelector('.campo-cant input').value = it.cantidad;
  fila.querySelector('.campo-precio input').value = it.precioUnitario;
  fila.querySelector('select.select-iva').value = String(it.alicuotaIva);
  actualizarTotalesGasto();
}

function iaRenderPendientes(){
  const cont = document.getElementById('ngIaItems');
  if (!cont) return;
  const pend = window._iaItemsPendientes || [];
  if (!pend.length) { cont.innerHTML = ''; return; }
  const opcionesConceptos = '<option value="">Elegí un concepto existente…</option>' + conceptosCache.map(c => `<option value="${c._id}">${escapeHtml(c.nombre)}</option>`).join('');
  cont.innerHTML = `<div style="margin-top:10px;font-size:13px"><strong>${pend.length} línea(s) de la factura no coinciden con tus conceptos de gasto.</strong> Elegí qué hacer con cada una:</div>` + pend.map(it => `
    <div class="fia-item" id="iaPend${it._iaId}">
      <h4>${escapeHtml(it.descripcion)}</h4>
      <div class="muted">${it.cantidad} × ${money(it.precioUnitario)} — IVA ${it.alicuotaIva}%</div>
      ${(it.candidatos || []).length ? `<div class="muted" style="margin-top:6px">¿Será alguno de estos?</div><div class="fia-sug">${it.candidatos.map(c => `<button class="btn small secondary" onclick="iaUsarConcepto(${it._iaId}, '${c._id}')">${escapeHtml(c.nombre)}</button>`).join('')}</div>` : ''}
      <div class="grid2" style="margin-top:6px">
        <select id="iaSel${it._iaId}">${opcionesConceptos}</select>
        <button class="btn small secondary" onclick="iaUsarConcepto(${it._iaId}, document.getElementById('iaSel${it._iaId}').value)">Usar este concepto</button>
      </div>
      <div class="fia-acciones">
        <button class="btn small" onclick="iaCrearConcepto(${it._iaId})">Crear concepto «${escapeHtml(it.descripcion.length > 40 ? it.descripcion.slice(0, 40) + '…' : it.descripcion)}»</button>
        <button class="btn small secondary" onclick="iaQuitarPend(${it._iaId})">No cargar este ítem</button>
      </div>
      <div class="err" id="iaPendErr${it._iaId}"></div>
    </div>`).join('');
}

function iaUsarConcepto(id, conceptoId){
  const it = iaPend(id);
  if (!it) return;
  const concepto = conceptosCache.find(c => String(c._id) === String(conceptoId));
  if (!concepto) { const el = document.getElementById('iaPendErr' + id); if (el) el.textContent = 'Elegí un concepto de la lista'; return; }
  iaAgregarFilaConConcepto(it, concepto);
  iaQuitarPend(id);
}

async function iaCrearConcepto(id){
  const it = iaPend(id);
  if (!it) return;
  const errEl = document.getElementById('iaPendErr' + id);
  errEl.textContent = '';
  try{
    const r = await fetch(BASE + '/conceptos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({ nombre: it.descripcion })});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al crear el concepto');
    iaAgregarFilaConConcepto(it, data);
    iaQuitarPend(id);
  }catch(e){ errEl.textContent = e.message; }
}

async function guardarNuevoGasto(){
  const items = juntarItemsGasto();
  const body = {
    proveedorId: document.getElementById('ngProveedor').value,
    condicionPago: document.getElementById('ngCondicionPago').value.trim(),
    fecha: document.getElementById('ngFecha').value,
    moneda: document.getElementById('ngMoneda').value,
    items,
    descuentoPorcentaje: Number(document.getElementById('ngDescuentoPorcentaje').value) || 0,
    descuentoMonto: Number(document.getElementById('ngDescuentoMonto').value) || 0,
    observaciones: document.getElementById('ngObservaciones').value.trim(),
    tipoComprobante: document.getElementById('ngTipoComprobante').value,
    puntoVenta: document.getElementById('ngPuntoVenta').value.trim(),
    comprobanteNumero: document.getElementById('ngComprobanteNumero').value.trim(),
  };
  Object.assign(body, ImpuestosUI.leer('impNG'));
  document.getElementById('ngErrNueva').textContent = '';
  if (!body.proveedorId) { document.getElementById('ngErrNueva').textContent = 'Elegí un proveedor'; return; }
  if (!items.length) { document.getElementById('ngErrNueva').textContent = 'Agregá al menos un concepto'; return; }
  const pendientesIA = (window._iaItemsPendientes || []).length;
  if (pendientesIA) { document.getElementById('ngErrNueva').textContent = 'Todavía hay ' + pendientesIA + ' ítem(s) de la factura sin resolver (están arriba): elegí un concepto, creá uno nuevo o elegí "No cargar este ítem".'; return; }
  if (!body.puntoVenta) { document.getElementById('ngErrNueva').textContent = 'Falta el punto de venta del comprobante'; return; }
  if (!body.comprobanteNumero) { document.getElementById('ngErrNueva').textContent = 'Falta el número del comprobante'; return; }
  try{
    const r = await fetch(BASE, {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al guardar');
    cerrarModal();
    await cargarGastos();
  }catch(e){
    document.getElementById('ngErrNueva').textContent = e.message;
  }
}

const TIPO_VALOR_LABEL = { efectivo: 'Efectivo', cheque: 'Cheque', cuenta: 'Cuenta', tarjeta: 'Tarjeta' };

// Tesorería: efectivo/cuenta/tarjeta tienen que decir de qué caja o
// banco sale; cheque pide los datos del cheque propio que se emite
// (entra "emitido", no mueve plata hasta que se confirme el pago).
// Mismo criterio que Compras: efectivo SOLO puede salir de una caja;
// cuenta (transferencia) y tarjeta solo pueden salir de un banco.
function opcionesCuentaPago(tipoValor){
  if (tipoValor === 'efectivo') {
    return cajasTesoreriaCache.map(c => `<option value="caja:${c._id}">${escapeHtml(c.nombre)} (${escapeHtml(c.moneda)}, saldo ${money(c.saldo)})</option>`).join('')
      || '<option value="">No tenés ninguna caja habilitada — pedile a un administrador que te habilite una desde Configuración</option>';
  }
  return bancosTesoreriaCache.map(b => `<option value="banco:${b._id}">${escapeHtml(b.nombre)} (saldo ${money(b.saldo)})</option>`).join('')
    || '<option value="">No tenés ningún banco habilitado — pedile a un administrador que te habilite uno desde Configuración</option>';
}
function opcionesBancoPropioCheque(seleccionado){
  return bancosTesoreriaCache.map(b => `<option value="${b._id}" ${String(b._id)===seleccionado?'selected':''}>${escapeHtml(b.nombre)}</option>`).join('')
    || '<option value="">No tenés ningún banco propio habilitado</option>';
}
function actualizarTipoValorPago(){
  const tipoValor = document.getElementById('npTipoValor').value;
  const esCheque = tipoValor === 'cheque';
  const esTarjeta = tipoValor === 'tarjeta';
  document.getElementById('npCuentaWrap').classList.toggle('hidden', esCheque);
  document.getElementById('npChequeWrap').classList.toggle('hidden', !esCheque);
  document.getElementById('npTarjetaWrap').classList.toggle('hidden', !esTarjeta);
  if (!esCheque) {
    document.getElementById('npCuentaLabel').textContent = tipoValor === 'efectivo' ? '¿De qué caja sale? *' : '¿De qué banco sale? *';
    document.getElementById('npCuenta').innerHTML = opcionesCuentaPago(tipoValor);
  }
}
function abrirPago(id){
  const g = gastosCache.find(x => x._id === id);
  if (!g) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Registrar pago — gasto #${g.numero}</h2>
        <p class="muted">Saldo pendiente: ${money(g.saldoPendiente)}</p>
        <div class="grid2">
          <div><label>Tipo de valor *</label><select id="npTipoValor" onchange="actualizarTipoValorPago()"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option><option value="cuenta">Cuenta (transferencia)</option><option value="tarjeta">Tarjeta</option></select></div>
          <div><label>Monto *</label><input id="npMonto" type="number" min="0.01" step="0.01" value="${g.saldoPendiente}"></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div id="npCuentaWrap"><label id="npCuentaLabel">¿De qué caja sale? *</label><select id="npCuenta">${opcionesCuentaPago('efectivo')}</select></div>
          <div><label>Fecha *</label><input id="npFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <div id="npChequeWrap" class="hidden" style="margin-top:10px">
          <div class="grid2">
            <div><label>Número de cheque *</label><input id="npChequeNumero"></div>
            <div><label>Banco propio *</label><select id="npChequeCuenta">${opcionesBancoPropioCheque()}</select></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Fecha de emisión</label><input id="npChequeFechaEmision" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
            <div><label>Vencimiento *</label><input id="npChequeVencimiento" type="date"></div>
          </div>
        </div>
        <div id="npTarjetaWrap" class="hidden" style="margin-top:10px">
          <div class="grid2">
            <div><label>Entidad/tarjeta</label><input id="npTarjetaEntidad" placeholder="Ej: Visa, Mastercard"></div>
            <div><label>Tipo</label><select id="npTarjetaTipo"><option value="credito">Crédito</option><option value="debito">Débito</option></select></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Cuotas</label><input id="npTarjetaCuotas" type="number" min="1" step="1" value="1"></div>
            <div><label>Lote *</label><input id="npTarjetaLote"></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Cupón *</label><input id="npTarjetaCupon"></div>
            <div><label>Código de autorización</label><input id="npTarjetaCodigoAutorizacion" placeholder="Opcional"></div>
          </div>
        </div>
        <div style="margin-top:10px"><label>Nota</label><input id="npNota" placeholder="Opcional"></div>
        <div class="err" id="npErr"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarPago('${id}')">Registrar</button>
      </div>
    </div>
  `;
}

async function confirmarPago(id){
  const tipoValor = document.getElementById('npTipoValor').value;
  const body = {
    tipoValor,
    monto: Number(document.getElementById('npMonto').value),
    fecha: document.getElementById('npFecha').value,
    nota: document.getElementById('npNota').value.trim()
  };
  if (!body.monto || body.monto <= 0) { document.getElementById('npErr').textContent = 'El monto tiene que ser mayor a 0'; return; }
  if (tipoValor === 'cheque') {
    body.chequeNumero = document.getElementById('npChequeNumero').value.trim();
    body.chequeCuentaId = document.getElementById('npChequeCuenta').value;
    body.chequeFechaEmision = document.getElementById('npChequeFechaEmision').value;
    body.chequeFechaVencimiento = document.getElementById('npChequeVencimiento').value;
    if (!body.chequeNumero) { document.getElementById('npErr').textContent = 'Falta el número de cheque'; return; }
    if (!body.chequeCuentaId) { document.getElementById('npErr').textContent = 'Elegí de qué banco propio sale el cheque'; return; }
    if (!body.chequeFechaVencimiento) { document.getElementById('npErr').textContent = 'Falta la fecha de vencimiento del cheque'; return; }
  } else {
    const cuenta = document.getElementById('npCuenta').value;
    if (!cuenta) { document.getElementById('npErr').textContent = tipoValor === 'efectivo' ? 'Elegí de qué caja sale el pago' : 'Elegí de qué banco sale el pago'; return; }
    const [cuentaTipo, cuentaId] = cuenta.split(':');
    body.cuentaTipo = cuentaTipo;
    body.cuentaId = cuentaId;
    if (tipoValor === 'tarjeta') {
      body.tarjetaEntidad = document.getElementById('npTarjetaEntidad').value.trim();
      body.tarjetaTipo = document.getElementById('npTarjetaTipo').value;
      body.tarjetaCuotas = Number(document.getElementById('npTarjetaCuotas').value) || 1;
      body.tarjetaLote = document.getElementById('npTarjetaLote').value.trim();
      body.tarjetaCupon = document.getElementById('npTarjetaCupon').value.trim();
      body.tarjetaCodigoAutorizacion = document.getElementById('npTarjetaCodigoAutorizacion').value.trim();
      if (!body.tarjetaLote) { document.getElementById('npErr').textContent = 'Falta el número de lote'; return; }
      if (!body.tarjetaCupon) { document.getElementById('npErr').textContent = 'Falta el número de cupón'; return; }
    }
  }
  try{
    const r = await fetch(BASE + '/' + id + '/pagos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarGastos();
    verDetalle(id);
  }catch(e){
    document.getElementById('npErr').textContent = e.message;
  }
}

async function anularGasto(id){
  const g = gastosCache.find(x => x._id === id);
  const motivo = prompt('¿Por qué se anula este gasto? (opcional)') || '';
  if (motivo === null) return;
  if (!confirm(`¿Anular el gasto #${g.numero}?`)) return;
  try{
    const r = await fetch(BASE + '/' + id + '/anular', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({motivo})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarGastos();
    verDetalle(id);
  }catch(e){
    alert(e.message);
  }
}

// Export en Excel (.xlsx) — ver importExport.js en el backend. Solo
// export: un gasto se genera operativamente, no se carga masiva.
async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
</script>

<script>
// Importar historial de gastos de Dux (9/10/2026)
let impDuxB64 = null;
function nroImportado(x){ return x.numeroOriginal ? escapeHtml(x.numeroOriginal) + ' <span class="muted" style="font-size:11px" title="Histórico importado de Dux">Dux</span>' : '#' + x.numero; }
function abrirImportarDux(){
  impDuxB64 = null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar historial de gastos de Dux</h2>
        <p class="muted">Subí el archivo "Listado de Comprobantes de Servicios" de Dux (.xls o .xlsx). Se carga como historial: sin movimientos de stock ni de caja/banco. Lo pagado y el saldo se toman de Dux. Si lo subís dos veces, no duplica.</p>
        <input type="file" id="impDuxArchivo" accept=".xls,.xlsx" onchange="previewImportDux()">
        <div class="err" id="impDuxErr"></div>
        <div id="impDuxResumen"></div>
        <button class="btn" id="impDuxBtn" style="margin-top:10px;display:none" onclick="aplicarImportDux()">Importar</button>
      </div>
    </div>`;
}
function leerB64(file){ return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); }); }
async function previewImportDux(){
  const file = document.getElementById('impDuxArchivo').files[0];
  const errEl = document.getElementById('impDuxErr'); errEl.textContent = '';
  document.getElementById('impDuxResumen').innerHTML = ''; document.getElementById('impDuxBtn').style.display = 'none';
  if (!file) return;
  document.getElementById('impDuxResumen').innerHTML = '<p class="muted">Analizando…</p>';
  try{
    impDuxB64 = await leerB64(file);
    const r = await fetch('/api/compras-import-dux/gastos/preview', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: impDuxB64})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error al analizar');
    const f = x => x ? new Date(x).toLocaleDateString('es-AR', {timeZone:'UTC'}) : '-';
    const m = n => '$' + Number(n).toLocaleString('es-AR', {maximumFractionDigits:0});
    document.getElementById('impDuxResumen').innerHTML = `
      <ul style="line-height:1.7;padding-left:18px">
        <li><b>${d.aImportar}</b> gastos para importar de ${d.filasLeidas} leídos (${d.yaImportadas} ya estaban cargados)</li>
        <li>Período: ${f(d.desde)} a ${f(d.hasta)} — Total: <b>${m(d.totalImporte)}</b></li>
        <li>Con saldo pendiente: ${d.conSaldo} por <b>${m(d.totalSaldo)}</b>${d.anuladas ? ' — ' + d.anuladas + ' anuladas en Dux' : ''}</li>
        <li>Se cargan en la sucursal activa: <b>${escapeHtml(d.sucursalDestino || '-')}</b></li>
        <li>Proveedores: ${d.proveedoresExistentes} ya existen, <b>${d.proveedoresNuevos}</b> se van a crear${d.proveedoresAmbiguos ? ', ' + d.proveedoresAmbiguos + ' coinciden con más de uno (quedan sin vincular)' : ''}</li>
        ${d.conceptosNuevos ? '<li>Conceptos de gasto nuevos a crear: <b>' + d.conceptosNuevos + '</b></li>' : ''}
      </ul>
      ${d.errores.length ? '<p class="err">' + d.errores.length + ' fila(s) con error (se saltean):</p><ul class="muted">' + d.errores.slice(0,10).map(e => '<li>Fila ' + e.fila + ': ' + escapeHtml(e.motivo) + '</li>').join('') + '</ul>' : ''}`;
    if (d.aImportar > 0) document.getElementById('impDuxBtn').style.display = '';
  }catch(e){ errEl.textContent = e.message; document.getElementById('impDuxResumen').innerHTML = ''; }
}
async function aplicarImportDux(){
  const btn = document.getElementById('impDuxBtn'); const errEl = document.getElementById('impDuxErr');
  if (btn.disabled || !impDuxB64) return;
  btn.disabled = true; btn.textContent = 'Importando…'; errEl.textContent = '';
  try{
    const r = await fetch('/api/compras-import-dux/gastos/aplicar', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: impDuxB64})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error al importar');
    document.getElementById('impDuxResumen').innerHTML = `<p class="ok-msg">Listo: ${d.insertadas} gastos importados${d.proveedoresCreados ? ' y ' + d.proveedoresCreados + ' proveedores creados' : ''}.</p>`;
    btn.style.display = 'none';
    if (typeof cargarGastos === 'function') cargarGastos();
  }catch(e){ errEl.textContent = e.message; btn.disabled = false; btn.textContent = 'Importar'; }
}
</script>
