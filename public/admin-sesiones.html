<!doctype html>
<html lang="es"><head><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis sesiones</title>
<style>
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#1b1f24;margin:0;padding:20px}
.card{max-width:900px;margin:0 auto 14px;background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:20px}
h1{font-size:20px;margin:0 0 6px} .muted{color:#667085;font-size:13px}
select,button{padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;font-size:14px;background:#fff} button{background:#1b1f24;color:#fff;border:0;font-weight:700;cursor:pointer} button.sec{background:#fff;color:#b42318;border:1px solid #f0b9b4}
.ses{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#e3f6ea;color:#067647;margin-left:6px}
.err{color:#b42318;margin-top:8px} .ok{color:#067647;margin-top:8px}
</style></head><body>
<div class="card">
  <h1>Sesiones abiertas</h1>
  <p class="muted">Cada celular o computadora donde entraste. La sesión dura 30 días y se renueva sola mientras la uses. Si perdiste un equipo o te olvidaste abierta una sesión, cerrala desde acá.</p>
  <div id="adminSel" hidden style="margin:10px 0"><label class="muted">Ver sesiones de: </label><select id="uSel" onchange="cargar()"></select></div>
  <div id="aviso" class="muted"></div>
  <div id="lista"></div>
  <div style="margin-top:14px"><button class="sec" id="btnTodas" onclick="cerrarTodas()">Cerrar todas las demás sesiones</button></div>
  <div class="err" id="err"></div><div class="ok" id="ok"></div>
</div>
<script>
const TOKEN = localStorage.getItem('obras_admin_token') || '';
const H = {'x-admin-token': TOKEN, 'Content-Type': 'application/json'};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
let miId = '';
function uid(){ const v = document.getElementById('uSel').value; return v && v !== miId ? v : ''; }
async function cargar(){
  const err = document.getElementById('err'); err.textContent = ''; document.getElementById('ok').textContent = '';
  if (!TOKEN){ err.textContent = 'Entrá primero al sistema con tu usuario.'; return; }
  try{
    const u = uid();
    const r = await fetch('/api/usuarios/sesiones' + (u ? '?usuarioId=' + u : ''), {headers: H});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    document.getElementById('aviso').textContent = d.sinSesionActual && !u ? 'Estás con una sesión anterior al cambio (vale hasta el ' + fmt(d.vencenSesionesViejas).slice(0,8) + '). Al volver a entrar aparecerá acá.' : '';
    document.getElementById('lista').innerHTML = d.sesiones.length ? d.sesiones.map(s =>
      `<div class="ses"><div><b>${esc(s.dispositivo || 'Dispositivo')}</b>${s.actual?'<span class="pill">Esta sesión</span>':''}<div class="muted">Entró ${esc(fmt(s.creada))} · último uso ${esc(fmt(s.ultimoUso))} · IP ${esc(s.ip)}</div></div>
      ${s.actual?'':`<button class="sec" onclick="cerrar('${esc(s._id)}')">Cerrar sesión</button>`}</div>`).join('') : '<div class="muted" style="margin:10px 0">No hay sesiones abiertas.</div>';
    document.getElementById('btnTodas').textContent = u ? 'Cerrar todas las sesiones de este usuario' : 'Cerrar todas las demás sesiones';
  }catch(e){ err.textContent = e.message; }
}
async function cerrar(id){
  if (!confirm('¿Cerrar esa sesión?')) return;
  const r = await fetch('/api/usuarios/sesiones/' + id + '/cerrar', {method:'POST', headers: H, body:'{}'});
  const d = await r.json(); if (!r.ok) { document.getElementById('err').textContent = d.error || 'Error'; return; }
  await cargar(); document.getElementById('ok').textContent = 'Sesión cerrada.';
}
async function cerrarTodas(){
  const u = uid();
  if (!confirm(u ? '¿Cerrar todas las sesiones de ese usuario?' : '¿Cerrar todas las sesiones menos esta?')) return;
  const r = await fetch('/api/usuarios/sesiones/cerrar-todas', {method:'POST', headers: H, body: JSON.stringify({usuarioId: u || undefined, conservarActual: !u})});
  const d = await r.json(); if (!r.ok) { document.getElementById('err').textContent = d.error || 'Error'; return; }
  await cargar(); document.getElementById('ok').textContent = 'Listo: ' + d.cerradas + ' sesión(es) cerrada(s).';
}
(async function(){
  try{
    const me = await (await fetch('/api/usuarios/me', {headers: H})).json(); miId = String((me.usuario && me.usuario._id) || me._id || '');
    const l = await fetch('/api/usuarios', {headers: H});
    if (l.ok){ const us = await l.json(); const arr = Array.isArray(us) ? us : (us.usuarios || []);
      if (arr.length > 1){ document.getElementById('uSel').innerHTML = '<option value="' + esc(miId) + '">Yo</option>' + arr.filter(x => String(x._id) !== miId).map(x => `<option value="${esc(x._id)}">${esc(x.nombre || x.usuario)}</option>`).join(''); document.getElementById('adminSel').hidden = false; } }
  }catch(e){}
  cargar();
})();
</script></body></html>
