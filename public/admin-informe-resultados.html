<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de resultados - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea; --danger:#c53030; --danger-soft:#fbe4e1; --piedra:#5d646d;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8; --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316; --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f; --piedra:#9aa0a8; --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5); }
  }
  :root[data-theme="dark"] { --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8; --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316; --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f; --piedra:#9aa0a8; --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5); }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  main{padding:20px;max-width:1280px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .muted{color:var(--muted);font-size:12px;} .hidden{display:none !important;} .err{color:var(--danger);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;} #loginScreen .card{width:300px;text-align:center;}
  .tb-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .tb-filtros select,.tb-filtros input[type=date],.tb-filtros input[type=text]{width:auto;font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);}
  .tb-filtros input[type=text]{min-width:150px;}
  .tb-filtros label.chk{display:flex;align-items:center;gap:5px;margin:0;font-size:12px;cursor:pointer;} .tb-filtros label.chk input{width:auto;}
  .seg{display:inline-flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px;gap:2px;border:1px solid var(--border);}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:5px 13px;border-radius:999px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;}
  .kpi .et{font-size:12px;font-weight:700;color:var(--muted);} .kpi .val{font-size:clamp(1.2rem,2vw,1.6rem);font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
  .kpi.main{background:radial-gradient(120% 140% at 0% 0%,#34373c 0%,#1d1f22 55%,#141517 100%);color:#f3f1ee;border:0;} .kpi.main .et{color:#aeb2b8;}
  .tabla{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .tabla table{width:100%;border-collapse:collapse;font-size:13px;}
  .tabla th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .tabla td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .tabla tr:last-child td{border-bottom:0;} .tabla .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;} .tabla th.n{text-align:right;}
  .tabla tbody tr.clic{cursor:pointer;} .tabla tbody tr.clic:hover{background:var(--bg);}
  .tabla tfoot td{font-weight:800;background:var(--bg);}
  .barra-imp{display:flex;align-items:center;gap:8px;justify-content:flex-end;} .barra-imp .pista{width:90px;height:7px;border-radius:4px;background:var(--bg);overflow:hidden;flex:none;} .barra-imp .pista>div{height:100%;background:var(--accent);border-radius:4px;}
  .vacio{padding:28px;text-align:center;color:var(--muted);}
  .tb-info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:800;cursor:help;}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));} .tabla{overflow-x:auto;}}
  .tabla td.neg,.tabla .neg{color:var(--danger);} .tabla .pos{color:var(--ok);}
  .tabla tr.sec td{background:var(--bg);font-weight:800;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .tabla tr.sub td{font-weight:800;border-top:1px solid var(--border);} .tabla tr.ind td:first-child{padding-left:30px;color:var(--muted);}
  .tabla tr.res td{font-weight:800;font-size:14px;background:var(--bg);} .tabla td.tot,.tabla th.tot{border-left:1px solid var(--border);font-weight:800;}
  .tabla tr.pct td{font-size:11.5px;color:var(--muted);padding-top:0;border-top:0;}
  .tabla{overflow-x:auto;} .tabla td:first-child,.tabla th:first-child{white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1;min-width:210px;} .tabla tr.sec td:first-child,.tabla tr.res td:first-child{background:var(--bg);}
  .tb-filtros .btn{padding:6px 14px;border-radius:999px;font-size:12.5px;} #btnCfg{margin-left:auto;}
  .lista-cfg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0;} .lista-cfg label{display:flex;gap:5px;align-items:center;margin:0;font-size:12.5px;color:var(--text);cursor:pointer;} .lista-cfg input{width:auto;}
  .aviso{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:8px 14px;font-size:12.5px;margin-bottom:12px;}
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Estado de resultados</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button data-iconizado="1" class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el estado de resultados. Pedile a un administrador que lo habilite desde Usuarios y roles.</p>
    <button data-iconizado="1" class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <main>
    <div class="tb-filtros">
      <select id="fPeriodo" aria-label="Período" onchange="preset(this.value)">
        <option value="anio" selected>Este año</option><option value="mes">Este mes</option><option value="mespasado">Mes pasado</option>
        <option value="3m">Últimos 3 meses</option><option value="6m">Últimos 6 meses</option><option value="aniopasado">Año pasado</option><option value="custom">Personalizado</option>
      </select>
      <input type="date" id="fDesde" aria-label="Desde" onchange="$('fPeriodo').value='custom';cargar()">
      <input type="date" id="fHasta" aria-label="Hasta" onchange="$('fPeriodo').value='custom';cargar()">
      <select id="fAlcance" aria-label="Sucursales" onchange="cargar()"><option value="actual">Sucursal elegida arriba</option><option value="todas">Todas mis sucursales</option></select>
      <button id="btnCfg" class="hidden btn secondary" style="margin-left:auto" onclick="panelCfg()" title="Elegir qué gastos ya están incluidos en el costo de producción (por ejemplo sueldos de operarios) para no restarlos dos veces">Gastos incluidos en el costo</button>
      <button data-iconizado="1" class="btn secondary" onclick="exportar()" title="Descargar este estado de resultados en Excel">Exportar a Excel</button>
      <span class="tb-info" title="Ventas netas: ventas del período sin IVA, restando notas de crédito. Costo de mercadería: cantidad vendida por el costo actual de cada producto (aproximado: si el costo cambió, usa el de hoy). Gastos: gastos cargados sin IVA, por concepto; las compras de mercadería no son gasto, ya están en el costo. Resultado = ventas netas - costo - gastos; no incluye impuesto a las ganancias ni intereses.">i</span>
    </div>
    <div id="err"></div><div id="cfgPanel" class="hidden aviso" style="background:var(--card);border:1px solid var(--border)"></div><div id="aviso"></div>
    <div class="kpis">
      <div class="kpi"><div class="et">Ventas netas</div><div class="val" id="kVen">$ —</div></div>
      <div class="kpi" title="Ventas netas menos costo de mercadería vendida"><div class="et">Margen bruto</div><div class="val" id="kMar">—</div></div>
      <div class="kpi"><div class="et">Gastos</div><div class="val" id="kGas">—</div></div>
      <div class="kpi main"><div class="et">Resultado</div><div class="val" id="kRes">$ —</div></div>
    </div>
    <div class="tabla"><table><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
  </main>
</div>

<script>
const BASE = '/api/informes';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){ const h = Object.assign({'x-admin-token':TOKEN}, extra||{}); if (ORG) h['x-org-id'] = ORG; return h; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
const pesos = n => (n < 0 ? '-$ ' : '$ ') + Math.round(Math.abs(n || 0)).toLocaleString('es-AR');
const pct = n => n == null ? '—' : n.toLocaleString('es-AR', {maximumFractionDigits:1}) + ' %';
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const etMes = k => MES[+k.slice(5) - 1] + ' ' + k.slice(2, 4);

async function login(){
  const usuario = $('loginUser').value, pass = $('loginPass').value;
  $('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token; localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){ $('loginErr').textContent = e.message; }
}
function logout(){ localStorage.removeItem('obras_admin_token'); location.reload(); }

const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
function preset(v){
  if (v === 'custom') return;
  const hoy = new Date(); hoy.setHours(12,0,0,0);
  let d = new Date(hoy.getFullYear(), 0, 1, 12), h = new Date(hoy);
  if (v === 'mes') d = new Date(hoy.getFullYear(), hoy.getMonth(), 1, 12);
  else if (v === 'mespasado') { d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1, 12); h = new Date(hoy.getFullYear(), hoy.getMonth(), 0, 12); }
  else if (v === '3m') d = new Date(hoy.getFullYear(), hoy.getMonth() - 2, 1, 12);
  else if (v === '6m') d = new Date(hoy.getFullYear(), hoy.getMonth() - 5, 1, 12);
  else if (v === 'aniopasado') { d = new Date(hoy.getFullYear() - 1, 0, 1, 12); h = new Date(hoy.getFullYear() - 1, 11, 31, 12); }
  $('fDesde').value = iso(d); $('fHasta').value = iso(h);
  if (!$('app').classList.contains('hidden')) cargar();
}

async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; $('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    const ok = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('informe_resultados'));
    if (!ok) { $('loginScreen').classList.add('hidden'); $('sinAccesoScreen').classList.remove('hidden'); return; }
  }catch(e){ $('loginErr').textContent = 'No se pudo validar la sesión.'; return; }
  PiedraSidebar.render(me, 'informe-resultados');
  document.title = 'Estado de resultados - Piedra Negra';
  $('loginScreen').classList.add('hidden'); $('sinAccesoScreen').classList.add('hidden'); $('app').classList.remove('hidden');
  preset('anio');
  try{ const r = await fetch(BASE + '/resultados/config', {headers: headersAuth()}); const c = await r.json(); if (r.ok && c.puedeEditar) $('btnCfg').classList.remove('hidden'); }catch(e){}
  await cargar();
}
if (TOKEN) iniciarApp(); else $('loginScreen').classList.remove('hidden');

function params(extra){
  const q = new URLSearchParams({desde: $('fDesde').value, hasta: $('fHasta').value, alcance: $('fAlcance').value});
  Object.keys(extra||{}).forEach(k => q.set(k, extra[k]));
  return q;
}
const cls = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : '');

async function cargar(){
  $('err').innerHTML = ''; $('aviso').innerHTML = '';
  let d;
  try{
    const r = await fetch(BASE + '/resultados?' + params(), {headers: headersAuth()});
    d = await r.json(); if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  }catch(e){ $('err').innerHTML = '<div class="err">No se pudo cargar: ' + escapeHtml(e.message) + '</div>'; return; }
  const T = d.total;
  $('kVen').textContent = pesos(T.ventasNetas);
  $('kMar').innerHTML = pesos(T.margenBruto) + ' <span class="muted" style="font-weight:700">' + pct(T.margenPct) + '</span>';
  $('kGas').textContent = pesos(T.gastosTotal);
  $('kRes').innerHTML = pesos(T.resultado) + ' <span style="font-size:.8rem;font-weight:700;color:#aeb2b8">' + pct(T.resultadoPct) + '</span>';
  if (T.sinCosto) $('aviso').innerHTML = '<div class="aviso">Hay ' + pesos(T.sinCosto) + ' vendidos en productos <b>sin costo cargado</b>: no entran en el costo y el margen puede estar sobrestimado. Cargá el costo en la ficha del producto.</div>';
  const M = d.meses, col = (f, c) => M.map(m => '<td class="n ' + (c ? c(m) : '') + '">' + f(m) + '</td>').join('') + '<td class="n tot ' + (c ? c(T) : '') + '">' + f(T) + '</td>';
  $('tHead').innerHTML = '<tr><th></th>' + M.map(m => '<th class="n">' + etMes(m.mes) + '</th>').join('') + '<th class="n tot">Total</th></tr>';
  let h = '<tr class="sub"><td>Ventas netas</td>' + col(m => pesos(m.ventasNetas)) + '</tr>';
  h += '<tr class="ind"><td>(-) Costo de mercadería vendida</td>' + col(m => pesos(-m.costo), m => m.costo ? 'neg' : '') + '</tr>';
  h += '<tr class="sub"><td>Margen bruto</td>' + col(m => pesos(m.margenBruto), m => cls(m.margenBruto)) + '</tr>';
  h += '<tr class="pct"><td>% sobre ventas</td>' + col(m => pct(m.margenPct)) + '</tr>';
  h += '<tr class="sec"><td colspan="' + (M.length + 2) + '">Gastos</td></tr>';
  h += d.conceptos.length ? d.conceptos.map(c => '<tr class="ind"><td>' + escapeHtml(c) + '</td>' + col(m => m.gastos[c] ? pesos(-m.gastos[c]) : '–') + '</tr>').join('') : '<tr class="ind"><td colspan="' + (M.length + 2) + '">No hay gastos cargados en el período.</td></tr>';
  h += '<tr class="sub"><td>Total gastos</td>' + col(m => pesos(-m.gastosTotal), m => m.gastosTotal ? 'neg' : '') + '</tr>';
  if (T.enCosto) h += '<tr class="pct" title="Estos gastos ya están dentro del costo de producción de los productos: se muestran para que los veas, pero no se restan de nuevo."><td>Incluidos en el costo (no se restan)</td>' + col(m => m.enCosto ? pesos(-m.enCosto) : '–') + '</tr>';
  h += '<tr class="res"><td>RESULTADO</td>' + col(m => pesos(m.resultado), m => cls(m.resultado)) + '</tr>';
  h += '<tr class="pct"><td>% sobre ventas</td>' + col(m => pct(m.resultadoPct)) + '</tr>';
  $('tBody').innerHTML = h;
}

async function panelCfg(){
  const p = $('cfgPanel');
  if (!p.classList.contains('hidden')) { p.classList.add('hidden'); return; }
  p.innerHTML = 'Cargando…'; p.classList.remove('hidden');
  try{
    const r = await fetch(BASE + '/resultados/config', {headers: headersAuth()}); const c = await r.json(); if (!r.ok) throw new Error(c.error || 'Error');
    const sel = new Set(c.enCosto);
    p.innerHTML = '<b>Gastos que ya están dentro del costo de producción</b><div class="muted" style="margin-top:2px">Tildá los conceptos que ya forman parte del costo de tus productos (por ejemplo los sueldos de operarios) para que no se resten otra vez como gasto. Vale para la sucursal elegida arriba.</div><div class="lista-cfg">' +
      (c.conceptos.length ? c.conceptos.map(n => '<label><input type="checkbox" value="' + escapeHtml(n) + '"' + (sel.has(n) ? ' checked' : '') + '> ' + escapeHtml(n) + '</label>').join('') : '<span class="muted">Todavía no hay conceptos de gasto cargados.</span>') +
      '</div><button data-iconizado="1" class="btn" onclick="guardarCfg()">Guardar</button>';
  }catch(e){ p.innerHTML = '<span class="err">' + escapeHtml(e.message) + '</span>'; }
}
async function guardarCfg(){
  const enCosto = [...document.querySelectorAll('#cfgPanel input[type=checkbox]:checked')].map(i => i.value);
  const r = await fetch(BASE + '/resultados/config', {method:'PUT', headers: headersAuth({'Content-Type':'application/json'}), body: JSON.stringify({enCosto})});
  const d = await r.json(); if (!r.ok) { alert(d.error || 'No se pudo guardar'); return; }
  $('cfgPanel').classList.add('hidden'); cargar();
}
async function exportar(){
  try{
    const r = await fetch(BASE + '/resultados?' + params({formato: 'xlsx'}), {headers: headersAuth()});
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'No se pudo exportar'); }
    const blob = await r.blob(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'estado-de-resultados-' + $('fDesde').value + '_' + $('fHasta').value + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }catch(e){ $('err').innerHTML = '<div class="err">' + escapeHtml(e.message) + '</div>'; }
}
</script>
</body>
</html>
