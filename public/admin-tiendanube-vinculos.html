<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vínculos con Tiendanube</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--bd:#e3e6ea;--tx:#1b1f24;--mu:#667085;--er:#b42318;--ok:#067647;--wa:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--bd:#2d3339;--tx:#eceff2;--mu:#98a2b3;--er:#f4908a;--ok:#5fd39a;--wa:#f5b266}}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:16px}
.wrap{max-width:1250px;margin:0 auto} h1{font-size:21px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.muted{color:var(--mu);font-size:13px} table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top} th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)} td.n,th.n{text-align:right;white-space:nowrap}
button,select,input{padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px} button{cursor:pointer}
.t{display:flex;gap:10px;flex-wrap:wrap}.t div{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-width:120px;cursor:pointer}.t b{font-size:20px;display:block}.t div.on{border-color:var(--tx)}
.d{color:var(--er);font-weight:700}.ok{color:var(--ok)}.wa{color:var(--wa)}
</style></head><body><div class="wrap">
<h1>Vínculos con Tiendanube</h1>
<p class="muted">Cada producto de la tienda con el producto del sistema al que corresponde y los dos precios. Para vincular los que faltan: <a href="/admin-tiendanube-vinculo.html">pantalla de vincular</a>.</p>
<div class="card"><div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<button id="btn" onclick="cargar()">Actualizar desde Tiendanube</button>
<label class="muted">Lista de precios del sistema</label><select id="lista" onchange="cargar()"></select>
<input id="q" placeholder="Filtrar por SKU o nombre…" oninput="pintar()" style="min-width:240px"></div>
<div id="err" style="color:var(--er);margin-top:8px"></div></div>
<div class="card" id="res" style="display:none"><div class="t" id="tarj"></div>
<div style="overflow:auto;max-height:640px;margin-top:12px"><table><thead><tr><th>SKU en Tiendanube</th><th>Producto en Tiendanube</th><th>Producto del sistema</th><th>Vínculo</th><th class="n">Precio Tiendanube</th><th class="n">Precio sistema</th><th class="n">Diferencia</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
<script>
const TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORGX = localStorage.getItem('obras_org_activo') || ''; if (ORGX === 'todas') ORGX = localStorage.getItem('obras_org_operar') || '';
async function asegurarOrg(){ if (ORGX) return; try { const r = await fetch('/api/usuarios/me', {headers:{'x-admin-token':TOKEN}}); const d = await r.json(); if (d.organizaciones && d.organizaciones[0]) ORGX = d.organizaciones[0]._id; } catch(e) {} }
const H = () => { const h = {'x-admin-token':TOKEN,'Content-Type':'application/json'}; if (ORGX) { h['x-org-id'] = ORGX; h['x-org-operar'] = ORGX; } return h; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = n => n==null||!isFinite(n)?'—':'$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
let D=null, FILTRO='todos';
async function cargar(){
  const err=document.getElementById('err'), b=document.getElementById('btn'); err.textContent=''; b.disabled=true; b.textContent='Leyendo…'; await asegurarOrg();
  try{ const l=document.getElementById('lista').value; const r=await fetch('/api/tiendanube-vinculo/vinculos'+(l?'?listaId='+l:''),{headers:H()}); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error'); D=d;
    const s=document.getElementById('lista'); s.innerHTML=d.listas.map(x=>'<option value="'+x._id+'"'+(x._id===d.lista?' selected':'')+'>'+esc(x.nombre)+'</option>').join('');
    document.getElementById('res').style.display=''; pintar();
  }catch(e){ err.textContent=e.message; }
  b.disabled=false; b.textContent='Actualizar desde Tiendanube';
}
function dif(r){ if(!r.producto||r.precioSistema==null||!isFinite(r.tn.precio)) return null; return r.precioSistema-r.tn.precio; }
function pintar(){
  if(!D) return; const s=D.resumen, q=document.getElementById('q').value.trim().toLowerCase();
  const T=[['todos',s.total,'en Tiendanube'],['sku',s.porSku,'por SKU igual'],['manual',s.manuales,'vinculados a mano'],['sin',s.sinVinculo,'sin vínculo'],['dif',s.conDiferencia,'con diferencia de precio'],['sinp',s.sinPrecioSistema,'sin precio en el sistema']];
  document.getElementById('tarj').innerHTML=T.map(t=>'<div class="'+(FILTRO===t[0]?'on':'')+'" onclick="FILTRO=\''+t[0]+'\';pintar()"><b>'+t[1]+'</b>'+t[2]+'</div>').join('');
  let f=D.filas.filter(r=>FILTRO==='todos'||(FILTRO==='sku'&&r.tipo==='sku')||(FILTRO==='manual'&&r.tipo==='manual')||(FILTRO==='sin'&&r.tipo==='sin')||(FILTRO==='dif'&&dif(r)!=null&&Math.abs(dif(r))>=0.5)||(FILTRO==='sinp'&&r.producto&&r.precioSistema==null));
  if(q) f=f.filter(r=>(r.tn.sku+' '+r.tn.nombre+' '+(r.producto?r.producto.sku+' '+r.producto.nombre:'')).toLowerCase().includes(q));
  if(FILTRO==='dif') f=f.slice().sort((a,b)=>Math.abs(dif(b))-Math.abs(dif(a)));
  document.getElementById('tb').innerHTML=f.slice(0,1500).map(r=>{ const d=dif(r); const tipo=r.tipo==='sku'?'<span class="ok">SKU igual</span>':r.tipo==='manual'?'<span class="wa">a mano</span>':'<span class="d">sin vínculo</span>';
    return '<tr><td><b>'+esc(r.tn.sku||'(sin SKU)')+'</b></td><td>'+(r.tn.url?'<a target="_blank" href="'+esc(r.tn.url)+'">'+esc(r.tn.nombre)+'</a>':esc(r.tn.nombre))+'</td><td>'+(r.producto?'<b>'+esc(r.producto.sku)+'</b> '+esc(r.producto.nombre):'<span class="muted">—</span>')+'</td><td>'+tipo+'</td><td class="n">'+M(r.tn.precio)+(r.tn.promo!=null?'<div class="muted">oferta '+M(r.tn.promo)+'</div>':'')+'</td><td class="n">'+M(r.precioSistema)+'</td><td class="n'+(d!=null&&Math.abs(d)>=0.5?' d':'')+'">'+(d==null?'—':(d>0?'+':'')+M(d))+'</td><td>'+(r.tipo==='manual'?'<button onclick="desvincular(\''+r.producto._id+'\')">Quitar vínculo</button>':'')+'</td></tr>'; }).join('')+(f.length>1500?'<tr><td colspan="8" class="muted">Se muestran las primeras 1.500; usá el filtro.</td></tr>':'');
}
async function desvincular(id){ if(!confirm('Se quita el vínculo manual de este producto.')) return; try{ const r=await fetch('/api/tiendanube-vinculo/desvincular',{method:'POST',headers:H(),body:JSON.stringify({productoId:id})}); if(r.ok) cargar(); }catch(e){} }
cargar();
</script></body></html>
