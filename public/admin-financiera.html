<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financiera - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .kpi .v{font-size:22px;font-weight:800;margin-top:4px;}
  .num{text-align:right;white-space:nowrap;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto;}
  .modal{background:var(--card);border-radius:14px;width:min(900px,100%);padding:18px 20px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal .close-x{position:absolute;top:10px;right:14px;cursor:pointer;font-size:18px;}
  .fila-ch{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr 1fr 1fr 34px;gap:6px;margin-bottom:6px;align-items:end;}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--border);}
  .pill.ok{background:var(--ok-soft);color:var(--ok);} .pill.mal{background:var(--danger-soft);color:var(--danger);}
  .sub td{background:var(--bg);}
</style>
</head>
<body>

<body>
<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Financiera</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>
<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Tesorería.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>
<div id="app" class="hidden">
  <header>
    <div class="brand"><h1>Financiera — cheques y cuenta corriente</h1></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="row">
        <button class="btn" onclick="abrirOperacion()">Nueva operación (recibir cheques)</button>
        <button class="btn secondary" onclick="abrirPago()">Registrar pago en efectivo</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Operaciones</h3>
      <table>
        <thead><tr><th>#</th><th>Fecha</th><th>Tasa mens.</th><th class="num">Nominal</th><th class="num">Efectivo pactado</th><th class="num">Pagado</th><th class="num">Pendiente</th><th class="num">Ganancia</th><th></th></tr></thead>
        <tbody id="opsBody"><tr><td colspan="9" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Pagos a la financiera</h3>
      <table>
        <thead><tr><th>Fecha</th><th class="num">Monto</th><th>Nota</th><th></th></tr></thead>
        <tbody id="pagosBody"></tbody>
      </table>
    </div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
const BASE = '/api/financiera';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){ const h = Object.assign({'x-admin-token':TOKEN}, extra||{}); if (ORG) h['x-org-id'] = ORG; return h; }
function headersAuthJson(){ return headersAuth({'Content-Type':'application/json'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR', /T00:00:00(\.000)?Z$/.test(String(iso)) ? {timeZone:'UTC'} : undefined); }
function hoyISO(){ return new Date(Date.now()-3*3600000).toISOString().slice(0,10); }
function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }
async function login(){
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value})});
    const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token; localStorage.setItem('obras_admin_token', TOKEN); await iniciarApp();
  }catch(e){ document.getElementById('loginErr').textContent = e.message; }
}
function logout(){ localStorage.removeItem('obras_admin_token'); location.reload(); }
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  if (orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas')) return;
  const def = orgs.find(o => o.nombre === 'Piedra Negra');
  ORG = orgs.length === 1 ? orgs[0]._id : (def ? def._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  if (ORG) localStorage.setItem('obras_org_activo', ORG);
}
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    if (!(me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('tesoreria')))) {
      document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('sinAccesoScreen').classList.remove('hidden'); return;
    }
  }catch(e){ document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.'; return; }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'financiera', { ocultarOrg: false });
  document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = (me.usuario && me.usuario.nombre) || '';
  await cargar();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

let DATOS = null, ABIERTAS = new Set();
async function cargar(){
  try{
    const r = await fetch(BASE + '/resumen', {headers: headersAuth()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    DATOS = d; render();
  }catch(e){ document.getElementById('opsBody').innerHTML = `<tr><td colspan="9" class="err">${escapeHtml(e.message)}</td></tr>`; }
}
function render(){
  const t = DATOS.total;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="muted">Saldo a pagar a la financiera</div><div class="v" style="color:${t.saldo > 0 ? 'var(--danger)' : 'var(--ok)'}">${money(t.saldo)}</div></div>
    <div class="kpi"><div class="muted">Cheques recibidos (nominal)</div><div class="v">${money(t.nominal)}</div></div>
    <div class="kpi"><div class="muted">Efectivo pactado / pagado</div><div class="v" style="font-size:16px">${money(t.efectivoPactado)} / ${money(t.pagado)}</div></div>
    <div class="kpi"><div class="muted">Ganancia financiera</div><div class="v" style="color:var(--ok)">${money(t.ganancia)} <span class="muted">(${t.gananciaPct}%)</span></div></div>`;
  const filas = DATOS.operaciones.map(o => {
    const abierta = ABIERTAS.has(String(o._id));
    let h = `<tr>
      <td>${o.numero}</td><td>${fechaCorta(o.fecha)}</td><td>${o.tasaMensual}%</td>
      <td class="num">${money(o.nominalVigente)}</td><td class="num">${money(o.debe)}</td><td class="num">${money(o.pagado)}</td>
      <td class="num"><strong>${money(o.pendiente)}</strong></td><td class="num" style="color:var(--ok)">${money(o.ganancia)} <span class="muted">${o.gananciaPct}%</span></td>
      <td><button class="btn small secondary" onclick="toggleOp('${o._id}')">${abierta ? 'Ocultar' : 'Cheques'}</button> ${o.editable ? `<button class="btn small secondary" onclick="abrirOperacion('${o._id}')">Editar</button>` : ''}</td></tr>`;
    if (abierta) {
      h += `<tr class="sub"><td colspan="9"><table><thead><tr><th>Cheque</th><th>Banco</th><th>Librador</th><th>Vence</th><th class="num">Días</th><th class="num">Nominal</th><th class="num">Costo</th><th>Estado</th><th></th></tr></thead><tbody>` +
        o.items.map(i => `<tr><td>${escapeHtml(i.numero||'—')}</td><td>${escapeHtml(i.banco||'')}</td><td>${escapeHtml(i.librador||'')}</td><td>${fechaCorta(i.fechaVencimiento)}</td><td class="num">${i.dias}</td><td class="num">${money(i.monto)}</td><td class="num">${money(i.costo)}</td>
          <td><span class="pill ${i.estado === 'devuelto' || i.estado === 'rechazado' ? 'mal' : ''}">${escapeHtml(i.estado === 'endosado' ? 'entregado a ' + (i.endosadoA || 'proveedor') : (i.estado || '—').replace('_',' '))}</span></td>
          <td>${i.estado === 'devuelto' ? '' : `<button class="btn small secondary" onclick="devolver('${i.chequeId}')">Devolver a financiera</button>`}</td></tr>`).join('') +
        `</tbody></table>${o.rechazado ? `<p class="muted">Devuelto a la financiera: ${money(o.rechazado)} menos de deuda.</p>` : ''}
        ${o.pagado === 0 && !o.rechazado ? `<button class="btn small secondary" onclick="anularOp('${o._id}')">Anular operación</button>` : ''}</td></tr>`;
    }
    return h;
  }).join('');
  document.getElementById('opsBody').innerHTML = filas || '<tr><td colspan="9" class="muted">Todavía no cargaste operaciones.</td></tr>';
  document.getElementById('pagosBody').innerHTML = DATOS.pagos.map(p => `<tr><td>${fechaCorta(p.fecha)}</td><td class="num">${money(p.monto)}</td><td>${escapeHtml(p.nota||'')}${p.anulado ? ' <span class="pill mal">anulado</span>' : ''}</td><td>${p.anulado ? '' : `<button class="btn small secondary" onclick="anularPago('${p._id}')">Anular</button>`}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin pagos.</td></tr>';
}
function toggleOp(id){ if (ABIERTAS.has(id)) ABIERTAS.delete(id); else ABIERTAS.add(id); render(); }
async function post(url, body){
  const r = await fetch(BASE + url, {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body||{})});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error'); return d;
}
async function anularOp(id){ if (!confirm('¿Anular esta operación? Los cheques se anulan y deja de contar en el saldo.')) return; try{ await post('/operaciones/' + id + '/anular'); await cargar(); }catch(e){ alert(e.message); } }
async function anularPago(id){ if (!confirm('¿Anular este pago? El efectivo vuelve a la caja.')) return; try{ await post('/pagos/' + id + '/anular'); await cargar(); }catch(e){ alert(e.message); } }
async function devolver(chequeId){
  const motivo = prompt('Cheque rechazado: se devuelve a la financiera y baja lo que le debés por el costo de ese cheque.\n\nMotivo (opcional):');
  if (motivo === null) return;
  try{ await post('/cheques/' + chequeId + '/rechazo', {motivo}); await cargar(); alert('Listo. Si la financiera lo cubre con otro valor, cargalo como una nueva operación; si lo cubre con efectivo, registralo como ingreso en Tesorería.'); }catch(e){ alert(e.message); }
}

// ---- Nueva operación ----
let timerCalc = null;
function filaCheque(c){
  c = c || {};
  const v = x => escapeHtml(x == null ? '' : x);
  return `<div class="fila-ch" data-chequeid="${v(c.chequeId)}">
    <div><label>Nº cheque</label><input class="c-num" value="${v(c.numero)}"></div><div><label>Banco</label><input class="c-banco" value="${v(c.banco)}"></div>
    <div><label>Librador</label><input class="c-lib" value="${v(c.librador)}"></div><div><label>CUIT librador</label><input class="c-cuit" value="${v(c.cuitLibrador)}"></div>
    <div><label>Monto *</label><input class="c-monto" type="number" step="0.01" min="0" value="${v(c.monto)}" oninput="recalcular()"></div>
    <div><label>Vencimiento *</label><input class="c-venc" type="date" value="${c.fechaVencimiento ? String(c.fechaVencimiento).slice(0,10) : ''}" onchange="recalcular()"></div>
    <button class="btn small secondary" onclick="this.closest('.fila-ch').remove(); recalcular()">×</button></div>`;
}
let EDITANDO = null;
function abrirOperacion(opId){
  const op = opId ? DATOS.operaciones.find(o => String(o._id) === String(opId)) : null;
  EDITANDO = op ? String(op._id) : null;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal"><span class="close-x" onclick="cerrarModal()">✕</span>
    <h2 style="margin-top:0">${op ? 'Editar operación #' + op.numero : 'Nueva operación — cheques recibidos de la financiera'}</h2>
    <div class="row" style="margin-bottom:10px">
      <div style="width:160px"><label>Fecha</label><input id="opFecha" type="date" value="${op ? String(op.fecha).slice(0,10) : hoyISO()}" onchange="recalcular()"></div>
      <div style="width:160px"><label>Tasa mensual (%) *</label><input id="opTasa" type="number" step="0.01" min="0" value="${op ? op.tasaMensual : ''}" oninput="recalcular()"></div>
    </div>
    <div class="card" style="background:var(--bg);padding:12px;margin-bottom:12px">
      <strong>🧾 Cargar los cheques con IA</strong>
      <div class="muted" style="margin:2px 0 8px">Subí el PDF o una foto de los cheques (pueden ser varios en el mismo archivo): la IA lee los datos y completa las filas. Revisalos antes de guardar.</div>
      <div class="row">
        <label class="btn secondary small" style="cursor:pointer;margin:0">📷 Sacar foto<input type="file" accept="image/*" capture="environment" hidden onchange="leerChequesIA(this)"></label>
        <label class="btn secondary small" style="cursor:pointer;margin:0">📎 Subir archivo / PDF<input type="file" accept="image/*,application/pdf,.pdf" hidden multiple onchange="leerChequesIA(this)"></label>
      </div>
      <div id="iaEstado" class="muted" style="margin-top:6px"></div>
    </div>
    <div id="opCheques">${op ? op.items.filter(i => i.estado !== 'devuelto').map(i => filaCheque(i)).join('') : filaCheque()}</div>
    <button class="btn small secondary" onclick="document.getElementById('opCheques').insertAdjacentHTML('beforeend', filaCheque())">+ Agregar cheque</button>
    <div class="card" style="margin-top:14px;background:var(--bg)" id="opCalc"><span class="muted">Cargá la tasa y los cheques para ver el efectivo.</span></div>
    <div class="row"><div style="width:240px"><label>Efectivo pactado (dejá vacío para usar el sugerido)</label><input id="opPactado" type="number" step="0.01" min="0" value="${op && Math.abs(op.efectivoPactado - op.efectivoSugerido) > 0.005 ? op.efectivoPactado : ''}" oninput="recalcular()"></div>
      <div style="flex:1"><label>Observaciones</label><input id="opObs" value="${op ? escapeHtml(op.observaciones) : ''}"></div></div>
    <div class="err" id="opErr"></div>
    <button class="btn" style="margin-top:10px" onclick="guardarOperacion()">${op ? 'Guardar cambios' : 'Guardar operación'}</button></div></div>`;
  if (op) recalcular();
}
function leerOperacion(){
  const cheques = [...document.querySelectorAll('#opCheques .fila-ch')].map(f => ({
    chequeId: f.dataset.chequeid || '', numero: f.querySelector('.c-num').value, banco: f.querySelector('.c-banco').value, librador: f.querySelector('.c-lib').value, cuitLibrador: f.querySelector('.c-cuit').value,
    monto: f.querySelector('.c-monto').value, fechaVencimiento: f.querySelector('.c-venc').value })).filter(c => c.monto || c.fechaVencimiento);
  return { fecha: document.getElementById('opFecha').value, tasaMensual: document.getElementById('opTasa').value, cheques, efectivoPactado: document.getElementById('opPactado').value, observaciones: document.getElementById('opObs').value };
}
function recalcular(){
  clearTimeout(timerCalc);
  timerCalc = setTimeout(async () => {
    const b = leerOperacion(); const out = document.getElementById('opCalc'); if (!out) return;
    if (!b.cheques.length || b.tasaMensual === '' || b.cheques.some(c => !(Number(c.monto) > 0) || !c.fechaVencimiento)) { out.innerHTML = '<span class="muted">Completá tasa, monto y vencimiento de cada cheque para ver el efectivo.</span>'; return; }
    try{
      const d = await post('/calcular', b);
      out.innerHTML = `Nominal <strong>${money(d.nominal)}</strong> · Efectivo sugerido <strong>${money(d.efectivoSugerido)}</strong> · Efectivo a pagar <strong>${money(d.efectivoPactado)}</strong> · Ganancia <strong style="color:var(--ok)">${money(d.ganancia)} (${d.gananciaPct}%)</strong>`;
    }catch(e){ out.innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`; }
  }, 250);
}
async function guardarOperacion(){
  try{
    if (EDITANDO) { const r = await fetch(BASE + '/operaciones/' + EDITANDO, {method:'PUT', headers: headersAuthJson(), body: JSON.stringify(leerOperacion())}); const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error'); }
    else await post('/operaciones', leerOperacion());
    cerrarModal(); await cargar();
  }
  catch(e){ document.getElementById('opErr').textContent = e.message; }
}


function archivoABase64(file){ return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); }); }
async function leerChequesIA(input){
  const archivos = [...input.files]; input.value = '';
  const estado = document.getElementById('iaEstado');
  if (!archivos.length) return;
  let cargados = 0; const avisos = [];
  for (const file of archivos) {
    estado.textContent = 'Leyendo ' + file.name + '…';
    try{
      const b64 = await archivoABase64(file);
      const r = await fetch(BASE + '/leer-cheques', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({ archivoBase64: b64, mimeType: file.type, nombreArchivo: file.name })});
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
      const cont = document.getElementById('opCheques');
      d.cheques.forEach(c => {
        let fila = [...cont.querySelectorAll('.fila-ch')].find(f => !f.querySelector('.c-monto').value && !f.querySelector('.c-venc').value && !f.querySelector('.c-num').value);
        if (!fila) { cont.insertAdjacentHTML('beforeend', filaCheque()); fila = cont.lastElementChild; }
        fila.querySelector('.c-num').value = c.numero; fila.querySelector('.c-banco').value = c.banco; fila.querySelector('.c-lib').value = c.librador;
        fila.querySelector('.c-cuit').value = c.cuitLibrador; fila.querySelector('.c-monto').value = c.monto || ''; fila.querySelector('.c-venc').value = c.fechaVencimiento;
        cargados++;
      });
      (d.avisos || []).forEach(a => avisos.push(file.name + ': ' + a));
      d.cheques.forEach(c => { if (!c.fechaVencimiento || !(c.monto > 0)) avisos.push('Cheque ' + (c.numero || '(s/n)') + ': completá el ' + (!c.fechaVencimiento ? 'vencimiento' : 'monto') + ' a mano.'); });
    }catch(e){ avisos.push(file.name + ': ' + e.message); }
  }
  estado.innerHTML = (cargados ? `<strong>${cargados} cheque(s) cargados.</strong> Revisá los datos. ` : '') + avisos.map(a => `<div class="err">${escapeHtml(a)}</div>`).join('');
  recalcular();
}

// ---- Pago ----
async function abrirPago(){
  let cajas = [];
  try{ const r = await fetch('/api/tesoreria/cajas', {headers: headersAuth()}); cajas = await r.json(); }catch(e){}
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal" style="max-width:480px"><span class="close-x" onclick="cerrarModal()">✕</span>
    <h2 style="margin-top:0">Pago en efectivo a la financiera</h2>
    <p class="muted">Saldo actual: <strong>${money(DATOS ? DATOS.total.saldo : 0)}</strong></p>
    <label>Monto *</label><input id="pgMonto" type="number" step="0.01" min="0">
    <label style="margin-top:8px">Caja de donde sale *</label><select id="pgCaja"><option value="">Elegí…</option>${(Array.isArray(cajas)?cajas:[]).map(c => `<option value="${c._id}">${escapeHtml(c.nombre)}</option>`).join('')}</select>
    <label style="margin-top:8px">Fecha</label><input id="pgFecha" type="date" value="${hoyISO()}">
    <label style="margin-top:8px">Nota</label><input id="pgNota">
    <div class="err" id="pgErr"></div>
    <button class="btn" style="margin-top:10px" onclick="guardarPago()">Registrar pago</button></div></div>`;
}
async function guardarPago(){
  try{
    await post('/pagos', { monto: document.getElementById('pgMonto').value, cuentaTipo: 'caja', cuentaId: document.getElementById('pgCaja').value, fecha: document.getElementById('pgFecha').value, nota: document.getElementById('pgNota').value });
    cerrarModal(); await cargar();
  }catch(e){ document.getElementById('pgErr').textContent = e.message; }
}
