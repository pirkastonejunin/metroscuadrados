<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libros fiscales - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;color:var(--muted);}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;}
  .chk .dot{flex:0 0 18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px;}
  .chk .dot.ok{background:var(--ok-soft);color:var(--ok);} .chk .dot.no{background:var(--danger-soft);color:var(--danger);}
  .paso{border-left:3px solid var(--accent);padding-left:12px;margin:14px 0;}
  .paso h3{margin:0 0 6px;font-size:14px;}
  .paso ol{margin:6px 0 6px 18px;padding:0;font-size:13px;line-height:1.55;}
  textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;height:130px;}
  .aviso{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;}
  .aviso.warn{background:var(--danger-soft);color:var(--danger);}
  .okmsg{color:var(--ok);font-size:13px;margin:6px 0;font-weight:600;}
  .scroll{overflow-x:auto;}
  td.num,th.num{text-align:right;white-space:nowrap;}
  tfoot td{font-weight:800;border-top:2px solid var(--border);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Fiscal</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button data-iconizado="1" class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo Fiscal. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button data-iconizado="1" class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand"><h1 id="tituloLibro">Libro IVA</h1></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
    </div>
  </header>
  <main>
    <section id="tab-libro">
      <div class="card">
        <div class="row">
          <label style="display:flex;gap:6px;align-items:center;align-self:flex-end;margin:0"><input type="checkbox" id="fConsol" onchange="cargarLibro()"> Todas las sucursales con el mismo CUIT</label>
          <div><label>Desde</label><input type="date" id="fDesde"></div>
          <div><label>Hasta</label><input type="date" id="fHasta"></div>
          <button data-iconizado="1" class="btn" onclick="cargarLibro()">Ver</button>
          <button data-iconizado="1" class="btn secondary" onclick="bajarLibro()">Descargar Excel</button>
        </div>
        <div id="libroMsg"></div>
      </div>
      <div class="card"><div class="scroll" id="libroTabla"></div></div>
    </section>
  </main>
</div>

<script>
const BASE = '/api/fiscal';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function msg(id, texto, ok){ $(id).innerHTML = texto ? '<div class="' + (ok ? 'okmsg' : 'err') + '">' + escapeHtml(texto) + '</div>' : ''; }
async function api(path, opts){
  const o = Object.assign({}, opts || {});
  o.headers = headersAuth(o.body ? {'Content-Type':'application/json'} : {});
  const r = await fetch(BASE + path, o);
  let data = null; try { data = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error((data && data.error) || ('Error ' + r.status));
  return data;
}
async function bajar(path, nombre){
  const r = await fetch(BASE + path, {headers: headersAuth()});
  if (!r.ok) { let d=null; try{ d = await r.json(); }catch(e){} throw new Error((d && d.error) || ('Error ' + r.status)); }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function login(){
  const usuario = $('loginUser').value, pass = $('loginPass').value;
  $('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token; localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){ $('loginErr').textContent = e.message; }
}
function logout(){ localStorage.removeItem('obras_admin_token'); location.reload(); }

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido); else localStorage.removeItem(ORG_KEY);
}

const VISTAS = {
  ventas: { tab: 'libro-iva-ventas', titulo: 'Libro IVA Ventas', key: 'fiscal-ventas' },
  compras: { tab: 'libro-iva-compras', titulo: 'Libro IVA Compras', key: 'fiscal-compras' },
  retenciones: { tab: 'retenciones', titulo: 'Percepciones y retenciones', key: 'fiscal-retenciones' }
};
const VISTA = VISTAS[new URLSearchParams(location.search).get('vista')] || VISTAS.ventas;
let TAB = VISTA.tab;
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; $('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('fiscal'));
    if (!tieneAcceso) { $('loginScreen').classList.add('hidden'); $('sinAccesoScreen').classList.remove('hidden'); return; }
  }catch(e){ $('loginErr').textContent = 'No se pudo validar la sesión.'; return; }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, VISTA.key);
  $('tituloLibro').textContent = VISTA.titulo; document.title = VISTA.titulo + ' - Piedra Negra';
  $('loginScreen').classList.add('hidden'); $('sinAccesoScreen').classList.add('hidden'); $('app').classList.remove('hidden');
  $('topbarUser').textContent = (me.usuario && me.usuario.nombre) || '';
  const hoy = new Date(), ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const f = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  $('fDesde').value = f(ini); $('fHasta').value = f(hoy);
  await cargarLibro();
}
if (TOKEN) iniciarApp(); else $('loginScreen').classList.remove('hidden');

let ULTIMO = null;
function fmt(v, clave, cols){
  if (typeof v === 'number') return v.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
  return escapeHtml(v == null ? '' : v);
}
function qsLibro(extra){
  const p = new URLSearchParams();
  if ($('fDesde').value) p.set('desde', $('fDesde').value);
  if ($('fHasta').value) p.set('hasta', $('fHasta').value);
  if ($('fConsol').checked) p.set('consolidado', '1');
  if (extra) p.set('formato', extra);
  return '?' + p.toString();
}
async function cargarLibro(){
  msg('libroMsg','');
  $('libroTabla').innerHTML = '<div class="muted">Cargando…</div>';
  try{
    const d = await api('/' + TAB + qsLibro());
    ULTIMO = d;
    if (!d.filas.length) { $('libroTabla').innerHTML = '<div class="muted">No hay comprobantes en ese período.</div>'; return; }
    const num = c => { const f = d.filas.find(x => typeof x[c.clave] === 'number'); return !!f || (d.totales && d.totales[c.clave] !== undefined); };
    let h = '<table><thead><tr>' + d.columnas.map(c => '<th class="' + (num(c) ? 'num' : '') + '">' + escapeHtml(c.titulo) + '</th>').join('') + '</tr></thead><tbody>';
    d.filas.forEach(f => { h += '<tr>' + d.columnas.map(c => '<td class="' + (num(c) ? 'num' : '') + '">' + fmt(f[c.clave]) + '</td>').join('') + '</tr>'; });
    h += '</tbody><tfoot><tr>' + d.columnas.map((c,i) => '<td class="' + (num(c) ? 'num' : '') + '">' + (i === 0 ? 'TOTALES' : (d.totales && d.totales[c.clave] !== undefined ? fmt(d.totales[c.clave]) : '')) + '</td>').join('') + '</tr></tfoot></table>';
    $('libroTabla').innerHTML = h;
  }catch(e){ $('libroTabla').innerHTML = ''; msg('libroMsg', e.message); }
}
async function bajarLibro(){
  try{ await bajar('/' + TAB + qsLibro('xlsx'), TAB + '.xlsx'); }catch(e){ msg('libroMsg', e.message); }
}
</script>
</body>
</html>
