<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vincular con Tiendanube</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--bd:#e3e6ea;--tx:#1b1f24;--mu:#667085;--er:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--bd:#2d3339;--tx:#eceff2;--mu:#98a2b3;--er:#f4908a;--ok:#5fd39a}}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:16px}
.wrap{max-width:1100px;margin:0 auto} h1{font-size:21px;margin:0 0 4px} h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.muted{color:var(--mu);font-size:13px} table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top} th{color:var(--mu);font-weight:600}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px} button.p{background:#1b1f24;color:#fff}
select{padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:280px;max-width:100%}
.t{display:flex;gap:10px;flex-wrap:wrap}.t div{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-width:130px}.t b{font-size:20px;display:block}
</style></head><body><div class="wrap">
<h1>Vincular productos con Tiendanube</h1>
<p class="muted">Empareja los productos que ya están publicados en Tiendanube con los del sistema, para poder actualizar precios y stock. Las fotos quedan en Tiendanube: no se copian ni ocupan lugar en la base.</p>
<div class="card"><button class="p" id="btn" onclick="analizar()">Leer Tiendanube y proponer vínculos</button> <span class="muted" id="est"></span><div id="err" style="color:var(--er);margin-top:8px"></div></div>
<div id="out"></div></div>
<script>
const TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORGX = localStorage.getItem('obras_org_activo') || ''; if (ORGX === 'todas') ORGX = localStorage.getItem('obras_org_operar') || '';
// El catálogo es el mismo para todas las sucursales: si no hay una elegida, se usa la primera que tenga el usuario.
async function asegurarOrg(){ if (ORGX) return; try { const r = await fetch('/api/usuarios/me', {headers:{'x-admin-token':TOKEN}}); const d = await r.json(); if (d.organizaciones && d.organizaciones[0]) ORGX = d.organizaciones[0]._id; } catch(e) {} }
const H = () => { const h = {'x-admin-token':TOKEN,'Content-Type':'application/json'}; if (ORGX) { h['x-org-id'] = ORGX; h['x-org-operar'] = ORGX; } return h; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = n => Number(n||0).toLocaleString('es-AR'); let P = [];
(async()=>{ await asegurarOrg(); try{ const r=await fetch('/api/tiendanube-vinculo/estado',{headers:H()}); const d=await r.json(); if(r.ok) document.getElementById('est').textContent='Productos ya vinculados con otro SKU: '+N(d.vinculados); }catch(e){} })();
async function analizar(){
  const err=document.getElementById('err'), out=document.getElementById('out'), b=document.getElementById('btn'); err.textContent=''; b.disabled=true; await asegurarOrg();
  out.innerHTML='<div class="card muted">Leyendo la tienda y comparando… puede tardar un minuto.</div>';
  try{
    const r=await fetch('/api/tiendanube-vinculo/analizar',{headers:H()}); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error'); P=d.propuestas;
    let h='<div class="card"><div class="t"><div><b>'+N(d.enTienda)+'</b>variantes en Tiendanube</div><div><b>'+N(d.directos)+'</b>ya coinciden por SKU</div><div><b>'+N(d.yaVinculados)+'</b>ya vinculados</div><div><b>'+N(d.pendientes)+'</b>sin pareja todavía</div></div></div>';
    if(!P.length){ h+='<div class="card">Todo lo que está en Tiendanube ya está vinculado.</div>'; }
    else{
      h+='<div class="card"><h2>Para vincular</h2><p class="muted">Las de parecido alto vienen tildadas. Elegí el producto correcto en cada fila o dejalo en “ninguno”. “Producto viejo” es el que tenías con ese SKU de Dux (ya desactivado), que ayuda a encontrar el nuevo.'+(d.hayMas?' Se muestran las primeras 1.500.':'')+'</p>'
        +'<div style="overflow:auto;max-height:560px"><table><thead><tr><th></th><th>En Tiendanube</th><th>Producto del sistema</th></tr></thead><tbody>'
        +P.map((p,i)=>{const ops='<option value="">— ninguno —</option>'+p.candidatos.map((c,j)=>'<option value="'+c.productoId+'"'+(j===0&&p.seguro?' selected':'')+'>'+esc((c.sku?c.sku+' · ':'')+c.nombre)+' ('+c.parecido+'%)</option>').join('');
          return '<tr><td><input type="checkbox" class="chk" data-i="'+i+'"'+(p.seguro?' checked':'')+(p.candidatos.length&&p.sku?'':' disabled')+'></td><td><b>'+esc(p.sku||'(sin SKU)')+'</b><div>'+esc(p.nombre)+'</div>'+(p.productoViejo?'<div class="muted">Producto viejo: '+esc(p.productoViejo)+'</div>':'')+(p.url?'<a class="muted" target="_blank" href="'+esc(p.url)+'">ver en la tienda</a>':'')+'</td><td>'+(p.candidatos.length?'<select class="sel" data-i="'+i+'" onchange="this.closest(\'tr\').querySelector(\'.chk\').checked=!!this.value">'+ops+'</select>':'<span class="muted">sin parecidos</span>')+'</td></tr>';}).join('')
        +'</tbody></table></div><div style="margin-top:12px"><button class="p" onclick="guardar()">Guardar los vínculos tildados</button> <span id="res"></span></div></div>';
    }
    out.innerHTML=h;
  }catch(e){ out.innerHTML=''; err.textContent=e.message; }
  b.disabled=false;
}
async function guardar(){ await asegurarOrg();
  const pares=[]; document.querySelectorAll('.chk').forEach(c=>{ if(!c.checked) return; const i=+c.dataset.i, s=document.querySelector('.sel[data-i="'+i+'"]'); if(s&&s.value) pares.push({productoId:s.value,sku:P[i].sku,productId:P[i].productId,variantId:P[i].variantId}); });
  if(!pares.length){ document.getElementById('res').textContent='No hay nada tildado.'; return; }
  if(!confirm('Se vinculan '+pares.length+' productos con Tiendanube. ¿Seguimos?')) return;
  try{ const r=await fetch('/api/tiendanube-vinculo/vincular',{method:'POST',headers:H(),body:JSON.stringify({pares})}); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
    document.getElementById('res').innerHTML='<span style="color:var(--ok)">'+d.guardados+' vinculados.</span>'+(d.rechazados.length?' <span style="color:var(--er)">No se guardaron '+d.rechazados.length+': '+d.rechazados.slice(0,8).map(x=>esc(x.sku)+' ('+esc(x.motivo)+')').join('; ')+'</span>':'');
  }catch(e){ document.getElementById('res').innerHTML='<span style="color:var(--er)">'+esc(e.message)+'</span>'; }
}
</script></body></html>
