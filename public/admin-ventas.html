<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --warn:#b7791f; --warn-soft:#fdf3d9;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.pendiente{background:var(--warn-soft);color:var(--warn);}
  .pill.parcialmente_entregada{background:var(--info-soft);color:var(--info);}
  .pill.entregada{background:var(--ok-soft);color:var(--ok);}
  .pill.anulada{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:860px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin:14px 0 10px;}
  .fila-item{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .fila-item .campo-producto{flex:2;min-width:160px;position:relative;}
  .campo-combo-cliente{position:relative;flex:1;min-width:160px;}
  .producto-buscar-opciones{position:absolute;top:100%;left:0;right:0;z-index:40;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-top:2px;max-height:220px;overflow:auto;box-shadow:var(--shadow);}
  .producto-buscar-opciones .opcion{padding:7px 10px;font-size:13px;cursor:pointer;}
  .producto-buscar-opciones .opcion:hover,.producto-buscar-opciones .opcion.activa{background:var(--accent-soft);}
  .producto-buscar-opciones .sin-resultados{padding:8px 10px;font-size:13px;color:var(--muted);}
  .fila-item .campo-cant{flex:1;min-width:100px;}
  .fila-item .campo-cant-bulto{flex:1;min-width:100px;}
  .fila-item .campo-precio{flex:1;min-width:100px;}
  .fila-item .campo-subtotal{flex:1;min-width:90px;text-align:right;font-weight:700;padding-top:8px;}
  .fila-item .btn-quitar{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--danger);border-radius:8px;width:36px;height:36px;font-size:15px;font-weight:700;cursor:pointer;}
  .totales-box{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;}
  .totales-box .fila-total{display:flex;justify-content:space-between;padding:2px 0;}
  .totales-box .fila-total.grande{font-size:16px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  .detalle-pago{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14;
      --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14;
    --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Ventas</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Ventas. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Ventas</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:220px">
            <label>Cliente</label>
            <div class="campo-combo-cliente" id="fvClienteWrap">
              <input type="text" id="fvBuscar" class="producto-buscar" placeholder="Todos" autocomplete="off"
                oninput="escribirClienteCombo(this,'fv')" onfocus="renderOpcionesClienteCombo(this,'fv',this.value)"
                onblur="cerrarOpcionesClienteCombo('fv')" onkeydown="navegarOpcionesClienteCombo(event,'fv')">
              <input type="hidden" id="fvCliente" value="" data-onselect="cargarVentas">
              <div class="producto-buscar-opciones hidden" id="fvClienteOpciones"></div>
            </div>
          </div>
          <div style="min-width:150px">
            <label>Estado</label>
            <select id="fvEstado" onchange="cargarVentas()">
              <option value="">Todos</option>
              <option value="pendiente">Pendiente</option>
              <option value="parcialmente_entregada">Entrega parcial</option>
              <option value="entregada">Entregada</option>
              <option value="anulada">Anulada</option>
            </select>
          </div>
          <div style="min-width:140px">
            <label>Desde</label>
            <input id="fvDesde" type="date" onchange="cargarVentas()">
          </div>
          <div style="min-width:140px">
            <label>Hasta</label>
            <input id="fvHasta" type="date" onchange="cargarVentas()">
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" onclick="descargarBlob(BASE + '/export', 'ventas.xlsx')">Exportar</button>
          <button class="btn" onclick="abrirNuevaVenta()">+ Nueva venta</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Nº</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Cobrado</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
        <tbody id="ventasBody"><tr><td colspan="8" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/ventas';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
// Variantes con organización explícita (1/10/2026, selector de Sucursal en
// Nueva venta) — para pedir datos de OTRA organización sin pisar la que
// está activa globalmente (ORG/localStorage), que sigue siendo la que usa
// el resto de la pantalla.
function headersAuthOrg(orgId, extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  h['x-org-id'] = orgId || ORG;
  return h;
}
function headersAuthJsonOrg(orgId, extra){ return headersAuthOrg(orgId, Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }
function fechaHora(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('es-AR'); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
let meCache = null;
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    meCache = me;
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('ventas'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'ventas', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarListasBase();
  await cargarVentas();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// -------------------------------------------------------------------
// Clientes, productos y depósitos — se cargan una sola vez al entrar
// -------------------------------------------------------------------
let clientesCache = [];
let productosCache = [];
let depositosCache = [];
// Tesorería (2/10/2026): cajas/bancos habilitados para este usuario+
// sucursal, para elegir adónde va un cobro (o cuál banco propio al
// endosar, si hiciera falta más adelante) — se recargan junto con el
// resto de las listas base porque dependen de la organización activa.
let cajasTesoreriaCache = [];
let bancosTesoreriaCache = [];
// Listas de precio de Productos (30/9/2026) — se piden acá también porque
// GET /api/productos/listas-precio acepta acceso de 'productos' O 'ventas'
// (ver authListasPrecio en productos.js). Se usan solo para sugerir el
// precio unitario al armar una venta; el precio de cada ítem sigue siendo
// editable a mano como siempre.
let listasPrecioCache = [];
// Usuarios activos, para el combo de "Vendedor" en Nueva venta
// (3/10/2026) — ver cargarListasBase.
let usuariosCache = [];
function opcionesVendedorVenta(seleccionado){
  const base = seleccionado && !usuariosCache.some(u => u.nombre === seleccionado)
    ? [{ nombre: seleccionado }] // por si el usuario logueado no está en la lista (caso raro)
    : [];
  return base.concat(usuariosCache).map(u =>
    `<option value="${escapeHtml(u.nombre)}" ${u.nombre === seleccionado ? 'selected' : ''}>${escapeHtml(u.nombre)}</option>`
  ).join('');
}
// `orgId` opcional (1/10/2026, selector de Sucursal en Nueva venta): sin
// él, carga todo para la organización activa globalmente y repuebla el
// filtro de la pantalla de listado. Con él, trae los datos de ESA otra
// organización sin tocar la activa — se usa al cambiar de sucursal adentro
// del formulario de carga, donde clientes/productos/depósitos disponibles
// dependen de qué organización se eligió para esa venta puntual.
// Antes, si alguno de estos 4 pedidos fallaba (401, 500, red caída),
// quedaba en silencio con un array vacío — Mato veía "no me despliega
// los clientes" sin ningún indicio de qué pasó (2/10/2026). Ahora cada
// uno que falla se loguea en la consola del navegador con el motivo, y
// si CUALQUIERA falló se muestra un aviso arriba del formulario en vez
// de dejarlo en blanco sin explicación.
// Guarda el último aviso de carga (si hubo fallas) para poder mostrarlo
// también si el modal de "Nueva venta" se abre DESPUÉS de que esto ya
// corrió (como pasa normalmente: esto se ejecuta una vez al entrar a la
// pantalla, antes de que exista el div #avisoCargaBase del modal).
let avisoCargaBaseMsg = '';
function pintarAvisoCargaBase(){
  const avisoEl = document.getElementById('avisoCargaBase');
  if (avisoEl) avisoEl.textContent = avisoCargaBaseMsg;
}
async function cargarListasBase(orgId){
  const h = orgId ? headersAuthOrg(orgId) : headersAuth();
  const [rc, rp, rd, rl, rcj, rbc, ru] = await Promise.all([
    fetch(BASE + '/clientes', {headers: h}),
    fetch(BASE + '/productos', {headers: h}),
    fetch(BASE + '/depositos', {headers: h}),
    fetch('/api/productos/listas-precio', {headers: h}),
    fetch('/api/tesoreria/cajas', {headers: h}),
    fetch('/api/tesoreria/bancos', {headers: h}),
    fetch('/api/usuarios/lite', {headers: h})
  ]);
  const fallas = [];
  async function leer(r, nombre){
    if (r.ok) return await r.json();
    let detalle = '';
    try { detalle = (await r.json()).error || ''; } catch(e){}
    console.error(`Error cargando ${nombre}: HTTP ${r.status} ${detalle}`);
    fallas.push(`${nombre} (HTTP ${r.status}${detalle ? ': ' + detalle : ''})`);
    return [];
  }
  clientesCache = await leer(rc, 'clientes');
  productosCache = await leer(rp, 'productos');
  depositosCache = await leer(rd, 'depósitos');
  listasPrecioCache = await leer(rl, 'listas de precio');
  // Cajas/bancos: si el usuario no tiene el módulo Tesorería habilitado
  // esto da 403 — no es una falla real, simplemente no va a poder elegir
  // cuenta al cobrar (ver construirSelectorCuentaCobro).
  cajasTesoreriaCache = rcj.ok ? await rcj.json() : [];
  bancosTesoreriaCache = rbc.ok ? await rbc.json() : [];
  // Usuarios para el combo de "Vendedor" (3/10/2026, pedido de Mato: "en
  // la pantalla de venta cuando figura vendedor deberia dejar elegir
  // entre los que ya estan cargados, solo aparece administrador" — era
  // un campo de texto libre precargado con el nombre de quien está
  // logueado). GET /api/usuarios/lite no pide el módulo 'usuarios'.
  usuariosCache = ru.ok ? await ru.json() : [];
  avisoCargaBaseMsg = fallas.length
    ? `No se pudo cargar: ${fallas.join(' · ')}. Probá recargar la página; si sigue, avisá.`
    : '';
  pintarAvisoCargaBase();
}

// Versión liviana de lo de arriba, SOLO depósitos + listas de precio
// (3/10/2026, segunda vuelta — el fix anterior traía todo cargarListasBase()
// de nuevo al abrir "Nueva venta", incluido el catálogo completo de
// productos y clientes, y Mato reportó que ahora tardaba muchísimo en
// abrir. Depósitos y listas de precio son unas pocas decenas de
// registros como mucho — no hace falta volver a pedir ~20.000 productos
// cada vez solo para que esos dos combos estén al día).
async function refrescarDepositosYListasVenta(orgId){
  const h = orgId ? headersAuthOrg(orgId) : headersAuth();
  const [rd, rl] = await Promise.all([
    fetch(BASE + '/depositos', {headers: h}),
    fetch('/api/productos/listas-precio', {headers: h})
  ]);
  if (rd.ok) depositosCache = await rd.json();
  if (rl.ok) listasPrecioCache = await rl.json();
}

// Misma lógica que precioResuelto() en productos.js: un override puntual
// manda; si no hay, se calcula costo + % de la lista.
// No todas las listas tienen todo el catálogo (1/10/2026) — si la lista
// es de alcance "selección" y el producto no está en sus productosIds, no
// hay precio sugerido de esa lista: el llamador cae al precio general
// del producto (ver actualizarFilaVenta), como si no hubiera lista elegida.
function precioResueltoVenta(producto, lista){
  if (!producto || !lista) return null;
  if (lista.alcance === 'seleccion' && !(lista.productosIds || []).some(id => String(id) === String(producto._id))) return null;
  const overrides = producto.preciosPorLista || [];
  const ov = overrides.find(x => String(x.listaId) === String(lista._id));
  if (ov) return ov.precio;
  if (lista.formula === 'cf_x_bulto') {
    if (producto.precio == null) return null;
    const bultos = (producto.unidadesPorBulto && producto.unidadesPorBulto > 0) ? producto.unidadesPorBulto : 1;
    return Math.round(producto.precio * bultos * 100) / 100;
  }
  if (producto.costo == null) return null;
  return Math.round(producto.costo * (1 + (lista.porcentaje || 0) / 100) * 100) / 100;
}

// Buscador de cliente tipo combobox (2/10/2026, pedido de Mato) — mismo
// problema y misma solución que el buscador de productos: antes el
// <select> con el catálogo completo de clientes era lento para elegir y
// no mostraba lo que se tipeaba. Se usa tanto en "Nueva venta" (nv) como
// en el filtro de cliente del listado (fv), con un "prefix" para poder
// reusar las mismas funciones en los dos lugares.
function textoCliente(c){
  return c.apellidoRazonSocial || c.nombre || '(sin nombre)';
}
function buscarClientesVenta(query){
  const q = (query || '').trim().toLowerCase();
  const resultados = q
    ? clientesCache.filter(c => textoCliente(c).toLowerCase().includes(q))
    : clientesCache;
  return resultados.slice(0, LIMITE_SUGERENCIAS_PRODUCTO);
}
function comboClienteHtml(prefix, seleccionadoId, onSelect){
  const seleccionado = seleccionadoId ? clientesCache.find(c => String(c._id) === String(seleccionadoId)) : null;
  return `
    <div class="campo-combo-cliente" id="${prefix}ClienteWrap">
      <input type="text" id="${prefix}Buscar" class="producto-buscar" placeholder="Buscar cliente…" autocomplete="off"
        value="${seleccionado ? escapeHtml(textoCliente(seleccionado)) : ''}"
        oninput="escribirClienteCombo(this,'${prefix}')" onfocus="renderOpcionesClienteCombo(this,'${prefix}',this.value)"
        onblur="cerrarOpcionesClienteCombo('${prefix}')" onkeydown="navegarOpcionesClienteCombo(event,'${prefix}')">
      <input type="hidden" id="${prefix}Cliente" value="${seleccionadoId||''}" data-onselect="${onSelect||''}">
      <div class="producto-buscar-opciones hidden" id="${prefix}ClienteOpciones"></div>
    </div>
  `;
}
function renderOpcionesClienteCombo(input, prefix, query){
  const cont = document.getElementById(prefix + 'ClienteOpciones');
  const resultados = buscarClientesVenta(query);
  cont.innerHTML = resultados.length
    ? resultados.map(c => `<div class="opcion" data-id="${c._id}" onmousedown="elegirClienteCombo(this,'${prefix}')">${escapeHtml(textoCliente(c))}</div>`).join('')
    : `<div class="sin-resultados">${clientesCache.length ? 'Sin resultados para esa búsqueda' : 'No hay clientes cargados'}</div>`;
  cont.classList.remove('hidden');
}
function escribirClienteCombo(input, prefix){
  const oculto = document.getElementById(prefix + 'Cliente');
  oculto.value = '';
  renderOpcionesClienteCombo(input, prefix, input.value);
  if (!input.value.trim()) {
    const onSelect = oculto.dataset.onselect;
    if (onSelect && typeof window[onSelect] === 'function') window[onSelect]();
  }
}
function cerrarOpcionesClienteCombo(prefix){
  setTimeout(() => { const cont = document.getElementById(prefix + 'ClienteOpciones'); if (cont) cont.classList.add('hidden'); }, 150);
}
function navegarOpcionesClienteCombo(e, prefix){
  const cont = document.getElementById(prefix + 'ClienteOpciones');
  if (cont.classList.contains('hidden')) return;
  const opciones = Array.from(cont.querySelectorAll('.opcion'));
  if (!opciones.length) return;
  let idx = opciones.findIndex(o => o.classList.contains('activa'));
  if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(opciones.length - 1, idx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); elegirClienteCombo(opciones[idx >= 0 ? idx : 0], prefix); return; }
  else if (e.key === 'Escape') { cont.classList.add('hidden'); return; }
  else return;
  opciones.forEach(o => o.classList.remove('activa'));
  opciones[idx].classList.add('activa');
  opciones[idx].scrollIntoView({ block: 'nearest' });
}
function elegirClienteCombo(el, prefix){
  const clienteId = el.dataset.id;
  const cliente = clientesCache.find(c => String(c._id) === clienteId);
  const oculto = document.getElementById(prefix + 'Cliente');
  oculto.value = clienteId;
  document.getElementById(prefix + 'Buscar').value = cliente ? textoCliente(cliente) : '';
  document.getElementById(prefix + 'ClienteOpciones').classList.add('hidden');
  const onSelect = oculto.dataset.onselect;
  if (onSelect && typeof window[onSelect] === 'function') window[onSelect]();
}
// Buscador de producto por SKU o nombre (2/10/2026) — reemplaza al <select>
// con el catálogo entero como <option>. Un <select> nativo con miles de
// productos tiene dos problemas que Mato reportó: tarda en abrirse/elegir
// (el navegador arma de nuevo toda la lista) y el "salto al escribir" del
// select nativo no muestra lo que estás tecleando y solo busca por el
// PRINCIPIO del texto de cada opción — si el producto no empieza con lo
// que escribiste, no lo encuentra aunque esté ahí. Esto en cambio es un
// campo de texto real (se ve lo que se escribe) que filtra por SKU o
// nombre en cualquier parte del texto, mostrando como máximo
// LIMITE_SUGERENCIAS_PRODUCTO resultados a la vez.
const LIMITE_SUGERENCIAS_PRODUCTO = 30;
function textoProducto(p){
  return (p.sku ? p.sku + ' — ' : '') + p.nombre;
}
function buscarProductosVenta(query){
  const q = (query || '').trim().toLowerCase();
  const activos = productosCache.filter(p => p.activo !== false);
  const resultados = q
    ? activos.filter(p => (p.sku && p.sku.toLowerCase().includes(q)) || (p.nombre && p.nombre.toLowerCase().includes(q)))
    : activos;
  return resultados.slice(0, LIMITE_SUGERENCIAS_PRODUCTO);
}
function renderOpcionesProductoVenta(input, query){
  const fila = input.closest('.fila-item');
  const cont = fila.querySelector('.producto-buscar-opciones');
  const resultados = buscarProductosVenta(query);
  cont.innerHTML = resultados.length
    ? resultados.map(p => `<div class="opcion" data-id="${p._id}" onmousedown="elegirProductoVenta(this)">${escapeHtml(textoProducto(p))}</div>`).join('')
    : `<div class="sin-resultados">${productosCache.length ? 'Sin resultados para esa búsqueda' : 'No hay productos cargados'}</div>`;
  cont.classList.remove('hidden');
}
// Al escribir, la selección previa queda invalidada hasta elegir de nuevo
// de la lista — evita mandar a vender un producto distinto al que
// terminó quedando escrito en el campo.
function escribirProductoVenta(input){
  input.closest('.fila-item').querySelector('.producto-id').value = '';

}
function cerrarOpcionesProductoVenta(input){
  // El onmousedown de la opción dispara ANTES que este blur, así que
  // elegir con el mouse/touch funciona igual aunque esto la cierre después.
  const fila = input.closest('.fila-item');
  setTimeout(() => { const cont = fila.querySelector('.producto-buscar-opciones'); if (cont) cont.classList.add('hidden'); }, 150);
}
function navegarOpcionesProductoVenta(e, input){
  const cont = input.closest('.fila-item').querySelector('.producto-buscar-opciones');
  if (cont.classList.contains('hidden')) return;
  const opciones = Array.from(cont.querySelectorAll('.opcion'));
  if (!opciones.length) return;
  let idx = opciones.findIndex(o => o.classList.contains('activa'));
  if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(opciones.length - 1, idx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); elegirProductoVenta(opciones[idx >= 0 ? idx : 0]); return; }
  else if (e.key === 'Escape') { cont.classList.add('hidden'); return; }
  else return;
  opciones.forEach(o => o.classList.remove('activa'));
  opciones[idx].classList.add('activa');
  opciones[idx].scrollIntoView({ block: 'nearest' });
}
function elegirProductoVenta(el){
  const fila = el.closest('.fila-item');

async function guardarNuevoClienteDesdeVenta(){

  try{

// Si el producto elegido tiene "Unidades por bulto" cargado en su ficha
// (ej: 1 bulto = 1,44 m²), se muestran los dos campos (unidad real y
// bultos) al mismo tiempo, sincronizados en vivo en los dos sentidos
// (1/10/2026, pedido de Mato: "que me muestre ambas medidas... de esa
// manera veo la conversión en el momento, no quiero que me haga
// desplegar y elegir uno u otro"). El valor que se manda a la venta
// (precio y stock) siempre es en la unidad real del producto — el campo
// de bultos es solo una ayuda para cargar más rápido. Sin bultos
// cargados en la ficha, el campo de bultos ni aparece (como antes).
function redondear2(n){ return Math.round((Number(n)||0) * 100) / 100; }

// Los bultos no se pueden fraccionar (3/10/2026, pedido de Mato: "los
// bultos no pueden ser fracciones entonces tenemos que redondear cuando
// hacemos la venta ajustando los m2") — se redondea siempre PARA ARRIBA
// al bulto entero más cercano (nunca para abajo: el cliente tiene que
// recibir al menos lo que pidió), y la cantidad real (m2 u otra unidad)
// se reajusta para coincidir exacto con esos bultos enteros — tanto si
// se escribió la cantidad en m2 como si se escribió directo en bultos.
function sincronizarCantidadVenta(el, origen){
  const fila = el.closest('.fila-item');
  const oculto = fila.querySelector('.producto-id');
  const producto = productosCache.find(p => String(p._id) === oculto.value);
  const unidadInput = fila.querySelector('.cant-unidad');
  const bultoInput = fila.querySelector('.cant-bulto');
  if (producto && producto.unidadesPorBulto) {
    const bultosExactos = origen === 'unidad'
      ? (Number(unidadInput.value) || 0) / producto.unidadesPorBulto
      : (Number(bultoInput.value) || 0);
    const bultos = Math.max(0, Math.ceil(bultosExactos - 1e-9));
    bultoInput.value = bultos;
    unidadInput.value = redondear2(bultos * producto.unidadesPorBulto);
  }
  actualizarTotalesVenta();
}

function cantidadBaseDeFila(fila){
  return Number(fila.querySelector('.cant-unidad').value) || 0;
}

function actualizarFilaVenta(fila){
  const oculto = fila.querySelector('.producto-id');
  const precioInput = fila.querySelector('.campo-precio input');
  const bultoWrap = fila.querySelector('.campo-cant-bulto');
  const unidadInput = fila.querySelector('.cant-unidad');
  const unidadIndicador = fila.querySelector('.unidad-indicador');
  const producto = productosCache.find(p => String(p._id) === oculto.value);

  const lista = listaPrecioSeleccionadaVenta();
  const precio = producto ? precioResueltoVenta(producto, lista) : null;
  // Si no hay lista seleccionada o el producto no tiene costo cargado,
  // se cae al precio general del producto (como antes de esta función).
  precioInput.value = precio != null ? precio : (producto ? (producto.precio || 0) : 0);
  unidadIndicador.textContent = producto ? (UNIDAD_LABEL_VENTA[producto.unidad] || producto.unidad || '') : '';
  bultoWrap.classList.toggle('hidden', !(producto && producto.unidadesPorBulto > 0));
  if (producto && producto.unidadesPorBulto) {
    sincronizarCantidadVenta(unidadInput, 'unidad');
  }

  actualizarTotalesVenta();
}

// Al cambiar la lista de precio elegida, recalcula el precio sugerido de
// cada fila YA cargada (30/9/2026) — sigue siendo editable a mano después.
function recalcularPreciosPorListaVenta(){
  const lista = listaPrecioSeleccionadaVenta();
  document.querySelectorAll('#nvFilasItems .fila-item').forEach(fila => {
    const oculto = fila.querySelector('.producto-id');
    if (!oculto.value) return;
    const producto = productosCache.find(p => String(p._id) === oculto.value);
    const precioInput = fila.querySelector('.campo-precio input');
    const precio = producto ? precioResueltoVenta(producto, lista) : null;
    precioInput.value = precio != null ? precio : (producto ? (producto.precio || 0) : 0);
  });
  actualizarTotalesVenta();
}

function juntarItemsVenta(){
  const filas = document.querySelectorAll('#nvFilasItems .fila-item');
  const items = [];
  filas.forEach(fila => {
    const oculto = fila.querySelector('.producto-id');
    const cantidad = cantidadBaseDeFila(fila);
    const precioUnitario = Number(fila.querySelector('.campo-precio input').value);
    if (oculto.value && cantidad > 0) items.push({ productoId: oculto.value, cantidad, precioUnitario });
  });
  return items;
}

function actualizarTotalesVenta(){
  const filas = document.querySelectorAll('#nvFilasItems .fila-item');
  let subtotal = 0;
  filas.forEach(fila => {
    const cantidad = cantidadBaseDeFila(fila);
    const precioUnitario = Number(fila.querySelector('.campo-precio input').value) || 0;
    const sub = cantidad * precioUnitario;
    subtotal += sub;
    fila.querySelector('.subtotal-valor').textContent = money(sub);
  });
  const descPorc = Number(document.getElementById('nvDescuentoPorcentaje').value) || 0;
  const descMonto = Number(document.getElementById('nvDescuentoMonto').value) || 0;
  let total = subtotal;
  if (descPorc) total -= total * (descPorc / 100);
  if (descMonto) total -= descMonto;
  total = Math.max(0, total);
  document.getElementById('nvTotales').innerHTML = `
    <div class="fila-total"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    <div class="fila-total grande"><span>Total</span><span>${money(total)}</span></div>
  `;
}

async function guardarNuevaVenta(){
  const items = juntarItemsVenta();
  const tipoEntrega = document.getElementById('nvTipoEntrega').value;
  const body = {
    clienteId: document.getElementById('nvCliente').value,
    vendedor: document.getElementById('nvVendedor').value.trim(),
    fecha: document.getElementById('nvFecha').value,
    moneda: document.getElementById('nvMoneda').value,
    tipoEntrega,
    tipoComprobante: document.getElementById('nvTipoComprobante') ? document.getElementById('nvTipoComprobante').value : 'comprobante_x',
    depositoId: document.getElementById('nvDeposito').value || null,
    listaPrecioId: document.getElementById('nvListaPrecio') ? (document.getElementById('nvListaPrecio').value || null) : null,
    items,
    descuentoPorcentaje: Number(document.getElementById('nvDescuentoPorcentaje').value) || 0,
    descuentoMonto: Number(document.getElementById('nvDescuentoMonto').value) || 0,
    observaciones: document.getElementById('nvObservaciones').value.trim()
  };
  document.getElementById('nvErr').textContent = '';
  if (!body.clienteId) { document.getElementById('nvErr').textContent = 'Elegí un cliente'; return; }
  if (!items.length) { document.getElementById('nvErr').textContent = 'Agregá al menos un producto'; return; }
  // El depósito solo es obligatorio con entrega inmediata (ver
  // actualizarVisibilidadDeposito) — con "no entrega" se puede elegir
  // después, al generar el remito.
  if (tipoEntrega === 'inmediata' && !body.depositoId) { document.getElementById('nvErr').textContent = 'Elegí a qué depósito le vas a entregar la venta'; return; }
  // Bloquea el botón mientras la venta se está guardando (2/10/2026) — sin
  // esto, tocar "Guardar venta" varias veces seguidas (por ejemplo después
  // de un rechazo, esperando que "ahora sí" funcione) disparaba un POST
  // por cada click y podía duplicar el comprobante.
  const btn = document.getElementById('nvGuardarBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Guardando…';
  try{
    // La venta se guarda en la sucursal elegida en el formulario (puede ser
    // distinta de la sucursal activa del resto de la pantalla, ver
    // cambiarSucursalVenta) — por eso headersAuthJsonOrg en vez de
    // headersAuthJson acá.
    const r = await fetch(BASE, {method:'POST', headers: headersAuthJsonOrg(ventaOrgSeleccionada), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al guardar');
    cerrarModal();
    // avisoRemito (2/10/2026): la venta se guardó igual aunque elegiste
    // entrega inmediata — no había stock físico para generar el remito
    // en el momento, así que quedó pendiente con el stock comprometido.
    if (data.avisoRemito) alert('La venta se guardó, pero no se pudo generar el remito todavía:\n\n' + data.avisoRemito + '\n\nQuedó pendiente — generá el remito desde el detalle cuando haya stock.');
    if (ventaOrgSeleccionada === ORG) await cargarVentas();
    // Si se guardó en OTRA sucursal, el listado actual (de la sucursal
    // activa) no la muestra — es esperado, no hace falta recargar nada acá.
  }catch(e){
    document.getElementById('nvErr').textContent = e.message;
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

const TIPO_VALOR_LABEL = { efectivo: 'Efectivo', cheque: 'Cheque', cuenta: 'Cuenta', tarjeta: 'Tarjeta' };

// Imprimibles (3/10/2026) — las rutas de comprobante/remito/recibo
// devuelven HTML, no JSON, y necesitan el header de autenticación, que
// una navegación directa (window.open(url)) no puede llevar. Por eso se
// pide con fetch() y el HTML resultante se escribe en una pestaña nueva
// en blanco — mismo criterio que ya se usa para descargar los .xlsx
// (ver descargarBlob más abajo), adaptado para mostrar en vez de bajar.
//
// `accion` (opcional, 2da vuelta del mismo día — pedido de Mato: "agregar
// boton de ver, comparti, imprimir, anular"): además de "Ver" (abre
// nomás), deja abrir y disparar sola la acción correspondiente apenas
// carga — "imprimir" llama a window.print(), "compartir" llama a
// compartirDocumento() (definida dentro de la propia página imprimible,
// ver imprimibles.js) — así "Imprimir" y "Compartir" quedan como botón
// de un solo click desde cualquier lista, sin duplicar la lógica de
// armar el PDF en cada pantalla.
async function imprimirDocumento(url, accion){
  const ventana = window.open('', '_blank');
  try{
    const r = await fetch(url, {headers: headersAuth()});
    const html = await r.text();
    if (!r.ok) { ventana.document.write('<p>No se pudo generar el documento.</p>'); return; }
    ventana.document.write(html);
    ventana.document.close();
    if (accion === 'imprimir') {
      ventana.addEventListener('load', () => setTimeout(() => ventana.print(), 250));
    } else if (accion === 'compartir') {
      ventana.addEventListener('load', () => setTimeout(() => { if (ventana.compartirDocumento) ventana.compartirDocumento(); }, 250));
    }
  }catch(e){
    ventana.document.write('<p>No se pudo generar el documento: ' + escapeHtml(e.message) + '</p>');
  }
}
// Grupo de botones Ver/Imprimir/Compartir para un documento imprimible
// (comprobante, remito o recibo) — reusado en el detalle de venta.
function botonesImprimible(url){
  return `
    <button class="btn small secondary" onclick="imprimirDocumento('${url}')">Ver</button>
    <button class="btn small secondary" onclick="imprimirDocumento('${url}','imprimir')">Imprimir</button>
    <button class="btn small secondary" onclick="imprimirDocumento('${url}','compartir')">Compartir</button>
  `;
}

// El depósito ya se eligió al cargar la venta (y el stock ya está
// comprometido ahí) para cualquier venta cargada desde el 2/10/2026 en
// adelante — ahí no hace falta volver a preguntarlo, solo confirmar que
// se quiere generar el remito. Una venta más vieja, sin depósito
// asignado todavía, sigue preguntándolo acá (ver POST /:id/entregar).
// Generar remito con entrega parcial (3/10/2026, pedido de Mato: "una
// venta puede tener varios remitos... el cliente puede retirar
// parcialmente") — por defecto se entrega todo lo pendiente de cada
// ítem (el input ya arranca con ese valor), pero se puede bajar la
// cantidad para dejar el resto pendiente de otro remito posterior.
// Los ítems sin nada pendiente (ya entregados del todo en un remito
// anterior) ni se muestran.
// Redondea la cantidad a entregar en un remito al bulto entero más
// cercano para arriba (igual que sincronizarCantidadVenta al cargar la
// venta), sin pasarse de lo que queda pendiente para ese ítem — lo
// pendiente ya quedó ajustado a bulto entero al cargar/entregar antes, así
// que si el redondeo se pasa, simplemente se entrega todo lo pendiente.
function sincronizarCantidadEntrega(inp){
  const pendiente = Number(inp.dataset.pendiente) || 0;
  const unidadesPorBulto = Number(inp.dataset.bulto) || 0;
  let valor = Number(inp.value) || 0;
  if (valor < 0) valor = 0;
  if (unidadesPorBulto > 0 && valor > 0) {
    const bultos = Math.ceil(valor / unidadesPorBulto - 1e-9);
    valor = redondear2(bultos * unidadesPorBulto);
  }
  if (valor > pendiente) valor = redondear2(pendiente);
  inp.value = valor;
}

function abrirEntregar(id){
  const v = ventasCache.find(x => x._id === id);
  if (!v) return;
  const deposito = v.depositoId ? depositosCache.find(d => String(d._id) === String(v.depositoId)) : null;
  const filasItems = v.items.map((it, idx) => {
    const entregada = it.cantidadEntregada || 0;
    const pendiente = Math.max(0, it.cantidad - entregada);
    if (pendiente <= 0) return '';
    // Igual que al cargar la venta: si el producto se vende por bulto, no
    // se puede remitir una fracción de bulto. data-bulto en 0 (producto sin
    // bulto, o no encontrado en el catálogo) desactiva el redondeo.
    const producto = it.productoId ? productosCache.find(p => String(p._id) === String(it.productoId)) : null;
    const unidadesPorBulto = (producto && producto.unidadesPorBulto > 0) ? producto.unidadesPorBulto : 0;
    return `
      <tr>
        <td>${escapeHtml(it.nombre)}</td>
        <td class="muted">${pendiente}</td>
        <td><input type="number" class="ent-cantidad" data-idx="${idx}" data-pendiente="${pendiente}" data-bulto="${unidadesPorBulto}" min="0" max="${pendiente}" step="any" value="${pendiente}" style="width:100px" oninput="sincronizarCantidadEntrega(this)"></td>
      </tr>
    `;
  }).join('');
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Generar remito — venta #${v.numero}</h2>
        <p class="muted">Por defecto se entrega todo lo pendiente. Si el cliente retira solo una parte, cambiá la cantidad de ese ítem — el resto queda pendiente para otro remito. No se puede deshacer — si hace falta corregir, se anula la venta.</p>
        ${deposito ? '' : `<label>Depósito *</label><select id="ntDeposito">${opcionesDepositosVenta()}</select>`}
        <table style="margin-top:10px">
          <thead><tr><th>Producto</th><th>Pendiente</th><th>A entregar ahora</th></tr></thead>
          <tbody>${filasItems}</tbody>
        </table>
        <div class="err" id="ntErr"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarEntregar('${id}')">Confirmar y generar remito</button>
      </div>
    </div>
  `;
}

async function confirmarEntregar(id){
  const sel = document.getElementById('ntDeposito');
  const depositoId = sel ? sel.value : null;
  if (sel && !depositoId) { document.getElementById('ntErr').textContent = 'Elegí un depósito'; return; }
  const items = [];
  document.querySelectorAll('.ent-cantidad').forEach(inp => {
    const cantidad = Number(inp.value) || 0;
    if (cantidad > 0) items.push({ index: Number(inp.dataset.idx), cantidad });
  });
  if (!items.length) { document.getElementById('ntErr').textContent = 'Elegí al menos un ítem para entregar'; return; }
  try{
    const body = Object.assign({ items }, depositoId ? {depositoId} : {});
    const r = await fetch(BASE + '/' + id + '/entregar', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarVentas();
    verDetalle(id);
  }catch(e){
    document.getElementById('ntErr').textContent = e.message;
  }
}

// Tesorería (2/10/2026): efectivo/cuenta/tarjeta tienen que decir a qué
// caja o banco se acredita; cheque pide los datos del cheque de tercero
// en vez de una cuenta (entra "en cartera", no mueve plata todavía).
// Pedido de Mato (2/10/2026): efectivo SOLO puede ir a una caja (un banco
// es cuando el cliente hace una transferencia real); cuenta (transferencia)
// y tarjeta solo pueden ir a un banco.
function opcionesCuentaCobro(tipoValor){
  if (tipoValor === 'efectivo') {
    return cajasTesoreriaCache.map(c => `<option value="caja:${c._id}">${escapeHtml(c.nombre)} (${escapeHtml(c.moneda)}, saldo ${money(c.saldo)})</option>`).join('')
      || '<option value="">No tenés ninguna caja habilitada — pedile a un administrador que te habilite una desde Configuración</option>';
  }
  return bancosTesoreriaCache.map(b => `<option value="banco:${b._id}">${escapeHtml(b.nombre)} (saldo ${money(b.saldo)})</option>`).join('')
    || '<option value="">No tenés ningún banco habilitado — pedile a un administrador que te habilite uno desde Configuración</option>';
}
function actualizarTipoValorCobro(){
  const tipoValor = document.getElementById('ncTipoValor').value;
  const esCheque = tipoValor === 'cheque';
  const esTarjeta = tipoValor === 'tarjeta';
  document.getElementById('ncCuentaWrap').classList.toggle('hidden', esCheque);
  document.getElementById('ncChequeWrap').classList.toggle('hidden', !esCheque);
  document.getElementById('ncTarjetaWrap').classList.toggle('hidden', !esTarjeta);
  if (!esCheque) {
    document.getElementById('ncCuentaLabel').textContent = tipoValor === 'efectivo' ? '¿A qué caja va? *' : '¿A qué banco va? *';
    document.getElementById('ncCuenta').innerHTML = opcionesCuentaCobro(tipoValor);
  }
}
function abrirCobro(id){
  const v = ventasCache.find(x => x._id === id);
  if (!v) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Registrar cobro — venta #${v.numero}</h2>
        <p class="muted">Saldo pendiente: ${money(v.saldoPendiente)}</p>
        <div class="grid2">
          <div><label>Tipo de valor *</label><select id="ncTipoValor" onchange="actualizarTipoValorCobro()"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option><option value="cuenta">Cuenta (transferencia)</option><option value="tarjeta">Tarjeta</option></select></div>
          <div><label>Monto *</label><input id="ncMonto" type="number" min="0.01" step="0.01" value="${v.saldoPendiente}"></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div id="ncCuentaWrap"><label id="ncCuentaLabel">¿A qué caja va? *</label><select id="ncCuenta">${opcionesCuentaCobro('efectivo')}</select></div>
          <div><label>Fecha *</label><input id="ncFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <div id="ncChequeWrap" class="hidden" style="margin-top:10px">
          <div class="grid2">
            <div><label>Número de cheque *</label><input id="ncChequeNumero"></div>
            <div><label>Banco emisor</label><input id="ncChequeBanco"></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Librador</label><input id="ncChequeLibrador" placeholder="Si es distinto del cliente"></div>
            <div><label>CUIT del librador</label><input id="ncChequeCuit" placeholder="Opcional"></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Fecha de emisión</label><input id="ncChequeFechaEmision" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
            <div><label>Vencimiento *</label><input id="ncChequeVencimiento" type="date"></div>
          </div>
        </div>
        <div id="ncTarjetaWrap" class="hidden" style="margin-top:10px">
          <div class="grid2">
            <div><label>Entidad/tarjeta</label><input id="ncTarjetaEntidad" placeholder="Ej: Visa, Mastercard"></div>
            <div><label>Tipo</label><select id="ncTarjetaTipo"><option value="credito">Crédito</option><option value="debito">Débito</option></select></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Cuotas</label><input id="ncTarjetaCuotas" type="number" min="1" step="1" value="1"></div>
            <div><label>Lote *</label><input id="ncTarjetaLote"></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <div><label>Cupón *</label><input id="ncTarjetaCupon"></div>
            <div><label>Código de autorización</label><input id="ncTarjetaCodigoAutorizacion" placeholder="Opcional"></div>
          </div>
        </div>
        <div style="margin-top:10px"><label>Nota</label><input id="ncNota" placeholder="Opcional"></div>
        <div class="err" id="ncErr"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarCobro('${id}')">Registrar</button>
      </div>
    </div>
  `;
}

async function confirmarCobro(id){
  const tipoValor = document.getElementById('ncTipoValor').value;
  const body = {
    tipoValor,
    monto: Number(document.getElementById('ncMonto').value),
    fecha: document.getElementById('ncFecha').value,
    nota: document.getElementById('ncNota').value.trim()
  };
  if (!body.monto || body.monto <= 0) { document.getElementById('ncErr').textContent = 'El monto tiene que ser mayor a 0'; return; }
  if (tipoValor === 'cheque') {
    body.chequeNumero = document.getElementById('ncChequeNumero').value.trim();
    body.chequeBanco = document.getElementById('ncChequeBanco').value.trim();
    body.chequeLibrador = document.getElementById('ncChequeLibrador').value.trim();
    body.chequeCuitLibrador = document.getElementById('ncChequeCuit').value.trim();
    body.chequeFechaEmision = document.getElementById('ncChequeFechaEmision').value;
    body.chequeFechaVencimiento = document.getElementById('ncChequeVencimiento').value;
    if (!body.chequeNumero) { document.getElementById('ncErr').textContent = 'Falta el número de cheque'; return; }
    if (!body.chequeFechaVencimiento) { document.getElementById('ncErr').textContent = 'Falta la fecha de vencimiento del cheque'; return; }
  } else {
    const cuenta = document.getElementById('ncCuenta').value;
    if (!cuenta) { document.getElementById('ncErr').textContent = tipoValor === 'efectivo' ? 'Elegí a qué caja va el cobro' : 'Elegí a qué banco va el cobro'; return; }
    const [cuentaTipo, cuentaId] = cuenta.split(':');
    body.cuentaTipo = cuentaTipo;
    body.cuentaId = cuentaId;
    if (tipoValor === 'tarjeta') {
      body.tarjetaEntidad = document.getElementById('ncTarjetaEntidad').value.trim();
      body.tarjetaTipo = document.getElementById('ncTarjetaTipo').value;
      body.tarjetaCuotas = Number(document.getElementById('ncTarjetaCuotas').value) || 1;
      body.tarjetaLote = document.getElementById('ncTarjetaLote').value.trim();
      body.tarjetaCupon = document.getElementById('ncTarjetaCupon').value.trim();
      body.tarjetaCodigoAutorizacion = document.getElementById('ncTarjetaCodigoAutorizacion').value.trim();
      if (!body.tarjetaLote) { document.getElementById('ncErr').textContent = 'Falta el número de lote'; return; }
      if (!body.tarjetaCupon) { document.getElementById('ncErr').textContent = 'Falta el número de cupón'; return; }
    }
  }
  try{
    const r = await fetch(BASE + '/' + id + '/pagos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarVentas();
    verDetalle(id);
  }catch(e){
    document.getElementById('ncErr').textContent = e.message;
  }
}

async function anularVenta(id){
  const v = ventasCache.find(x => x._id === id);
  const motivo = prompt('¿Por qué se anula esta venta? (opcional)') || '';
  if (motivo === null) return;
  if (!confirm(`¿Anular la venta #${v.numero}?${v.stockDescontado ? ' Se va a reingresar el stock descontado.' : ''}`)) return;
  try{
    const r = await fetch(BASE + '/' + id + '/anular', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({motivo})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarVentas();
    verDetalle(id);
  }catch(e){
    alert(e.message);
  }
}

// Export en Excel (.xlsx) — ver importExport.js en el backend. Solo
// export: una venta se genera operativamente, no se carga masiva.
async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
</script>
