<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --warn:#b7791f; --warn-soft:#fdf3d9;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.pendiente{background:var(--warn-soft);color:var(--warn);}
  .pill.entregada{background:var(--ok-soft);color:var(--ok);}
  .pill.anulada{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:860px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin:14px 0 10px;}
  .fila-item{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .fila-item .campo-producto{flex:2;min-width:160px;}
  .fila-item .campo-cant{flex:1;min-width:100px;}
  .fila-item .campo-cant-bulto{flex:1;min-width:100px;}
  .fila-item .campo-precio{flex:1;min-width:100px;}
  .fila-item .campo-subtotal{flex:1;min-width:90px;text-align:right;font-weight:700;padding-top:8px;}
  .fila-item .btn-quitar{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--danger);border-radius:8px;width:36px;height:36px;font-size:15px;font-weight:700;cursor:pointer;}
  .totales-box{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;}
  .totales-box .fila-total{display:flex;justify-content:space-between;padding:2px 0;}
  .totales-box .fila-total.grande{font-size:16px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  .detalle-pago{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14;
      --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14;
    --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Ventas</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Ventas. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Ventas</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:180px">
            <label>Cliente</label>
            <select id="fvCliente" onchange="cargarVentas()"><option value="">Todos</option></select>
          </div>
          <div style="min-width:150px">
            <label>Estado</label>
            <select id="fvEstado" onchange="cargarVentas()">
              <option value="">Todos</option>
              <option value="pendiente">Pendiente</option>
              <option value="entregada">Entregada</option>
              <option value="anulada">Anulada</option>
            </select>
          </div>
          <div style="min-width:140px">
            <label>Desde</label>
            <input id="fvDesde" type="date" onchange="cargarVentas()">
          </div>
          <div style="min-width:140px">
            <label>Hasta</label>
            <input id="fvHasta" type="date" onchange="cargarVentas()">
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" onclick="descargarBlob(BASE + '/export', 'ventas.xlsx')">Exportar</button>
          <button class="btn" onclick="abrirNuevaVenta()">+ Nueva venta</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Nº</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Cobrado</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
        <tbody id="ventasBody"><tr><td colspan="8" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/ventas';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
// Variantes con organización explícita (1/10/2026, selector de Sucursal en
// Nueva venta) — para pedir datos de OTRA organización sin pisar la que
// está activa globalmente (ORG/localStorage), que sigue siendo la que usa
// el resto de la pantalla.
function headersAuthOrg(orgId, extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  h['x-org-id'] = orgId || ORG;
  return h;
}
function headersAuthJsonOrg(orgId, extra){ return headersAuthOrg(orgId, Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }
function fechaHora(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('es-AR'); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
let meCache = null;
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    meCache = me;
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('ventas'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'ventas', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarListasBase();
  await cargarVentas();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// -------------------------------------------------------------------
// Clientes, productos y depósitos — se cargan una sola vez al entrar
// -------------------------------------------------------------------
let clientesCache = [];
let productosCache = [];
let depositosCache = [];
// Listas de precio de Productos (30/9/2026) — se piden acá también porque
// GET /api/productos/listas-precio acepta acceso de 'productos' O 'ventas'
// (ver authListasPrecio en productos.js). Se usan solo para sugerir el
// precio unitario al armar una venta; el precio de cada ítem sigue siendo
// editable a mano como siempre.
let listasPrecioCache = [];
// `orgId` opcional (1/10/2026, selector de Sucursal en Nueva venta): sin
// él, carga todo para la organización activa globalmente y repuebla el
// filtro de la pantalla de listado. Con él, trae los datos de ESA otra
// organización sin tocar la activa — se usa al cambiar de sucursal adentro
// del formulario de carga, donde clientes/productos/depósitos disponibles
// dependen de qué organización se eligió para esa venta puntual.
async function cargarListasBase(orgId){
  const h = orgId ? headersAuthOrg(orgId) : headersAuth();
  const [rc, rp, rd, rl] = await Promise.all([
    fetch(BASE + '/clientes', {headers: h}),
    fetch(BASE + '/productos', {headers: h}),
    fetch(BASE + '/depositos', {headers: h}),
    fetch('/api/productos/listas-precio', {headers: h})
  ]);
  clientesCache = rc.ok ? await rc.json() : [];
  productosCache = rp.ok ? await rp.json() : [];
  depositosCache = rd.ok ? await rd.json() : [];
  listasPrecioCache = rl.ok ? await rl.json() : [];
  if (!orgId) {
    document.getElementById('fvCliente').innerHTML = '<option value="">Todos</option>' +
      clientesCache.map(c => `<option value="${c._id}">${escapeHtml(c.apellidoRazonSocial || c.nombre || '(sin nombre)')}</option>`).join('');
  }
}

// Misma lógica que precioResuelto() en productos.js: un override puntual
// manda; si no hay, se calcula costo + % de la lista.
// No todas las listas tienen todo el catálogo (1/10/2026) — si la lista
// es de alcance "selección" y el producto no está en sus productosIds, no
// hay precio sugerido de esa lista: el llamador cae al precio general
// del producto (ver actualizarFilaVenta), como si no hubiera lista elegida.
function precioResueltoVenta(producto, lista){
  if (!producto || !lista) return null;
  if (lista.alcance === 'seleccion' && !(lista.productosIds || []).some(id => String(id) === String(producto._id))) return null;
  const overrides = producto.preciosPorLista || [];
  const ov = overrides.find(x => String(x.listaId) === String(lista._id));
  if (ov) return ov.precio;
  if (lista.formula === 'cf_x_bulto') {
    if (producto.precio == null) return null;
    const bultos = (producto.unidadesPorBulto && producto.unidadesPorBulto > 0) ? producto.unidadesPorBulto : 1;
    return Math.round(producto.precio * bultos * 100) / 100;
  }
  if (producto.costo == null) return null;
  return Math.round(producto.costo * (1 + (lista.porcentaje || 0) / 100) * 100) / 100;
}
function opcionesListasPrecioVenta(seleccionada){
  const activas = listasPrecioCache.filter(l => l.activa !== false);
  return activas.map(l =>
    `<option value="${l._id}" ${String(l._id)===String(seleccionada)?'selected':''}>${escapeHtml(l.nombre)}</option>`
  ).join('');
}
function listaPrecioSeleccionadaVenta(){
  const select = document.getElementById('nvListaPrecio');
  const id = select ? select.value : '';
  return listasPrecioCache.find(l => String(l._id) === String(id)) || null;
}

// -------------------------------------------------------------------
// Listado de ventas
// -------------------------------------------------------------------
const ESTADO_LABEL = { pendiente: 'Pendiente', entregada: 'Entregada', anulada: 'Anulada' };
let ventasCache = [];

async function cargarVentas(){
  const params = new URLSearchParams();
  if (document.getElementById('fvCliente').value) params.set('clienteId', document.getElementById('fvCliente').value);
  if (document.getElementById('fvEstado').value) params.set('estado', document.getElementById('fvEstado').value);
  if (document.getElementById('fvDesde').value) params.set('desde', document.getElementById('fvDesde').value);
  if (document.getElementById('fvHasta').value) params.set('hasta', document.getElementById('fvHasta').value);
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('ventasBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="8" class="err">No se pudo cargar.</td></tr>'; return; }
  ventasCache = await r.json();
  if (!ventasCache.length) { body.innerHTML = '<tr><td colspan="8" class="muted">No hay ventas cargadas todavía.</td></tr>'; return; }
  body.innerHTML = ventasCache.map(v => `
    <tr>
      <td><strong>${v.tipoComprobante === 'fiscal' ? 'F' : 'X'}-${String(v.numero).padStart(5,'0')}</strong></td>
      <td class="muted">${fechaCorta(v.fecha)}</td>
      <td>${escapeHtml(v.clienteNombre)}</td>
      <td>${money(v.total)}</td>
      <td class="muted">${money(v.totalCobrado)}</td>
      <td>${v.saldoPendiente > 0 ? money(v.saldoPendiente) : '<span class="muted">—</span>'}</td>
      <td><span class="pill ${v.estado}">${ESTADO_LABEL[v.estado]||v.estado}</span></td>
      <td><button class="btn small secondary" onclick="verDetalle('${v._id}')">Ver</button></td>
    </tr>
  `).join('');
}

// -------------------------------------------------------------------
// Nueva venta
// -------------------------------------------------------------------
function opcionesClientesSelect(seleccionado){
  return '<option value="">Elegí un cliente…</option>' + clientesCache.map(c =>
    `<option value="${c._id}" ${c._id===seleccionado?'selected':''}>${escapeHtml(c.apellidoRazonSocial || c.nombre || '(sin nombre)')}</option>`
  ).join('');
}
function opcionesProductosVenta(seleccionado){
  return '<option value="">Elegí un producto…</option>' + productosCache.map(p =>
    `<option value="${p._id}" ${p._id===seleccionado?'selected':''}>${escapeHtml(p.sku||'')} — ${escapeHtml(p.nombre)}</option>`
  ).join('');
}
function opcionesDepositosVenta(seleccionado){
  return '<option value="">Elegí un depósito…</option>' + depositosCache.filter(d => d.activo !== false).map(d =>
    `<option value="${d._id}" ${d._id===seleccionado?'selected':''}>${escapeHtml(d.nombre)}</option>`
  ).join('');
}
// Sucursal = organización (1/10/2026, pedido de Mato) — es el mismo
// concepto que ya usa toda la app (orgId/resolverOrg/filtroOrg), acá
// expuesto con ese nombre porque es como Mato lo llama en el día a día. Se
// muestra el selector solo si el usuario tiene acceso a más de una (o es
// Administrador general) — si solo tiene una, se usa esa sin preguntar,
// igual que en el resto de la app.
function opcionesSucursalVenta(seleccionado){
  const orgs = (meCache && meCache.organizaciones) || [];
  return orgs.map(o => `<option value="${o._id}" ${String(o._id)===String(seleccionado)?'selected':''}>${escapeHtml(o.nombre)}</option>`).join('');
}
function puedeElegirSucursal(){
  const orgs = (meCache && meCache.organizaciones) || [];
  return orgs.length > 1 || !!(meCache && meCache.puedeVerTodas);
}

// Tipo de comprobante (1/10/2026, preparación para el módulo de ARCA —
// ver ventas.js). Por ahora ninguno de los dos es un comprobante fiscal de
// verdad, es solo para separar la numeración de antemano.
const TIPO_COMPROBANTE_LABEL = {
  comprobante_x: 'Comprobante X (interno, no fiscal)',
  fiscal: 'Fiscal (para cuando esté ARCA)'
};

let ventaOrgSeleccionada = '';

function abrirNuevaVenta(){
  ventaOrgSeleccionada = ORG;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal wide">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Nueva venta</h2>
        ${puedeElegirSucursal() ? `

// Etiquetas de unidad (1/10/2026, pedido de Mato: "que identifique la
// unidad de medida") — mismas unidades que ofrece Productos.
const UNIDAD_LABEL_VENTA = { unidad:'Unidad', m2:'m²', ml:'Metro lineal', kg:'Kilo', litro:'Litro', paquete:'Paquete', jornal:'Jornal' };

function agregarFilaVenta(){
  const cont = document.getElementById('nvFilasItems');
  const fila = document.createElement('div');
  fila.className = 'fila-item';
  fila.innerHTML = `
    <div class="campo-producto">

    </div>

      <label>Cantidad <span class="muted unidad-indicador"></span></label>
      <input type="number" min="0.01" step="0.01" value="1" class="cant-unidad" oninput="sincronizarCantidadVenta(this,'unidad')">
    </div>

      <label>Bultos</label>
      <input type="number" min="0.01" step="0.01" class="cant-bulto" oninput="sincronizarCantidadVenta(this,'bulto')">

      <label>Precio unit.</label>
      <input type="number" min="0" step="0.01" value="0" oninput="actualizarTotalesVenta()">

// Si el producto elegido tiene "Unidades por bulto" cargado en su ficha
// (ej: 1 bulto = 1,44 m²), se muestran los dos campos (unidad real y
// bultos) al mismo tiempo, sincronizados en vivo en los dos sentidos
// (1/10/2026, pedido de Mato: "que me muestre ambas medidas... de esa
// manera veo la conversión en el momento, no quiero que me haga
// desplegar y elegir uno u otro"). El valor que se manda a la venta
// (precio y stock) siempre es en la unidad real del producto — el campo
// de bultos es solo una ayuda para cargar más rápido. Sin bultos
// cargados en la ficha, el campo de bultos ni aparece (como antes).
function redondear2(n){ return Math.round((Number(n)||0) * 100) / 100; }

function sincronizarCantidadVenta(el, origen){
  const fila = el.closest('.fila-item');
  const select = fila.querySelector('.campo-producto select');
  const producto = productosCache.find(p => String(p._id) === select.value);
  const unidadInput = fila.querySelector('.cant-unidad');
  const bultoInput = fila.querySelector('.cant-bulto');
  if (producto && producto.unidadesPorBulto) {
    if (origen === 'unidad') {
      bultoInput.value = redondear2((Number(unidadInput.value) || 0) / producto.unidadesPorBulto);
    } else {
      unidadInput.value = redondear2((Number(bultoInput.value) || 0) * producto.unidadesPorBulto);
    }
  }
  actualizarTotalesVenta();
}

function cantidadBaseDeFila(fila){
  return Number(fila.querySelector('.cant-unidad').value) || 0;
}

function actualizarFilaVenta(el){
  const fila = el.closest('.fila-item');
  const select = fila.querySelector('.campo-producto select');
  const precioInput = fila.querySelector('.campo-precio input');
  const bultoWrap = fila.querySelector('.campo-cant-bulto');
  const unidadInput = fila.querySelector('.cant-unidad');
  const unidadIndicador = fila.querySelector('.unidad-indicador');
  const producto = productosCache.find(p => String(p._id) === select.value);

  if (el === select) {
    const lista = listaPrecioSeleccionadaVenta();
    const precio = producto ? precioResueltoVenta(producto, lista) : null;
    // Si no hay lista seleccionada o el producto no tiene costo cargado,
    // se cae al precio general del producto (como antes de esta función).
    precioInput.value = precio != null ? precio : (producto ? (producto.precio || 0) : 0);
    unidadIndicador.textContent = producto ? (UNIDAD_LABEL_VENTA[producto.unidad] || producto.unidad || '') : '';
    bultoWrap.classList.toggle('hidden', !(producto && producto.unidadesPorBulto > 0));
    if (producto && producto.unidadesPorBulto) {
      sincronizarCantidadVenta(unidadInput, 'unidad');
    }
  }

  actualizarTotalesVenta();
}

// Al cambiar la lista de precio elegida, recalcula el precio sugerido de
// cada fila YA cargada (30/9/2026) — sigue siendo editable a mano después.
function recalcularPreciosPorListaVenta(){
  const lista = listaPrecioSeleccionadaVenta();
  document.querySelectorAll('#nvFilasItems .fila-item').forEach(fila => {
    const select = fila.querySelector('.campo-producto select');
    if (!select.value) return;
    const producto = productosCache.find(p => String(p._id) === select.value);
    const precioInput = fila.querySelector('.campo-precio input');
    const precio = producto ? precioResueltoVenta(producto, lista) : null;
    precioInput.value = precio != null ? precio : (producto ? (producto.precio || 0) : 0);
  });
  actualizarTotalesVenta();
}

function juntarItemsVenta(){
  const filas = document.querySelectorAll('#nvFilasItems .fila-item');
  const items = [];
  filas.forEach(fila => {
    const select = fila.querySelector('.campo-producto select');
    const cantidad = cantidadBaseDeFila(fila);
    const precioUnitario = Number(fila.querySelector('.campo-precio input').value);
    if (select.value && cantidad > 0) items.push({ productoId: select.value, cantidad, precioUnitario });
  });
  return items;
}

function actualizarTotalesVenta(){
  const filas = document.querySelectorAll('#nvFilasItems .fila-item');
  let subtotal = 0;
  filas.forEach(fila => {
    const cantidad = cantidadBaseDeFila(fila);
    const precioUnitario = Number(fila.querySelector('.campo-precio input').value) || 0;
    const sub = cantidad * precioUnitario;
    subtotal += sub;
    fila.querySelector('.subtotal-valor').textContent = money(sub);
  });
  const descPorc = Number(document.getElementById('nvDescuentoPorcentaje').value) || 0;
  const descMonto = Number(document.getElementById('nvDescuentoMonto').value) || 0;
  let total = subtotal;
  if (descPorc) total -= total * (descPorc / 100);
  if (descMonto) total -= descMonto;
  total = Math.max(0, total);
  document.getElementById('nvTotales').innerHTML = `
    <div class="fila-total"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    <div class="fila-total grande"><span>Total</span><span>${money(total)}</span></div>
  `;
}

async function guardarNuevaVenta(){
  const items = juntarItemsVenta();
  const tipoEntrega = document.getElementById('nvTipoEntrega').value;
  const body = {
    clienteId: document.getElementById('nvCliente').value,
    vendedor: document.getElementById('nvVendedor').value.trim(),
    fecha: document.getElementById('nvFecha').value,
    moneda: document.getElementById('nvMoneda').value,
    tipoEntrega,
    tipoComprobante: document.getElementById('nvTipoComprobante') ? document.getElementById('nvTipoComprobante').value : 'comprobante_x',
    depositoId: tipoEntrega === 'inmediata' ? document.getElementById('nvDeposito').value : null,
    listaPrecioId: document.getElementById('nvListaPrecio') ? (document.getElementById('nvListaPrecio').value || null) : null,
    items,
    descuentoPorcentaje: Number(document.getElementById('nvDescuentoPorcentaje').value) || 0,
    descuentoMonto: Number(document.getElementById('nvDescuentoMonto').value) || 0,
    observaciones: document.getElementById('nvObservaciones').value.trim()
  };
  document.getElementById('nvErr').textContent = '';
  if (!body.clienteId) { document.getElementById('nvErr').textContent = 'Elegí un cliente'; return; }
  if (!items.length) { document.getElementById('nvErr').textContent = 'Agregá al menos un producto'; return; }
  if (tipoEntrega === 'inmediata' && !body.depositoId) { document.getElementById('nvErr').textContent = 'Elegí a qué depósito le vas a descontar el stock'; return; }
  try{
    // La venta se guarda en la sucursal elegida en el formulario (puede ser
    // distinta de la sucursal activa del resto de la pantalla, ver
    // cambiarSucursalVenta) — por eso headersAuthJsonOrg en vez de
    // headersAuthJson acá.
    const r = await fetch(BASE, {method:'POST', headers: headersAuthJsonOrg(ventaOrgSeleccionada), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al guardar');
    cerrarModal();
    if (ventaOrgSeleccionada === ORG) await cargarVentas();
    // Si se guardó en OTRA sucursal, el listado actual (de la sucursal
    // activa) no la muestra — es esperado, no hace falta recargar nada acá.
  }catch(e){
    document.getElementById('nvErr').textContent = e.message;
  }
}

        </p>
        <table>
          <thead><tr><th>SKU</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
          <tbody>${filasItems}</tbody>
        </table>
        <div class="totales-box">
          <div class="fila-total"><span>Subtotal</span><span>${money(v.subtotal)}</span></div>
          ${v.descuentoPorcentaje ? `<div class="fila-total"><span>Descuento (${v.descuentoPorcentaje}%)</span><span>-${money(v.subtotal*v.descuentoPorcentaje/100)}</span></div>` : ''}

        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Entregar venta #${v.numero}</h2>
        <p class="muted">Esto va a descontar el stock de los productos de la venta. No se puede deshacer — si hace falta corregir, se anula la venta.</p>
        <label>Depósito *</label>
        <select id="ntDeposito">${opcionesDepositosVenta(v.depositoId)}</select>
        <div class="err" id="ntErr"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarEntregar('${id}')">Confirmar entrega</button>
      </div>
    </div>
  `;
}

async function confirmarEntregar(id){
  const depositoId = document.getElementById('ntDeposito').value;
  if (!depositoId) { document.getElementById('ntErr').textContent = 'Elegí un depósito'; return; }
  try{
    const r = await fetch(BASE + '/' + id + '/entregar', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({depositoId})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarVentas();
    verDetalle(id);
  }catch(e){
    document.getElementById('ntErr').textContent = e.message;
  }
}

function abrirCobro(id){
  const v = ventasCache.find(x => x._id === id);
  if (!v) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Registrar cobro — venta #${v.numero}</h2>
        <p class="muted">Saldo pendiente: ${money(v.saldoPendiente)}</p>
        <div class="grid2">
          <div><label>Tipo de valor *</label><select id="ncTipoValor"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option><option value="cuenta">Cuenta</option><option value="tarjeta">Tarjeta</option></select></div>
          <div><label>Monto *</label><input id="ncMonto" type="number" min="0.01" step="0.01" value="${v.saldoPendiente}"></div>
        </div>
        <div style="margin-top:10px"><label>Nota</label><input id="ncNota" placeholder="Opcional"></div>
        <div class="err" id="ncErr"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarCobro('${id}')">Registrar</button>
      </div>
    </div>
  `;
}

async function confirmarCobro(id){
  const body = {
    tipoValor: document.getElementById('ncTipoValor').value,
    monto: Number(document.getElementById('ncMonto').value),
    nota: document.getElementById('ncNota').value.trim()
  };
  if (!body.monto || body.monto <= 0) { document.getElementById('ncErr').textContent = 'El monto tiene que ser mayor a 0'; return; }
  try{
    const r = await fetch(BASE + '/' + id + '/pagos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarVentas();
    verDetalle(id);
  }catch(e){
    document.getElementById('ncErr').textContent = e.message;
  }
}

async function anularVenta(id){
  const v = ventasCache.find(x => x._id === id);
  const motivo = prompt('¿Por qué se anula esta venta? (opcional)') || '';
  if (motivo === null) return;
  if (!confirm(`¿Anular la venta #${v.numero}?${v.stockDescontado ? ' Se va a reingresar el stock descontado.' : ''}`)) return;
  try{
    const r = await fetch(BASE + '/' + id + '/anular', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({motivo})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarVentas();
    verDetalle(id);
  }catch(e){
    alert(e.message);
  }
}

// Export en Excel (.xlsx) — ver importExport.js en el backend. Solo
// export: una venta se genera operativamente, no se carga masiva.
async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
</script>
