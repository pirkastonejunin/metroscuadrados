<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación por sucursal - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea; --danger:#c53030; --danger-soft:#fbe4e1; --piedra:#5d646d;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8; --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316; --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f; --piedra:#9aa0a8; --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5); }
  }
  :root[data-theme="dark"] { --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8; --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316; --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f; --piedra:#9aa0a8; --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5); }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  main{padding:20px;max-width:1280px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .muted{color:var(--muted);font-size:12px;} .hidden{display:none !important;} .err{color:var(--danger);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;} #loginScreen .card{width:300px;text-align:center;}
  .tb-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .tb-filtros select,.tb-filtros input{width:auto;font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);}
  .tb-info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:800;cursor:help;margin-left:auto;}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;min-width:0;}
  .kpi .et{font-size:13px;font-weight:700;color:var(--muted);}
  .kpi .val{font-size:clamp(1.5rem,2.4vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 8px;white-space:nowrap;}
  .kpi .det{font-size:12px;font-weight:600;color:var(--muted);min-height:1.2em;}
  .kpi.oscuro{color:#f3f1ee;border:0;background:radial-gradient(120% 140% at 0% 0%,#34373c 0%,#1d1f22 55%,#141517 100%);box-shadow:0 18px 40px -24px rgba(0,0,0,.55);}
  .kpi.oscuro .et,.kpi.oscuro .det{color:#aeb2b8;}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .tag.ok{background:var(--ok-soft);color:var(--ok);} .tag.mal{background:var(--danger-soft);color:var(--danger);} .tag.neu{background:var(--bg);color:var(--muted);}
  .tabla{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:6px 18px 10px;overflow-x:auto;}
  .tabla h3{margin:14px 0 6px;font-size:15px;font-weight:800;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:11px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;font-weight:700;}
  th{font-size:12px;color:var(--muted);font-weight:700;}
  tbody tr:last-child td{border-bottom:0;}
  tr.total td{font-weight:800;border-top:2px solid var(--border);}
  td.pos{color:var(--ok);font-weight:700;} td.neg{color:var(--danger);font-weight:700;}
  @media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Facturación</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button data-iconizado="1" class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el tablero de facturación. Pedile a un administrador que lo habilite desde Usuarios y roles.</p>
    <button data-iconizado="1" class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <main>
    <div class="tb-filtros">
      <select id="fPeriodo" aria-label="Período" onchange="preset(this.value)">
        <option value="hoy">Hoy</option><option value="semana">Esta semana</option><option value="mes" selected>Este mes</option>
        <option value="mespasado">Mes pasado</option><option value="30">Últimos 30 días</option><option value="anio">Este año</option><option value="custom">Personalizado</option>
      </select>
      <input type="date" id="fDesde" aria-label="Desde" onchange="$('fPeriodo').value='custom';cargar()">
      <input type="date" id="fHasta" aria-label="Hasta" onchange="$('fPeriodo').value='custom';cargar()">
      <span class="muted" id="topbarUser" style="margin-left:6px"></span>
      <span class="tb-info" title="Facturación: ventas del período con IVA, restando notas de crédito. Cobros: lo cobrado a clientes en el período. Pagos: lo pagado a proveedores y gastos en el período. Posición fiscal: IVA de ventas menos IVA de compras del período (positivo = IVA a pagar, negativo = saldo a favor); no incluye percepciones ni retenciones. Saldos de deuda: lo que falta cobrar menos lo que falta pagar, a hoy (no depende del período). Ves las sucursales que tenés asignadas.">i</span>
    </div>
    <div id="err"></div>

    <div class="kpis" id="kpis"></div>
    <div class="tabla hidden" id="tablaBox">
      <h3>Por sucursal</h3>
      <table><thead><tr><th>Sucursal</th><th>Facturado</th><th>Cobros</th><th>Pagos</th><th>Posición fiscal</th><th>Saldo de deuda</th></tr></thead><tbody id="tabla"></tbody></table>
    </div>
  </main>
</div>

<script>
const BASE = '/api/facturacion';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){ const h = Object.assign({'x-admin-token':TOKEN}, extra||{}); if (ORG) h['x-org-id'] = ORG; return h; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
const pesos = n => (n < 0 ? '-$ ' : '$ ') + Math.round(Math.abs(n || 0)).toLocaleString('es-AR');

async function login(){
  const usuario = $('loginUser').value, pass = $('loginPass').value;
  $('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token; localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){ $('loginErr').textContent = e.message; }
}
function logout(){ localStorage.removeItem('obras_admin_token'); location.reload(); }

const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
function preset(v){
  if (v === 'custom') return;
  const hoy = new Date(); hoy.setHours(12,0,0,0);
  let d = new Date(hoy), h = new Date(hoy);
  if (v === 'semana') d.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
  else if (v === 'mes') d = new Date(hoy.getFullYear(), hoy.getMonth(), 1, 12);
  else if (v === 'mespasado') { d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1, 12); h = new Date(hoy.getFullYear(), hoy.getMonth(), 0, 12); }
  else if (v === '30') d.setDate(hoy.getDate() - 29);
  else if (v === 'anio') d = new Date(hoy.getFullYear(), 0, 1, 12);
  $('fDesde').value = iso(d); $('fHasta').value = iso(h);
  if (!$('app').classList.contains('hidden')) cargar();
}

async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; $('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    const ok = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('tablero_facturacion'));
    if (!ok) { $('loginScreen').classList.add('hidden'); $('sinAccesoScreen').classList.remove('hidden'); return; }
  }catch(e){ $('loginErr').textContent = 'No se pudo validar la sesión.'; return; }
  PiedraSidebar.render(me, 'facturacion');
  document.title = 'Facturación por sucursal - Piedra Negra';
  $('loginScreen').classList.add('hidden'); $('sinAccesoScreen').classList.add('hidden'); $('app').classList.remove('hidden');
  $('topbarUser').textContent = (me.usuario && me.usuario.nombre) || '';
  preset('mes');
  await cargar();
}
if (TOKEN) iniciarApp(); else $('loginScreen').classList.remove('hidden');

const clase = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
function kpi(et, valor, det, oscuro, tip){
  return '<div class="kpi' + (oscuro ? ' oscuro' : '') + '" title="' + escapeHtml(tip || '') + '"><div class="et">' + et + '</div><div class="val">' + valor + '</div><div class="det">' + det + '</div></div>';
}
function tag(texto, tipo){ return '<span class="tag ' + tipo + '">' + texto + '</span>'; }

async function cargar(){
  $('err').innerHTML = '';
  const qs = new URLSearchParams({desde: $('fDesde').value, hasta: $('fHasta').value});
  let d;
  try{
    const r = await fetch(BASE + '/resumen?' + qs, {headers: headersAuth()});
    d = await r.json(); if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  }catch(e){ $('err').innerHTML = '<div class="err">No se pudo cargar: ' + escapeHtml(e.message) + '</div>'; return; }
  const T = d.total, S = d.sucursales.slice().sort((a, b) => b.facturado - a.facturado);
  const pf = T.posicionFiscal;
  $('kpis').innerHTML =
    kpi('Facturación', pesos(T.facturado), S.length > 1 ? S.length + ' sucursales' : (S[0] ? escapeHtml(S[0].nombre) : ''), true, 'Ventas del período con IVA, restando notas de crédito') +
    kpi('Cobros menos pagos', pesos(T.flujoNeto), tag(T.flujoNeto >= 0 ? 'cobraste más' : 'pagaste más', T.flujoNeto >= 0 ? 'ok' : 'mal'), false, 'Cobros ' + pesos(T.cobros) + ' · Pagos ' + pesos(T.pagos)) +
    kpi('Posición fiscal', pesos(Math.abs(pf)), tag(pf > 0 ? 'IVA a pagar' : (pf < 0 ? 'saldo a favor' : 'sin saldo'), pf > 0 ? 'mal' : (pf < 0 ? 'ok' : 'neu')), false, 'IVA ventas ' + pesos(T.ivaVentas) + ' · IVA compras ' + pesos(T.ivaCompras)) +
    kpi('Saldo de deuda', pesos(T.saldoNeto), tag(T.saldoNeto >= 0 ? 'te deben más' : 'debés más', T.saldoNeto >= 0 ? 'ok' : 'mal'), false, 'Por cobrar ' + pesos(T.porCobrar) + ' · Por pagar ' + pesos(T.porPagar));

  // Tabla por sucursal (solo si hay más de una)
  $('tablaBox').classList.toggle('hidden', S.length < 2);
  const fila = (s, cls) => '<tr class="' + (cls || '') + '"><td>' + escapeHtml(s.nombre) + '</td><td>' + pesos(s.facturado) + '</td>' +
    '<td title="Cobros del período">' + pesos(s.cobros) + '</td><td title="Pagos del período">' + pesos(s.pagos) + '</td>' +
    '<td class="' + (s.posicionFiscal > 0 ? 'neg' : (s.posicionFiscal < 0 ? 'pos' : '')) + '" title="IVA ventas ' + pesos(s.ivaVentas) + ' · IVA compras ' + pesos(s.ivaCompras) + '">' + (s.posicionFiscal > 0 ? 'a pagar ' : (s.posicionFiscal < 0 ? 'a favor ' : '')) + pesos(Math.abs(s.posicionFiscal)) + '</td>' +
    '<td class="' + clase(s.saldoNeto) + '" title="Por cobrar ' + pesos(s.porCobrar) + ' · Por pagar ' + pesos(s.porPagar) + '">' + pesos(s.saldoNeto) + '</td></tr>';
  $('tabla').innerHTML = S.map(s => fila(s)).join('') + fila(Object.assign({ nombre: 'Total' }, T), 'total');
}
</script>
</body>
</html>
