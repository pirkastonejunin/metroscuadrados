<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reiniciar datos de prueba</title>
<style>
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f7f9;color:#1b1f24;margin:0;padding:20px}
.card{max-width:640px;margin:0 auto;background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:22px}
h1{font-size:20px;margin:0 0 6px} .muted{color:#667085;font-size:13px}
table{width:100%;border-collapse:collapse;margin:14px 0} td{padding:7px 4px;border-bottom:1px solid #eee;font-size:14px} td.n{text-align:right;font-weight:700}
button{border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;background:#1b1f24;color:#fff}
button.sec{background:#fff;color:#1b1f24;border:1px solid #cfd4da} button.peligro{background:#b42318}
input{padding:9px;border:1px solid #cfd4da;border-radius:8px;font-size:14px} .err{color:#b42318;margin-top:8px} .ok{color:#067647;margin-top:8px}
</style></head><body><div class="card">
<h1>Reiniciar datos de prueba</h1>
<p class="muted">Deja en blanco ventas, remitos, cobranzas, stock, cuenta corriente y tesorería de la organización activa. Se conservan visitas, obras, presupuestos, clientes, productos, proveedores, compras y configuración. <b>No se puede deshacer</b>: bajá el respaldo antes.</p>
<div id="cont">Cargando…</div>
<div class="err" id="err"></div>
</div>
<script>
const TOKEN = localStorage.getItem('obras_admin_token') || '';
const ORG = localStorage.getItem('obras_org_activo') || '';
function h(extra){ const o = {'x-admin-token': TOKEN}; if (ORG) o['x-org-id'] = ORG; return Object.assign(o, extra||{}); }
async function cargar(){
  const el = document.getElementById('cont');
  if (!TOKEN){ el.innerHTML = 'Entrá primero al sistema con tu usuario Administrador.'; return; }
  const r = await fetch('/api/reinicio-datos/preview', {headers: h()});
  const d = await r.json();
  if (!r.ok){ el.innerHTML = ''; document.getElementById('err').textContent = d.error; return; }
  el.innerHTML = `<p><b>Organización:</b> ${d.organizacion}</p>
    <table>${d.filas.map(f => `<tr><td>${f.etiqueta}</td><td class="n">${f.cantidad}</td></tr>`).join('')}</table>
    <p class="muted">Se conserva: ${d.conservado.join(', ')}.</p>
    <p><button class="sec" onclick="respaldo()">1. Descargar respaldo</button></p>
    <p>2. Para confirmar escribí <b>BORRAR</b>: <input id="conf" autocomplete="off"> <button class="peligro" onclick="ejecutar()">Borrar ahora</button></p>`;
}
async function respaldo(){
  const r = await fetch('/api/reinicio-datos/respaldo', {headers: h()});
  if (!r.ok){ document.getElementById('err').textContent = (await r.json()).error; return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'respaldo-antes-de-reiniciar.json'; a.click();
}
async function ejecutar(){
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/reinicio-datos/ejecutar', {method:'POST', headers: h({'Content-Type':'application/json'}), body: JSON.stringify({confirmar: document.getElementById('conf').value.trim()})});
  const d = await r.json();
  if (!r.ok){ err.textContent = d.error; return; }
  document.getElementById('cont').innerHTML = '<p class="ok">Listo. Datos de prueba borrados.</p><pre class="muted">' + JSON.stringify(d.borrado, null, 1) + '</pre>';
}
cargar();
</script></body></html>
