<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.inactivo{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:500;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Productos</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Productos. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Productos</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:200px;flex:1">
            <label>Buscar (nombre o SKU)</label>
            <input id="fBusqueda" oninput="cargarProductosConPausa()" placeholder="Ej: revestimiento gris">
          </div>
          <div style="min-width:180px">
            <label>Rubro</label>
            <select id="fRubro" onchange="cargarProductos()"><option value="">Todos</option></select>
          </div>
          <div style="min-width:180px">
            <label>Marca</label>
            <select id="fMarca" onchange="cargarProductos()"><option value="">Todas</option></select>
          </div>
          <div style="min-width:200px">
            <label>Proveedor</label>
            <select id="fProveedor" onchange="cargarProductos()"><option value="">Todos</option></select>
          </div>
          <div>
            <label style="visibility:hidden">.</label>
            <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap">
              <input type="checkbox" id="fInactivos" style="width:auto" onchange="cargarProductos()"> Ver inactivos
            </label>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" title="Elegir qué columnas mostrar en la tabla" onclick="abrirColumnas()">⚙️ Columnas</button>
          <button class="btn secondary" onclick="exportarXlsx()">Exportar</button>
          <button class="btn secondary" onclick="abrirImportar()">Importar</button>
          <button class="btn secondary" onclick="abrirDuplicadosSku()">Revisar SKUs duplicados</button>
          <button class="btn secondary" onclick="abrirListasPrecio()">Listas de precio</button>
          <button class="btn" onclick="abrirNuevoProducto()">+ Nuevo producto</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div style="overflow-x:auto">
      <table>
        <thead><tr id="productosHead"></tr></thead>
        <tbody id="productosBody"><tr><td colspan="8" class="muted">Cargando...</td></tr></tbody>
      </table>
      </div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/productos';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return n==null ? '—' : '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('productos'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'productos', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarRubros();
  await cargarMarcas();
  await cargarRubrosBase();
  await cargarSubrubrosBase();
  await cargarProveedoresLite();
  await cargarProductos();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

let proveedoresCache = [];
async function cargarProveedoresLite(){
  const r = await fetch(BASE + '/proveedores-lite', {headers: headersAuth()});
  if (!r.ok) return;
  proveedoresCache = await r.json();
  const select = document.getElementById('fProveedor');
  const actual = select.value;
  select.innerHTML = '<option value="">Todos</option>' + proveedoresCache.map(p =>
    `<option value="${p._id}">${escapeHtml(p.razonSocial || p.nombreFantasia || '(sin nombre)')}</option>`
  ).join('');
  select.value = actual;
}
function opcionesProveedor(seleccionadoId){
  return '<option value="">Sin proveedor asignado</option>' + proveedoresCache.map(p =>
    `<option value="${p._id}" ${String(p._id)===String(seleccionadoId)?'selected':''}>${escapeHtml(p.razonSocial || p.nombreFantasia || '(sin nombre)')}</option>`
  ).join('');
}

async function cargarRubros(){
  const r = await fetch(BASE + '/rubros', {headers: headersAuth()});
  if (!r.ok) return;
  const rubros = await r.json();
  const select = document.getElementById('fRubro');
  const actual = select.value;
  select.innerHTML = '<option value="">Todos</option>' + rubros.map(rb => `<option value="${escapeHtml(rb)}">${escapeHtml(rb)}</option>`).join('');
  select.value = actual;
}

async function cargarMarcas(){
  const r = await fetch(BASE + '/marcas', {headers: headersAuth()});
  if (!r.ok) return;
  const marcas = await r.json();
  const select = document.getElementById('fMarca');
  const actual = select.value;
  select.innerHTML = '<option value="">Todas</option>' + marcas.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
  select.value = actual;
}

// Base de Rubros y Subrubros (1/10/2026, pedido de Mato): antes eran
// campos de texto libre en la ficha; ahora se eligen de una base que se
// administra en Configuración → Bases y catálogos (admin-config-bases.html).
// El producto sigue guardando el nombre como texto (no cambia nada del
// backend de filtros/export), solo cambia de dónde sale ese texto.
let rubrosBaseCache = [];
let subrubrosBaseCache = [];
async function cargarRubrosBase(){
  const r = await fetch(BASE + '/config/rubros', {headers: headersAuth()});
  rubrosBaseCache = r.ok ? await r.json() : [];
}
async function cargarSubrubrosBase(){
  const r = await fetch(BASE + '/config/subrubros', {headers: headersAuth()});
  subrubrosBaseCache = r.ok ? await r.json() : [];
}
// Si el producto ya tenía cargado un rubro/subrubro que ya no está activo
// en la base (se desactivó o nunca se migró), se agrega igual como opción
// seleccionada para no perder el dato — se avisa que no está en la base.
function opcionesRubroSelect(seleccionado){
  const activos = rubrosBaseCache.filter(r => r.activo !== false);
  const yaEsta = activos.some(r => r.nombre === seleccionado);
  const extra = (seleccionado && !yaEsta)
    ? `<option value="${escapeHtml(seleccionado)}" selected>${escapeHtml(seleccionado)} (no está en la base)</option>` : '';
  return '<option value="">Sin rubro</option>' + extra + activos.map(r =>
    `<option value="${escapeHtml(r.nombre)}" ${r.nombre===seleccionado?'selected':''}>${escapeHtml(r.nombre)}</option>`
  ).join('');
}
function opcionesSubrubroSelect(rubroNombre, seleccionado){
  const delRubro = subrubrosBaseCache.filter(s => s.activo !== false && s.rubroNombre === rubroNombre);
  const yaEsta = delRubro.some(s => s.nombre === seleccionado);
  const extra = (seleccionado && !yaEsta)
    ? `<option value="${escapeHtml(seleccionado)}" selected>${escapeHtml(seleccionado)} (no está en la base)</option>` : '';
  return '<option value="">Sin subrubro</option>' + extra + delRubro.map(s =>
    `<option value="${escapeHtml(s.nombre)}" ${s.nombre===seleccionado?'selected':''}>${escapeHtml(s.nombre)}</option>`
  ).join('');
}
function cambiarRubroFormulario(){
  const rubro = document.getElementById('fpRubro').value;
  document.getElementById('fpSubrubro').innerHTML = opcionesSubrubroSelect(rubro, '');
}

let productosCache = [];
// `cargarPedido` numera cada llamado a cargarProductos() — como la caja de
// búsqueda dispara un pedido por cada letra tipeada (oninput), las
// respuestas del servidor pueden volver en otro orden (la de una búsqueda
// vieja y más amplia puede tardar más y llegar DESPUÉS que la de la
// búsqueda nueva), y antes esa respuesta vieja pisaba el resultado bueno
// — por eso "encuentra el producto y después borra el filtro". Ahora cada
// respuesta se descarta si ya no es la última que se pidió.
let cargarPedido = 0;
let cargarPausaTimer = null;
// Espera un toque antes de buscar mientras se sigue tipeando, para no
// disparar un pedido por cada letra — el guard de `cargarPedido` de
// cargarProductos() ya corrige el resultado aunque esto no estuviera,
// pero así hay menos pedidos de sobra.
function cargarProductosConPausa(){
  clearTimeout(cargarPausaTimer);
  cargarPausaTimer = setTimeout(cargarProductos, 300);
}
async function cargarProductos(){
  const pedido = ++cargarPedido;
  const params = new URLSearchParams();
  if (document.getElementById('fBusqueda').value.trim()) params.set('q', document.getElementById('fBusqueda').value.trim());
  if (document.getElementById('fRubro').value) params.set('rubro', document.getElementById('fRubro').value);
  if (document.getElementById('fMarca').value) params.set('marca', document.getElementById('fMarca').value);
  if (document.getElementById('fProveedor').value) params.set('proveedorId', document.getElementById('fProveedor').value);
  if (document.getElementById('fInactivos').checked) params.set('incluirInactivos', '1');
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  if (pedido !== cargarPedido) return; // ya se pidió algo más nuevo, descartar esta respuesta
  const body = document.getElementById('productosBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="8" class="err">No se pudo cargar.</td></tr>'; return; }
  productosCache = await r.json();
  if (pedido !== cargarPedido) return; // por si se disparó otro pedido mientras se leía el body
  renderProductos();
}

const TIPO_PRODUCTO_LABEL = { simple: 'Simple', combo: 'Combo', produccion: 'De producción' };

// Columnas elegibles de la tabla de Productos (2/10/2026, pedido de
// Mato: "que me deje elegir qué columnas quiero mostrar"). SKU, Producto
// y Acciones son fijas (identifican la fila y siempre hacen falta); el
// resto se puede prender/apagar desde el botón "Columnas" y la elección
// queda guardada en este navegador.
const COLUMNAS_PRODUCTOS_DISPONIBLES = [
  { key: 'rubroMarca', titulo: 'Rubro / Marca', defecto: true,
    render: p => `<td class="muted">${[p.rubro, p.marca].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</td>` },
  { key: 'unidad', titulo: 'Unidad', defecto: true,
    render: p => `<td class="muted">${escapeHtml(p.unidad)}</td>` },
  { key: 'precio', titulo: 'Precio', defecto: true,
    render: p => `<td>${money(p.precio)}</td>` },
  { key: 'costo', titulo: 'Costo', defecto: false,
    render: p => `<td class="muted">${p.costo!=null ? (p.moneda==='USD'?'US$ ':'$ ') + Number(p.costo).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</td>` },
  { key: 'tipo', titulo: 'Tipo', defecto: true,
    render: p => `<td class="muted">${TIPO_PRODUCTO_LABEL[p.tipoProducto] || 'Simple'}</td>` },
  { key: 'proveedor', titulo: 'Proveedor', defecto: false,
    render: p => { const prov = proveedoresCache.find(x => String(x._id) === String(p.proveedorId)); return `<td class="muted">${prov ? escapeHtml(prov.razonSocial || prov.nombreFantasia || '') : (escapeHtml(p.proveedor||'') || '—')}</td>`; } },
  { key: 'estado', titulo: 'Estado', defecto: true,
    render: p => `<td><span class="pill ${p.activo === false ? 'inactivo' : 'activo'}">${p.activo === false ? 'Inactivo' : 'Activo'}</span></td>` }
];
const COLUMNAS_PRODUCTOS_KEY = 'pn_productos_columnas_v1';
function columnasProductosVisibles(){
  try{
    const guardado = JSON.parse(localStorage.getItem(COLUMNAS_PRODUCTOS_KEY) || 'null');
    if (Array.isArray(guardado)) return guardado;
  }catch(e){}
  return COLUMNAS_PRODUCTOS_DISPONIBLES.filter(c => c.defecto).map(c => c.key);
}

function abrirColumnas(){
  const visibles = columnasProductosVisibles();
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal" style="max-width:360px">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Columnas a mostrar</h2>
        <p class="muted">SKU, Producto y Acciones siempre se muestran.</p>
        ${COLUMNAS_PRODUCTOS_DISPONIBLES.map(c => `
          <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);margin-bottom:8px">
            <input type="checkbox" style="width:auto" id="col_${c.key}" ${visibles.includes(c.key)?'checked':''}> ${escapeHtml(c.titulo)}
          </label>
        `).join('')}
        <button class="btn" style="margin-top:6px" onclick="guardarColumnas()">Aplicar</button>
      </div>
    </div>
  `;
}
function guardarColumnas(){
  const elegidas = COLUMNAS_PRODUCTOS_DISPONIBLES.filter(c => document.getElementById('col_'+c.key).checked).map(c => c.key);
  localStorage.setItem(COLUMNAS_PRODUCTOS_KEY, JSON.stringify(elegidas));
  cerrarModal();
  renderProductos();
}

function renderProductos(){
  const body = document.getElementById('productosBody');
  const visibles = columnasProductosVisibles();
  const columnas = COLUMNAS_PRODUCTOS_DISPONIBLES.filter(c => visibles.includes(c.key));
  const totalCols = columnas.length + 3; // SKU, Producto y Acciones
  document.getElementById('productosHead').innerHTML =
    `<th>SKU</th><th>Producto</th>` + columnas.map(c => `<th>${escapeHtml(c.titulo)}</th>`).join('') + `<th></th>`;
  if (!productosCache.length) { body.innerHTML = `<tr><td colspan="${totalCols}" class="muted">No hay productos todavía.</td></tr>`; return; }
  body.innerHTML = productosCache.map(p => `
    <tr>
      <td><strong>${escapeHtml(p.sku)}</strong></td>
      <td>${escapeHtml(p.nombre)}${p.descripcion ? `<div class="muted">${escapeHtml(p.descripcion)}</div>` : ''}</td>
      ${columnas.map(c => c.render(p)).join('')}
      <td style="white-space:nowrap">
        <button class="btn small secondary" onclick="abrirEditarProducto('${p._id}')">Editar</button>
        ${p.activo === false ? '' : `<button class="btn small danger" onclick="desactivarProducto('${p._id}', '${escapeHtml(p.nombre).replace(/'/g,"\\'")}')">Desactivar</button>`}
      </td>
    </tr>
  `).join('');
}

  try{
    const r = await fetch('/api/costos/productos/' + p.costoProductoId, {headers: headersAuthJson()});

    const prod = await r.json();
    cont.innerHTML = `

}

// a la página pública y sus fotos (30/9/2026, pedido de Mato).
async function cargarInfoTiendanube(p){
  const cont = document.getElementById('tiendanubeInfo');

  try{
    const r = await fetch(BASE + '/tiendanube/' + encodeURIComponent(p.sku), {headers: headersAuthJson()});

async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function exportarXlsx(){ descargarBlob(BASE + '/export', 'productos.xlsx'); }

// Import asincrónico (30/9/2026): con catálogos grandes (el de Dux trae
// 20.000+ productos) el procesamiento puede tardar bastante — el POST
// ahora devuelve enseguida un `jobId` y esta función va consultando el
// progreso con GET /import/estado/:id cada 1,5s, mostrando "Procesando
// X / total" para que quede claro que sigue trabajando y no que se
// colgó. Antes esto no mostraba ningún mensaje mientras esperaba.
async function confirmarImportar(){
  const input = document.getElementById('impArchivo');
  const file = input.files[0];
  const btn = document.getElementById('impBtn');
  document.getElementById('impErr').textContent = '';
  document.getElementById('impResultado').innerHTML = '';
  if (!file) { document.getElementById('impErr').textContent = 'Elegí un archivo .xlsx o .xls'; return; }
  btn.disabled = true;
  document.getElementById('impResultado').innerHTML = '<p class="muted">Subiendo archivo...</p>';
  try{
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const r = await fetch(BASE + '/import', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');

    document.getElementById('impResultado').innerHTML =
      `<p class="muted">Procesando 0 / ${data.total}...</p>`;
    const job = await esperarJobImport(data.jobId);

    let html = `<p class="ok-msg">Creados: ${job.creados} — Actualizados: ${job.actualizados}</p>`;
    if (job.errores && job.errores.length) {
      html += `<p class="err">${job.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        job.errores.slice(0, 200).map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') +
        (job.errores.length > 200 ? `<li>... y ${job.errores.length - 200} más</li>` : '') + '</ul>';
    }
    document.getElementById('impResultado').innerHTML = html;
    await cargarRubros();
    await cargarProductos();
  }catch(e){
    document.getElementById('impErr').textContent = e.message;
  }finally{
    btn.disabled = false;
  }
}

// Consulta GET /import/estado/:id cada 1,5s hasta que el job termine
// ('listo' o 'error'). Devuelve el job final.
async function esperarJobImport(jobId){
  while (true) {
    await new Promise(res => setTimeout(res, 1500));
    const r = await fetch(BASE + '/import/estado/' + jobId, {headers: headersAuthJson()});
    const job = await r.json();
    if (!r.ok) throw new Error(job.error || 'Error consultando el progreso del import');
    if (job.estado === 'procesando') {
      document.getElementById('impResultado').innerHTML =
        `<p class="muted">Procesando ${job.procesados} / ${job.total}...</p>`;
      continue;
    }
    if (job.estado === 'error') throw new Error(job.errorGeneral || 'El import falló de forma inesperada');
    return job;
  }
}

// Igual que esperarJobImport, pero para los imports de listas de precio
// (1/10/2026, pedido de Mato: "que lo haga en segundo plano o que me vaya
// avisando el progreso porque no puedo ver si esta trabado o no"):
// actualiza el contenedor de resultado indicado mientras el job corre.
async function esperarJobImportListaPrecio(jobId, contenedorId){
  while (true) {
    await new Promise(res => setTimeout(res, 1500));
    const r = await fetch(BASE + '/import/estado/' + jobId, {headers: headersAuthJson()});
    const job = await r.json();
    if (!r.ok) throw new Error(job.error || 'Error consultando el progreso del import');
    if (job.estado === 'procesando') {
      const cont = document.getElementById(contenedorId);
      if (cont) cont.innerHTML = `<p class="muted">Procesando ${job.procesados} / ${job.total}...</p>`;
      continue;
    }
    if (job.estado === 'error') throw new Error(job.errorGeneral || 'El import falló de forma inesperada');
    return job;
  }
}

// Equivalencia de columnas al importar (2/10/2026, pedido de Mato: "que
// me deje elegir equivalencia de columna cuando no coincide con la
// plantilla"): antes de importar de verdad, se consulta el archivo para
// ver qué encabezados trae y se compara contra la plantilla esperada. Si
// TODO matchea solo (igual que siempre pasó hasta ahora), no se lo
// molesta con nada; si alguna columna esperada no tiene un encabezado que
// le corresponda, se muestra un panel para elegir a mano cuál columna del
// archivo es cuál, antes de seguir.
function leerArchivoComoBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
async function resolverMapeoColumnas(base64, endpointEncabezados, contenedorId){
  // Si el chequeo de encabezados falla por cualquier motivo (red, timeout,
  // etc.), no debe impedir el import real: seguimos sin mapeo manual, igual
  // que siempre se hizo antes de que existiera esta función. Esto es una
  // mejora aditiva, nunca un punto nuevo de falla para el import.
  let data;
  try {
    const r = await fetch(BASE + endpointEncabezados, {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error leyendo las columnas del archivo');
  } catch (e) {
    console.warn('No se pudo chequear la equivalencia de columnas, se continúa sin mapeo manual:', e);
    return {};
  }
  const faltaAlguna = data.columnas.some(c => !data.sugeridos[c.clave]);
  if (!faltaAlguna) return {}; // todas las columnas matchearon solas con la plantilla
  return new Promise(resolve => {
    const cont = document.getElementById(contenedorId);
    if (!cont) { resolve({}); return; }
    cont.innerHTML = `
      <div class="card" style="margin:10px 0;background:var(--bg)">
        <strong>Algunas columnas del archivo no coinciden con la plantilla</strong>
        <p class="muted" style="margin-top:4px;margin-bottom:0">Elegí a mano a cuál columna del archivo corresponde cada una. Si una columna esperada no está en tu archivo, dejala en "— no asignar —".</p>
        ${data.columnas.map(c => `
          <div class="row" style="margin-top:8px;align-items:center">
            <div style="width:200px"><strong>${escapeHtml(c.titulo)}</strong></div>
            <div style="flex:1">
              <select id="mapcol_${c.clave}">
                <option value="">— no asignar —</option>
                ${data.encabezados.map(h => `<option value="${escapeHtml(h)}" ${h===data.sugeridos[c.clave]?'selected':''}>${escapeHtml(h)}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('')}
        <button type="button" class="btn" style="margin-top:10px" onclick="window.__confirmarMapeoColumnas()">Confirmar equivalencias y continuar</button>
      </div>
    `;
    window.__confirmarMapeoColumnas = () => {
      const mapeo = {};
      data.columnas.forEach(c => {
        const v = document.getElementById('mapcol_'+c.clave).value;
        if (v) mapeo[c.clave] = v;
      });
      cont.innerHTML = '';
      resolve(mapeo);
    };
  });
}

function renderDuplicadosSku(data){
  const cont = document.getElementById('dupContenido');

    cont.innerHTML = '<p class="ok-msg">No hay SKUs duplicados 🎉</p>';
    return;
  }
  let html = `<p class="muted">Se encontraron ${data.totalGrupos} SKU(s) con más de un producto activo. Al confirmar, se completan en el producto que se conserva los datos vacíos con los del otro (nunca se pisa un dato ya cargado); el otro queda desactivado, no se borra.</p>`;
  html += data.grupos.map(g => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px">
      <strong>${escapeHtml(g.sku)}</strong>

      </ul>
    </div>
  `).join('');
  html += `<div id="dupResultado"></div><button class="btn" style="margin-top:10px" id="dupBtn" onclick="confirmarConsolidarSku()">Fusionar los que se puedan fusionar solos</button>`;
  cont.innerHTML = html;

async function confirmarConsolidarSku(){
  const btn = document.getElementById('dupBtn');
  btn.disabled = true;
  document.getElementById('dupResultado').innerHTML = '<p class="muted">Fusionando...</p>';
  try{
    const r = await fetch(BASE + '/consolidar-sku', {method:'POST', headers: headersAuthJson()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al consolidar');
    let html = `<p class="ok-msg">Fusionados: ${data.fusionados}</p>`;
    if (data.revisionManual && data.revisionManual.length) {
      html += `<p class="err">${data.revisionManual.length} grupo(s) necesitan revisión manual:</p><ul class="muted" style="margin-top:0">` +
        data.revisionManual.map(g => `<li>${escapeHtml(g.sku)}: ${escapeHtml(g.motivo)}</li>`).join('') + '</ul>';

    document.getElementById('dupResultado').innerHTML = html;
    await cargarProductos();
  }catch(e){

  }finally{
    btn.disabled = false;

}

async function crearListaPrecio(){
  const nombre = document.getElementById('nlpNombre').value.trim();
  const porcentaje = Number(document.getElementById('nlpPorcentaje').value) || 0;
  const alcance = document.getElementById('nlpAlcance').value;
  const formula = document.getElementById('nlpFormula').value;
  document.getElementById('listasPrecioErr').textContent = '';
  if (!nombre) { document.getElementById('listasPrecioErr').textContent = 'Poné un nombre para la lista'; return; }
  try{
    const r = await fetch(BASE + '/listas-precio', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({nombre, porcentaje, alcance, formula})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    document.getElementById('nlpNombre').value = '';
    document.getElementById('nlpPorcentaje').value = '0';
    document.getElementById('nlpAlcance').value = 'todos';
    document.getElementById('nlpFormula').value = 'costo_porcentaje';
    await cargarListasPrecioModal();
  }catch(e){
    document.getElementById('listasPrecioErr').textContent = e.message;

function abrirImportarListaPrecio(listaId, listaNombre){
  const sub = document.createElement('div');

  sub.style.zIndex = '570';
  sub.onclick = function(e){ if (e.target === sub) sub.remove(); };
  sub.innerHTML = `
    <div class="modal">

      <h2>Importar precios — ${escapeHtml(listaNombre)}</h2>
      <p class="muted">Mismas columnas que el export de esta lista (SKU, Nombre, Precio) — la forma más simple es exportar, editar en Excel y volver a subir. Precio vacío saca el precio manual (vuelve a Costo + %). Si la lista es de "selección de productos", un SKU nuevo del archivo se agrega solo a la lista.</p>

async function confirmarImportarListaPrecio(listaId){
  const input = document.getElementById('ilpArchivo');
  const file = input.files[0];
  const btn = document.getElementById('ilpBtn');
  document.getElementById('ilpErr').textContent = '';
  document.getElementById('ilpMapeo').innerHTML = '';
  document.getElementById('ilpResultado').innerHTML = '';
  if (!file) { document.getElementById('ilpErr').textContent = 'Elegí un archivo .xlsx o .xls'; return; }
  btn.disabled = true;
  try{
    const base64 = await leerArchivoComoBase64(file);
    const mapeo = await resolverMapeoColumnas(base64, '/listas-precio/' + listaId + '/import/encabezados', 'ilpMapeo');
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/import', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64, mapeo})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    document.getElementById('ilpResultado').innerHTML = `<p class="muted">Procesando 0 / ${data.total}...</p>`;
    const job = await esperarJobImportListaPrecio(data.jobId, 'ilpResultado');
    let html = `<p class="ok-msg">Actualizados: ${job.actualizados||0}${job.nuevosMiembros ? ` (${job.nuevosMiembros} nuevo(s) agregado(s) a la lista)` : ''}</p>`;
    if (job.errores && job.errores.length) {
      html += `<p class="err">${job.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        job.errores.slice(0, 100).map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') +
        (job.errores.length > 100 ? `<li>... y ${job.errores.length - 100} más</li>` : '') + '</ul>';
    }
    document.getElementById('ilpResultado').innerHTML = html;
    await cargarListasPrecioModal();
    if (document.getElementById('gplModalBg')) await cargarGestionProductosLista(listaId);
  }catch(e){
    document.getElementById('ilpErr').textContent = e.message;
  }finally{
    btn.disabled = false;
  }
}

  sub.className = 'modal-bg';
  sub.style.zIndex = '570';
  sub.onclick = function(e){ if (e.target === sub) sub.remove(); };
  sub.innerHTML = `
    <div class="modal">
      <span class="close-x" onclick="document.getElementById('itlModalBg').remove()">✕</span>
      <h2>Importar todas las listas</h2>
      <p class="muted">Mismas columnas que "Exportar todas las listas" (SKU, Nombre, Moneda, Costo y una columna por lista). Moneda y Costo son de referencia — no se actualizan desde acá, se editan desde Productos. Si una lista es de "selección de productos", un SKU nuevo en su columna se agrega solo a esa lista. Una columna de lista que no esté en el archivo queda sin cambios; una celda vacía en una columna que sí está, saca el precio manual.</p>
      <label>Archivo (.xlsx o .xls)</label>
      <input type="file" id="itlArchivo" accept=".xlsx,.xls">
      <div class="err" id="itlErr"></div>
      <div id="itlMapeo"></div>
      <div id="itlResultado"></div>
      <button class="btn" id="itlBtn" style="margin-top:10px" onclick="confirmarImportarTodasListas()">Importar</button>
    </div>
  `;
  document.body.appendChild(sub);
}

async function confirmarImportarTodasListas(){
  const input = document.getElementById('itlArchivo');
  const file = input.files[0];
  const btn = document.getElementById('itlBtn');
  document.getElementById('itlErr').textContent = '';
  document.getElementById('itlMapeo').innerHTML = '';
  document.getElementById('itlResultado').innerHTML = '';
  if (!file) { document.getElementById('itlErr').textContent = 'Elegí un archivo .xlsx o .xls'; return; }
  btn.disabled = true;
  try{
    const base64 = await leerArchivoComoBase64(file);
    const mapeo = await resolverMapeoColumnas(base64, '/listas-precio/importar-todas/encabezados', 'itlMapeo');
    const r = await fetch(BASE + '/listas-precio/importar-todas', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64, mapeo})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    document.getElementById('itlResultado').innerHTML = `<p class="muted">Procesando 0 / ${data.total}...</p>`;
    const job = await esperarJobImportListaPrecio(data.jobId, 'itlResultado');
    let html = `<p class="ok-msg">Productos actualizados: ${job.actualizados||0}${job.nuevosMiembros ? ` (${job.nuevosMiembros} alta(s) nueva(s) en listas de selección)` : ''}</p>`;
    if (job.errores && job.errores.length) {
      html += `<p class="err">${job.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        job.errores.slice(0, 100).map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') +
        (job.errores.length > 100 ? `<li>... y ${job.errores.length - 100} más</li>` : '') + '</ul>';
    }
    document.getElementById('itlResultado').innerHTML = html;
    await cargarListasPrecioModal();
  }catch(e){
    document.getElementById('itlErr').textContent = e.message;
  }finally{
    btn.disabled = false;
  }
}

// -------------------------------------------------------------------
// Gestión de productos de una lista de alcance "selección" (1/10/2026,
// pedido de Mato: "no todas las listas tienen todos los productos...
// la de mayorista debe tener los artículos de producción y algún que
// otro producto adicional"). Permite sumar todo un rubro de una, ver
// quiénes están y sacar uno puntual — sumar de a uno puntual se hace
// completando el Excel de import con el SKU que falte.
// -------------------------------------------------------------------
// Abre la vista de productos de una lista (2/10/2026, 2da vuelta — pedido
// de Mato: "cuando entro a las listas que me deje acceder a cada una
// para poder verlas"): antes el botón "Productos" solo aparecía en listas
// de alcance "selección"; ahora cualquier lista se puede abrir para VER
// sus precios resueltos. Agregar/quitar miembros a mano solo tiene
// sentido en una lista de "selección" — en una de "todo el catálogo" esta
// pantalla es de solo consulta.
async function abrirGestionProductosLista(listaId){
  const sub = document.createElement('div');
  sub.id = 'gplModalBg';
  sub.className = 'modal-bg';
  sub.style.zIndex = '570';
  sub.onclick = function(e){ if (e.target === sub) sub.remove(); };
  sub.innerHTML = `
    <div class="modal" style="max-width:720px">
      <span class="close-x" onclick="document.getElementById('gplModalBg').remove()">✕</span>
      <h2 id="gplTitulo">Productos de la lista</h2>
      <div id="gplBody"><p class="muted">Cargando...</p></div>
    </div>
  `;
  document.body.appendChild(sub);
  await cargarGestionProductosLista(listaId);
}

let gestionListaCache = null;
let gplFiltro = '';
async function cargarGestionProductosLista(listaId){
  const body = document.getElementById('gplBody');
  if (!body) return;
  try{
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/precios', {headers: headersAuthJson()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    gestionListaCache = data;
    const titulo = document.getElementById('gplTitulo');
    if (titulo) titulo.textContent = 'Productos de "' + data.lista.nombre + '"';
    const esSeleccion = data.lista.alcance === 'seleccion';
    body.innerHTML = `
      <p class="muted">${esSeleccion
        ? 'Esta lista solo aplica a los productos que tiene agregados acá (no a todo el catálogo). Sumá un rubro entero, o un SKU puntual importando un Excel con ese SKU agregado.'
        : 'Esta lista aplica a todo el catálogo — acá podés ver el precio resuelto de cada producto.'}</p>
      ${esSeleccion ? `
      <div class="row" style="margin-bottom:10px">
        <div style="flex:1"><label>Agregar todo un rubro</label><select id="gplRubro">${opcionesRubroSelect('')}</select></div>
        <div><label style="visibility:hidden">.</label><button class="btn secondary" onclick="agregarRubroALista('${listaId}')">Agregar rubro</button></div>
      </div>` : ''}
      <div class="row" style="margin-bottom:10px;align-items:flex-end">
        <div style="flex:1"><label>Buscar (nombre o SKU)</label><input id="gplBuscar" value="${escapeHtml(gplFiltro)}" oninput="gplFiltro=this.value;renderGestionProductosLista()" placeholder="Filtrar esta lista..."></div>
        <button class="btn secondary small" title="Exportar a Excel" onclick="descargarBlob(BASE + '/listas-precio/${listaId}/export', 'lista-precio.xlsx')">⬇️ Exportar</button>
        <button class="btn secondary small" title="Importar precios desde Excel" onclick="abrirImportarListaPrecio('${listaId}', (gestionListaCache&&gestionListaCache.lista.nombre)||'')">⬆️ Importar</button>
      </div>
      <div class="err" id="gplErr"></div>
      <div id="gplTablaWrap"></div>
    `;
    renderGestionProductosLista(listaId);
  }catch(e){
    body.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`;
  }
}

function renderGestionProductosLista(listaId){
  const wrap = document.getElementById('gplTablaWrap');
  if (!wrap || !gestionListaCache) return;
  listaId = listaId || gestionListaCache.lista._id;
  const esSeleccion = gestionListaCache.lista.alcance === 'seleccion';
  const q = gplFiltro.trim().toLowerCase();
  const filas = gestionListaCache.filas.filter(f => !q ||
    (f.nombre||'').toLowerCase().includes(q) || (f.sku||'').toLowerCase().includes(q));
  if (!gestionListaCache.filas.length) { wrap.innerHTML = '<p class="muted">Todavía no tiene productos agregados.</p>'; return; }
  if (!filas.length) { wrap.innerHTML = '<p class="muted">Ningún producto coincide con la búsqueda.</p>'; return; }
  wrap.innerHTML = `
    <p class="muted">${filas.length} de ${gestionListaCache.filas.length} producto(s)</p>
    <div style="overflow-x:auto;max-height:420px;overflow-y:auto">
    <table>
      <thead><tr><th>SKU</th><th>Nombre</th><th>Rubro</th><th>Precio</th><th></th></tr></thead>
      <tbody>
        ${filas.map(f => `
          <tr>
            <td>${escapeHtml(f.sku||'')}</td>
            <td>${escapeHtml(f.nombre||'')}</td>
            <td class="muted">${escapeHtml(f.rubro||'')}</td>
            <td>
              <input type="number" step="0.01" id="gplPrecio_${f._id}" value="${f.precio!=null?f.precio:''}" style="width:110px"
                onkeydown="if(event.key==='Enter'){event.preventDefault();guardarPrecioListaDesdeGestion('${listaId}','${f._id}')}">
            </td>
            <td style="white-space:nowrap">
              <button type="button" class="btn small secondary" title="Guardar precio (vacío = volver a Costo + %)" onclick="guardarPrecioListaDesdeGestion('${listaId}','${f._id}')">💾</button>
              ${esSeleccion ? `<button type="button" class="btn small secondary" title="Quitar de la lista" onclick="quitarProductoDeLista('${listaId}','${f._id}')">✕</button>` : ''}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
}

// Editar el precio de un producto directo desde la vista de la lista
// (2/10/2026, pedido de Mato: "cuando entro a la lista que me deje
// editar los precios de cada producto") — mismo PUT que ya usaba la
// ficha de producto ("Precios por lista"), vacío saca el override manual
// (vuelve a Costo + % o a la fórmula de la lista).
async function guardarPrecioListaDesdeGestion(listaId, productoId){
  const input = document.getElementById('gplPrecio_'+productoId);
  if (!input) return;
  const valor = input.value.trim();
  const precio = valor === '' ? null : Number(valor);
  if (precio !== null && (!Number.isFinite(precio) || precio < 0)) { alert('El precio tiene que ser un número mayor o igual a 0'); return; }
  try{
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/precio/' + productoId, {method:'PUT', headers: headersAuthJson(), body: JSON.stringify({precio})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al guardar el precio');
    const fila = gestionListaCache && gestionListaCache.filas.find(f => String(f._id) === String(productoId));
    if (fila) fila.precio = precio;
    input.style.borderColor = 'var(--ok)';
    setTimeout(() => { if (input && input.isConnected) input.style.borderColor = ''; }, 800);
  }catch(e){
    alert(e.message);
  }
}

async function agregarRubroALista(listaId){
  const rubro = document.getElementById('gplRubro').value;
  document.getElementById('gplErr').textContent = '';
  if (!rubro) { document.getElementById('gplErr').textContent = 'Elegí un rubro'; return; }
  try{
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/productos/por-rubro', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({rubro})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarGestionProductosLista(listaId);
  }catch(e){
    document.getElementById('gplErr').textContent = e.message;
  }
}

async function quitarProductoDeLista(listaId, productoId){
  try{
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/productos/' + productoId, {method:'DELETE', headers: headersAuth()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarGestionProductosLista(listaId);
  }catch(e){
    alert(e.message);
  }
}

// -------------------------------------------------------------------
// "Precios por lista" dentro de la ficha de un producto: muestra el
// precio resuelto para cada lista activa (costo + % o el override
// puntual, si lo hay) con edición inline.
// -------------------------------------------------------------------
let fichaListasPrecioCache = [];
let cotizacionDolarCache = null;
async function cargarPreciosPorLista(p){
  const cont = document.getElementById('preciosPorListaInfo');
  if (!cont || !p._id) return;
  cont.innerHTML = '<p class="muted">Cargando listas de precio...</p>';
  try{
    const [r, rc] = await Promise.all([
      fetch(BASE + '/listas-precio', {headers: headersAuthJson()}),
      fetch(BASE + '/config/cotizacion-dolar', {headers: headersAuthJson()})
    ]);
    const listas = await r.json();
    if (!r.ok) throw new Error(listas.error || 'Error');
    fichaListasPrecioCache = listas;
    cotizacionDolarCache = rc.ok ? (await rc.json()).valor : null;
    renderPreciosPorLista(p);
  }catch(e){
    cont.innerHTML = '';
  }
}

// No todas las listas tienen todo el catálogo (1/10/2026) — una lista de
// alcance "selección" solo resuelve precio para los productos que tiene
// en `productosIds`; para las demás (y siempre la predeterminada)
// aplica a cualquier producto, como antes.
function perteneceALista(p, lista){
  if (!lista || lista.alcance !== 'seleccion') return true;
  return (lista.productosIds || []).some(id => String(id) === String(p._id));
}

// Si el producto está cargado en USD (1/10/2026, pedido de Mato: "vamos
// a tener productos en dólares y otros en pesos... que tomando ese valor
// de dólar calcule el precio en pesos automáticamente"), el costo se
// convierte a pesos con la cotización configurada en Bases y catálogos
// antes de aplicarle el % de la lista — sin cotización cargada, no se
// puede resolver (precio null, igual que sin costo).
function precioResueltoFicha(p, lista){
  const overrides = p.preciosPorLista || [];
  const ov = overrides.find(x => String(x.listaId) === String(lista._id));
  if (ov) return { precio: ov.precio, override: true };
  if (lista.formula === 'cf_x_bulto') {
    const cf = Number(document.getElementById('fpPrecio') ? document.getElementById('fpPrecio').value : NaN);
    if (!cf && cf !== 0) return { precio: null, override: false };
    const unidadesPorBultoEl = document.getElementById('fpUnidadesPorBulto');
    const bultos = (unidadesPorBultoEl && Number(unidadesPorBultoEl.value) > 0) ? Number(unidadesPorBultoEl.value) : 1;
    return { precio: Math.round(cf * bultos * 100) / 100, override: false };
  }
  const costo = Number(document.getElementById('fpCosto').value);
  if (!costo && costo !== 0) return { precio: null, override: false };
  const moneda = document.getElementById('fpMoneda') ? document.getElementById('fpMoneda').value : 'ARS';
  const costoEnPesos = moneda === 'USD' ? (cotizacionDolarCache ? costo * cotizacionDolarCache : null) : costo;
  if (costoEnPesos == null) return { precio: null, override: false, sinCotizacion: true };
  return { precio: Math.round(costoEnPesos * (1 + (lista.porcentaje||0)/100) * 100) / 100, override: false };
}

function renderPreciosPorLista(p){
  const cont = document.getElementById('preciosPorListaInfo');
  const activas = fichaListasPrecioCache.filter(l => l.activa !== false);
  if (!activas.length) { cont.innerHTML = ''; return; }
  cont.innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <strong>Precios por lista</strong>
      <table style="margin-top:6px">
        <thead><tr><th>Lista</th><th>Precio</th><th>Origen</th><th></th></tr></thead>
        <tbody>
          ${activas.map(l => {
            if (!perteneceALista(p, l)) {
              return `
                <tr>
                  <td>${escapeHtml(l.nombre)}</td>
                  <td colspan="2" class="muted">No pertenece a esta lista (es de selección de productos)</td>
                  <td><button type="button" class="btn small secondary" onclick="agregarProductoAListaDesdeFicha('${p._id}','${l._id}')">Agregar a esta lista</button></td>
                </tr>
              `;
            }
            const { precio, override, sinCotizacion } = precioResueltoFicha(p, l);
            return `
              <tr>
                <td>${escapeHtml(l.nombre)}${l.predeterminada ? ' <span class="muted">(Consumidor Final)</span>' : ''}</td>
                <td><input type="number" step="0.01" id="ppl_${l._id}" value="${precio!=null?precio:''}" style="width:110px"></td>
                <td class="muted">${override ? 'Manual' : (sinCotizacion ? 'Falta cargar la cotización del dólar' : `Costo +${l.porcentaje||0}%`)}</td>
                <td style="white-space:nowrap">
                  <button type="button" class="btn small secondary" onclick="guardarPrecioLista('${p._id}','${l._id}')">Guardar</button>
                  ${override ? `<button type="button" class="btn small secondary" onclick="quitarPrecioLista('${p._id}','${l._id}')">Quitar manual</button>` : ''}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      <p class="muted" style="margin-bottom:0">La lista Consumidor Final siempre queda igual al campo "Precio de venta" de arriba.${document.getElementById('fpMoneda') && document.getElementById('fpMoneda').value==='USD' ? ` Este producto está cargado en USD — se convierte a pesos con la cotización de Bases y catálogos${cotizacionDolarCache ? ` (hoy: $${cotizacionDolarCache})` : ' (todavía no está cargada)'}.` : ''}</p>
    </div>
  `;
}

async function agregarProductoAListaDesdeFicha(productoId, listaId){
  try{
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/productos/' + productoId, {method:'POST', headers: headersAuthJson()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    const lista = fichaListasPrecioCache.find(l => String(l._id) === String(listaId));
    if (lista) { lista.productosIds = lista.productosIds || []; lista.productosIds.push(productoId); }
    const p = productosCache.find(x => String(x._id) === String(productoId)) || {_id: productoId};
    renderPreciosPorLista(p);
  }catch(e){
    alert(e.message);
  }
}

async function guardarPrecioLista(productoId, listaId){
  const input = document.getElementById('ppl_' + listaId);
  const valor = input.value;
  const precio = valor === '' ? null : Number(valor);
  try{
    const r = await fetch(BASE + '/listas-precio/' + listaId + '/precio/' + productoId, {method:'PUT', headers: headersAuthJson(), body: JSON.stringify({precio})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    const p = productosCache.find(x => String(x._id) === String(productoId)) || {_id: productoId};
    p.preciosPorLista = (p.preciosPorLista || []).filter(x => String(x.listaId) !== String(listaId));
    if (precio != null) p.preciosPorLista.push({listaId, precio});
    const lista = fichaListasPrecioCache.find(l => String(l._id) === String(listaId));
    if (lista && lista.predeterminada) {
      p.precio = precio;
      const fpPrecio = document.getElementById('fpPrecio');
      if (fpPrecio) fpPrecio.value = precio != null ? precio : '';
    }
    renderPreciosPorLista(p);
  }catch(e){
    alert(e.message);
  }
}

async function quitarPrecioLista(productoId, listaId){
  document.getElementById('ppl_' + listaId).value = '';
  await guardarPrecioLista(productoId, listaId);
}
</script>
