<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedores - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.inactivo{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:500;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:920px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .modal-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .modal-tabs button{background:none;border:none;padding:9px 12px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .modal-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  .totales-box{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;}
  .totales-box .fila-total{display:flex;justify-content:space-between;padding:2px 0;}
  .totales-box .fila-total.grande{font-size:16px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Proveedores</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Proveedores. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Proveedores</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:220px;flex:1">
            <label>Buscar (razón social, código, CUIT o documento)</label>
            <input id="fBusqueda" oninput="cargarProveedores()" placeholder="Ej: Cerámica del Sur, 30-12345678-9">
          </div>
          <div>
            <label style="visibility:hidden">.</label>
            <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap">
              <input type="checkbox" id="fInactivos" style="width:auto" onchange="cargarProveedores()"> Ver inactivos
            </label>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" onclick="exportarXlsx()">Exportar</button>
          <button class="btn secondary" onclick="abrirImportar()">Importar</button>
          <button class="btn" onclick="abrirNuevoProveedor()">+ Nuevo proveedor</button>
        </div>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Código</th><th>Proveedor</th><th>Rubro</th><th>CUIT / Doc.</th><th>Contacto</th><th>Estado</th><th></th></tr></thead>
        <tbody id="proveedoresBody"><tr><td colspan="7" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/proveedores';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
const TIPO_COMPROBANTE_LABEL = {
  factura_a: 'Factura A', factura_b: 'Factura B', factura_c: 'Factura C', factura_m: 'Factura M',
  nota_credito_a: 'Nota de Crédito A', nota_credito_b: 'Nota de Crédito B', nota_credito_c: 'Nota de Crédito C', nota_credito_m: 'Nota de Crédito M',
  nota_debito_a: 'Nota de Débito A', nota_debito_b: 'Nota de Débito B', nota_debito_c: 'Nota de Débito C', nota_debito_m: 'Nota de Débito M',
  recibo: 'Recibo', ticket: 'Ticket', otro: 'Otro (no fiscal)'
};
const ORIGEN_CC_PROVEEDOR_LABEL = { compra: 'Compra', pago_compra: 'Pago (compra)', gasto: 'Gasto', pago_gasto: 'Pago (gasto)' };

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('proveedores'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'proveedores', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarProveedores();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

let proveedoresCache = [];
async function cargarProveedores(){
  const params = new URLSearchParams();
  if (document.getElementById('fBusqueda').value.trim()) params.set('q', document.getElementById('fBusqueda').value.trim());
  if (document.getElementById('fInactivos').checked) params.set('incluirInactivos', '1');
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('proveedoresBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="7" class="err">No se pudo cargar.</td></tr>'; return; }
  proveedoresCache = await r.json();
  renderProveedores();
}

const CATEGORIA_FISCAL_LABEL = {
  consumidor_final: 'Consumidor final', exento: 'Exento', monotributista: 'Monotributista',
  responsable_inscripto: 'Responsable Inscripto', exterior: 'Exterior', iva_no_alcanzado: 'IVA no alcanzado'
};
const TIPO_DOCUMENTO_LABEL = { cuil: 'CUIL', cuit: 'CUIT', dni: 'DNI', pasaporte: 'Pasaporte' };

function renderProveedores(){
  const body = document.getElementById('proveedoresBody');
  if (!proveedoresCache.length) { body.innerHTML = '<tr><td colspan="7" class="muted">No hay proveedores todavía.</td></tr>'; return; }
  body.innerHTML = proveedoresCache.map(p => `
    <tr>
      <td><strong>${escapeHtml(p.codigo || '—')}</strong></td>
      <td>${escapeHtml(p.razonSocial)}${p.nombreFantasia ? `<div class="muted">${escapeHtml(p.nombreFantasia)}</div>` : ''}</td>
      <td class="muted">${escapeHtml(p.rubro || '—')}</td>
      <td class="muted">${p.cuit ? escapeHtml(p.cuit) : (p.numeroDocumento ? `${TIPO_DOCUMENTO_LABEL[p.tipoDocumento]||'Doc.'} ${escapeHtml(p.numeroDocumento)}` : '—')}</td>
      <td class="muted">${[p.telefono || p.celular, p.email].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</td>
      <td><span class="pill ${p.activo === false ? 'inactivo' : 'activo'}">${p.activo === false ? 'Inactivo' : 'Activo'}</span></td>
      <td>
        <button class="btn small secondary" onclick="abrirEditarProveedor('${p._id}')">Editar</button>
        ${p.activo === false ? '' : `<button class="btn small danger" onclick="desactivarProveedor('${p._id}', '${escapeHtml(p.razonSocial).replace(/'/g,"\\'")}')">Desactivar</button>`}
      </td>
    </tr>
  `).join('');
}

const CATEGORIAS_FISCALES = [
  {v:'', l:'Sin especificar'}, {v:'consumidor_final', l:'Consumidor final'}, {v:'exento', l:'Exento'}, {v:'monotributista', l:'Monotributista'},
  {v:'responsable_inscripto', l:'Responsable Inscripto'}, {v:'exterior', l:'Exterior'}, {v:'iva_no_alcanzado', l:'IVA no alcanzado'}
];
const TIPOS_DOCUMENTO = [{v:'', l:'Sin especificar'}, {v:'dni', l:'DNI'}, {v:'cuit', l:'CUIT'}, {v:'cuil', l:'CUIL'}, {v:'pasaporte', l:'Pasaporte'}];
const MONEDAS = [{v:'ARS', l:'Pesos ($)'}, {v:'USD', l:'Dólares (US$)'}];

function opciones(lista, seleccionada){
  return lista.map(u => `<option value="${u.v}" ${u.v===(seleccionada||'')?'selected':''}>${u.l}</option>`).join('');
}

// Rubro de proveedor: desplegable con algunos valores fijos + los que ya
// se hayan cargado antes, mismo patrón que Tipo de cliente en Clientes.
const RUBROS_PROVEEDOR_BASE = ['Insumos', 'Fletes / Transporte', 'Servicios'];
function opcionesRubroProveedor(seleccionado){
  const usados = proveedoresCache.map(p => p.rubro).filter(Boolean);
  const todos = [...new Set([...RUBROS_PROVEEDOR_BASE, ...usados])];
  let html = '<option value="">Sin especificar</option>' +
    todos.map(t => `<option value="${escapeHtml(t)}" ${t===seleccionado?'selected':''}>${escapeHtml(t)}</option>`).join('');
  if (seleccionado && !todos.includes(seleccionado)) {
    html += `<option value="${escapeHtml(seleccionado)}" selected>${escapeHtml(seleccionado)}</option>`;
  }
  html += '<option value="__nuevo__">+ Agregar nuevo…</option>';
  return html;
}
function listenerRubroProveedor(){
  const select = document.getElementById('fpRubro');
  const valorPrevio = select.value;
  select.addEventListener('change', function(){
    if (this.value !== '__nuevo__') return;
    const nuevo = (prompt('Nuevo rubro de proveedor:') || '').trim();
    if (nuevo) {
      const opt = document.createElement('option');
      opt.value = nuevo; opt.textContent = nuevo; opt.selected = true;
      this.insertBefore(opt, this.lastElementChild);
    } else {
      this.value = valorPrevio && valorPrevio !== '__nuevo__' ? valorPrevio : '';
    }
  });
}

function cerrarModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// Esquema por analogía con Clientes (ver proveedores.js — el artículo
// real de Proveedores en Dux dio 403 al intentar relevarlo). Solo razón
// social es obligatoria.
function formularioProveedor(p){
  p = p || {};
  return `
    <div class="section-title">Datos generales</div>
    <div class="grid3">
      <div style="grid-column:span 2"><label>Razón social *</label><input id="fpRazonSocial" value="${escapeHtml(p.razonSocial||'')}"></div>
      <div><label>Código</label><input id="fpCodigo" value="${escapeHtml(p.codigo||'')}"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>Nombre de fantasía</label><input id="fpNombreFantasia" value="${escapeHtml(p.nombreFantasia||'')}"></div>
      <div><label>Rubro</label><select id="fpRubro">${opcionesRubroProveedor(p.rubro)}</select></div>
      <div><label>Persona de contacto</label><input id="fpPersonaContacto" value="${escapeHtml(p.personaContacto||'')}"></div>
    </div>

    <div class="section-title" style="margin-top:16px">Datos fiscales y comerciales</div>
    <div class="grid3">
      <div><label>Categoría fiscal</label><select id="fpCategoriaFiscal">${opciones(CATEGORIAS_FISCALES, p.categoriaFiscal)}</select></div>
      <div><label>Tipo documento</label><select id="fpTipoDocumento">${opciones(TIPOS_DOCUMENTO, p.tipoDocumento)}</select></div>
      <div><label>Número documento</label><input id="fpNumeroDocumento" value="${escapeHtml(p.numeroDocumento||'')}"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>CUIT / CUIL</label><input id="fpCuit" value="${escapeHtml(p.cuit||'')}" placeholder="30-12345678-9"></div>
      <div><label>Condición de pago</label><input id="fpCondicionPago" value="${escapeHtml(p.condicionPago||'')}" placeholder="Ej: 30 días fecha factura"></div>
      <div><label>Días de pago</label><input id="fpDiasPago" type="number" min="0" step="1" value="${p.diasPago!=null?p.diasPago:''}"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>Moneda</label><select id="fpMoneda">${opciones(MONEDAS, p.moneda||'ARS')}</select></div>
    </div>

    <div class="section-title" style="margin-top:16px">Datos bancarios (para pagos)</div>
    <div class="grid3">
      <div><label>Banco</label><input id="fpBanco" value="${escapeHtml(p.banco||'')}"></div>
      <div><label>CBU</label><input id="fpCbu" value="${escapeHtml(p.cbu||'')}"></div>
      <div><label>Alias CBU</label><input id="fpAliasCbu" value="${escapeHtml(p.aliasCbu||'')}"></div>
    </div>
    <div style="margin-top:10px"><label>Cuenta bancaria (número)</label><input id="fpCuentaBancaria" value="${escapeHtml(p.cuentaBancaria||'')}"></div>

    <div class="section-title" style="margin-top:16px">Datos de contacto</div>
    <div class="grid3">
      <div><label>Provincia</label><input id="fpProvincia" value="${escapeHtml(p.provincia||'')}"></div>
      <div><label>Localidad</label><input id="fpLocalidad" value="${escapeHtml(p.localidad||'')}"></div>
      <div><label>Código postal</label><input id="fpCodigoPostal" value="${escapeHtml(p.codigoPostal||'')}"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div style="grid-column:span 2"><label>Domicilio</label><input id="fpDomicilio" value="${escapeHtml(p.domicilio||'')}"></div>
      <div><label>Barrio</label><input id="fpBarrio" value="${escapeHtml(p.barrio||'')}"></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div><label>Zona</label><input id="fpZona" value="${escapeHtml(p.zona||'')}"></div>
      <div><label>Teléfono</label><input id="fpTelefono" value="${escapeHtml(p.telefono||'')}"></div>
      <div><label>Celular</label><input id="fpCelular" value="${escapeHtml(p.celular||'')}"></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label>Correo electrónico</label><input id="fpEmail" type="email" value="${escapeHtml(p.email||'')}"></div>

    <div style="margin-top:10px"><label>Descripción (interna)</label><textarea id="fpDescripcion">${escapeHtml(p.descripcion||'')}</textarea></div>
    <div style="margin-top:10px"><label>Notas internas</label><textarea id="fpNotas">${escapeHtml(p.notas||'')}</textarea></div>
  `;
}

function abrirNuevoProveedor(){

    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal wide">
        <span class="close-x" onclick="cerrarModal()">✕</span>

    cuit: document.getElementById('fpCuit').value.trim(),

async function guardarNuevoProveedor(){
  const body = leerFormularioProveedor();
  if (!body.razonSocial) { document.getElementById('fpErr').textContent = 'La razón social es obligatoria'; return; }
  try{
    const r = await fetch(BASE, {method:'POST', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    cerrarModal();
    await cargarProveedores();
  }catch(e){
    document.getElementById('fpErr').textContent = e.message;
  }
}

function abrirEditarProveedor(id){
  const p = proveedoresCache.find(x => x._id === id);
  if (!p) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal wide">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>${escapeHtml(p.razonSocial || p.nombreFantasia || 'Editar proveedor')}</h2>
        <div class="modal-tabs">
          <button class="active" data-tab="datos" onclick="mostrarTabProveedor('datos')">Datos del proveedor</button>
          <button data-tab="cuenta-corriente" onclick="mostrarTabProveedor('cuenta-corriente', '${id}')">Cuenta corriente</button>
        </div>
        <div id="tabProveedorDatos">
          ${formularioProveedor(p)}
          <div class="err" id="fpErr"></div>
          <button class="btn" style="margin-top:10px" onclick="guardarEdicionProveedor('${id}')">Guardar cambios</button>

        <div id="tabProveedorCuentaCorriente" class="hidden">
          <div id="pccContenido" class="muted">Cargando...</div>
        </div>
      </div>

}
function mostrarTabProveedor(tab, proveedorId){
  document.querySelectorAll('.modal-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tabProveedorDatos').classList.toggle('hidden', tab !== 'datos');
  document.getElementById('tabProveedorCuentaCorriente').classList.toggle('hidden', tab !== 'cuenta-corriente');
  if (tab === 'cuenta-corriente') cargarCuentaCorrienteProveedorTab(proveedorId);
}

async function guardarEdicionProveedor(id){
  const body = leerFormularioProveedor();
  if (!body.razonSocial) { document.getElementById('fpErr').textContent = 'La razón social es obligatoria'; return; }
  try{
    const r = await fetch(BASE + '/' + id, {method:'PUT', headers: headersAuthJson(), body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    cerrarModal();
    await cargarProveedores();
  }catch(e){
    document.getElementById('fpErr').textContent = e.message;
  }
}

async function desactivarProveedor(id, nombre){
  if (!confirm(`¿Desactivar "${nombre}"? No se borra, pero deja de aparecer en las listas normales.`)) return;
  try{
    const r = await fetch(BASE + '/' + id, {method:'DELETE', headers: headersAuth()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    await cargarProveedores();
  }catch(e){
    alert(e.message);
  }
}

// -------------------------------------------------------------------
// Import / export en Excel (.xlsx) — ver importExport.js en el backend.
// -------------------------------------------------------------------
async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function exportarXlsx(){ descargarBlob(BASE + '/export', 'proveedores.xlsx'); }

function abrirImportar(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar proveedores desde Excel</h2>
        <p class="muted">Tiene que tener las mismas columnas que el export de este módulo (los títulos de columna, no el orden). Si el Código o el CUIT ya existen, se actualiza ese proveedor; si no, se crea uno nuevo.</p>
        <p><a href="#" onclick="descargarBlob(BASE + '/plantilla-import', 'plantilla-proveedores.xlsx'); return false;">Descargar plantilla en blanco</a></p>
        <label>Archivo (.xlsx)</label>
        <input type="file" id="impArchivo" accept=".xlsx">
        <div class="err" id="impErr"></div>
        <div id="impResultado"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarImportar()">Importar</button>
      </div>
    </div>
  `;
}

async function confirmarImportar(){
  const input = document.getElementById('impArchivo');
  const file = input.files[0];
  document.getElementById('impErr').textContent = '';
  document.getElementById('impResultado').innerHTML = '';
  if (!file) { document.getElementById('impErr').textContent = 'Elegí un archivo .xlsx'; return; }
  try{
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const r = await fetch(BASE + '/import', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    let html = `<p class="ok-msg">Creados: ${data.creados} — Actualizados: ${data.actualizados}</p>`;
    if (data.errores && data.errores.length) {
      html += `<p class="err">${data.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        data.errores.map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') + '</ul>';
    }
    document.getElementById('impResultado').innerHTML = html;
    await cargarProveedores();
  }catch(e){
    document.getElementById('impErr').textContent = e.message;
  }
}
// -------------------------------------------------------------------
// Cuenta corriente del proveedor (4/10/2026, pedido de Mato: "crear una
// pestaña para ver el saldo de la cuenta corriente... que nos de las
// opciones de ver los comprobantes y demas") — reconstruida en el
// backend a partir de Compras y Gastos (ver GET /:id/cuenta-corriente en
// proveedores.js). Pensada para la pestaña "Cuenta corriente" del modal
// de Editar proveedor (ver abrirEditarProveedor/mostrarTabProveedor
// arriba) — rellena el contenedor #pccContenido que ya está en el DOM.
// -------------------------------------------------------------------
let cuentaCorrienteProveedorCache = null;
async function cargarCuentaCorrienteProveedorTab(id){
  const cont0 = document.getElementById('pccContenido');
  if (cont0) cont0.innerHTML = 'Cargando...';
  try{
    const r = await fetch(BASE + '/' + id + '/cuenta-corriente', {headers: headersAuth()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al cargar la cuenta corriente');
    cuentaCorrienteProveedorCache = data;
    const cont = document.getElementById('pccContenido');
    if (!cont) return; // se cerró el modal mientras cargaba
    const saldoTexto = money(data.saldo);
    // Mismo criterio que la cuenta corriente de Clientes: los
    // movimientos vienen del más nuevo al más viejo, así que el saldo
    // corrido de cada fila se reconstruye deshaciendo, de ahí hacia
    // atrás, el efecto de la fila anterior (débito suma, crédito resta).
    let saldoCorrido = data.saldo;
    const filas = data.movimientos.map((m, i) => {
      if (i > 0) {
        const anterior = data.movimientos[i - 1];
        saldoCorrido -= anterior.tipo === 'debito' ? anterior.monto : -anterior.monto;
      }
      return { m, saldo: saldoCorrido, index: i };
    });
    cont.innerHTML = `
      <p class="muted" style="margin-top:0">Saldo: <strong style="color:${data.saldo > 0 ? 'var(--danger)' : (data.saldo < 0 ? 'var(--ok)' : 'var(--text)')}">${saldoTexto}</strong>${data.saldo > 0 ? ' (le debemos esto al proveedor)' : (data.saldo < 0 ? ' (a favor nuestro)' : '')}</p>
      <table>
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Origen</th><th>Débito</th><th>Crédito</th><th>Saldo</th><th></th></tr></thead>
        <tbody>
          ${filas.length ? filas.map(({m, saldo, index}) => {
            const tieneDetalle = m.origen === 'compra' || m.origen === 'gasto';
            const conceptoHtml = tieneDetalle
              ? `<a href="javascript:void(0)" onclick="verDetalleMovimientoProveedor(${index})" style="text-decoration:underline;cursor:pointer" title="Ver el comprobante">${escapeHtml(m.concepto || '—')}</a>`
              : escapeHtml(m.concepto || '—');
            return `
            <tr>
              <td>${fechaCorta(m.fecha)}</td>
              <td>${conceptoHtml}${m.nota ? `<div class="muted">${escapeHtml(m.nota)}</div>` : ''}</td>
              <td class="muted">${ORIGEN_CC_PROVEEDOR_LABEL[m.origen] || escapeHtml(m.origen || '—')}</td>
              <td>${m.tipo === 'debito' ? money(m.monto) : ''}</td>
              <td>${m.tipo === 'credito' ? money(m.monto) : ''}</td>
              <td class="muted">${money(saldo)}</td>
              <td>${tieneDetalle ? `<button class="btn small secondary" onclick="verDetalleMovimientoProveedor(${index})">Ver</button>` : ''}</td>
            </tr>
          `; }).join('') : '<tr><td colspan="7" class="muted">Todavía no hay movimientos.</td></tr>'}
        </tbody>
      </table>
    `;
  }catch(e){
    const cont = document.getElementById('pccContenido');
    if (cont) cont.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`;
  }
}

// Detalle de un comprobante (compra o gasto) referenciado desde la
// cuenta corriente — viene embebido en el movimiento (items,
// observaciones, pagos ya resueltos), así que no hace falta llamar a
// Compras/Gastos (y no exige tener esos módulos habilitados para poder
// ver la cuenta corriente de un proveedor).
function verDetalleMovimientoProveedor(index){
  const data = cuentaCorrienteProveedorCache;
  if (!data) return;
  const m = data.movimientos[index];
  if (!m) return;
  const filasItems = (m.items || []).map(it => `
    <tr>
      <td>${escapeHtml(it.sku||'')}</td>
      <td>${escapeHtml(it.nombre)}</td>
      <td>${it.cantidad}</td>
      <td>${money(it.precioUnitario)}</td>
      <td>${it.alicuotaIva !== undefined ? (it.alicuotaIva === 0 ? 'Exento' : it.alicuotaIva + '%') : '—'}</td>
      <td>${money(it.subtotal)}</td>
    </tr>
  `).join('');
  document.getElementById('modalRoot').insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="dmpBg" onclick="if(event.target===this) cerrarDetalleMovimientoProveedor()">
      <div class="modal wide">
        <span class="close-x" onclick="cerrarDetalleMovimientoProveedor()">✕</span>
        <h2>${escapeHtml(m.concepto)}</h2>
        ${m.tipoComprobante ? `<p class="muted" style="margin-top:-8px">
          ${TIPO_COMPROBANTE_LABEL[m.tipoComprobante]||m.tipoComprobante} ${escapeHtml(m.puntoVenta||'')}-${escapeHtml(m.comprobanteNumero||'')}
          ${m.esFiscal ? '<span class="pill activo">Fiscal</span>' : '<span class="pill inactivo">No fiscal</span>'}
        </p>` : ''}
        ${filasItems ? `<table>
          <thead><tr><th>SKU</th><th>Producto/Concepto</th><th>Cant.</th><th>Precio</th><th>IVA</th><th>Subtotal</th></tr></thead>
          <tbody>${filasItems}</tbody>
        </table>` : ''}
        <div class="totales-box">
          <div class="fila-total grande"><span>Total</span><span>${money(m.monto)}</span></div>
          <div class="fila-total"><span>Pagado</span><span>${money(m.totalPagado)}</span></div>
          <div class="fila-total" style="font-weight:700"><span>Saldo</span><span>${money(m.saldoPendiente)}</span></div>
        </div>
        ${m.observaciones ? `<p class="muted" style="margin-top:10px"><strong>Observaciones:</strong> ${escapeHtml(m.observaciones)}</p>` : ''}
        <p class="muted" style="margin-top:10px">Para registrar pagos o anular, entrá a ${m.origen === 'compra' ? 'Compras' : 'Gastos'} y buscá el ${m.origen === 'compra' ? 'Compra' : 'Gasto'} #${m.docNumero}.</p>
      </div>
    </div>
  `);
}
function cerrarDetalleMovimientoProveedor(){
  const el = document.getElementById('dmpBg');
  if (el) el.remove();
}
