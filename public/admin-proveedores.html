<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedores - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="/nav-sidebar.js"></script>
<script src="/btn-iconos.js"></script>
<script src="/menu-acciones.js"></script>
<script src="/prov-import.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030; --danger-soft:#fbe4e1;
    --info:#1d4ed8; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  header .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;flex-shrink:0;}
  header button:hover{border-color:var(--danger);color:var(--danger);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
  .kpi .t{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .kpi .v{font-size:20px;font-weight:800;margin-top:6px;}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:4px;}
  .kpi .v.neg{color:var(--danger);}
  .kpi .v.pos{color:var(--ok);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:50px;font-family:inherit;}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-block;text-decoration:none;}
  .btn:hover{filter:brightness(0.94);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:hover td{background:var(--bg);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.activo{background:var(--ok-soft);color:var(--ok);}
  .pill.inactivo{background:var(--danger-soft);color:var(--danger);}
  .muted{color:var(--muted);font-size:12px;}
  .hidden{display:none !important;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:500;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:680px;width:100%;box-shadow:var(--shadow);}
  .modal.wide{max-width:920px;}
  .modal h2{margin-top:0;font-size:16px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-size:18px;}
  .err{color:var(--danger);font-size:13px;margin:6px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:6px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;}
  #loginScreen .card{width:300px;text-align:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .modal-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .modal-tabs button{background:none;border:none;padding:9px 12px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .modal-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  .totales-box{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;}
  .totales-box .fila-total{display:flex;justify-content:space-between;padding:2px 0;}
  .totales-box .fila-total.grande{font-size:16px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
      --info:#7fa8ff; --info-soft:#1c2a4a;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080; --danger-soft:#3a1f1f;
    --info:#7fa8ff; --info-soft:#1c2a4a;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="card">
    <h2 style="margin-top:0;margin-bottom:14px">Proveedores</h2>
    <label>Usuario</label>
    <input id="loginUser" autocapitalize="off" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:8px">Contraseña</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="sinAccesoScreen" class="hidden">
  <div class="card" style="max-width:340px;margin:80px auto;text-align:center">
    <h2 style="margin-top:0">Sin acceso</h2>
    <p class="muted">Tu usuario no tiene habilitado el módulo de Proveedores. Pedile a un administrador que te lo habilite desde Usuarios y roles.</p>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1>Proveedores</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="topbarUser" style="font-size:12px;font-weight:600;white-space:nowrap"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="flex:1">
          <div style="min-width:220px;flex:1">
            <label>Buscar (razón social, código, CUIT o documento)</label>
            <input id="fBusqueda" oninput="cargarProveedores()" placeholder="Ej: Cerámica del Sur, 30-12345678-9">
          </div>
          <div>
            <label style="visibility:hidden">.</label>
            <label style="display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);white-space:nowrap">
              <input type="checkbox" id="fInactivos" style="width:auto" onchange="cargarProveedores()"> Ver inactivos
            </label>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn secondary" onclick="exportarXlsx()">Exportar</button>
          <button class="btn secondary" onclick="abrirImportar()">Importar</button>
          <button class="btn secondary" onclick="abrirSaldosProvDux()" title="Saldos de proveedores de Dux (Consulta de Proveedores con Saldo)">Saldos Dux</button>
          <button class="btn secondary" onclick="abrirUnificarP()" title="Buscar proveedores duplicados y unificarlos">Unificar duplicados</button>
          <button class="btn secondary" onclick="abrirFichasDux()" title="Ficha de proveedores de Dux (Listado de Proveedores)">Fichas Dux</button>
          <button class="btn" onclick="abrirNuevoProveedor()">+ Nuevo proveedor</button>
        </div>
      </div>
    </div>
    <div class="kpis" id="kpisProveedores"></div>
    <div class="card">
      <table>
        <thead><tr><th>Código</th><th>Proveedor</th><th>Rubro</th><th>CUIT / Doc.</th><th>Contacto</th><th style="text-align:right">Saldo</th><th>Estado</th><th></th></tr></thead>
        <tbody id="proveedoresBody"><tr><td colspan="8" class="muted">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const BASE = '/api/proveedores';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
let ORG = localStorage.getItem('obras_org_activo') || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaCorta(iso){ if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('es-AR'); }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
const TIPO_COMPROBANTE_LABEL = {
  factura_a: 'Factura A', factura_b: 'Factura B', factura_c: 'Factura C', factura_m: 'Factura M',
  nota_credito_a: 'Nota de Crédito A', nota_credito_b: 'Nota de Crédito B', nota_credito_c: 'Nota de Crédito C', nota_credito_m: 'Nota de Crédito M',
  nota_debito_a: 'Nota de Débito A', nota_debito_b: 'Nota de Débito B', nota_debito_c: 'Nota de Débito C', nota_debito_m: 'Nota de Débito M',
  recibo: 'Recibo', ticket: 'Ticket', otro: 'Otro (no fiscal)'
};
const ORIGEN_CC_PROVEEDOR_LABEL = { compra: 'Compra', pago_compra: 'Pago (compra)', gasto: 'Gasto', pago_gasto: 'Pago (gasto)', saldo_inicial_dux: 'Saldo inicial Dux', ajuste: 'Ajuste de saldo' };

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

const ORG_KEY = 'obras_org_activo';
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas');
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id
    : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : (me.puedeVerTodas ? 'todas' : '')));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

let NOMBRE_USUARIO = '';
async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('proveedores'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  resolverOrgActiva(me);
  PiedraSidebar.render(me, 'proveedores', { ocultarOrg: true });
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbarUser').textContent = NOMBRE_USUARIO;
  await cargarProveedores();
  // Viene desde otra pantalla (Compras, Pagos, Gastos): abre la ficha del proveedor en la pestaña pedida.
  const qs = new URLSearchParams(location.search);
  if (qs.get('id')) {
    let p = proveedoresCache.find(x => x._id === qs.get('id'));
    if (!p) { try { const r = await fetch(BASE + '?incluirInactivos=1', {headers: headersAuth()}); if (r.ok) { proveedoresCache = await r.json(); p = proveedoresCache.find(x => x._id === qs.get('id')); } } catch(e){} }
    if (p) { abrirEditarProveedor(p._id); mostrarTabProveedor(qs.get('tab') || 'cuenta-corriente', p._id); }
    history.replaceState(null, '', location.pathname);
  }
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

let proveedoresCache = [];
async function cargarProveedores(){
  const params = new URLSearchParams();
  if (document.getElementById('fBusqueda').value.trim()) params.set('q', document.getElementById('fBusqueda').value.trim());
  if (document.getElementById('fInactivos').checked) params.set('incluirInactivos', '1');
  const r = await fetch(BASE + '?' + params.toString(), {headers: headersAuth()});
  const body = document.getElementById('proveedoresBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="8" class="err">No se pudo cargar.</td></tr>'; return; }
  proveedoresCache = await r.json();
  await cargarResumenSaldos();
  renderProveedores();
}


// Tarjetas de totales + ranking + columna Saldo (mismo saldo que la cuenta corriente de cada proveedor).
// Son dinámicas: se calculan sobre lo que muestra la lista (búsqueda, "Ver inactivos") y al tocar una tarjeta la lista se filtra.
let resumenSaldosProv = null;
let filtroSaldoProv = '';   // '' | 'deuda' | 'favor'
async function cargarResumenSaldos(){
  try {
    const r = await fetch(BASE + '/resumen-saldos', {headers: headersAuth()});
    resumenSaldosProv = r.ok ? await r.json() : null;
  } catch (e) { resumenSaldosProv = null; }
}
function saldoProv(id){
  if (!resumenSaldosProv) return null;
  const s = resumenSaldosProv.saldos[String(id)];
  return s === undefined ? null : s;
}
function proveedoresVisibles(){
  const ord = filtroSaldoProv === 'deuda' ? (a, b) => (saldoProv(b._id) || 0) - (saldoProv(a._id) || 0) : (filtroSaldoProv === 'favor' ? (a, b) => (saldoProv(a._id) || 0) - (saldoProv(b._id) || 0) : null);
  const l = proveedoresCache.filter(p => {
    const s = saldoProv(p._id) || 0;
    if (filtroSaldoProv === 'deuda') return s > 0.5;
    if (filtroSaldoProv === 'favor') return s < -0.5;
    return true;
  });
  return ord ? l.sort(ord) : l;
}
function saldoCeldaProv(id){
  const s = saldoProv(id);
  if (s === null) return '<span class="muted">—</span>';
  if (Math.abs(s) < 0.5) return '<span class="muted">$ 0,00</span>';
  return `<strong style="color:${s > 0 ? 'var(--danger)' : 'var(--ok)'}">${money(s)}</strong>`;
}
function toggleFiltroSaldoProv(f){
  filtroSaldoProv = filtroSaldoProv === f ? '' : f;
  renderProveedores();
}
function renderKpisProveedores(){
  const el = document.getElementById('kpisProveedores'); if (!el) return;
  if (!resumenSaldosProv) { el.innerHTML = ''; return; }
  const lista = proveedoresCache.map(p => ({ p, s: saldoProv(p._id) || 0 }));
  const deudores = lista.filter(x => x.s > 0.5).sort((a, b) => b.s - a.s);
  const favor = lista.filter(x => x.s < -0.5);
  const deuda = deudores.reduce((a, x) => a + x.s, 0), aFavor = favor.reduce((a, x) => a - x.s, 0), neto = deuda - aFavor;
  const top = deudores.slice(0, 8), max = top.length ? top[0].s : 1;
  const act = (f) => filtroSaldoProv === f ? 'outline:2px solid var(--accent);' : '';
  el.innerHTML = `
    <div class="kpi" style="cursor:pointer;${act('deuda')}" onclick="toggleFiltroSaldoProv('deuda')" title="Tocá para ver solo los proveedores a los que les debemos">
      <div class="t">Les debemos</div><div class="v ${deuda > 0 ? 'neg' : ''}">${money(deuda)}</div><div class="s">${deudores.length} proveedor${deudores.length === 1 ? '' : 'es'} con saldo a pagar</div></div>
    <div class="kpi" style="cursor:pointer;${act('favor')}" onclick="toggleFiltroSaldoProv('favor')" title="Tocá para ver solo los proveedores con saldo a favor nuestro">
      <div class="t">A favor nuestro</div><div class="v ${aFavor > 0 ? 'pos' : ''}">${money(aFavor)}</div><div class="s">${favor.length} proveedor${favor.length === 1 ? '' : 'es'} — pagos a cuenta y créditos</div></div>
    <div class="kpi">
      <div class="t">Neto</div><div class="v ${neto > 0 ? 'neg' : 'pos'}">${money(neto)}</div><div class="s">lo que debemos menos lo que tenemos a favor</div></div>
    <div class="kpi" style="grid-column:span 2;min-width:300px">
      <div class="t">Ranking de deuda</div>
      ${top.length ? `<div style="margin-top:8px;display:grid;gap:6px">${top.map((x, i) => `
        <div style="display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:13px;cursor:pointer" onclick="abrirCuentaProveedorDesdeRanking('${x.p._id}')" title="Ver su cuenta corriente">
          <span class="muted" style="font-weight:800">${i + 1}</span>
          <div style="min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600">${escapeHtml(x.p.razonSocial || x.p.nombreFantasia || '')}</div>
            <div style="height:5px;border-radius:3px;background:var(--border);margin-top:3px"><div style="height:5px;border-radius:3px;background:var(--danger);width:${Math.max(3, Math.round(x.s / max * 100))}%"></div></div></div>
          <strong>${money(x.s)}</strong>
        </div>`).join('')}</div>${deudores.length > top.length ? `<div class="s">y ${deudores.length - top.length} más</div>` : ''}` : '<div class="s" style="margin-top:8px">Ningún proveedor con deuda.</div>'}
    </div>`;
}
function abrirCuentaProveedorDesdeRanking(id){
  abrirEditarProveedor(id);
  mostrarTabProveedor('cuenta-corriente', id);
}

const CATEGORIA_FISCAL_LABEL = {
  consumidor_final: 'Consumidor final', exento: 'Exento', monotributista: 'Monotributista',
  responsable_inscripto: 'Responsable Inscripto', exterior: 'Exterior', iva_no_alcanzado: 'IVA no alcanzado'
};
const TIPO_DOCUMENTO_LABEL = { cuil: 'CUIL', cuit: 'CUIT', dni: 'DNI', pasaporte: 'Pasaporte' };

function renderProveedores(){
  const body = document.getElementById('proveedoresBody');
  renderKpisProveedores();
  const visibles = proveedoresVisibles();
  if (!proveedoresCache.length) { body.innerHTML = '<tr><td colspan="8" class="muted">No hay proveedores todavía.</td></tr>'; return; }
  if (!visibles.length) { body.innerHTML = '<tr><td colspan="8" class="muted">Ningún proveedor coincide con el filtro. <a href="javascript:void(0)" onclick="toggleFiltroSaldoProv(filtroSaldoProv)">Quitar filtro</a></td></tr>'; return; }
  body.innerHTML = visibles.map(p => `
    <tr>
      <td><strong>${escapeHtml(p.codigo || '—')}</strong></td>
      <td>${escapeHtml(p.razonSocial)}${p.nombreFantasia ? `<div class="muted">${escapeHtml(p.nombreFantasia)}</div>` : ''}</td>

const CATEGORIAS_FISCALES = [

  {v:'responsable_inscripto', l:'Responsable Inscripto'}, {v:'exterior', l:'Exterior'}, {v:'iva_no_alcanzado', l:'IVA no alcanzado'}
];
const TIPOS_DOCUMENTO = [{v:'', l:'Sin especificar'}, {v:'dni', l:'DNI'}, {v:'cuit', l:'CUIT'}, {v:'cuil', l:'CUIL'}, {v:'pasaporte', l:'Pasaporte'}];
const MONEDAS = [{v:'ARS', l:'Pesos ($)'}, {v:'USD', l:'Dólares (US$)'}];

function opciones(lista, seleccionada){
  return lista.map(u => `<option value="${u.v}" ${u.v===(seleccionada||'')?'selected':''}>${u.l}</option>`).join('');
}

// Rubro de proveedor: desplegable con algunos valores fijos + los que ya
// se hayan cargado antes, mismo patrón que Tipo de cliente en Clientes.
const RUBROS_PROVEEDOR_BASE = ['Insumos', 'Fletes / Transporte', 'Servicios'];
function opcionesRubroProveedor(seleccionado){
  const usados = proveedoresCache.map(p => p.rubro).filter(Boolean);
  const todos = [...new Set([...RUBROS_PROVEEDOR_BASE, ...usados])];
  let html = '<option value="">Sin especificar</option>' +
    todos.map(t => `<option value="${escapeHtml(t)}" ${t===seleccionado?'selected':''}>${escapeHtml(t)}</option>`).join('');
  if (seleccionado && !todos.includes(seleccionado)) {
    html += `<option value="${escapeHtml(seleccionado)}" selected>${escapeHtml(seleccionado)}</option>`;
  }
  html += '<option value="__nuevo__">+ Agregar nuevo…</option>';
  return html;
}
function listenerRubroProveedor(){
  const select = document.getElementById('fpRubro');
  const valorPrevio = select.value;
  select.addEventListener('change', function(){
    if (this.value !== '__nuevo__') return;
    const nuevo = (prompt('Nuevo rubro de proveedor:') || '').trim();
    if (nuevo) {
      const opt = document.createElement('option');
      opt.value = nuevo; opt.textContent = nuevo; opt.selected = true;
      this.insertBefore(opt, this.lastElementChild);
    } else {
      this.value = valorPrevio && valorPrevio !== '__nuevo__' ? valorPrevio : '';
    }
  });
}

async function descargarBlob(url, nombreArchivo){
  const r = await fetch(url, {headers: headersAuth()});
  if (!r.ok) { alert('No se pudo descargar el archivo'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function exportarXlsx(){ descargarBlob(BASE + '/export', 'proveedores.xlsx'); }

function abrirImportar(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar proveedores desde Excel</h2>
        <p class="muted">Tiene que tener las mismas columnas que el export de este módulo (los títulos de columna, no el orden). Si el Código o el CUIT ya existen, se actualiza ese proveedor; si no, se crea uno nuevo.</p>
        <p><a href="#" onclick="descargarBlob(BASE + '/plantilla-import', 'plantilla-proveedores.xlsx'); return false;">Descargar plantilla en blanco</a></p>
        <label>Archivo (.xlsx)</label>
        <input type="file" id="impArchivo" accept=".xlsx">
        <div class="err" id="impErr"></div>
        <div id="impResultado"></div>
        <button class="btn" style="margin-top:10px" onclick="confirmarImportar()">Importar</button>
      </div>
    </div>
  `;

async function confirmarImportar(){
  const input = document.getElementById('impArchivo');
  const file = input.files[0];
  document.getElementById('impErr').textContent = '';
  document.getElementById('impResultado').innerHTML = '';
  if (!file) { document.getElementById('impErr').textContent = 'Elegí un archivo .xlsx'; return; }
  try{
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const r = await fetch(BASE + '/import', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({archivoBase64: base64})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al importar');
    let html = `<p class="ok-msg">Creados: ${data.creados} — Actualizados: ${data.actualizados}</p>`;
    if (data.errores && data.errores.length) {
      html += `<p class="err">${data.errores.length} fila(s) con error:</p><ul class="muted" style="margin-top:0">` +
        data.errores.map(e => `<li>Fila ${e.fila}: ${escapeHtml(e.motivo)}</li>`).join('') + '</ul>';
    }
    document.getElementById('impResultado').innerHTML = html;
    await cargarProveedores();
  }catch(e){
    document.getElementById('impErr').textContent = e.message;
  }
}

// Cuenta corriente del proveedor (4/10/2026, pedido de Mato: "crear una
// pestaña para ver el saldo de la cuenta corriente... que nos de las
// opciones de ver los comprobantes y demas") — reconstruida en el
// backend a partir de Compras y Gastos (ver GET /:id/cuenta-corriente en
// proveedores.js). Pensada para la pestaña "Cuenta corriente" del modal
// de Editar proveedor (ver abrirEditarProveedor/mostrarTabProveedor
// arriba) — rellena el contenedor #pccContenido que ya está en el DOM.
// -------------------------------------------------------------------
// Acceso rápido para registrar un pago desde acá mismo (4/10/2026,
// pedido de Mato: "cuando miramos la cuenta corriente del proveedor nos
// deberia dejar generar pagos como acceso rapido") — el módulo de pagos
// a proveedores vive en Compras (es ahí donde se reparte el pago entre
// las facturas pendientes), así que se abre esa pantalla con el
// proveedor ya elegido en vez de duplicar ese flujo acá.
function irARegistrarPagoProveedor(id){
  // Popup encima de la cuenta corriente (igual que el cobro en Clientes): es la misma pantalla de "Pago a cuenta" de Compras, en un marco.
  cerrarPopupPagoProveedor();
  const d = document.createElement('div');
  d.id = 'popupPagoProv';
  d.style.cssText = 'position:fixed;inset:0;z-index:900;';
  d.innerHTML = '<iframe src="admin-compras.html?embed=1&pagoProveedor=' + encodeURIComponent(id) + '" style="width:100%;height:100%;border:0;background:transparent" allowtransparency="true"></iframe>';
  document.body.appendChild(d);
  window.addEventListener('message', escucharPopupPagoProveedor);
}
function escucharPopupPagoProveedor(ev){
  if (ev.origin !== location.origin || !ev.data || ev.data.tipo !== 'popup-compras-cerrado') return;
  cerrarPopupPagoProveedor();

}
function cerrarPopupPagoProveedor(){

  window.removeEventListener('message', escucharPopupPagoProveedor);
}

let cuentaCorrienteProveedorCache = null;
async function cargarCuentaCorrienteProveedorTab(id){
  const cont0 = document.getElementById('pccContenido');
  if (cont0) cont0.innerHTML = 'Cargando...';
  try{
    const r = await fetch(BASE + '/' + id + '/cuenta-corriente', {headers: headersAuth()});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al cargar la cuenta corriente');
    cuentaCorrienteProveedorCache = data;
    window._ccProvCtx = { id, saldo: data.saldo, movs: data.movimientos, proveedor: (proveedoresCache.find(x => String(x._id) === String(id))) || {} };
    const cont = document.getElementById('pccContenido');
    if (!cont) return; // se cerró el modal mientras cargaba
    const saldoTexto = money(data.saldo);
    // Mismo criterio que la cuenta corriente de Clientes: los
    // movimientos vienen del más nuevo al más viejo, así que el saldo
    // corrido de cada fila se reconstruye deshaciendo, de ahí hacia
    // atrás, el efecto de la fila anterior (débito suma, crédito resta).
    let saldoCorrido = data.saldo;
    const filas = data.movimientos.map((m, i) => {
      if (i > 0) {
        const anterior = data.movimientos[i - 1];
        if (!anterior.importado) saldoCorrido -= anterior.tipo === 'debito' ? anterior.monto : -anterior.monto; // el historial importado de Dux no entra en el saldo
      }
      return { m, saldo: m.importado ? null : saldoCorrido, index: i };
    });
    cont.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:center">
        <p class="muted" style="margin-top:0">Saldo: <strong style="color:${data.saldo > 0 ? 'var(--danger)' : (data.saldo < 0 ? 'var(--ok)' : 'var(--text)')}">${saldoTexto}</strong>${data.saldo > 0 ? ' (le debemos esto al proveedor)' : (data.saldo < 0 ? ' (a favor nuestro)' : '')}</p>
        <div style="position:relative">
          <button class="btn secondary" id="ccAccionesBtn" onclick="toggleAccionesCCProv(event)" title="Acciones de la cuenta corriente" style="font-size:18px;line-height:1;padding:6px 12px">⚙</button>
          <div id="ccAccionesMenu" class="hidden" style="position:absolute;right:0;top:110%;z-index:50;min-width:250px;background:var(--surface,#fff);border:1px solid var(--border,#ccc);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px">
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('pagar')">💰 Registrar pago</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('compra')">🧾 Nueva compra</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('orden')">📋 Nueva orden de compra</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('ajuste')">⚖ Ajustar saldo</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('imprimir')">🖨 Ver / imprimir resumen</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('whatsapp')">💬 Enviar resumen por WhatsApp</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('mail')">✉ Enviar resumen por mail</a>
            <a href="javascript:void(0)" class="cc-acc-item" onclick="accionCCProv('excel')">⬇ Descargar resumen (Excel/CSV)</a>
          </div>
        </div>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Origen</th><th>Débito</th><th>Crédito</th><th>Saldo</th><th></th></tr></thead>
        <tbody>
          ${filas.length ? filas.map(({m, saldo, index}) => {
            const tieneDetalle = m.origen === 'compra' || m.origen === 'gasto';
            const conceptoHtml = tieneDetalle
              ? `<a href="javascript:void(0)" onclick="verDetalleMovimientoProveedor(${index})" style="text-decoration:underline;cursor:pointer" title="Ver el comprobante">${escapeHtml(m.concepto || '—')}</a>`
              : escapeHtml(m.concepto || '—');
            return `
            <tr>
              <td>${fechaCorta(m.fecha)}</td>
              <td>${conceptoHtml}${m.nota ? `<div class="muted">${escapeHtml(m.nota)}</div>` : ''}</td>
              <td class="muted">${ORIGEN_CC_PROVEEDOR_LABEL[m.origen] || escapeHtml(m.origen || '—')}${m.importado ? ' <span style="font-size:11px" title="Histórico importado de Dux">Dux</span>' : ''}</td>
              <td>${m.tipo === 'debito' ? money(m.monto) : ''}</td>
              <td>${m.tipo === 'credito' ? money(m.monto) : ''}</td>
              <td class="muted">${saldo === null ? '<span title="Histórico importado de Dux: no modifica el saldo">—</span>' : money(saldo)}</td>
              <td>${tieneDetalle ? `<button class="btn small secondary" onclick="verDetalleMovimientoProveedor(${index})">Ver</button>` : (m.origen === 'ajuste' ? `<button class="btn small secondary" title="Quitar este ajuste" onclick="quitarAjusteSaldoProveedor('${m.docId}')">Quitar</button>` : '')}</td>
            </tr>
          `; }).join('') : '<tr><td colspan="7" class="muted">Todavía no hay movimientos.</td></tr>'}
        </tbody>
      </table>
    `;
  }catch(e){
    const cont = document.getElementById('pccContenido');
    if (cont) cont.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`;
  }
}

(function(){ const st = document.createElement('style'); st.textContent = '.cc-acc-item{display:block;padding:9px 12px;border-radius:6px;color:var(--text,#222);text-decoration:none;font-size:14px;white-space:nowrap}.cc-acc-item:hover{background:rgba(127,127,127,.15)}'; document.head.appendChild(st); })();
function toggleAccionesCCProv(ev){
  ev.stopPropagation();
  const m = document.getElementById('ccAccionesMenu'); if (!m) return;
  m.classList.toggle('hidden');
  if (!m.classList.contains('hidden')) setTimeout(() => document.addEventListener('click', function cerrar(){ m.classList.add('hidden'); document.removeEventListener('click', cerrar); }), 0);

function nombreProvCC(c){ const p = c.proveedor || {}; return p.razonSocial || p.nombre || (document.querySelector('#modalRoot h2') || {}).textContent || 'Proveedor'; }
function resumenCCProvTexto(maxFilas){
  const c = window._ccProvCtx; if (!c) return '';
  const fil = c.movs.filter(m => !m.importado).slice(0, maxFilas || 10);
  const estado = c.saldo > 0.005 ? 'Saldo a pagar al proveedor: ' + money(c.saldo) : (c.saldo < -0.005 ? 'Saldo a favor: ' + money(-c.saldo) : 'Cuenta al día (saldo $ 0)');
  return 'Resumen de cuenta corriente — ' + nombreProvCC(c) + '\n' + estado + '\n\nÚltimos movimientos:\n' + fil.map(m => fechaCorta(m.fecha) + ' · ' + (m.concepto || m.origen || '') + ' · ' + (m.tipo === 'debito' ? '+' : '−') + money(m.monto)).join('\n');
}
function telefonoWhatsAppProv(p){
  let d = String(p.celular || p.telefono || '').replace(/\D/g, '').replace(/^0+/, '');
  if (!d) return '';
  if (d.startsWith('54')) return d;
  if (!d.startsWith('9')) d = '9' + d;
  return '54' + d;
}
function accionCCProv(que){
  const mn = document.getElementById('ccAccionesMenu'); if (mn) mn.classList.add('hidden');
  const c = window._ccProvCtx; if (!c) return;
  if (que === 'pagar') { irARegistrarPagoProveedor(c.id); return; }
  if (que === 'compra') { location.href = 'admin-compras.html?nuevaCompra=' + encodeURIComponent(c.id); return; }
  if (que === 'ajuste') { abrirAjusteSaldoProveedor(); return; }
  if (que === 'orden') { location.href = 'admin-compras.html?nuevaOrden=' + encodeURIComponent(c.id); return; }
  if (que === 'whatsapp') {
    const tel = telefonoWhatsAppProv(c.proveedor);
    if (!tel && !confirm('El proveedor no tiene teléfono cargado. ¿Abrir WhatsApp igual para elegir el contacto a mano?')) return;
    window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(resumenCCProvTexto(10)), '_blank'); return;
  }
  if (que === 'mail') {
    location.href = 'mailto:' + (c.proveedor.email || '') + '?subject=' + encodeURIComponent('Resumen de cuenta corriente') + '&body=' + encodeURIComponent(resumenCCProvTexto(15));
    return;
  }
  const nombre = nombreProvCC(c);
  let corrido = c.saldo;
  const filas = c.movs.map((m, i) => {
    if (i > 0) { const a = c.movs[i - 1]; if (!a.importado) corrido -= a.tipo === 'debito' ? a.monto : -a.monto; }
    return { m, saldo: m.importado ? null : corrido };
  });
  if (que === 'excel') {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lineas = [['Fecha', 'Concepto', 'Origen', 'Débito', 'Crédito', 'Saldo'].map(q).join(';')].concat(filas.map(f => [fechaCorta(f.m.fecha), f.m.concepto || '', f.m.origen || '', f.m.tipo === 'debito' ? f.m.monto : '', f.m.tipo === 'credito' ? f.m.monto : '', f.saldo == null ? '' : f.saldo].map(q).join(';')));
    const blob = new Blob(['\ufeff' + lineas.join('\n')], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cuenta-corriente-proveedor-' + nombre.replace(/[^\w]+/g, '-') + '.csv'; a.click(); return;
  }
  const w = window.open('', '_blank'); if (!w) { alert('El navegador bloqueó la ventana. Permití ventanas emergentes.'); return; }
  const tr = filas.map(f => `<tr><td>${fechaCorta(f.m.fecha)}</td><td>${escapeHtml(f.m.concepto || '')}</td><td style="text-align:right">${f.m.tipo === 'debito' ? money(f.m.monto) : ''}</td><td style="text-align:right">${f.m.tipo === 'credito' ? money(f.m.monto) : ''}</td><td style="text-align:right">${f.saldo == null ? '—' : money(f.saldo)}</td></tr>`).join('');
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Resumen de cuenta corriente</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#111}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left}th{background:#f2f2f2}</style>
    <h2>Resumen de cuenta corriente — proveedor</h2><p><b>${escapeHtml(nombre)}</b><br>Emitido el ${new Date().toLocaleDateString('es-AR')} · <b>Saldo: ${money(c.saldo)}</b> ${c.saldo > 0.005 ? '(a pagar al proveedor)' : (c.saldo < -0.005 ? '(a favor nuestro)' : '')}</p>
    <table><thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Débito</th><th style="text-align:right">Crédito</th><th style="text-align:right">Saldo</th></tr></thead><tbody>${tr}</tbody></table>
    <p><button onclick="window.print()">Imprimir</button></p>`);
  w.document.close();
}

let ORGS_PROV = [];
async function abrirAjusteSaldoProveedor(){
  const c = window._ccProvCtx; if (!c) return;
  try { const r = await fetch('/api/usuarios/me', {headers: headersAuth()}); if (r.ok) ORGS_PROV = (await r.json()).organizaciones || []; } catch (e) {}
  const idsOrg = ORGS_PROV.map(o => String(o._id));
  const op = localStorage.getItem('obras_org_operar');
  const defOrg = (ORG && ORG !== 'todas' && idsOrg.includes(ORG)) ? ORG : (op && idsOrg.includes(op) ? op : (idsOrg[0] || ''));
  const nombre = nombreProvCC(c);
  document.getElementById('modalRoot').insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="ajBg" onclick="if(event.target===this) cerrarAjusteSaldoProveedor()" style="z-index:950">
      <div class="modal">
        <span class="close-x" onclick="cerrarAjusteSaldoProveedor()">✕</span>
        <h2>Ajustar saldo — ${escapeHtml(nombre)}</h2>
        <p class="muted" style="margin-top:-6px">Saldo actual: <strong>${money(c.saldo)}</strong> ${c.saldo > 0.005 ? '(le debemos)' : (c.saldo < -0.005 ? '(a favor nuestro)' : '')}. Poné el saldo que tiene que quedar y el sistema calcula la diferencia.</p>
        <div class="row">
          <div style="flex:1;min-width:180px"><label>Saldo que tiene que quedar *</label><input id="ajNuevo" type="number" step="0.01" value="${c.saldo}" oninput="calcularAjusteSaldoProveedor()"></div>
          <div style="flex:1;min-width:150px"><label>Fecha</label><input id="ajFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <div id="ajDif" class="muted" style="margin:8px 0"></div>
        ${ORGS_PROV.length > 1 ? `<div><label>Sucursal a la que corresponde *</label><select id="ajOrg">${ORGS_PROV.map(o => `<option value="${o._id}" ${String(o._id) === defOrg ? 'selected' : ''}>${escapeHtml(o.nombre)}</option>`).join('')}</select></div>` : ''}
        <div style="margin-top:10px"><label>Motivo *</label><input id="ajMotivo" placeholder="Ej: diferencia de cambio, error de carga, acuerdo con el proveedor"></div>
        <div class="err" id="ajErr"></div>
        <button class="btn" style="margin-top:10px" onclick="guardarAjusteSaldoProveedor()">Guardar ajuste</button>
      </div>
    </div>`);
  calcularAjusteSaldoProveedor();
}
function cerrarAjusteSaldoProveedor(){ const e = document.getElementById('ajBg'); if (e) e.remove(); }
function calcularAjusteSaldoProveedor(){
  const c = window._ccProvCtx; if (!c) return;
  const nuevo = Number(document.getElementById('ajNuevo').value);
  const dif = Math.round((nuevo - c.saldo) * 100) / 100;
  document.getElementById('ajDif').innerHTML = Math.abs(dif) < 0.005 ? 'No hay diferencia: el saldo ya es ese.'
    : (dif > 0 ? `Se suman <strong>${money(dif)}</strong> a lo que le debemos (ajuste de débito).` : `Se restan <strong>${money(-dif)}</strong> de lo que le debemos (ajuste de crédito).`);
}
async function guardarAjusteSaldoProveedor(){
  const c = window._ccProvCtx; if (!c) return;
  const err = document.getElementById('ajErr'); err.textContent = '';
  const nuevo = Number(document.getElementById('ajNuevo').value);
  const dif = Math.round((nuevo - c.saldo) * 100) / 100;
  const motivo = document.getElementById('ajMotivo').value.trim();
  if (!isFinite(nuevo)) { err.textContent = 'Poné el saldo que tiene que quedar.'; return; }
  if (Math.abs(dif) < 0.005) { err.textContent = 'No hay diferencia con el saldo actual.'; return; }
  if (!motivo) { err.textContent = 'Escribí el motivo del ajuste.'; return; }
  const h = headersAuthJson(); const so = document.getElementById('ajOrg'); if (so && so.value) h['x-org-id'] = so.value;
  try {
    const r = await fetch(BASE + '/' + c.id + '/ajuste-saldo', {method: 'POST', headers: h, body: JSON.stringify({ tipo: dif > 0 ? 'debito' : 'credito', monto: Math.abs(dif), fecha: document.getElementById('ajFecha').value, motivo })});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    cerrarAjusteSaldoProveedor();
    cargarCuentaCorrienteProveedorTab(c.id);
  } catch (e) { err.textContent = e.message; }
}
async function quitarAjusteSaldoProveedor(ajusteId){
  const c = window._ccProvCtx; if (!c) return;
  if (!confirm('¿Quitar este ajuste de saldo? La cuenta corriente vuelve al saldo anterior.')) return;
  try {
    const r = await fetch(BASE + '/' + c.id + '/ajuste-saldo/' + ajusteId, {method: 'DELETE', headers: headersAuth()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    cargarCuentaCorrienteProveedorTab(c.id);
  } catch (e) { alert(e.message); }
}

          <div class="fila-total grande"><span>Total</span><span>${money(m.monto)}</span></div>

        <p class="muted" style="margin-top:10px">Para registrar pagos o anular, entrá a ${m.origen === 'compra' ? 'Compras' : 'Gastos'} y buscá el ${m.origen === 'compra' ? 'Compra' : 'Gasto'} #${m.docNumero}.</p>

  `);

// Consulta de CUIT en ARCA (5/10/2026): completa razón social, domicilio y
// categoría fiscal con los datos del padrón. No pisa lo que ya está cargado
// salvo la categoría fiscal; si falla, el formulario sigue igual.
let autoCuitUltimo = '';
// Al completar los 11 dígitos se consulta ARCA solo (sin pisar lo ya cargado).
function autoBuscarCuit(pref){
  const d = document.getElementById(pref + 'Cuit').value.replace(/\D/g, '');
  if (d.length !== 11) { autoCuitUltimo = ''; return; }
  if (d === autoCuitUltimo) return;
  autoCuitUltimo = d;
  const nombreId = pref === 'fc' ? 'fcApellidoRazonSocial' : 'fpRazonSocial';
  buscarCuitEnArca(pref, nombreId, pref === 'fc');
}
async function buscarCuitEnArca(pref, idNombre, conCategoria){
  const inp = document.getElementById(pref + 'Cuit');
  const err = document.getElementById(pref + 'Err');
  const cuit = (inp.value || '').replace(/\D/g, '');
  if (cuit.length !== 11) { err.textContent = 'Cargá el CUIT completo (11 dígitos) para buscarlo en ARCA'; return; }
  err.textContent = 'Consultando ARCA…';
  try{
    const r = await fetch('/api/fiscal/consulta-cuit/' + cuit, {headers: headersAuth()});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'No se pudo consultar ARCA');
    const poner = (id, val, forzar) => { const el = document.getElementById(id); if (el && val && (forzar || !el.value.trim())) el.value = val; };
    poner(idNombre, d.razonSocial);
    poner(pref + 'Domicilio', d.domicilio);
    poner(pref + 'Localidad', d.localidad);
    poner(pref + 'Provincia', d.provincia);
    poner(pref + 'CodigoPostal', d.codigoPostal);
    if (conCategoria) poner(pref + 'CategoriaFiscal', d.categoriaFiscal, true);
    err.textContent = '';
    if (d.estadoClave && String(d.estadoClave).toUpperCase() !== 'ACTIVO') err.textContent = 'Ojo: ARCA informa la clave como ' + d.estadoClave + '.';
  }catch(e){ err.textContent = e.message; }
}

  await cargarUnificarP();
}
function unifGrupoHtmlP(g, gi){ return `
      <div id="unifGP${gi}" style="border:1px solid #ccc;border-radius:8px;padding:8px 10px;margin:8px 0;${g.riesgo ? 'border-color:#d9a400;background:rgba(217,164,0,.08)' : ''}">
        <div class="muted" style="margin-bottom:4px"><b>${escapeHtml(g.motivo)}</b></div>
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          <tr class="muted"><td>Conservar</td><td>Juntar</td><td>Proveedor</td><td>Sucursal</td><td>CUIT</td><td>Domicilio</td><td>Teléfono</td><td style="text-align:right">Compras</td><td style="text-align:right">Saldo</td></tr>
          ${g.miembros.map((m, mi) => `<tr>
            <td><input type="radio" name="unifKP${gi}" value="${m._id}" ${mi === 0 ? 'checked' : ''} onchange="unifMarcarP(${gi})"></td>
            <td><input type="checkbox" class="unifCP${gi}" value="${m._id}" ${mi === 0 ? 'disabled' : (gi >= 100000 ? '' : 'checked')}></td>
            <td>${escapeHtml(m.nombre)}</td><td>${escapeHtml(m.sucursal)}</td><td>${escapeHtml(m.cuit)}</td><td>${escapeHtml(m.domicilio)}</td><td>${escapeHtml(m.telefono)}</td>
            <td style="text-align:right">${m.ventas}</td><td style="text-align:right">${m.saldo ? m.saldo.toLocaleString('es-AR') : ''}</td></tr>`).join('')}
        </table>
        <button class="btn" style="margin-top:6px" onclick="unificarGrupoP(${gi})">Unificar este grupo</button>
        <span class="muted" id="unifRP${gi}"></span>
      </div>`; }
let unifManualP = 0;
async function buscarUnificarP(){
  const q = document.getElementById('unifQP').value.trim(), out = document.getElementById('unifBuscaP'), errEl = document.getElementById('unifErrP'); errEl.textContent = '';
  if (q.length < 2){ out.innerHTML = ''; return; }
  out.innerHTML = '<p class="muted">Buscando…</p>';
  try{
    const r = await fetch('/api/unificar-proveedores/buscar?q=' + encodeURIComponent(q), {headers: headersAuth()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    if (d.miembros.length < 2){ out.innerHTML = '<p class="muted">' + (d.miembros.length ? 'Solo hay un proveedor con ese nombre.' : 'No se encontró ningún proveedor.') + '</p>'; return; }
    const gi = 100000 + (++unifManualP);
    out.innerHTML = '<p class="muted">Resultados de la búsqueda (hasta 60). Tildá los que son el mismo proveedor y elegí cuál se conserva:</p>' + unifGrupoHtmlP({motivo: 'Búsqueda manual', riesgo: false, miembros: d.miembros}, gi);
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function cargarUnificarP(){
  const out = document.getElementById('unifListaP'), errEl = document.getElementById('unifErrP'); if (!out) return;
  try{
    const r = await fetch('/api/unificar-proveedores/grupos', {headers: headersAuth()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    unifGruposP = d.grupos;
    if (!d.grupos.length){ out.innerHTML = '<p class="ok-msg">No se encontraron proveedores duplicados.</p>'; return; }
    out.innerHTML = `<p><b>${d.total}</b> grupo(s) de posibles duplicados${d.total > d.grupos.length ? ' (se muestran los primeros ' + d.grupos.length + ')' : ''}.
      <button class="btn unifTodosBtnP" style="margin-left:8px" onclick="unificarTodosP(true)">Unificar TODO junto (${d.total} grupos)</button>
      ${d.sinRiesgo && d.sinRiesgo < d.total ? `<button class="btn secondary unifTodosBtnP" style="margin-left:8px" onclick="unificarTodosP(false)">Solo los ${d.sinRiesgo} sin riesgo</button>` : ''}</p><p class="muted" id="unifProgP"></p>` + d.grupos.map((g, gi) => unifGrupoHtmlP(g, gi)).join('');
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function unificarTodosP(incluirDudosos){
  const prog = document.getElementById('unifProgP');
  const msg = incluirDudosos
    ? 'Se van a unificar TODOS los grupos, incluidos los de mismo nombre con CUIT distinto (pueden ser personas distintas). En cada grupo se conserva el proveedor con más ventas. No hay botón para deshacerlo. ¿Seguro?'
    : 'Se van a unificar todos los grupos sin riesgo (mismo CUIT, o mismo nombre sin CUIT contradictorio). En cada grupo se conserva el proveedor con más ventas. ¿Seguimos?';
  if (!confirm(msg)) return;
  document.querySelectorAll('.unifTodosBtnP').forEach(b => b.disabled = true);
  if (prog) prog.textContent = 'Unificando, puede tardar un par de minutos…';
  try{
    const r = await fetch('/api/unificar-proveedores/unificar-todos', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({incluirDudosos: !!incluirDudosos})});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    document.getElementById('unifListaP').innerHTML = '<p class="ok-msg">Listo: ' + d.grupos + ' grupos unificados (' + d.unificados + ' proveedores duplicados juntados).</p>';
    if (typeof cargarProveedores === 'function') cargarProveedores();
  }catch(e){ if (prog) prog.textContent = ''; document.getElementById('unifErrP').textContent = e.message; document.querySelectorAll('.unifTodosBtnP').forEach(b => b.disabled = false); }
}
function unifMarcarP(gi){
  const k = document.querySelector('input[name="unifKP' + gi + '"]:checked').value;
  document.querySelectorAll('.unifCP' + gi).forEach(c => { if (c.value === k){ c.checked = false; c.disabled = true; } else if (c.disabled){ c.disabled = false; c.checked = gi < 100000; } });
}
async function unificarGrupoP(gi){
  const k = document.querySelector('input[name="unifKP' + gi + '"]:checked').value;
  const perd = [...document.querySelectorAll('.unifCP' + gi)].filter(c => c.checked && c.value !== k).map(c => c.value);
  if (!perd.length){ alert('Tildá al menos un duplicado para juntar.'); return; }
  if (!confirm('¿Unificar ' + perd.length + ' proveedor(s) duplicado(s) en el que conservás? No se puede deshacer fácilmente.')) return;
  const res = document.getElementById('unifRP' + gi); res.textContent = ' Unificando…';
  try{
    const r = await fetch('/api/unificar-proveedores/unificar', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({ganadorId: k, perdedorIds: perd})});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
    document.getElementById('unifGP' + gi).innerHTML = '<span class="ok-msg">Listo: ' + d.unificados + ' unificado(s) en ' + escapeHtml(d.conservado) + '.</span>';
    if (typeof cargarProveedores === 'function') cargarProveedores();
  }catch(e){ res.textContent = ' ' + e.message; }
}


// ---- Ficha de proveedores de Dux ----
let impFpB64 = null, impFpOrgs = [];
async function abrirFichasDux(){
  impFpB64 = null;
  try{ const r = await fetch('/api/usuarios/me', {headers: headersAuth()}); if (r.ok) impFpOrgs = (await r.json()).organizaciones || []; }catch(e){}
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar fichas de proveedores de Dux</h2>
        <p class="muted">Subí el archivo "Listado de Proveedores" de Dux. A los proveedores que ya existen (por las compras, gastos y pagos importados) les completa los datos que tengan vacíos (CUIT, categoría fiscal, domicilio, contacto…) sin pisar lo ya cargado. Los que no existen se crean en la sucursal que elijas. Se puede repetir sin duplicar.</p>
        <label>Sucursal donde se crean los que no existan</label>
        <select id="impFpOrg" onchange="previewFichasDux()">${impFpOrgs.map(o => `<option value="${o._id}" ${o._id === ORG ? 'selected' : ''}>${escapeHtml(o.nombre)}</option>`).join('')}</select>
        <input type="file" id="impFpArchivo" accept=".xls,.xlsx" onchange="previewFichasDux()" style="margin-top:8px">
        <div class="err" id="impFpErr"></div>
        <div id="impFpResumen"></div>
        <button class="btn" id="impFpBtn" style="margin-top:10px;display:none" onclick="aplicarFichasDux()">Importar fichas</button>
      </div>
    </div>`;
}
function hFp(){ const h = headersAuthJson(); const s = document.getElementById('impFpOrg'); if (s && s.value) h['x-org-id'] = s.value; return h; }
function bodyFp(){ return JSON.stringify({archivoBase64: impFpB64.b64, orgId: document.getElementById('impFpOrg').value}); }
async function previewFichasDux(){
  const file = document.getElementById('impFpArchivo').files[0]; const errEl = document.getElementById('impFpErr'); errEl.textContent = '';
  const out = document.getElementById('impFpResumen'); out.innerHTML = ''; document.getElementById('impFpBtn').style.display = 'none';
  if (!file) return; out.innerHTML = '<p class="muted">Analizando…</p>';
  try{
    if (!impFpB64 || impFpB64.file !== file) impFpB64 = {file, b64: await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); })};
    const r = await fetch('/api/fichas-import-dux/proveedores/preview', {method:'POST', headers: hFp(), body: bodyFp()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al analizar');
    out.innerHTML = `<ul style="line-height:1.7;padding-left:18px">
      <li><b>${d.proveedores}</b> proveedores en el archivo (${d.conCuit} con CUIT)</li>
      <li>${d.existentes} ya existen: a <b>${d.aCompletar}</b> se les completan datos (${d.camposACompletar} campos vacíos)</li>
      <li><b>${d.aCrear}</b> se van a crear</li></ul>`
      + (d.ambiguos ? `<p class="err">${d.ambiguos} no se cargan porque coinciden con más de un proveedor: ${d.ejemplosAmbiguos.map(escapeHtml).join(', ')}.</p>` : '')
      + (d.errores.length ? '<p class="muted">' + d.errores.length + ' aviso(s): ' + d.errores.slice(0,5).map(e => escapeHtml(e.motivo)).join('; ') + '</p>' : '');
    if (d.aCrear > 0 || d.aCompletar > 0) document.getElementById('impFpBtn').style.display = '';
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function aplicarFichasDux(){
  const btn = document.getElementById('impFpBtn'), errEl = document.getElementById('impFpErr');
  if (btn.disabled || !impFpB64) return; btn.disabled = true; errEl.textContent = '';
  try{
    const r = await fetch('/api/fichas-import-dux/proveedores/aplicar', {method:'POST', headers: hFp(), body: bodyFp()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al importar');
    document.getElementById('impFpResumen').innerHTML = `<p class="ok-msg">Listo: ${d.creados} proveedores creados y ${d.completados} completados.</p>`;
    btn.style.display = 'none'; if (typeof cargarProveedores === 'function') cargarProveedores();
  }catch(e){ errEl.textContent = e.message; }
  btn.disabled = false;
}
// ---- Saldos de proveedores de Dux ----
let impSpB64 = null, impSpOrgs = [];
async function abrirSaldosProvDux(){
  impSpB64 = null;
  try{ const r = await fetch('/api/usuarios/me', {headers: headersAuth()}); if (r.ok) impSpOrgs = (await r.json()).organizaciones || []; }catch(e){}
  const hoy = new Date(Date.now() - 3*3600e3).toISOString().slice(0,10);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) cerrarModal()">
      <div class="modal">
        <span class="close-x" onclick="cerrarModal()">✕</span>
        <h2>Importar saldos de proveedores de Dux</h2>
        <p class="muted">Subí el archivo "Consulta de Proveedores con Saldo" de Dux. Cada saldo se carga como "Saldo inicial Dux" en la cuenta corriente del proveedor (positivo = le debemos, negativo = saldo a favor nuestro). Las compras, gastos y pagos importados quedan como historial y dejan de sumar al saldo. Cada proveedor se busca por CUIT y por nombre en todas tus sucursales. Si lo subís de nuevo, reemplaza el saldo anterior, no lo duplica.</p>
        <label>Fecha del saldo</label>
        <input type="date" id="impSpFecha" value="${hoy}" onchange="previewSaldosProvDux()">
        <label style="margin-top:8px;display:block">Sucursal para los proveedores que no existan</label>
        <select id="impSpOrg" onchange="previewSaldosProvDux()">${impSpOrgs.map(o => `<option value="${o._id}" ${o._id === ORG ? 'selected' : ''}>${escapeHtml(o.nombre)}</option>`).join('')}</select>
        <label style="display:block;margin-top:8px"><input type="checkbox" id="impSpCero" onchange="previewSaldosProvDux()"> Poner en 0 a los proveedores con saldo inicial anterior que ya no figuran en el archivo</label>
        <input type="file" id="impSpArchivo" accept=".xls,.xlsx" onchange="previewSaldosProvDux()" style="margin-top:8px">
        <div class="err" id="impSpErr"></div>
        <div id="impSpResumen"></div>
        <button class="btn" id="impSpBtn" style="margin-top:10px;display:none" onclick="aplicarSaldosProvDux()">Cargar saldos</button>
      </div>
    </div>`;
}
function bodySaldosProvDux(){ return JSON.stringify({archivoBase64: impSpB64.b64, orgId: document.getElementById('impSpOrg').value, fechaCorte: document.getElementById('impSpFecha').value, ponerEnCero: document.getElementById('impSpCero').checked}); }
function hSp(){ const h = headersAuthJson(); const s = document.getElementById('impSpOrg'); if (s && s.value) h['x-org-id'] = s.value; return h; }
async function previewSaldosProvDux(){
  const file = document.getElementById('impSpArchivo').files[0]; const errEl = document.getElementById('impSpErr'); errEl.textContent = '';
  const out = document.getElementById('impSpResumen'); out.innerHTML = ''; document.getElementById('impSpBtn').style.display = 'none';
  if (!file) return; out.innerHTML = '<p class="muted">Analizando…</p>';
  try{
    if (!impSpB64 || impSpB64.file !== file) impSpB64 = {file, b64: await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); })};
    const r = await fetch('/api/saldos-import-dux/proveedores/preview', {method:'POST', headers: hSp(), body: bodySaldosProvDux()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al analizar');
    const m = n => '$' + Number(n).toLocaleString('es-AR', {maximumFractionDigits:0});
    out.innerHTML = `<ul style="line-height:1.7;padding-left:18px">
      <li><b>${d.proveedores}</b> proveedores con saldo. Les debemos <b>${m(d.totalDeuda)}</b> (${d.cantDeuda}) · a favor nuestro <b>${m(d.totalAFavor)}</b> (${d.cantAFavor}) · neto <b>${m(d.saldoNeto)}</b></li>
      <li>${d.existentes} ya existen${d.enVariasSucursales ? ' (' + d.enVariasSucursales + ' están en más de una sucursal: van a la que tiene más ventas)' : ''}, <b>${d.nuevos}</b> se van a crear</li>
      ${d.unificados ? `<li>${d.unificados} proveedores de Dux ya están unificados en uno solo en el sistema: se suman sus saldos.</li>` : ''}<li>A cargar ahora: <b>${d.aCargar}</b> (${d.sinCambios} ya tienen ese mismo saldo)${d.ponerEnCero ? ' · ' + d.ponerEnCero + ' se ponen en 0' : ''}</li></ul>`
      + (d.ambiguos ? `<p class="err"><b>${d.ambiguos} proveedores no se cargan</b> (${m(d.montoAmbiguos)}) porque el nombre coincide con más de un proveedor del sistema: ${d.detalleAmbiguos.map(x => escapeHtml(x.nombre) + ' (' + m(x.saldo) + ')').join(', ')}. Unificá los duplicados y volvé a subir el archivo.</p>` : '')
      + (d.errores.length ? '<p class="muted">' + d.errores.length + ' aviso(s): ' + d.errores.slice(0,5).map(e => escapeHtml(e.motivo)).join('; ') + '</p>' : '');
    if (d.aCargar > 0 || d.ponerEnCero > 0) document.getElementById('impSpBtn').style.display = '';
  }catch(e){ out.innerHTML = ''; errEl.textContent = e.message; }
}
async function aplicarSaldosProvDux(){
  const btn = document.getElementById('impSpBtn'), errEl = document.getElementById('impSpErr');
  if (btn.disabled || !impSpB64) return; btn.disabled = true; errEl.textContent = '';
  try{
    const r = await fetch('/api/saldos-import-dux/proveedores/aplicar', {method:'POST', headers: hSp(), body: bodySaldosProvDux()});
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error al cargar');
    document.getElementById('impSpResumen').innerHTML = `<p class="ok-msg">Listo: ${d.cargados} saldos cargados${d.proveedoresCreados ? ' y ' + d.proveedoresCreados + ' proveedores creados' : ''}.</p>`;
    btn.style.display = 'none'; if (typeof cargarProveedores === 'function') cargarProveedores();
  }catch(e){ errEl.textContent = e.message; }
  btn.disabled = false;
}
</script>
