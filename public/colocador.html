<meta charset="UTF-8">

<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --obra:#2f6fed; --obra-soft:#e2ebff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --danger:#c53030;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding-bottom:30px;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);color:var(--text);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:10px;}
  header .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  header .logo{height:19px;width:auto;display:block;flex-shrink:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;flex-shrink:0;}
  main{padding:14px;max-width:480px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:11px 16px;border-radius:8px;font-size:15px;font-weight:700;width:100%;font-family:inherit;display:inline-block;text-decoration:none;text-align:center;box-sizing:border-box;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.pendiente{background:var(--bg);color:var(--muted);}
  .pill.asignada{background:var(--obra-soft);color:var(--obra);}
  .pill.asignado{background:var(--obra-soft);color:var(--obra);}
  .pill.en_curso{background:var(--accent-soft);color:var(--accent);}
  .pill.terminada{background:var(--ok-soft);color:var(--ok);}
  .obra-titulo{font-weight:800;font-size:15px;}
  .muted{color:var(--muted);font-size:12.5px;}
  .err{color:var(--danger);font-size:13px;margin:8px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  #loginScreen .card{width:100%;max-width:340px;text-align:center;}
  #loginScreen .logo{height:24px;width:auto;margin:0 auto 16px;display:block;}
  .hidden{display:none !important;}
  .foto-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:8px 0;}
  .foto-galeria img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --obra:#7ea2ff; --obra-soft:#1c2740; --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
    :root:not([data-theme="light"]) .logo{filter:invert(1);}
  }
  :root[data-theme="dark"] {
    --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
    --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
    --obra:#7ea2ff; --obra-soft:#1c2740; --ok:#5fd39a; --ok-soft:#173328; --danger:#ff8080;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
  }
  :root[data-theme="dark"] .logo{filter:invert(1);}
</style>
</head>

<script>
const BASE = '/api/obras'; // coincide con app.use('/api/obras', obrasRouter) en server.js
let TOKEN = localStorage.getItem('colocador_token') || '';
let NOMBRE = localStorage.getItem('colocador_nombre') || '';

function api(path, opts={}) {
  opts.headers = Object.assign({'Content-Type':'application/json','x-colocador-token':TOKEN}, opts.headers||{});
  if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
  return fetch(BASE+path, opts).then(async r => {
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || 'Error de red');
    return data;
  });
}

async function login(){
  const pin = document.getElementById('pin').value.trim();
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch(BASE+'/colocador/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    NOMBRE = data.colocador.nombre;
    localStorage.setItem('colocador_token', TOKEN);
    localStorage.setItem('colocador_nombre', NOMBRE);
    iniciar();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('colocador_token');
  localStorage.removeItem('colocador_nombre');
  location.reload();
}
function iniciar(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('saludo').textContent = 'Hola, ' + NOMBRE;
  cargarMisObras();
}
if (TOKEN) iniciar();

// La obra se maneja como una sola, aunque tenga varios productos adentro
// (piso, zócalo, etc.) — un solo estado, una sola aclaración de oficina.
const ESTADOS_OBRA = {pendiente:'Por comenzar', asignado:'Por comenzar', en_curso:'En curso', terminada:'Terminada'};

let VIENDO_HISTORIAL = false;

function cambiarTabObras(historial){
  VIENDO_HISTORIAL = historial;
  document.getElementById('tabEnCurso').className = historial ? 'btn secondary' : 'btn';
  document.getElementById('tabHistorial').className = historial ? 'btn' : 'btn secondary';
  document.getElementById('tabEnCurso').style.cssText = 'width:auto;flex:1;padding:8px';
  document.getElementById('tabHistorial').style.cssText = 'width:auto;flex:1;padding:8px';
  cargarMisObras();
}

async function cargarMisObras(){
  let obras;
  try{
    obras = await api('/colocador/mis-obras' + (VIENDO_HISTORIAL ? '?historial=1' : ''));
  }catch(e){
    if (e.message.includes('vencida') || e.message.includes('inválida')) { logout(); return; }
    document.getElementById('listaObras').innerHTML = `<div class="err">${e.message}</div>`;
    return;
  }
  if (!obras.length){
    document.getElementById('listaObras').innerHTML = VIENDO_HISTORIAL
      ? '<p class="muted">Todavía no tenés obras terminadas.</p>'
      : '<p class="muted">No tenés obras asignadas por ahora.</p>';
    return;
  }
  document.getElementById('listaObras').innerHTML = obras.map(o => {
    const fotosAntes = (o.fotos||[]).filter(f=>(f.origen||'vendedor')==='vendedor');
    const fotosDespues = (o.fotos||[]).filter(f=>f.origen==='colocador');
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div class="obra-titulo">Obra #${o.numero} — ${o.cliente.nombre}</div>
        <span class="pill ${o.estado}">${ESTADOS_OBRA[o.estado]||o.estado}</span>
      </div>
      <div class="muted">${o.cliente.direccion||''} ${o.cliente.localidad?'· '+o.cliente.localidad:''}</div>
      ${o.cliente.telefono ? `<div class="muted">Tel. cliente: ${o.cliente.telefono}</div>` : ''}
      ${o.notasColocador ? `<div class="muted" style="margin-top:6px">Aclaración de oficina: ${o.notasColocador}</div>` : ''}
      ${fotosAntes.length ? `<div class="muted" style="margin-top:6px">Fotos del lugar</div><div class="foto-galeria">${fotosAntes.map(f=>`<img src="${f.data}">`).join('')}</div>` : ''}

      <div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee">
        <b>Productos</b>
        ${o.tareas.map(t=>`
          <div style="margin-top:6px">
            <div>${t.tipoTrabajo} <span class="muted">— ${t.m2Presupuestados} m²</span></div>
            ${(t.materiales&&t.materiales.length) ? `<div class="muted" style="margin-top:2px">${t.materiales.map(m=>`• ${m.cantidad?m.cantidad+' ':''}${m.tipo}`).join('<br>')}</div>` : ''}
          </div>
        `).join('')}
      </div>

      ${!VIENDO_HISTORIAL ? `
        <div style="display:flex;gap:8px;margin-top:12px">
          ${(o.estado==='pendiente'||o.estado==='asignado') ? `<button class="btn secondary" style="width:auto;flex:1" onclick="marcarEstadoObra('${o.obraId}','en_curso')">Comenzar obra</button>` : ''}
          ${o.estado!=='terminada' ? `<button class="btn" style="width:auto;flex:1" onclick="mostrarFormTerminarObra('${o.obraId}')">Marcar obra terminada</button>` : ''}
        </div>
        <div id="terminarBox-${o.obraId}"></div>
      ` : ''}

      <div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee">
        <b>Fotos del trabajo terminado</b>
        ${fotosDespues.length ? `<div class="foto-galeria">${fotosDespues.map(f=>`<img src="${f.data}">`).join('')}</div>` : '<p class="muted">Todavía no subiste fotos del resultado.</p>'}
        ${!VIENDO_HISTORIAL ? `
          <input type="file" accept="image/*" multiple id="inputFotosObra-${o.obraId}" style="margin-top:8px">
          <button class="btn small secondary" style="margin-top:8px;width:auto" onclick="subirFotosObra('${o.obraId}')">Agregar fotos</button>
          <div class="err" id="fotoObraErr-${o.obraId}"></div>
        ` : ''}
      </div>
    </div>
  `; }).join('');
}

function mostrarFormTerminarObra(obraId){
  document.getElementById(`terminarBox-${obraId}`).innerHTML = `
    <label style="margin-top:8px">¿Quedó algo pendiente? (opcional)</label>
    <input id="obs-${obraId}" placeholder="Ej: falta silicona en el borde">
    <button class="btn" style="margin-top:8px" onclick="confirmarTerminarObra('${obraId}')">Confirmar terminada</button>
  `;
}
async function confirmarTerminarObra(obraId){
  const observaciones = document.getElementById(`obs-${obraId}`).value.trim();
  await marcarEstadoObra(obraId, 'terminada', observaciones);
}
async function marcarEstadoObra(obraId, estado, observaciones){
  try{
    const body = observaciones !== undefined ? {estado, observaciones} : {estado};
    await api(`/colocador/obras/${obraId}/estado`, {method:'POST', body});
    cargarMisObras();
  }catch(e){ alert(e.message); }
}

// ---------------- FOTOS DEL RESULTADO ----------------

function leerComoDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function subirFotosObra(obraId){
  const input = document.getElementById(`inputFotosObra-${obraId}`);
  const errEl = document.getElementById(`fotoObraErr-${obraId}`);
  errEl.textContent = '';
  if (!input.files.length){ errEl.textContent = 'Elegí al menos una foto'; return; }
  try{
    const fotos = await Promise.all([...input.files].map(leerComoDataURL));
    await api(`/colocador/obras/${obraId}/fotos`, {method:'POST', body:{fotos}});
    cargarMisObras();
  }catch(e){ errEl.textContent = e.message; }
}
</script>
</body>
