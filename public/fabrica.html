<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producción - Piedra Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#171a1f; --muted:#6b7280;
    --border:#e5e7eb; --accent:#ff5a36; --accent-soft:#ffe7de; --accent-ink:#ffffff;
    --ok:#1f8a5f; --ok-soft:#e1f5ea;
    --warn:#b7791f; --warn-soft:#fdf3d9;
    --danger:#c53030;
    --shadow:0 1px 2px rgba(17,20,24,.04), 0 8px 20px -12px rgba(17,20,24,.12);
  }
  *{box-sizing:border-box;}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding-bottom:30px;-webkit-font-smoothing:antialiased;}
  header{background:var(--card);border-bottom:1px solid var(--border);color:var(--text);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:10px;}
  header .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  header .logo{height:19px;width:auto;display:block;flex-shrink:0;}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;flex-shrink:0;}
  main{padding:14px;max-width:480px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;width:100%;background:var(--bg);color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;padding:11px 16px;border-radius:8px;font-size:15px;font-weight:700;width:100%;font-family:inherit;display:inline-block;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer;}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.small{width:auto;padding:8px 12px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .muted{color:var(--muted);font-size:12.5px;}
  .err{color:var(--danger);font-size:13px;margin:8px 0;}
  .ok-msg{color:var(--ok);font-size:13px;margin:8px 0;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  #loginScreen .card{width:100%;max-width:340px;text-align:center;}
  #loginScreen .logo{height:24px;width:auto;margin:0 auto 16px;display:block;}
  .hidden{display:none !important;}
  .fila-item{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;}
  .fila-item .campo-producto{flex:2;min-width:0;}
  .fila-item .campo-paquetes{flex:1;min-width:0;}
  .fila-item .btn-quitar{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--danger);border-radius:8px;width:38px;height:38px;font-size:16px;font-weight:700;cursor:pointer;}
  .conversion-preview{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:8px;}
  .aviso-sku{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
  .aviso-sku b{display:block;margin-bottom:2px;}
  .aviso-ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
  .aviso-ok b{display:block;margin-bottom:2px;}
  .resumen-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5;}
  .acciones{display:flex;gap:8px;margin-top:10px;}
  .acciones .btn{flex:1;}
  h2.titulo-seccion{font-size:14px;margin:0 0 10px;}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121316; --card:#1c1e22; --text:#f4f5f6; --muted:#9aa0a8;
      --border:#2c2f34; --accent:#ff7a56; --accent-soft:#3a241f; --accent-ink:#121316;
      --ok:#5fd39a; --ok-soft:#173328; --warn:#e0b64a; --warn-soft:#3a2f14; --danger:#ff8080;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -12px rgba(0,0,0,.5);
    }
    :root:not([data-theme="light"]) .logo{filter:invert(1);}
  }
</style>
</head>

  <main>
    <div class="card">
      <label id="labelOrg" class="hidden">Organización</label>
      <select id="orgSelector" class="hidden" style="margin-bottom:10px" onchange="elegirOrganizacion(this.value)"></select>
      <label>Fecha</label>
      <input id="fecha" type="date" onchange="cargarProduccion()">
    </div>

    <div class="card">
      <h2 class="titulo-seccion">Lo fabricado hoy</h2>
      <div id="avisoSku" class="aviso-sku hidden"></div>
      <div id="filasItems"></div>
      <button class="btn secondary" style="margin-bottom:10px" onclick="agregarFila()">+ Agregar producto</button>
      <div class="err" id="formErr"></div>
      <div class="ok-msg" id="formOk"></div>
      <button class="btn" onclick="guardarProduccion()">Guardar carga del día</button>
      <p class="muted" id="ultimaActualizacion" style="margin-top:8px"></p>
    </div>

    <div class="card" id="cardStock">
      <h2 class="titulo-seccion">Ingresar a Stock</h2>
      <div id="avisoStockOk" class="aviso-ok hidden"></div>
      <div id="avisoStockAvisos" class="aviso-sku hidden"></div>
      <div class="err" id="stockErr"></div>
      <label>Depósito</label>
      <select id="depositoSelect"></select>
      <button class="btn" id="btnIngresarStock" style="margin-top:10px" onclick="ingresarAStock()">Ingresar producción a stock</button>
    </div>

    <div class="card" id="cardResumen">
      <h2 class="titulo-seccion">Para mandar por WhatsApp</h2>
      <div class="resumen-box" id="resumenTexto">Cargá y guardá al menos un producto para generar el resumen.</div>
      <div class="acciones">
        <button class="btn secondary" onclick="copiarResumen()">Copiar texto</button>
        <button class="btn" id="btnDux" onclick="descargarDux()">Generar archivo para Dux</button>
      </div>
    </div>
  </main>
</div>

<script>
const BASE = '/api/costos';
let TOKEN = localStorage.getItem('obras_admin_token') || '';
const ORG_KEY = 'obras_org_activo'; // misma clave que inicio.html/admin-costos.html
let ORG = localStorage.getItem(ORG_KEY) || '';
function headersAuth(extra){
  const h = Object.assign({'x-admin-token':TOKEN}, extra||{});
  if (ORG) h['x-org-id'] = ORG;
  return h;
}
function headersAuthJson(extra){ return headersAuth(Object.assign({'Content-Type':'application/json'}, extra||{})); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function login(){
  const usuario = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  try{
    const r = await fetch('/api/usuarios/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, password: pass})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    TOKEN = data.token;
    localStorage.setItem('obras_admin_token', TOKEN);
    await iniciarApp();
  }catch(e){
    document.getElementById('loginErr').textContent = e.message;
  }
}
function logout(){
  localStorage.removeItem('obras_admin_token');
  location.reload();
}

let PRODUCTOS = [];
let NOMBRE_USUARIO = '';
let ORGANIZACIONES = [];
let PUEDE_VER_TODAS = false;

// Igual criterio que admin-costos.html/inicio.html: si ya hay una
// selección guardada y sigue siendo válida, se respeta. Si no, un usuario
// del rol Fábrica (no protegido) normalmente tiene una sola organización
// y se elige sola; un Administrador (protegido) sin selección previa no
// puede cargar producción en "todas" a la vez, así que se le elige una
// real por defecto.
function resolverOrgActiva(me){
  const orgs = me.organizaciones || [];
  const haySeleccionValida = orgs.some(o => o._id === ORG) || (me.puedeVerTodas && ORG === 'todas' && orgs.length !== 1);
  if (haySeleccionValida) return;
  const orgPorDefecto = orgs.find(o => o.nombre === 'Piedra Negra');
  const elegido = orgs.length === 1 ? orgs[0]._id : (orgPorDefecto ? orgPorDefecto._id : (orgs[0] ? orgs[0]._id : ''));
  ORG = elegido;
  if (elegido) localStorage.setItem(ORG_KEY, elegido);
  else localStorage.removeItem(ORG_KEY);
}

function renderOrgSelector(){
  const select = document.getElementById('orgSelector');
  const label = document.getElementById('labelOrg');
  if (ORGANIZACIONES.length > 1) {
    select.innerHTML = ORGANIZACIONES.map(o => `<option value="${o._id}">${escapeHtml(o.nombre)}</option>`).join('');
    select.value = ORG;
    select.classList.remove('hidden');
    label.classList.remove('hidden');
  } else {
    select.classList.add('hidden');
    label.classList.add('hidden');
  }
}

function elegirOrganizacion(orgId){
  ORG = orgId;
  if (orgId) localStorage.setItem(ORG_KEY, orgId); else localStorage.removeItem(ORG_KEY);
  Promise.all([cargarProductos(), cargarDepositos()]).then(cargarProduccion);
}

function hoyISO(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

async function iniciarApp(){
  let me;
  try{
    const r = await fetch('/api/usuarios/me', {headers: headersAuth()});
    if (!r.ok) { localStorage.removeItem('obras_admin_token'); TOKEN=''; document.getElementById('loginScreen').classList.remove('hidden'); return; }
    me = await r.json();
    NOMBRE_USUARIO = (me.usuario && me.usuario.nombre) ? me.usuario.nombre : '';
    const tieneAcceso = me.rol && (me.rol.protegido || (me.rol.modulos||[]).includes('fabrica') || (me.rol.modulos||[]).includes('costos'));
    if (!tieneAcceso) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('sinAccesoScreen').classList.remove('hidden');
      return;
    }
  }catch(e){
    document.getElementById('loginErr').textContent = 'No se pudo validar la sesión.';
    return;
  }
  ORGANIZACIONES = me.organizaciones || [];
  PUEDE_VER_TODAS = !!me.puedeVerTodas;
  resolverOrgActiva(me);
  renderOrgSelector();
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('sinAccesoScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('fecha').value = hoyISO();
  await cargarProductos();
  await cargarDepositos();
  await cargarProduccion();
}
if (TOKEN) iniciarApp(); else document.getElementById('loginScreen').classList.remove('hidden');

async function cargarProductos(){
  const r = await fetch(BASE + '/productos-produccion', {headers: headersAuth()});
  if (!r.ok) return;
  PRODUCTOS = await r.json();
}

let DEPOSITOS = [];
const DEPOSITO_KEY = 'fabrica_deposito_elegido'; // recordado por dispositivo, no por org

async function cargarDepositos(){
  const r = await fetch(BASE + '/produccion/depositos', {headers: headersAuth()});
  if (!r.ok) return;
  DEPOSITOS = await r.json();
  const select = document.getElementById('depositoSelect');
  if (!DEPOSITOS.length) {
    select.innerHTML = '<option value="">No hay depósitos creados — pedile a un administrador que cree uno en Stock.</option>';
    return;
  }
  const recordado = localStorage.getItem(DEPOSITO_KEY);
  const porDefecto = DEPOSITOS.some(d => String(d._id) === recordado) ? recordado : DEPOSITOS[0]._id;
  select.innerHTML = DEPOSITOS.map(d => `<option value="${d._id}">${escapeHtml(d.nombre)}</option>`).join('');
  select.value = porDefecto;
}

function opcionesProductos(seleccionadoId){
  return '<option value="">Elegí un producto...</option>' + PRODUCTOS.map(p =>
    `<option value="${p._id}" ${String(p._id)===String(seleccionadoId)?'selected':''}>${escapeHtml(p.nombre)}${p.sku ? '' : ' (sin SKU)'}</option>`
  ).join('');
}

function agregarFila(productoId, paquetes){
  const cont = document.getElementById('filasItems');
  const fila = document.createElement('div');
  fila.className = 'fila-item-wrap';
  fila.innerHTML = `
    <div class="fila-item">
      <div class="campo-producto">
        <label>Producto</label>
        <select onchange="actualizarPreview(this)">${opcionesProductos(productoId)}</select>
      </div>
      <div class="campo-paquetes">
        <label>Paquetes</label>
        <input type="number" min="0" step="1" value="${paquetes||''}" oninput="actualizarPreview(this)">
      </div>
      <button class="btn-quitar" onclick="this.closest('.fila-item-wrap').remove()">×</button>
    </div>
    <div class="conversion-preview"></div>
  `;
  cont.appendChild(fila);
  if (productoId) actualizarPreview(fila.querySelector('select'));
}

function actualizarPreview(el){
  const wrap = el.closest('.fila-item-wrap');
  const select = wrap.querySelector('select');
  const input = wrap.querySelector('input');
  const preview = wrap.querySelector('.conversion-preview');
  const producto = PRODUCTOS.find(p => String(p._id) === select.value);
  const paquetes = Number(input.value);
  if (!producto || !paquetes || paquetes <= 0) { preview.textContent = ''; return; }
  const rinde = producto.rendimientoPorPaquete || null;
  if (!rinde) { preview.textContent = 'Este producto no tiene rendimiento por paquete configurado — se va a guardar en paquetes.'; return; }
  const total = paquetes * rinde;
  const unidad = producto.tipoCosteo === 'm2' ? 'm²' : 'unidades';
  preview.textContent = `= ${total.toLocaleString('es-AR', {maximumFractionDigits:2})} ${unidad}`;
}

function juntarItems(){
  const filas = document.querySelectorAll('#filasItems .fila-item-wrap');
  const items = [];
  filas.forEach(fila => {
    const select = fila.querySelector('select');
    const input = fila.querySelector('input');
    const paquetes = Number(input.value);
    if (select.value && paquetes > 0) items.push({ productoId: select.value, paquetes });
  });
  return items;
}

function mostrarAvisoSku(sinSku){
  const div = document.getElementById('avisoSku');
  if (sinSku && sinSku.length) {
    div.innerHTML = '<b>Sin SKU asignado (no van a entrar en el archivo de Dux):</b>' + sinSku.map(escapeHtml).join(', ');
    div.classList.remove('hidden');
  } else {
    div.classList.add('hidden');
  }
}

function generarResumenTexto(fecha, items){
  if (!items.length) return 'Cargá y guardá al menos un producto para generar el resumen.';
  const lineas = items.map(it => {
    const unidad = it.unidadConvertida === 'm2' ? 'm²' : (it.unidadConvertida === 'unidad' ? 'unidades' : 'paquetes');
    const cant = Number(it.cantidadConvertida).toLocaleString('es-AR', {maximumFractionDigits:2});
    return `• ${it.nombre}: ${it.paquetes} paquete${it.paquetes===1?'':'s'} = ${cant} ${unidad}`;
  });
  return `Producción del ${fecha}\n` + lineas.join('\n');
}

// Refleja en la tarjeta "Ingresar a Stock" el estado que viene de
// GET/POST /produccion (stockIngresado, depositoId, quién y cuándo).
function actualizarEstadoStock(data){
  const okDiv = document.getElementById('avisoStockOk');
  const btn = document.getElementById('btnIngresarStock');
  const select = document.getElementById('depositoSelect');
  const hayItems = !!(data.items && data.items.length);
  if (data.stockIngresado) {
    const cuando = data.stockIngresadoEn ? new Date(data.stockIngresadoEn).toLocaleString('es-AR') : '';
    const quien = data.stockIngresadoPor ? data.stockIngresadoPor.nombre : '';
    okDiv.innerHTML = '<b>Ya ingresado a stock.</b>' + [quien, cuando].filter(Boolean).join(' — ') +
      '. Si hace falta corregir, cargá un movimiento de ajuste en el módulo Stock.';
    okDiv.classList.remove('hidden');
    btn.disabled = true;
    btn.textContent = 'Ya ingresado a stock';
    select.disabled = true;
  } else {
    okDiv.classList.add('hidden');
    btn.disabled = !hayItems;
    btn.textContent = 'Ingresar producción a stock';
    select.disabled = false;
  }
  if (data.depositoId && DEPOSITOS.some(d => String(d._id) === String(data.depositoId))) {
    select.value = data.depositoId;
  }
}

async function cargarProduccion(){
  const fecha = document.getElementById('fecha').value || hoyISO();
  document.getElementById('formErr').textContent = '';
  document.getElementById('formOk').textContent = '';
  document.getElementById('stockErr').textContent = '';
  document.getElementById('avisoStockAvisos').classList.add('hidden');
  const r = await fetch(BASE + '/produccion?fecha=' + encodeURIComponent(fecha), {headers: headersAuth()});
  const data = await r.json();
  if (!r.ok) { document.getElementById('formErr').textContent = data.error || 'No se pudo cargar.'; return; }
  document.getElementById('filasItems').innerHTML = '';
  if (data.items && data.items.length) {
    data.items.forEach(it => agregarFila(it.productoId, it.paquetes));
  } else {
    agregarFila();
  }
  mostrarAvisoSku(data.sinSku);
  document.getElementById('ultimaActualizacion').textContent = data.actualizadoPor
    ? `Última carga: ${data.actualizadoPor.nombre}${data.updatedAt ? ' — ' + new Date(data.updatedAt).toLocaleString('es-AR') : ''}`
    : '';
  document.getElementById('resumenTexto').textContent = generarResumenTexto(fecha, data.items || []);
  document.getElementById('btnDux').disabled = !(data.items && data.items.some(it => it.sku));
  actualizarEstadoStock(data);
}

async function guardarProduccion(){
  const fecha = document.getElementById('fecha').value || hoyISO();
  const items = juntarItems();
  document.getElementById('formErr').textContent = '';
  document.getElementById('formOk').textContent = '';
  if (!items.length) { document.getElementById('formErr').textContent = 'Cargá al menos un producto con paquetes mayores a 0.'; return; }
  try{
    const r = await fetch(BASE + '/produccion', {method:'POST', headers: headersAuthJson(), body: JSON.stringify({fecha, items})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al guardar');
    document.getElementById('formOk').textContent = 'Guardado.';
    mostrarAvisoSku(data.sinSku);
    document.getElementById('ultimaActualizacion').textContent = data.actualizadoPor
      ? `Última carga: ${data.actualizadoPor.nombre}${data.updatedAt ? ' — ' + new Date(data.updatedAt).toLocaleString('es-AR') : ''}`
      : '';
    document.getElementById('resumenTexto').textContent = generarResumenTexto(fecha, data.items || []);
    document.getElementById('btnDux').disabled = !(data.items && data.items.some(it => it.sku));
    actualizarEstadoStock(data);
  }catch(e){
    document.getElementById('formErr').textContent = e.message;
  }
}

async function ingresarAStock(){
  const fecha = document.getElementById('fecha').value || hoyISO();
  const depositoId = document.getElementById('depositoSelect').value;
  document.getElementById('stockErr').textContent = '';
  document.getElementById('avisoStockAvisos').classList.add('hidden');
  if (!depositoId) { document.getElementById('stockErr').textContent = 'Elegí un depósito.'; return; }
  if (!confirm(`¿Ingresar a stock lo fabricado el ${fecha}? Esta acción no se puede deshacer — una corrección después se hace con un movimiento a mano en Stock.`)) return;
  const btn = document.getElementById('btnIngresarStock');
  btn.disabled = true;
  try{
    const r = await fetch(BASE + '/produccion/' + encodeURIComponent(fecha) + '/ingresar-stock', {
      method: 'POST', headers: headersAuthJson(), body: JSON.stringify({ depositoId })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'No se pudo ingresar a stock.');
    localStorage.setItem(DEPOSITO_KEY, depositoId);
    const avisos = [];
    if (data.sinCatalogo && data.sinCatalogo.length) avisos.push('Sin producto correspondiente en el catálogo de Stock (revisá el SKU): ' + data.sinCatalogo.join(', '));
    if (data.sinConvertir && data.sinConvertir.length) avisos.push('Sin rendimiento por paquete configurado, no se pudo convertir a stock: ' + data.sinConvertir.join(', '));
    if (avisos.length) {
      const div = document.getElementById('avisoStockAvisos');
      div.innerHTML = '<b>Ingresado con avisos:</b>' + avisos.join(' · ');
      div.classList.remove('hidden');
    }
    await cargarProduccion();
  }catch(e){
    document.getElementById('stockErr').textContent = e.message;
    btn.disabled = false;
  }
}

function copiarResumen(){
  const texto = document.getElementById('resumenTexto').textContent;
  navigator.clipboard.writeText(texto).then(() => {
    document.getElementById('formOk').textContent = 'Texto copiado.';
    setTimeout(() => { document.getElementById('formOk').textContent = ''; }, 2000);
  }).catch(() => {});
}

async function descargarDux(){
  const fecha = document.getElementById('fecha').value || hoyISO();
  document.getElementById('formErr').textContent = '';
  try{
    const r = await fetch(BASE + '/produccion/' + encodeURIComponent(fecha) + '/dux', {headers: headersAuth()});
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || 'No se pudo generar el archivo.');
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ingreso-stock-dux-' + fecha + '.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    document.getElementById('formErr').textContent = e.message;
  }
}
</script>
