<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Calculadora m2 - Panel admin</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  input[type="number"] { width: 100px; padding: 4px; }
  button { padding: 6px 12px; cursor: pointer; }
  .ok { color: #27632a; font-size: 13px; }
  .sku { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h1>Rendimiento por producto</h1>
  <p>Para cada producto que se vende por caja/bulto, elegí la unidad de medida y cuánto rinde una caja en esa unidad. Esto queda guardado como atributo propio del producto (metafield), sin tocar el SKU.</p>
  <table id="tabla">
    <thead>
      <tr><th>Producto</th><th>SKU</th><th>Unidad</th><th>Rinde por caja</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    var UNIDADES = {
      m2: 'Metros cuadrados (m²)',
      ml: 'Metros lineales (ml)',
      litro: 'Litros (L)',
      unidad: 'Unidad (venta directa, sin cálculo)'
    };

    function opcionesUnidad(seleccionada) {
      return Object.keys(UNIDADES).map(function (key) {
        var sel = key === seleccionada ? 'selected' : '';
        return '<option value="' + key + '" ' + sel + '>' + UNIDADES[key] + '</option>';
      }).join('');
    }

    function actualizarCampoRendimiento(id) {
      var tipo = document.getElementById('select-tipo-' + id).value;
      var input = document.getElementById('input-cobertura-' + id);
      if (tipo === 'unidad') {
        input.value = '1';
        input.disabled = true;
      } else {
        input.disabled = false;
      }
    }

    async function cargar() {
      const res = await fetch('/api/products');
      const productos = await res.json();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      productos.forEach(p => {
        const tr = document.createElement('tr');
        const tipoActual = p.tipo ? p.tipo.value : 'm2';
        tr.innerHTML =
          '<td>' + p.name + '</td>' +
          '<td class="sku">' + (p.sku || '-') + '</td>' +
          '<td><select id="select-tipo-' + p.id + '" onchange="actualizarCampoRendimiento(' + p.id + ')">' + opcionesUnidad(tipoActual) + '</select></td>' +
          '<td><input type="number" min="0.01" step="0.01" value="' + (p.cobertura ? p.cobertura.value : '') + '" id="input-cobertura-' + p.id + '" /></td>' +
          '<td><button onclick="guardar(' + p.id + ')">Guardar</button> <span class="ok" id="ok-' + p.id + '"></span></td>';
        tbody.appendChild(tr);
        actualizarCampoRendimiento(p.id);
      });
    }

    async function guardar(id) {
      const cobertura = document.getElementById('input-cobertura-' + id).value;
      const tipo = document.getElementById('select-tipo-' + id).value;
      const okEl = document.getElementById('ok-' + id);
      okEl.textContent = 'Guardando...';
      const res = await fetch('/api/bulto/' + id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cobertura, tipo })
      });
      if (res.ok) {
        okEl.textContent = 'Guardado ✓';
      } else {
        okEl.textContent = 'Error';
      }
      setTimeout(() => okEl.textContent = '', 2000);
    }

    cargar();
  </script>
</body>
</html>
